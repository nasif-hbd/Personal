<style>
/* ===================== Design tokens =====================
   Dark, glassy, neon-lit. Translucent surfaces over an aurora field,
   hairline borders that catch light, and cyan/violet edge glow.
========================================================== */
:root{
  --bg: #07080f;
  --bg-2: #0b0d17;
  --surface: rgba(255,255,255,.035);
  --surface-2: rgba(255,255,255,.06);
  --surface-solid: #12141f;
  --line: rgba(255,255,255,.09);
  --line-2: rgba(255,255,255,.16);
  --text: #eef1fb;
  --text-dim: #9ba3bd;
  --text-faint: #626a85;
  --accent: #22d3ee;
  --accent-2: #8b5cf6;
  --accent-3: #f472b6;
  --accent-soft: rgba(34,211,238,.14);
  --glow: 0 0 24px -4px rgba(34,211,238,.5);
  --glow-2: 0 0 30px -6px rgba(139,92,246,.55);
  --gold: #fbbf24;
  --gold-soft: rgba(251,191,36,.15);
  --success: #34d399;
  --warn: #fbbf24;
  --danger: #fb7185;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 22px;
  --shadow: 0 14px 40px -16px rgba(0,0,0,.8);
  --shadow-lg: 0 40px 90px -30px rgba(0,0,0,.9);
  --blur: blur(16px) saturate(150%);
  --font-display: "Sora", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(.22,1,.36,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --dur-fast: .14s;
  --dur: .24s;
  --dur-slow: .4s;
}
:root[data-theme="light"]{
  --bg: #eef1f8;
  --bg-2: #e5e9f4;
  --surface: rgba(255,255,255,.72);
  --surface-2: rgba(255,255,255,.92);
  --surface-solid: #ffffff;
  --line: rgba(15,23,42,.10);
  --line-2: rgba(15,23,42,.18);
  --text: #0f172a;
  --text-dim: #51607a;
  --text-faint: #8792a8;
  --accent: #0891b2;
  --accent-2: #7c3aed;
  --accent-3: #db2777;
  --accent-soft: rgba(8,145,178,.12);
  --glow: 0 0 24px -6px rgba(8,145,178,.4);
  --glow-2: 0 0 30px -8px rgba(124,58,237,.4);
  --gold: #b45309;
  --gold-soft: rgba(180,83,9,.12);
  --success: #059669;
  --danger: #e11d48;
  --shadow: 0 14px 40px -18px rgba(15,23,42,.28);
  --shadow-lg: 0 40px 90px -34px rgba(15,23,42,.34);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef1f8; --bg-2:#e5e9f4;
    --surface:rgba(255,255,255,.72); --surface-2:rgba(255,255,255,.92); --surface-solid:#ffffff;
    --line:rgba(15,23,42,.10); --line-2:rgba(15,23,42,.18);
    --text:#0f172a; --text-dim:#51607a; --text-faint:#8792a8;
    --accent:#0891b2; --accent-2:#7c3aed; --accent-3:#db2777; --accent-soft:rgba(8,145,178,.12);
    --glow:0 0 24px -6px rgba(8,145,178,.4); --glow-2:0 0 30px -8px rgba(124,58,237,.4);
    --gold:#b45309; --gold-soft:rgba(180,83,9,.12); --success:#059669; --danger:#e11d48;
    --shadow:0 14px 40px -18px rgba(15,23,42,.28); --shadow-lg:0 40px 90px -34px rgba(15,23,42,.34);
  }
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:14.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
/* Aurora field + fine grid, fixed behind everything */
body::before{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(900px 620px at 8% -10%, rgba(34,211,238,.20), transparent 62%),
    radial-gradient(800px 560px at 98% 4%, rgba(139,92,246,.20), transparent 60%),
    radial-gradient(700px 520px at 55% 108%, rgba(244,114,182,.13), transparent 62%),
    var(--bg);
}
body::after{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
  background-image:
    linear-gradient(to right, var(--line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--line) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 90% 60% at 50% 0%, #000 30%, transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%, #000 30%, transparent 78%);
}
h1,h2,h3{font-family:var(--font-display); font-weight:700; letter-spacing:-.025em; line-height:1.15;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}
a{color:var(--accent); text-underline-offset:3px;}
button{font-family:inherit;}
.hidden{display:none !important;}
.ic{width:16px; height:16px; flex:0 0 auto; display:inline-block; vertical-align:-3px;}
.ic.ic-sm{width:13px; height:13px;}
.ic.ic-lg{width:22px; height:22px;}
.ic.ic-xl{width:40px; height:40px;}
:is(button,a,[tabindex]):focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:8px;}

/* ===================== Motion ===================== */
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
@keyframes popIn{from{opacity:0; transform:scale(.96) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);}}
@keyframes sweep{from{transform:translateX(-120%);} to{transform:translateX(220%);}}
@keyframes glowPulse{0%,100%{opacity:.55;} 50%{opacity:1;}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ===================== Shell / top nav ===================== */
#app{display:flex; flex-direction:column; min-height:100vh;}
.topnav{
  position:sticky; top:0; z-index:60;
  background:color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--line);
}
.topnav-inner{
  max-width:1240px; margin:0 auto; padding:0 24px;
  display:flex; align-items:center; gap:20px; min-height:64px;
}
.brand{display:flex; align-items:center; gap:11px; text-decoration:none; color:inherit; flex:0 0 auto;}
.brand .mark{
  width:36px; height:36px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  border-radius:11px; color:#fff; position:relative;
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow:var(--glow);
}
.brand .mark .ic{width:20px; height:20px;}
.brand .name{font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-.02em; line-height:1.1;}
.brand .tag{font-family:var(--font-mono); font-size:9px; text-transform:uppercase; letter-spacing:.18em; color:var(--text-faint); margin-top:2px;}

.navrow{display:flex; align-items:center; gap:2px; flex:1; overflow-x:auto; scrollbar-width:none;}
.navrow::-webkit-scrollbar{display:none;}
.navbtn{
  border:1px solid transparent; background:transparent; color:var(--text-dim); cursor:pointer;
  font-size:13.5px; font-weight:500; padding:8px 14px; border-radius:99px; white-space:nowrap;
  transition:color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.navbtn:hover{color:var(--text); background:var(--surface);}
.navbtn.active{
  color:var(--text); background:var(--surface-2); border-color:var(--line-2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), var(--glow);
}

.topnav-right{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
.icon-btn{
  border:1px solid var(--line); background:var(--surface); color:var(--text-dim); cursor:pointer;
  width:36px; height:36px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; padding:0;
  transition:transform var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.icon-btn:hover{color:var(--text); border-color:var(--accent); box-shadow:var(--glow); transform:translateY(-1px);}
.icon-btn:active{transform:translateY(0) scale(.94);}
.icon-btn .ic{vertical-align:0;}

.key-status{
  font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.14em;
  color:var(--text-faint); display:flex; align-items:center; gap:7px;
  padding:6px 11px; border:1px solid var(--line); border-radius:99px; background:var(--surface);
}
.key-status .pip{width:6px; height:6px; border-radius:50%; flex:0 0 auto; animation:glowPulse 2.4s ease-in-out infinite;}
.key-status.ok .pip{background:var(--success); box-shadow:0 0 10px var(--success);}
.key-status.bad .pip{background:var(--danger); box-shadow:0 0 10px var(--danger);}

.pagehead{border-bottom:1px solid var(--line);}
.pagehead-inner{
  max-width:1240px; margin:0 auto; padding:11px 24px;
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
}
.pagehead h1{
  font-family:var(--font-mono); font-size:11px; font-weight:600; margin:0;
  text-transform:uppercase; letter-spacing:.2em; color:var(--text-dim);
}
.pagehead .sub{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); letter-spacing:.08em;}

main{flex:1; display:flex; flex-direction:column; min-width:0;}
.view{flex:1; max-width:1240px; width:100%; margin:0 auto; padding:32px 24px 96px;}
.view.view-anim{animation:fadeIn .18s var(--ease);}

/* ===================== Buttons / inputs ===================== */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:11px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--text);
  font-weight:600; font-size:13px; cursor:pointer; position:relative; overflow:hidden;
  transition:transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.btn:hover{transform:translateY(-1px); border-color:var(--accent); box-shadow:var(--glow); background:var(--surface-2);}
.btn:active{transform:translateY(0) scale(.97);}
.btn.primary{
  border:none; color:#04121a; font-weight:700;
  background:linear-gradient(120deg, var(--accent), var(--accent-2));
  box-shadow:0 8px 26px -10px rgba(34,211,238,.7);
}
:root[data-theme="light"] .btn.primary{color:#fff;}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .btn.primary{color:#fff;} }
.btn.primary::after{
  content:""; position:absolute; top:0; bottom:0; width:36%; pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.42), transparent);
  transform:translateX(-120%);
}
.btn.primary:hover::after{animation:sweep .75s var(--ease);}
.btn.primary:hover{box-shadow:0 12px 34px -10px rgba(34,211,238,.85);}
.btn.danger{color:var(--danger); border-color:rgba(251,113,133,.35);}
.btn.danger:hover{background:rgba(251,113,133,.12); border-color:var(--danger); box-shadow:0 0 24px -6px rgba(251,113,133,.5);}
.btn.small{padding:6px 12px; font-size:12px; border-radius:9px;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}

input[type=text], input[type=number], input[type=password], input[type=time], input[type=date], select, textarea{
  background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:11px;
  padding:10px 13px; font-size:13.5px; font-family:inherit; width:100%; outline:none;
  transition:border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
input:focus, select:focus, textarea:focus{border-color:var(--accent); box-shadow:var(--glow); background:var(--surface-2);}
label{
  font-family:var(--font-mono); font-size:10px; color:var(--text-faint); font-weight:500;
  display:block; margin-bottom:7px; text-transform:uppercase; letter-spacing:.14em;
}
.field{margin-bottom:16px;}
.row{display:flex; gap:14px;}
.row > .field{flex:1;}

.chip-row{display:flex; flex-wrap:wrap; gap:9px;}
.chip{
  padding:7px 14px; border-radius:99px; border:1px solid var(--line); background:var(--surface);
  color:var(--text-dim); font-size:12.5px; cursor:pointer; font-weight:500;
  transition:transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.chip:hover{transform:translateY(-1px); border-color:var(--accent); color:var(--text);}
.chip:active{transform:translateY(0) scale(.96);}
.chip.selected{
  background:var(--accent-soft); border-color:var(--accent); color:var(--accent);
  box-shadow:var(--glow);
}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px;
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
}
.badge{
  display:inline-block; font-family:var(--font-mono); font-size:9.5px; font-weight:600;
  text-transform:uppercase; letter-spacing:.15em; padding:4px 10px; border-radius:99px;
  background:var(--accent-soft); color:var(--accent); border:1px solid rgba(34,211,238,.28);
}
.badge.gold{background:var(--gold-soft); color:var(--gold); border-color:rgba(251,191,36,.3);}

/* ===================== Chat ===================== */
.chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 230px); min-height:430px;}
.chat-scroll{flex:1; overflow-y:auto; padding:4px 2px 12px;}
.msg{display:flex; gap:13px; max-width:800px; margin:0 auto 22px; animation:riseIn var(--dur) var(--ease) both;}
.msg .avatar{
  width:34px; height:34px; border-radius:11px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; border:1px solid var(--line);
}
.msg.user .avatar{background:var(--surface-2); color:var(--text-dim);}
.msg.assistant .avatar{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border:none; box-shadow:var(--glow);}
.msg .bubble{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 17px;
  flex:1; min-width:0; backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
}
.msg.user .bubble{background:var(--accent-soft); border-color:rgba(34,211,238,.2);}
.msg .bubble p{margin:0 0 9px;}
.msg .bubble p:last-child{margin-bottom:0;}
.msg .bubble ul{margin:6px 0; padding-left:20px;}
.msg .bubble code{background:rgba(0,0,0,.3); padding:2px 6px; border-radius:6px; font-family:var(--font-mono); font-size:12.5px;}
.msg .status-line{
  font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-bottom:10px;
  display:flex; align-items:center; gap:8px; text-transform:uppercase; letter-spacing:.12em;
}
.status-line .ic, .plan-chip-loading .ic{color:var(--accent); animation:glowPulse 1.6s ease-in-out infinite;}
.plan-chip{
  margin-top:10px; padding:14px 16px; border-radius:var(--radius); cursor:pointer; font-size:13.5px; font-weight:600;
  background:linear-gradient(120deg, var(--accent-soft), rgba(139,92,246,.12));
  border:1px solid rgba(34,211,238,.3); color:var(--text); box-shadow:var(--glow);
  display:flex; align-items:center; gap:10px;
  transition:transform var(--dur-fast) var(--ease);
}
.plan-chip:hover{transform:translateY(-2px);}
.plan-chip.plan-chip-loading{
  cursor:default; background:var(--surface); border-color:var(--line); color:var(--text-dim); box-shadow:none; transform:none;
}
.dotpulse{display:inline-flex; gap:4px;}
.dotpulse span{width:6px;height:6px;border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); animation:pulse 1.2s infinite ease-in-out;}
.dotpulse span:nth-child(2){animation-delay:.2s;} .dotpulse span:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,80%,100%{opacity:.25; transform:scale(.8);} 40%{opacity:1; transform:scale(1);}}

.chat-empty{max-width:560px; margin:56px auto; text-align:center;}
.chat-empty .big-ic{margin-bottom:18px; color:var(--accent); display:flex; justify-content:center; filter:drop-shadow(0 0 16px rgba(34,211,238,.6));}
.chat-empty h2{font-size:28px; margin:0 0 10px;}
.chat-empty p{color:var(--text-dim); margin:0 0 24px; font-size:14px;}

.chat-input-bar{border-top:1px solid var(--line); padding:16px 0 0;}
.chat-input-row{max-width:800px; margin:0 auto; display:flex; gap:10px; align-items:flex-end;}
.chat-input-row textarea{resize:none; min-height:46px; max-height:170px;}
.chat-hint{
  max-width:800px; margin:9px auto 0; font-family:var(--font-mono); font-size:9.5px;
  color:var(--text-faint); text-transform:uppercase; letter-spacing:.14em;
}

/* ===================== Plans ===================== */
.plans-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(285px,1fr)); gap:18px;}
.plan-card{
  cursor:pointer; position:relative; overflow:hidden;
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.plan-card::before{
  content:""; position:absolute; inset:0; border-radius:var(--radius); pointer-events:none; opacity:0;
  background:linear-gradient(120deg, rgba(34,211,238,.10), transparent 45%, rgba(139,92,246,.10));
  transition:opacity var(--dur) var(--ease);
}
.plan-card:hover{transform:translateY(-4px); border-color:var(--line-2); box-shadow:var(--shadow-lg), var(--glow);}
.plan-card:hover::before{opacity:1;}
.plan-card:active{transform:translateY(-1px);}
.plan-card h3{margin:12px 0 6px; font-size:18px;}
.plan-card .meta{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); letter-spacing:.06em; margin-bottom:14px;}
.progress-track{height:6px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden; margin-top:10px;}
.progress-fill{
  height:100%; border-radius:99px; transition:width var(--dur-slow) var(--ease);
  background:linear-gradient(90deg, var(--accent), var(--accent-2));
  box-shadow:0 0 14px rgba(34,211,238,.7);
}
.plan-card-foot{
  display:flex; justify-content:space-between; align-items:center; margin-top:12px;
  font-family:var(--font-mono); font-size:10px; color:var(--text-faint); letter-spacing:.06em;
}

.detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:28px; flex-wrap:wrap;}
.detail-head h2{margin:8px 0 8px; font-size:32px; max-width:18ch;}
.detail-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}

/* Week blocks */
.week-block{
  margin-bottom:16px; border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden;
  background:var(--surface); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  transition:border-color var(--dur) var(--ease);
}
.week-block.open{border-color:var(--line-2);}
.week-head{
  padding:16px 20px; cursor:pointer; display:flex; align-items:center; gap:12px; justify-content:space-between;
  transition:background var(--dur-fast) var(--ease);
}
.week-head:hover{background:var(--surface-2);}
.week-head .title{font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:-.02em;}
.week-head .theme{font-size:12.5px; color:var(--text-dim); font-weight:400;}
.week-body-grid{display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--dur-slow) var(--ease);}
.week-body{overflow:hidden; padding:0 20px; min-height:0;}
.week-block.open .week-body-grid{grid-template-rows:1fr;}
.week-block.open .week-body{padding:4px 20px 20px;}
.week-block.open .chev{transform:rotate(90deg);}
.chev{transition:transform var(--dur) var(--ease); color:var(--text-faint);}

/* Day rows */
.day-row{display:flex; gap:16px; padding:18px 0; border-top:1px solid var(--line);}
.day-row:first-child{border-top:none;}
.day-gutter{
  flex:0 0 40px; font-family:var(--font-mono); font-size:19px; font-weight:600; line-height:1;
  color:transparent; background:linear-gradient(140deg, var(--accent), var(--accent-2));
  -webkit-background-clip:text; background-clip:text; opacity:.65; padding-top:3px;
}
.day-main{flex:1; min-width:0;}
.day-head{
  display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:10px;
  color:var(--text-dim); font-weight:500; text-transform:uppercase; letter-spacing:.16em; margin-bottom:12px;
}
.day-head .date{color:var(--text-faint); letter-spacing:.08em;}
.day-head .today-flag{
  background:var(--accent-soft); color:var(--accent); padding:3px 9px; border-radius:99px;
  border:1px solid rgba(34,211,238,.3); letter-spacing:.12em; box-shadow:var(--glow);
}

.class-card{
  display:flex; gap:14px; align-items:flex-start; padding:12px; border-radius:14px;
  background:var(--surface); border:1px solid var(--line); margin-bottom:11px; flex-wrap:wrap;
  transition:transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.class-card:hover{transform:translateY(-2px); border-color:var(--line-2); box-shadow:var(--shadow);}
.class-card.done{opacity:.45;}
.class-card.done .cc-title{text-decoration:line-through;}
.class-card.rest-card{background:transparent; border-style:dashed; justify-content:center; padding:14px;}
.class-card.rest-card:hover{transform:none; box-shadow:none;}
.class-card .cc-main{flex:1; min-width:170px;}
.class-card .cc-title{font-size:14.5px; font-weight:600; line-height:1.35;}
.class-card .cc-meta{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-top:5px; letter-spacing:.04em;}
.class-card .cc-controls{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
.class-card input[type=time]{width:114px; padding:6px 9px; font-size:12px; font-family:var(--font-mono);}

/* ===================== Inline video ===================== */
.lesson-media{flex:0 0 auto; width:158px;}
.lesson-media.sm{width:112px;}
.lesson-media.expanded{flex:1 1 100%; width:100%; max-width:760px; order:99; margin-top:6px;}
.lesson-facade{
  position:relative; display:block; width:100%; aspect-ratio:16/9; padding:0; cursor:pointer;
  border:1px solid var(--line-2); border-radius:12px; overflow:hidden;
  background-size:cover; background-position:center; background-color:var(--surface-2);
  transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.lesson-facade::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,.45));
}
.lesson-facade:hover{transform:scale(1.03); border-color:var(--accent); box-shadow:var(--glow);}
.lesson-facade.icon-only{display:flex; align-items:center; justify-content:center; color:var(--text-dim);}
.lesson-facade .play-badge{
  position:absolute; inset:0; margin:auto; width:40px; height:40px; border-radius:50%; z-index:1;
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 22px rgba(34,211,238,.75);
  transition:transform var(--dur-fast) var(--ease-spring);
}
.lesson-facade:hover .play-badge{transform:scale(1.16);}
.lesson-facade .ic, .lesson-facade .play-badge, .lesson-facade .alt-flag{pointer-events:none;}
.lesson-facade .alt-flag{
  position:absolute; left:6px; bottom:6px; z-index:2;
  font-family:var(--font-mono); font-size:8px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  padding:2px 6px; border-radius:99px; color:var(--accent);
  background:rgba(4,6,14,.72); border:1px solid rgba(34,211,238,.4);
}
.week-block, .day-row{scroll-margin-top:130px;}

.lesson-embed{
  border:1px solid var(--line-2); border-radius:14px; overflow:hidden; background:#000;
  box-shadow:var(--shadow), var(--glow); animation:popIn var(--dur) var(--ease);
}
.lesson-embed .frame{position:relative; width:100%; padding-top:56.25%;}
.lesson-embed iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
.lesson-embed-bar{
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  padding:9px 12px; background:var(--surface-solid); color:var(--text-dim);
  font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.14em;
  border-top:1px solid var(--line);
}
.lesson-embed-bar .lb-actions{display:flex; gap:8px;}
.lesson-embed-bar button{
  background:var(--surface); border:1px solid var(--line); color:var(--text-dim); cursor:pointer;
  font-family:var(--font-mono); font-size:9px; text-transform:uppercase; letter-spacing:.12em;
  padding:4px 10px; border-radius:99px;
  transition:color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.lesson-embed-bar button:hover{color:var(--accent); border-color:var(--accent);}
.watch-bar{height:4px; background:rgba(255,255,255,.10); overflow:hidden;}
.watch-bar-fill{
  height:100%; width:0; background:linear-gradient(90deg, var(--accent), var(--accent-2));
  box-shadow:0 0 12px rgba(34,211,238,.8); transition:width .6s linear;
}
.watch-pct{color:var(--text-faint); align-self:center;}
.watch-pct.untracked{color:var(--warn);}
.facade-progress{
  position:absolute; left:0; right:0; bottom:0; height:4px; z-index:2;
  background:rgba(0,0,0,.55);
}
.facade-progress > span{
  display:block; height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2));
  box-shadow:0 0 10px rgba(34,211,238,.9);
}
.plan-card-remove{
  position:absolute; top:10px; right:10px; z-index:3; width:26px; height:26px; padding:0;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--text-faint);
  opacity:0; transition:opacity var(--dur) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.plan-card:hover .plan-card-remove, .plan-card-remove:focus-visible{opacity:1;}
.plan-card-remove:hover{color:var(--danger); border-color:var(--danger);}
@media (hover: none){ .plan-card-remove{opacity:1;} }

.todo-row{display:flex; align-items:flex-start; gap:10px; font-size:13.5px; padding:6px 2px;}
.todo-row.done .txt{text-decoration:line-through; color:var(--text-faint);}
.chk{
  width:17px; height:17px; flex:0 0 auto; accent-color:var(--accent); cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-spring);
}
.chk:active{transform:scale(1.25);}

/* ===================== Today ===================== */
.today-list{display:flex; flex-direction:column; gap:12px; max-width:860px;}
.count-badge{
  font-family:var(--font-mono); font-size:9.5px; padding:4px 10px; border-radius:99px; font-weight:600;
  text-transform:uppercase; letter-spacing:.12em; border:1px solid transparent;
}
.count-badge.warn{background:var(--gold-soft); color:var(--gold); border-color:rgba(251,191,36,.3);}
.count-badge.ok{background:var(--accent-soft); color:var(--accent); border-color:rgba(34,211,238,.3); box-shadow:var(--glow);}

/* ===================== Home ===================== */
.home-hero{
  position:relative; border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden;
  background:var(--surface); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow-lg); padding:38px 34px; margin-bottom:32px;
}
.home-hero::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(560px 260px at 88% -30%, rgba(139,92,246,.30), transparent 68%),
    radial-gradient(460px 220px at 8% 130%, rgba(34,211,238,.22), transparent 68%);
}
.home-hero::after{
  content:""; position:absolute; top:0; left:0; right:0; height:1px; pointer-events:none;
  background:linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
  opacity:.8;
}
.home-hero-inner{position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap;}
.home-eyebrow{
  font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.24em;
  color:var(--accent); margin-bottom:12px;
}
.home-title{font-size:46px; margin:0; max-width:15ch; letter-spacing:-.035em;}
.home-title em{
  font-style:normal; color:transparent;
  background:linear-gradient(120deg, var(--accent), var(--accent-2), var(--accent-3));
  -webkit-background-clip:text; background-clip:text;
}

.stat-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:16px; margin-bottom:40px;}
.stat-tile{
  padding:22px 24px; border-radius:var(--radius); border:1px solid var(--line); background:var(--surface);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); position:relative; overflow:hidden;
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.stat-tile::after{
  content:""; position:absolute; top:0; left:18px; right:18px; height:1px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent); opacity:.55;
}
.stat-tile:hover{transform:translateY(-3px); border-color:var(--line-2);}
.stat-value{
  font-family:var(--font-display); font-size:38px; font-weight:700; line-height:1; letter-spacing:-.04em;
  display:flex; align-items:center; gap:9px;
}
.stat-value .ic{color:var(--accent); filter:drop-shadow(0 0 10px rgba(34,211,238,.8));}
.stat-label{font-family:var(--font-mono); font-size:9.5px; color:var(--text-faint); margin-top:9px; text-transform:uppercase; letter-spacing:.18em;}

.home-section{margin-bottom:42px;}
.home-section-head{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.home-section-head h3{
  margin:0; font-size:11px; font-family:var(--font-mono); font-weight:600; text-transform:uppercase; letter-spacing:.22em;
  color:var(--text-dim); display:flex; align-items:center; gap:10px; white-space:nowrap;
}
.home-section-head h3::before{
  content:""; width:7px; height:7px; border-radius:50%; flex:0 0 auto;
  background:var(--accent); box-shadow:0 0 12px var(--accent);
}
.section-rule{height:1px; flex:1; min-width:20px; background:linear-gradient(90deg, var(--line-2), transparent);}

/* Featured paths */
.featured-grid{grid-template-columns:repeat(auto-fill, minmax(300px,1fr));}
.featured-card{
  position:relative; cursor:default; padding:0; overflow:hidden;
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.featured-card:hover{border-color:var(--line-2); box-shadow:var(--shadow-lg), var(--glow);}
.fc-band{
  padding:10px 16px; border-bottom:1px solid var(--line);
  font-family:var(--font-mono); font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.16em;
  display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--text);
  position:relative;
}
.fc-band::after{
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg, var(--accent), transparent);
}
.featured-card:nth-child(6n+1) .fc-band{background:linear-gradient(120deg, rgba(34,211,238,.22), transparent);}
.featured-card:nth-child(6n+2) .fc-band{background:linear-gradient(120deg, rgba(139,92,246,.22), transparent);}
.featured-card:nth-child(6n+3) .fc-band{background:linear-gradient(120deg, rgba(244,114,182,.20), transparent);}
.featured-card:nth-child(6n+4) .fc-band{background:linear-gradient(120deg, rgba(52,211,153,.20), transparent);}
.featured-card:nth-child(6n+5) .fc-band{background:linear-gradient(120deg, rgba(251,191,36,.20), transparent);}
.featured-card:nth-child(6n+6) .fc-band{background:linear-gradient(120deg, rgba(148,163,184,.20), transparent);}
.featured-card:nth-child(6n+2) .fc-band::after{background:linear-gradient(90deg, var(--accent-2), transparent);}
.featured-card:nth-child(6n+3) .fc-band::after{background:linear-gradient(90deg, var(--accent-3), transparent);}
.featured-card:nth-child(6n+4) .fc-band::after{background:linear-gradient(90deg, var(--success), transparent);}
.featured-card:nth-child(6n+5) .fc-band::after{background:linear-gradient(90deg, var(--gold), transparent);}
.fc-body{padding:18px 17px 17px;}
.featured-card h3{margin:0 0 8px; font-size:19px;}
.featured-card .meta{font-family:var(--font-mono); font-size:10px; color:var(--text-faint); letter-spacing:.07em; margin-bottom:12px;}
.featured-card .blurb{font-size:13px; color:var(--text-dim); line-height:1.62; margin:0 0 18px;}
.featured-card-foot{display:flex; justify-content:flex-end;}

/* ===================== Settings ===================== */
.settings-section{max-width:700px; margin-bottom:24px;}
.settings-section h3{font-size:19px; margin:0 0 8px;}
.settings-section .desc{font-size:13.5px; color:var(--text-dim); margin:0 0 16px; line-height:1.65;}
.settings-section code{font-family:var(--font-mono); font-size:12px; background:rgba(0,0,0,.3); padding:2px 6px; border-radius:6px;}
.pwd-wrap{display:flex; gap:10px;}
.pwd-wrap input{flex:1;}

/* ===================== Modal ===================== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(4,6,14,.72); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px; animation:fadeIn var(--dur) var(--ease);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.modal{
  background:var(--surface-solid); border:1px solid var(--line-2); border-radius:var(--radius-lg); padding:26px;
  max-width:560px; width:100%; max-height:88vh; overflow-y:auto;
  box-shadow:var(--shadow-lg), var(--glow); animation:popIn var(--dur) var(--ease);
}
.modal h2{margin:0 0 6px; font-size:24px;}
.modal .desc{font-size:13.5px; color:var(--text-dim); margin:0 0 20px;}
.modal-actions{display:flex; justify-content:flex-end; gap:12px; margin-top:10px;}

.watch-modal{max-width:900px; padding:24px;}
.watch-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px;}
.watch-eyebrow{font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.2em; color:var(--accent); margin-bottom:8px;}
.watch-head h2{margin:0; font-size:24px; line-height:1.2;}
.watch-player{
  position:relative; width:100%; padding-top:56.25%; overflow:hidden; background:#000;
  margin-bottom:18px; border-radius:14px; border:1px solid var(--line-2); box-shadow:var(--glow);
}
.watch-player iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
.watch-noplayer{
  padding:48px 20px; text-align:center; color:var(--text-dim); background:var(--surface);
  border:1px dashed var(--line-2); border-radius:14px; margin-bottom:18px;
}
.watch-meta{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-bottom:18px; letter-spacing:.08em;}
.watch-notes{font-family:var(--font); color:var(--text-dim); font-size:13.5px; margin:12px 0 0; line-height:1.65; letter-spacing:0;}
.watch-foot{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:18px;}
.watch-nav{display:flex; gap:10px;}
.watch-done-toggle{
  display:flex; align-items:center; gap:9px; font-size:13px; font-weight:500;
  color:var(--text-dim); cursor:pointer; margin:0;
}
.watch-external{font-family:var(--font-mono); font-size:10px; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.12em; text-decoration:none;}
.watch-external:hover{text-decoration:underline;}

/* ===================== Toasts ===================== */
#toasts{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--surface-solid); border:1px solid var(--line-2); border-radius:13px; padding:13px 16px;
  box-shadow:var(--shadow-lg); font-size:13.5px; max-width:340px;
  animation:popIn var(--dur) var(--ease-spring);
  display:flex; gap:10px; align-items:center;
  transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.toast .ic{color:var(--accent);}
.toast.error{border-color:rgba(251,113,133,.5);}
.toast.error .ic{color:var(--danger);}
.toast.success{border-color:rgba(52,211,153,.5);}
.toast.success .ic{color:var(--success);}
.toast.hide{opacity:0; transform:translateY(8px) scale(.96);}
.toast-msg{color:var(--text);}
.toast.error .toast-msg{color:var(--danger);}

/* ===================== Responsive ===================== */
@media (max-width:900px){
  .topnav-inner{flex-wrap:wrap; padding:0 14px; gap:10px; min-height:56px;}
  .brand{padding:10px 0; flex:1;}
  .navrow{order:3; flex:1 0 100%; border-top:1px solid var(--line); padding:8px 0; gap:6px;}
  .navbtn{padding:7px 13px; font-size:13px;}
  .view{padding:24px 14px 84px;}
  .pagehead-inner{padding:10px 14px;}
  .home-hero{padding:26px 20px;}
  .home-title{font-size:32px;}
  .detail-head h2{font-size:25px;}
  .day-row{gap:11px;}
  .day-gutter{flex-basis:26px; font-size:15px;}
  .lesson-media{width:118px;}
  .featured-card{transform:none !important;}
  body::after{background-size:44px 44px;}
}
@media print{
  .topnav, .pagehead, .chat-input-bar, .lesson-media{display:none !important;}
  body{background:#fff; color:#000;}
  body::before, body::after{display:none;}
  .card, .week-block{box-shadow:none;}
}
</style>
</head>
<body>
<div id="app">

  <header class="topnav">
    <div class="topnav-inner">
      <div class="brand">
        <div class="mark" data-icon-slot="compass"></div>
        <div><div class="name">ATLAS</div><div class="tag">Learning Studio</div></div>
      </div>

      <nav class="navrow" aria-label="Main">
        <button class="navbtn" data-nav="home">Home</button>
        <button class="navbtn" data-nav="chat">Chat</button>
        <button class="navbtn" data-nav="plans">Plans</button>
        <button class="navbtn" data-nav="today">Today</button>
        <button class="navbtn" data-nav="settings">Settings</button>
      </nav>

      <div class="topnav-right">
        <span class="key-status" id="keyStatus"></span>
        <button class="icon-btn" id="btnThemeToggle" title="Toggle theme"></button>
        <button class="btn primary small" id="btnNewPlan">New plan</button>
      </div>
    </div>
  </header>

  <main>
    <div class="pagehead">
      <div class="pagehead-inner">
        <h1 id="topTitle">Home</h1>
        <div class="sub" id="topSub"></div>
      </div>
    </div>
    <div class="view" id="view"></div>
  </main>

</div>

<div id="toasts" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";

/* ============================================================
   Icon set — small inline SVGs (no icon-font/CDN dependency)
============================================================ */
const ICONS = {
  compass: '<circle cx="12" cy="12" r="9"/><path d="m14.3 9.7-1.8 4.8-4.8 1.8 1.8-4.8z"/>',
  home: '<path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V10"/><path d="M9.5 20.5v-6.2h5v6.2"/>',
  chat: '<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8A2.5 2.5 0 0 1 17.5 17H10l-4.5 3.5V17h-1A2.5 2.5 0 0 1 2 14.5"/>',

function ymd(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function addDays(dateStr, n){ const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return d; }

// Returns {kind:"video"|"playlist", id} for anything Atlas can actually embed, or
// null when the link is a channel page / search page / non-YouTube URL that can
// only be opened externally (or resolved on-demand via the YouTube Data API key).
// Resolution order for what plays inside the app:
//   1. a video already resolved via the YouTube Data API and cached on the class
//   2. the lesson's own resourceUrl, when it happens to be a YouTube link
//   3. altVideoUrl — a YouTube stand-in for lessons whose main resource can't be
//      embedded (Khan Academy, MIT OCW, edX and friends all forbid iframing)
// Anything flagged isAlt is surfaced as "alternative", with the primary resource
// still one click away, so the two never get confused for each other.
function getYtEmbed(c){
  if(!c || c.type === "rest") return null;
  if(c.resolvedYtId) return {kind:"video", id:c.resolvedYtId, isAlt:!!c.resolvedIsAlt, channel:c.resolvedIsAlt ? (c.altChannel||"") : (c.channel||"")};
  const primary = extractYouTubeEmbed(c.resourceUrl);
  if(primary) return Object.assign(primary, {isAlt:false, channel:c.channel||""});
  const alt = extractYouTubeEmbed(c.altVideoUrl);
  if(alt) return Object.assign(alt, {isAlt:true, channel:c.altChannel||""});
  return null;
}
function ytApiKey(){ return (state.settings.ytApiKey||"").trim(); }
async function resolveYouTubeVideoId(plan, c){
  const key = ytApiKey();
  if(!key) return null;
  const q = encodeURIComponent(`${c.title} ${c.channel||""}`.trim());
  const resp = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&q=${q}&key=${key}`);
  if(!resp.ok){
    if(resp.status === 403) throw new Error("YouTube API key was rejected (check its restrictions or daily quota).");
    throw new Error(`YouTube search failed (HTTP ${resp.status}).`);
  }
  const data = await resp.json();
  const item = data.items && data.items[0];
  const vid = item && item.id && item.id.videoId;
  if(!vid) return null;
  c.resolvedYtId = vid;
  // Anything we had to go find is an alternative to the lesson's own resource.
  c.resolvedIsAlt = true;
  if(item.snippet && item.snippet.channelTitle) c.altChannel = item.snippet.channelTitle;
  plan.updatedAt = Date.now();
  persistPlans();
  return vid;
}
function extractYouTubeEmbed(url){
  if(!url) return null;
  try{
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./,"").replace(/^m\./,"");
    if(host === "youtu.be"){
      const id = u.pathname.slice(1).split("/")[0];
      return id ? {kind:"video", id} : null;
    }
    if(host === "youtube.com" || host === "youtube-nocookie.com"){
      if(u.pathname === "/watch"){
        const v = u.searchParams.get("v");
        return v ? {kind:"video", id:v} : null;
      }
      if(u.pathname === "/playlist"){
        const list = u.searchParams.get("list");
        return list ? {kind:"playlist", id:list} : null;
      }
      const m = u.pathname.match(/^\/(embed|shorts|live)\/([^/?]+)/);
      if(m){
        if(m[2] === "videoseries"){
          const list = u.searchParams.get("list");
          return list ? {kind:"playlist", id:list} : null;
        }
        return {kind:"video", id:m[2]};
      }
    }
  }catch(e){}
  return null;
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   Markdown-lite renderer (safe: escapes first)
============================================================ */
function inlineFormat(s){
  return s
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function blockFormat(escText){
  const lines = escText.split("\n");
  let html = "", inList = false;
  for(const raw of lines){
    const bullet = raw.match(/^\s*[-*]\s+(.*)/);
    if(bullet){
      if(!inList){ html += "<ul>"; inList = true; }
      html += `<li>${inlineFormat(bullet[1])}</li>`;
    } else {
      if(inList){ html += "</ul>"; inList = false; }
      if(raw.trim()==="") continue;
      html += `<p>${inlineFormat(raw)}</p>`;
    }
  }
  if(inList) html += "</ul>";
  return html;
}
function renderChatBubble(rawText){
  const fenceTag = "```cadence-plan";
  const idx = rawText.indexOf(fenceTag);
  let mainText = rawText, chip = "";
  if(idx !== -1){
    mainText = rawText.slice(0, idx);
    const after = rawText.slice(idx + fenceTag.length);
    const closed = after.includes("```");
    chip = closed
      ? `<div class="plan-chip" data-action="view-plan" tabindex="0" role="button">${icon("calendar","ic-sm")} <strong>Learning plan generated</strong> — click to view it</div>`
      : `<div class="plan-chip plan-chip-loading">${icon("hourglass","ic-sm")} Designing your curriculum <span class="dotpulse"><span></span><span></span><span></span></span></div>`;
  }
  return blockFormat(escapeHtml(mainText.trim())) + chip;
}

   Plan data helpers
============================================================ */
function computeDateForDay(plan, weekNumber, dayNumber){
  const offset = (weekNumber-1)*7 + (dayNumber-1);
  return ymd(addDays(plan.startDate, offset));
}
function planProgress(plan){
  let total=0, done=0;
  (plan.weeks||[]).forEach(w=>(w.days||[]).forEach(d=>(d.classes||[]).forEach(c=>{
    if(c.type==="rest") return;
    total++; if(c.done) done++;
  })));
  return total ? Math.round(done/total*100) : 0;
}
function classesScheduledOn(dateStr){
  const items = [];
  state.plans.forEach(plan=>{
    (plan.weeks||[]).forEach(week=>(week.days||[]).forEach(day=>{
      if(computeDateForDay(plan, week.weekNumber, day.dayNumber) !== dateStr) return;
      (day.classes||[]).forEach(c=>{ if(c.type!=="rest") items.push({plan, week, day, c}); });
    }));
  });
  return items;
}
function computeStreak(){
  let streak = 0;
  const cursor = new Date();
  for(let i=0;i<400;i++){
    const dateStr = ymd(cursor);
    const items = classesScheduledOn(dateStr);
    const allDone = items.length > 0 && items.every(it=>it.c.done);
    if(!allDone){
      if(i===0){ cursor.setDate(cursor.getDate()-1); continue; }
      break;
    }
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function completedThisWeek(){
  const today = new Date();
  let count = 0;
  for(let i=0;i<7;i++){
    const dateStr = ymd(addDays(ymd(today), -i));
    classesScheduledOn(dateStr).forEach(it=>{ if(it.c.done) count++; });
  }
  return count;
}
function extractPlanJSON(text){
  const re = /```cadence-plan\s*([\s\S]*?)```/g;
  let m, last=null;
  while((m = re.exec(text))) last = m[1];
  if(!last) return null;
  const raw = last.trim();
  try{ return JSON.parse(raw); }
  catch(e){
    try{ return JSON.parse(raw.replace(/,(\s*[}\]])/g, "$1")); }
    catch(e2){ return null; }
  }
}
function applyPlanData(plan, data){
  const oldClassIdx = {}, oldTodoIdx = {};
  (plan.weeks||[]).forEach(w=>(w.days||[]).forEach(d=>{
    (d.classes||[]).forEach(c=>{ oldClassIdx[`${w.weekNumber}|${d.dayNumber}|${c.title}`] = c; });
    (d.todos||[]).forEach(t=>{ oldTodoIdx[`${w.weekNumber}|${d.dayNumber}|${t.text}`] = t; });
  }));

  plan.title = data.title || plan.title;
  plan.subject = data.subject || plan.subject;
  plan.language = data.language || plan.language;
  plan.durationWeeks = Math.min(MAX_WEEKS, Number(data.durationWeeks)||plan.durationWeeks);
  plan.dailyMinutes = Number(data.dailyMinutes)||plan.dailyMinutes;

  plan.weeks = (data.weeks||[]).slice(0, MAX_WEEKS).map(w=>({
    weekNumber: Number(w.weekNumber)||1,
    theme: w.theme || "",
    days: (w.days||[]).slice(0,7).map(d=>({
      dayNumber: Number(d.dayNumber)||1,
      classes: (d.classes||[]).map(c=>{
        const old = oldClassIdx[`${w.weekNumber}|${d.dayNumber}|${c.title}`];
        return {
          id: (old && old.id) || uid(),
          title: c.title || "Untitled class",
          type: c.type || "video",
          resourceUrl: c.resourceUrl || "",
          channel: c.channel || "",
          altVideoUrl: c.altVideoUrl || "",
          altChannel: c.altChannel || "",
          durationMinutes: Number(c.durationMinutes)||plan.dailyMinutes,
          notes: c.notes || "",
          done: (old && old.done) || false,
          completionTime: (old && old.completionTime) || null,
          // Keep any video we already looked up, so regenerating a plan doesn't
          // spend YouTube quota re-finding the same clip.
          resolvedYtId: (old && old.resolvedYtId) || null,
          resolvedIsAlt: (old && old.resolvedIsAlt) || false,
        };
      }),
      todos: (d.todos||[]).map(t=>{
        const old = oldTodoIdx[`${w.weekNumber}|${d.dayNumber}|${t.text}`];
        return { id:(old && old.id)||uid(), text: t.text||"", done:(old && old.done)||false };
      })
    }))
  }));
  plan.updatedAt = Date.now();
  persistPlans();
}

function buildSystemPrompt(plan){
  const langLabel = LANGS[plan.language] || "English";
  return `You are Atlas, an expert personal learning coach and curriculum designer helping one learner build a real, achievable self-study plan.

LEARNER CONTEXT
- Subject / goal: ${plan.subject}
- Content language for resources: ${langLabel}
- Current level: ${plan.level}
- Duration: ${plan.durationWeeks} week(s) (hard max ${MAX_WEEKS} weeks, ~3 months)
- Daily study time available: ${plan.dailyMinutes} minutes
- Rest days per week: ${(plan.daysOff&&plan.daysOff.length) ? plan.daysOff.join(", ") : "none specified, use your judgement"}
- Today's date: ${ymd(new Date())}

RESEARCH REQUIREMENT
Use the web_search and web_fetch tools to find REAL, currently available, FREE YouTube videos that teach this subject in ${langLabel}. Prefer well-known, reputable educators/channels for that language and subject.
- Every "video" class's resourceUrl MUST be a link to one specific, individual YouTube video (a real youtube.com/watch?v=... or youtu.be/... URL for one exact video) — NEVER a channel homepage, a playlist page, a search-results URL, or an instruction like "search this channel for X". The app embeds this exact URL as a video player, so it must point straight at one playable video.
- Never invent a URL — every resourceUrl must come from an actual search result you found this conversation, and should be plausible as a real, currently-playable video (use web_fetch to spot-check ones you're unsure of).
- If you cannot find a strong specific-video match for a day, pick the single best real individual video you did find (even if imperfect) rather than falling back to a channel or a "search for" note — a specific video is always required for type "video".

OUTPUT FORMAT
Once you have enough information (ask brief clarifying questions first if something important is missing), respond with a short friendly note OUTSIDE any code fence, then ALWAYS append the FULL current plan as one single fenced block starting with \`\`\`cadence-plan and ending with \`\`\`, containing STRICT JSON (no comments, no trailing commas) in exactly this shape:

\`\`\`cadence-plan
{
  "title": "short plan title",
  "subject": "${plan.subject}",
  "language": "${plan.language}",
  "durationWeeks": ${plan.durationWeeks},
  "dailyMinutes": ${plan.dailyMinutes},
  "weeks": [
    {
      "weekNumber": 1,
      "theme": "what this week focuses on",
      "days": [
        {
          "dayNumber": 1,
          "classes": [
            {
              "title": "class / video title",
              "type": "video",
              "resourceUrl": "https://www.youtube.com/watch?v=...",
              "channel": "channel name",
              "altVideoUrl": "https://www.youtube.com/watch?v=... (a YouTube stand-in when resourceUrl can't be embedded)",
              "altChannel": "channel name for altVideoUrl",
              "durationMinutes": 30,
              "notes": "what to do / focus on"
            }
          ],
          "todos": [ { "text": "short actionable todo for the day" } ]
        }
      ]
    }
  ]
}
\`\`\`

RULES FOR THE JSON
- Every week object must contain exactly 7 entries in "days" (dayNumber 1-7), even rest days — use "type":"rest" with an empty or near-empty classes array and a light todo like "Review this week's notes".
- classes[].type is one of: "video", "practice", "reading", "quiz", "rest".
- EVERY non-rest class must be watchable inside the app. Whenever resourceUrl is NOT an embeddable YouTube link — i.e. it points at Khan Academy, MIT OCW, edX, Coursera, freeCodeCamp, British Council, a YouTube channel page, or a search page, none of which allow iframing — also set "altVideoUrl" to a real, specific YouTube video or playlist covering the same topic (plus "altChannel"). Same sourcing rule as resourceUrl: it must come from an actual search result, never invented. Omit altVideoUrl only when resourceUrl is already an embeddable YouTube video/playlist.
- Total class duration for a day should roughly match the learner's daily study time.
- durationWeeks must never exceed ${MAX_WEEKS}.
- Always output the WHOLE plan (every week decided so far), never a partial diff — even when the learner only asked to tweak one part.
- Never include dates or clock times in the JSON — the learner sets their own daily completion time in the app.
- Talk to the learner in whichever language they write to you in, but keep resourceUrl/channel values exactly as found.
- Keep the prose outside the code fence brief (a few sentences) — the plan JSON itself carries the detail.`;
}

async function sendToClaude(plan, userText, {onStatus, onChunk} = {}){
  const apiKey = (state.settings.apiKey||"").trim();
  if(!apiKey) throw new Error("missing-api-key");

  plan.chat.push({role:"user", content:userText, ts:Date.now()});
  persistPlans();

  let apiMessages = plan.chat.map(m=>({role:m.role, content:m.content}));
  // Prompt caching: mark the message just before this turn's new user message as a
  // cache breakpoint. On every follow-up turn, everything up to and including it is
  // read from cache (~90% cheaper) instead of reprocessed at full price. Only kicks
  // in from the 2nd message onward, and only helps on models with a low-enough
  // minimum cacheable prefix (Opus 5 / Sonnet 5); it's a harmless no-op otherwise.
  if(apiMessages.length > 1){
    const idx = apiMessages.length - 2;
    const prior = apiMessages[idx];
    apiMessages[idx] = {role: prior.role, content: [{type:"text", text: prior.content, cache_control:{type:"ephemeral"}}]};
  }
  let fullText = "";
  let continuations = 0;
  let finalStopReason = null;

  while(true){
    const body = {
      model: state.settings.model || "claude-sonnet-5",
      max_tokens: 12000,
      stream: true,
      system: [{type:"text", text: buildSystemPrompt(plan), cache_control:{type:"ephemeral"}}],
      messages: apiMessages,
      tools: [
        {type:"web_search_20260209", name:"web_search", max_uses:3},
        {type:"web_fetch_20260209", name:"web_fetch", max_uses:2}
      ]
    };
    if(state.settings.effort) body.output_config = {effort: state.settings.effort};

    let resp;
    try{
      resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{
          "content-type":"application/json",
          "x-api-key": apiKey,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body: JSON.stringify(body)
      });
    }catch(networkErr){
      throw new Error("Network error reaching the Claude API. Check your connection.");
    }

    if(!resp.ok){
      let msg = `Request failed (HTTP ${resp.status})`;
      try{ const errBody = await resp.json(); if(errBody && errBody.error && errBody.error.message) msg = errBody.error.message; }catch(e){}
      if(resp.status===401) msg = "Invalid API key. Check it in Settings.";
      throw new Error(msg);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let turnText = "";

    readLoop:
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for(const part of parts){
        for(const line of part.split("\n")){
          if(!line.startsWith("data:")) continue;
          const jsonStr = line.slice(5).trim();
          if(!jsonStr) continue;
          let payload;
          try{ payload = JSON.parse(jsonStr); }catch(e){ continue; }

          if(payload.type === "content_block_start"){
            const cb = payload.content_block;
            if(cb && cb.type === "server_tool_use"){
              const q = (cb.input && (cb.input.query||cb.input.url)) || "the web";
              onStatus && onStatus(`${icon("search","ic-sm")} Researching: ${escapeHtml(q)}`);
            }
          } else if(payload.type === "content_block_delta"){
            if(payload.delta && payload.delta.type === "text_delta"){
              turnText += payload.delta.text;
              fullText += payload.delta.text;
              onChunk && onChunk(fullText);
            }
          } else if(payload.type === "message_delta"){
            if(payload.delta && payload.delta.stop_reason) finalStopReason = payload.delta.stop_reason;
          } else if(payload.type === "error"){
            throw new Error((payload.error && payload.error.message) || "Stream error");
          }
        }
      }
    }

    const hasOpenFence = fullText.includes("```cadence-plan");
    const fenceClosed = hasOpenFence && (fullText.split("```cadence-plan")[1]||"").includes("```");

    if(finalStopReason === "max_tokens" && (!hasOpenFence || !fenceClosed) && continuations < MAX_CONTINUATIONS){
      continuations++;
      apiMessages.push({role:"assistant", content: turnText});
      apiMessages.push({role:"user", content:"Continue exactly where you left off. Do not repeat any earlier text and do not restart the JSON — just continue the raw output so it can be concatenated with what you already wrote."});
      onStatus && onStatus(`${icon("pencil","ic-sm")} Plan is long — continuing (part ${continuations+1})…`);
      continue;
    }
    break;
  }

  plan.chat.push({role:"assistant", content: fullText, ts:Date.now()});
  persistPlans();

  const planData = extractPlanJSON(fullText);
  if(planData) applyPlanData(plan, planData);

  return {text: fullText, planUpdated: !!planData, stopReason: finalStopReason};
}

function fireNotification(title, body){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  try{ new Notification(title, {body}); }catch(e){}
}
function checkReminders(){
  if(!state.settings.notifEnabled) return;
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  const now = new Date();
  const todayStr = ymd(now);
  const fired = store.get("firedNotifs", {});
  let changed = false;

  state.plans.forEach(plan=>{
    (plan.weeks||[]).forEach(week=>{
      (week.days||[]).forEach(day=>{
        const dateStr = computeDateForDay(plan, week.weekNumber, day.dayNumber);
        if(dateStr !== todayStr) return;
        (day.classes||[]).forEach(cls=>{
          if(!cls.completionTime || cls.done) return;
          const [hh,mm] = cls.completionTime.split(":").map(Number);
          if(isNaN(hh)||isNaN(mm)) return;
          const target = new Date(now); target.setHours(hh,mm,0,0);
          const diffMin = (target - now)/60000;
          const key10 = `${plan.id}|${cls.id}|${dateStr}|10`;
          const key5  = `${plan.id}|${cls.id}|${dateStr}|5`;
          if(diffMin<=10.25 && diffMin>=9.25 && !fired[key10]){
            fireNotification("⏰ 10 minutes left", `"${cls.title}" (${plan.title}) is due to finish at ${cls.completionTime}.`);
            fired[key10]=true; changed=true;
          }
          if(diffMin<=5.25 && diffMin>=4.25 && !fired[key5]){
            fireNotification("⏰ 5 minutes left", `Wrap up "${cls.title}" (${plan.title}) — due ${cls.completionTime}.`);
            fired[key5]=true; changed=true;
          }
        });
      });
    });
  });
  if(changed) store.set("firedNotifs", fired);
  if(state.view === "today") renderView();
}
setInterval(checkReminders, 20000);

/* ============================================================
   Google Drive sync — data lives only in this browser unless the
   learner connects their own Google Drive. No server of ours is ever
   involved: this app talks to Google's APIs directly from the browser
   using an OAuth Client ID the learner creates for free themselves
   (just like their own Claude API key — we can't create that for them).
   One JSON file ("atlas-backup.json") in their own Drive is created and
   kept up to date; only files this app itself creates are ever touched
   (scope: drive.file), nothing else in their Drive is readable.
============================================================ */
const DRIVE_FILENAME = "atlas-backup.json";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
let driveAccessToken = null;
let driveTokenClient = null;

function ensureGisLoaded(cb){
  if(window.google && google.accounts && google.accounts.oauth2) return cb();
  const existing = document.getElementById("gisScript");
  if(existing){ existing.addEventListener("load", cb, {once:true}); return; }
  const s = document.createElement("script");
  s.id = "gisScript";
  s.src = "https://accounts.google.com/gsi/client";
  s.async = true; s.defer = true;
  s.onload = cb;
  s.onerror = ()=> toast("Couldn't reach Google's sign-in script. Check your connection.", "error");
  document.head.appendChild(s);
}

function driveClientId(){ return (state.settings.driveClientId||"").trim(); }

function requestDriveToken(interactive){
  return new Promise((resolve, reject)=>{
    const clientId = driveClientId();
    if(!clientId){ reject(new Error("Add your Google OAuth Client ID first.")); return; }
    ensureGisLoaded(()=>{
      try{
        driveTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: DRIVE_SCOPE,
          callback: (resp)=>{
            if(resp && resp.error){ reject(new Error(resp.error)); return; }
            driveAccessToken = resp.access_token;
            resolve(driveAccessToken);
          },
          error_callback: (err)=> reject(new Error((err && err.type) || "Google sign-in was cancelled or failed.")),
        });
        driveTokenClient.requestAccessToken({prompt: interactive ? "consent" : ""});
      }catch(e){ reject(e); }
    });
  });
}

async function ensureDriveToken(){
  if(driveAccessToken) return driveAccessToken;
  return requestDriveToken(false);
}

async function findOrCreateDriveFile(token){
  let fileId = state.settings.driveFileId;
  if(fileId){
    const check = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id,trashed`, {headers:{Authorization:`Bearer ${token}`}});
    if(check.ok){
      const j = await check.json();
      if(!j.trashed) return fileId;
    }
  }
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const searchResp = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {headers:{Authorization:`Bearer ${token}`}});
  if(searchResp.ok){
    const j = await searchResp.json();
    if(j.files && j.files.length){
      state.settings.driveFileId = j.files[0].id;
      persistSettings();
      return j.files[0].id;
    }
  }
  const createResp = await fetch("https://www.googleapis.com/drive/v3/files", {
    method:"POST",
    headers:{Authorization:`Bearer ${token}`, "Content-Type":"application/json"},
    body: JSON.stringify({name: DRIVE_FILENAME, mimeType:"application/json"})
  });
  if(!createResp.ok) throw new Error("Could not create the backup file in Drive.");
  const created = await createResp.json();
  state.settings.driveFileId = created.id;
  persistSettings();
  return created.id;
}

function currentBackupPayload(){
  return JSON.stringify({exportedAt: Date.now(), plans: state.plans}, null, 2);
}

// Per-plan last-write-wins merge, so opening Atlas on a second device picks up
// whatever changed elsewhere instead of silently overwriting it. Plans that exist
// on only one side are kept; plans on both sides keep whichever copy has the
// newer updatedAt. (Deleting a plan on one device can still have it reappear if
// another device syncs an older copy before seeing the deletion — acceptable for
// a single-user app; just delete it again.)
function mergePlansData(localPlans, drivePlans){
  const byId = new Map();
  (drivePlans||[]).forEach(p=>{ if(p && p.id) byId.set(p.id, p); });
  (localPlans||[]).forEach(p=>{
    if(!p || !p.id) return;
    const other = byId.get(p.id);
    if(!other || (p.updatedAt||0) >= (other.updatedAt||0)) byId.set(p.id, p);
  });
  return Array.from(byId.values());
}

async function syncToDrive(){
  if(!state.settings.driveConnected) return;
  try{
    const token = await ensureDriveToken();
    const fileId = await findOrCreateDriveFile(token);
    const resp = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method:"PATCH",
      headers:{Authorization:`Bearer ${token}`, "Content-Type":"application/json"},
      body: currentBackupPayload()
    });
    if(resp.ok){
      state.settings.driveLastSync = Date.now();
      persistSettings();
      if(state.view==="settings") renderView();
    }
  }catch(e){
    console.warn("Drive sync failed", e);
  }
}

async function connectDrive(){
  if(!driveClientId()){ toast("Paste your Google OAuth Client ID first.", "error"); return; }
  try{
    await requestDriveToken(true);
    state.settings.driveConnected = true;
    persistSettings();
    toast("Google Drive connected", "success");
    await syncToDrive();
    renderView();
  }catch(e){
    toast(e.message || "Could not connect to Google Drive.", "error");
  }
}

async function restoreFromDrive(){
  try{
    const token = await ensureDriveToken();
    const fileId = await findOrCreateDriveFile(token);
    const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {headers:{Authorization:`Bearer ${token}`}});
    if(!resp.ok) throw new Error("Could not read the Drive backup file.");
    const data = await resp.json();
    if(Array.isArray(data.plans)){
      state.plans = data.plans;
      store.set("plans", state.plans);
      toast("Restored from Google Drive", "success");
      renderView();
    } else {
      toast("That Drive file doesn't look like an Atlas backup.", "error");
    }
  }catch(e){
    toast(e.message || "Could not restore from Drive.", "error");
  }
}

// Runs once at startup when this browser was already connected to Drive. Tries a
// silent (non-interactive) token refresh — works if the user's still signed into
// Google in this browser, fails quietly on a brand-new device/profile (no popup,
// no error toast; they just click "Connect" in Settings once to link it). On
// success, merges Drive's copy into local storage so a plan edited on another
// device shows up here without any manual "Restore" click.
async function autoSyncFromDrive(){
  if(!state.settings.driveConnected) return;
  try{
    const token = await ensureDriveToken();
    const fileId = await findOrCreateDriveFile(token);
    const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {headers:{Authorization:`Bearer ${token}`}});
    if(!resp.ok) return;
    const data = await resp.json();
    if(!Array.isArray(data.plans)) return;
    const merged = mergePlansData(state.plans, data.plans);
    const changed = JSON.stringify(merged) !== JSON.stringify(state.plans);
    state.plans = merged;
    store.set("plans", state.plans);
    state.settings.driveLastSync = Date.now();
    persistSettings();
    if(changed){
      renderView();
      toast("Synced latest from Google Drive", "success");
    }
  }catch(e){
    console.warn("Auto-sync from Drive skipped", e);
  }
}

function disconnectDrive(){
  driveAccessToken = null;
  state.settings.driveConnected = false;
  persistSettings();
  toast("Disconnected from Google Drive (your Drive file is untouched)", "success");
  renderView();
}

function renderChat(container){
  const plan = activePlan();
  setTopbar("Chat", plan ? plan.title : "");

  if(!plan){
    container.innerHTML = `
      <div class="chat-empty">
        <div class="big-ic">${icon("compass","ic-xl")}</div>
        <h2>Design your first learning plan</h2>
        <p>Tell Atlas what you want to learn, in which language, and how much time you have. It'll search the web for real, free YouTube classes and build you a full routine — up to 3 months.</p>
        <button class="btn primary" id="btnEmptyNewPlan">${icon("plus","ic-sm")} Create a learning plan</button>
      </div>`;
    document.getElementById("btnEmptyNewPlan").onclick = openNewPlanModal;
    return;
  }

  const suggestions = [
    "Make it a bit more intensive, I have more free time on weekends.",
    "Swap week 2 to focus more on practice than videos.",
    "Regenerate the resources in Hindi instead.",
  ];

  container.innerHTML = `
    <div class="chat-wrap">
      <div class="chat-scroll" id="chatScroll">
        ${plan.chat.length ? plan.chat.map(renderMsg).join("") : `
          <div class="chat-empty">
            <div class="big-ic">${icon("sparkle","ic-xl")}</div>
            <h2>${escapeHtml(plan.title)}</h2>
            <p>Ready to build your ${plan.durationWeeks}-week ${LANGS[plan.language]||''} plan for <strong>${escapeHtml(plan.subject)}</strong>.</p>
            <button class="btn primary" id="btnGenerateNow">Generate the full plan</button>
          </div>`}
        <div id="streamTarget"></div>
      </div>
      <div class="chat-input-bar">
        <div class="chip-row" style="margin-bottom:10px;">
          ${plan.chat.length ? suggestions.map(s=>`<span class="chip" data-action="fill-suggestion" data-text="${escapeHtml(s)}" tabindex="0" role="button">${escapeHtml(s)}</span>`).join("") : ""}
        </div>
        <div class="chat-input-row">
          <textarea id="chatInput" placeholder="Ask Atlas to adjust your plan, add a topic, change language…" rows="1"></textarea>
          <button class="btn primary" id="btnSend">Send</button>
        </div>
        <div class="chat-hint">Enter to send · Shift+Enter for a new line</div>
      </div>
    </div>
  `;

  const scroll = document.getElementById("chatScroll");
  scroll.scrollTop = scroll.scrollHeight;

  const input = document.getElementById("chatInput");
  const btnSend = document.getElementById("btnSend");
  if(input){
    input.addEventListener("keydown", e=>{
      if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); doSend(); }
    });
    input.addEventListener("input", ()=>{ input.style.height="auto"; input.style.height=Math.min(160,input.scrollHeight)+"px"; });
  }
  if(btnSend) btnSend.onclick = doSend;
  const genBtn = document.getElementById("btnGenerateNow");
  if(genBtn) genBtn.onclick = ()=> runChatTurn(buildInitialMessage(plan));

  function doSend(){
    const text = input.value.trim();
    if(!text || state.sending) return;
    input.value=""; input.style.height="auto";
    runChatTurn(text);
  }
}

function renderMsg(m){
  const isUser = m.role === "user";
  return `
    <div class="msg ${isUser?'user':'assistant'}">
      <div class="avatar">${isUser?icon("user"):icon("compass")}</div>
      <div class="bubble">${isUser ? `<p>${escapeHtml(m.content)}</p>` : renderChatBubble(m.content)}</div>
    </div>`;
}

function buildInitialMessage(plan){
  const langLabel = LANGS[plan.language]||"English";
  let msg = `I want to learn "${plan.subject}" over ${plan.durationWeeks} week(s), studying about ${plan.dailyMinutes} minutes per day. My current level is ${plan.level}. Please use ${langLabel} language video resources.`;
  if(plan.daysOff && plan.daysOff.length) msg += ` I'd prefer to rest on: ${plan.daysOff.join(", ")}.`;
  msg += " Please research real free YouTube resources and design the full curriculum now.";
  return msg;
}

async function runChatTurn(userText){
  const plan = activePlan();
  if(!plan) return;
  if(!(state.settings.apiKey||"").trim()){
    toast("Add your Claude API key in Settings first.", "error");
    state.view = "settings"; renderView();
    return;
  }
  state.sending = true;
  const scroll = document.getElementById("chatScroll");

  // render the user's message immediately
  const userMsgHtml = renderMsg({role:"user", content:userText});
  document.getElementById("streamTarget").insertAdjacentHTML("beforebegin", userMsgHtml);

  const target = document.getElementById("streamTarget");
  target.innerHTML = `
    <div class="msg assistant" id="liveMsg">
      <div class="avatar">${icon("compass")}</div>
      <div class="bubble">
        <div class="status-line" id="liveStatus">${icon("sparkle","ic-sm")} Thinking <span class="dotpulse"><span></span><span></span><span></span></span></div>
        <div id="liveText"></div>
      </div>
    </div>`;
  scroll.scrollTop = scroll.scrollHeight;
  const liveText = document.getElementById("liveText");
  const liveStatus = document.getElementById("liveStatus");

  disableChatInput(true);
  try{
    const result = await sendToClaude(plan, userText, {
      onStatus: (s)=>{ liveStatus.innerHTML = s; },
      onChunk: (full)=>{ liveText.innerHTML = renderChatBubble(full); scroll.scrollTop = scroll.scrollHeight; }
    });
    if(result.planUpdated){
      toast("Learning plan updated", "success");
    }
    renderView(); // full re-render to reflect persisted state cleanly
    const scroll2 = document.getElementById("chatScroll");
    if(scroll2) scroll2.scrollTop = scroll2.scrollHeight;
  }catch(err){
    toast(err.message || "Something went wrong talking to Claude.", "error");
    liveStatus.innerHTML = "";
    liveText.innerHTML = `<p style="color:var(--danger); display:flex; align-items:center; gap:6px;">${icon("alert","ic-sm")} ${escapeHtml(err.message||"Request failed.")}</p>`;
  }finally{
    state.sending = false;
    disableChatInput(false);
  }
}
function disableChatInput(disabled){
  const i = document.getElementById("chatInput");
  const b = document.getElementById("btnSend");
  if(i) i.disabled = disabled;
  if(b) b.disabled = disabled;
}

function weekKey(planId, weekNumber){ return `${planId}|${weekNumber}`; }
function renderWeekBlock(plan, week){
  const isOpen = state.openWeeks.has(weekKey(plan.id, week.weekNumber));
  return `
    <div class="week-block${isOpen?' open':''}" data-week="${week.weekNumber}">

function renderDayRow(plan, week, day){
  const dateStr = computeDateForDay(plan, week.weekNumber, day.dayNumber);

// Builds the video slot for a lesson. Collapsed it's a lightweight facade (just a
// thumbnail — no YouTube JS loaded); once played it becomes a real <iframe> right
// inside the card, spanning its full width, and stays open across re-renders.
function ytEmbedSrc(yt, autoplay){
  const a = autoplay ? "1" : "0";
  // enablejsapi lets the IFrame Player API report playback position back to us;
  // origin is required alongside it, but only meaningful over http(s).
  const origin = location.protocol.startsWith("http") ? `&origin=${encodeURIComponent(location.origin)}` : "";
  return yt.kind === "playlist"
    ? `https://www.youtube-nocookie.com/embed/videoseries?list=${yt.id}&rel=0&autoplay=${a}&enablejsapi=1${origin}`
    : `https://www.youtube-nocookie.com/embed/${yt.id}?rel=0&autoplay=${a}&enablejsapi=1${origin}`;
}
function renderLessonMedia(plan, c, small){
  const yt = getYtEmbed(c);
  const canResolve = !yt && c.type !== "rest" && !!ytApiKey();
  if(!yt && !canResolve) return "";
  const attrs = `data-plan="${plan.id}" data-class="${c.id}"`;

  if(yt && state.inlineOpen.has(c.id)){
    const what = yt.kind === "playlist" ? "Playlist" : "Now playing";
    return `
      <div class="lesson-media expanded" data-media="${c.id}">
        <div class="lesson-embed">
          <div class="frame">
            <iframe id="ytf-${c.id}" data-yt-class="${c.id}" src="${ytEmbedSrc(yt, true)}" title="${escapeHtml(c.title)}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="watch-bar" title="How much of this video you've watched">
            <div class="watch-bar-fill" data-watchfill="${c.id}" style="width:${Math.round(watchPct(c)*100)}%"></div>
          </div>
          <div class="lesson-embed-bar">
            <span>${yt.isAlt ? "Alt video" : what}${yt.channel ? " · " + escapeHtml(yt.channel) : ""}</span>
            <span class="lb-actions">
              <span class="watch-pct" data-watchpct="${c.id}">${Math.round(watchPct(c)*100)}% watched</span>
              <button data-action="focus-mode" ${attrs}>Focus mode</button>
              <button data-action="close-inline" ${attrs}>Close</button>
            </span>
          </div>
        </div>
      </div>`;
  }

  const label = canResolve
    ? `Find an alternative video for ${escapeHtml(c.title)}`
    : (yt.isAlt ? `Play alternative video for ${escapeHtml(c.title)}` : `Play ${escapeHtml(c.title)}`);
  let inner, extraCls = "", style = "";
  if(yt && yt.kind === "video"){
    style = ` style="background-image:url('https://img.youtube.com/vi/${yt.id}/hqdefault.jpg')"`;
    inner = `<span class="play-badge">${icon("play","ic-sm")}</span>`;
  } else if(yt){
    extraCls = " icon-only";
    inner = `${icon("playlist","ic-lg")}<span class="play-badge">${icon("play","ic-sm")}</span>`;
  } else {
    extraCls = " icon-only";
    inner = icon("search","ic-lg");
  }
  const flag = (yt && yt.isAlt) ? `<span class="alt-flag">Alt</span>` : "";
  const seen = watchPct(c);
  const seenBar = seen > 0.01
    ? `<span class="facade-progress" title="${Math.round(seen*100)}% watched"><span style="width:${Math.round(seen*100)}%"></span></span>` : "";
  return `
    <div class="lesson-media${small?" sm":""}" data-media="${c.id}">
      <button class="lesson-facade${extraCls}" data-action="play-inline" ${attrs} aria-label="${label}"${style}>${inner}${flag}${seenBar}</button>
    </div>`;
}

function renderClassCard(plan, c){
  if(c.type === "rest"){
    return `<div class="class-card rest-card"><div class="cc-main"><div class="cc-title">${icon("moon","ic-sm")} Rest day</div></div></div>`;
  }
  const typeIcon = {video:icon("play","ic-sm"), practice:icon("wrench","ic-sm"), reading:icon("bookOpen","ic-sm"), quiz:icon("clipboard","ic-sm")}[c.type] || icon("play","ic-sm");
  const media = renderLessonMedia(plan, c, false);
  // The embedded player may only be a stand-in, so keep the lesson's real

    ? `<a class="btn small" href="${escapeHtml(c.resourceUrl)}" target="_blank" rel="noopener">Open ${icon("external","ic-sm")}</a>` : "";
  const attachBtn = (!media && c.type !== "rest")
    ? `<button class="btn small" data-action="attach-video" data-plan="${plan.id}" data-class="${c.id}" title="Pick a YouTube video to watch here">${icon("plus","ic-sm")} Video</button>` : "";
  return `
    <div class="class-card ${c.done?'done':''}" data-card="${c.id}">
      ${media}
      <div class="cc-main">
        <div class="cc-title">${media?'':typeIcon+' '}${escapeHtml(c.title)}</div>

// Subtle pointer-driven 3D tilt on feature cards. Skipped entirely for touch
// devices (no hover concept) and when the visitor's OS asks for reduced motion.
function attachTiltEffects(root){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(window.matchMedia && window.matchMedia("(hover: none)").matches) return;
  root.querySelectorAll(".featured-card").forEach(el=>{
    el.addEventListener("mousemove", e=>{
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = `perspective(1100px) rotateX(${(-py*5).toFixed(2)}deg) rotateY(${(px*5).toFixed(2)}deg) translate(-3px,-3px)`;
    });
    el.addEventListener("mouseleave", ()=>{ el.style.transform = ""; });
  });
}

function renderToday(container){

  state.plans.forEach(plan=>{
    (plan.weeks||[]).forEach(week=>(week.days||[]).forEach(day=>{
      const dateStr = computeDateForDay(plan, week.weekNumber, day.dayNumber);
      if(dateStr !== todayStr) return;
      (day.classes||[]).forEach(c=>{ if(c.type!=="rest") items.push({plan, week, day, c}); });
      (day.todos||[]).forEach(t=> todos.push({plan, week, day, t}));
    }));
  });
  items.sort((a,b)=>{
    if(!a.c.completionTime) return 1;
    if(!b.c.completionTime) return -1;
