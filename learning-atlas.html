let lastFocusedBeforeModal = null;
function modalEscHandler(e){ if(e.key === "Escape") closeModal(); }
function modalTrapHandler(e){
  if(e.key !== "Tab") return;
  const modal = document.querySelector(".modal");
  if(!modal) return;
  const focusables = modal.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
  if(!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
// Called right after building any modal's markup: traps focus inside it, closes on
// Escape, and returns focus to whatever triggered it once it's dismissed.
function setupModalA11y(){
  // Guarded so re-rendering the same modal in place (e.g. the watch modal's
  // resolving->resolved swap, or its Prev/Next) doesn't overwrite the original
  // pre-modal focus target with a button inside the modal itself.
  if(lastFocusedBeforeModal === null) lastFocusedBeforeModal = document.activeElement;
  const modal = document.querySelector(".modal");
  if(modal) modal.focus();
  document.addEventListener("keydown", modalEscHandler);
  document.addEventListener("keydown", modalTrapHandler);
}
function closeModal(){
  document.getElementById("modalRoot").innerHTML = "";
  document.removeEventListener("keydown", modalEscHandler);
  document.removeEventListener("keydown", modalTrapHandler);
  if(lastFocusedBeforeModal && document.contains(lastFocusedBeforeModal)) lastFocusedBeforeModal.focus();
  lastFocusedBeforeModal = null;
}

/* ============================================================
   Global event delegation
============================================================ */
// Makes every non-native interactive element (divs/spans used as buttons via
// data-action/data-nav/data-lang/data-day, all given tabindex="0" above) operable
// from the keyboard the same way a real <button> would be.
document.addEventListener("keydown", e=>{
  if(e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest("[data-action], [data-nav], [data-lang], [data-day]");
  if(!el || el.tagName==="BUTTON" || el.tagName==="A" || el.tagName==="INPUT") return;
  e.preventDefault();
  el.click();
});
document.addEventListener("click", e=>{
  const navBtn = e.target.closest("[data-nav]");
  if(navBtn){ state.view = navBtn.dataset.nav; state.planDetailId = null; renderView(); closeMobileSidebar(); return; }

  const action = e.target.closest("[data-action]");
  if(!action) return;
  const act = action.dataset.action;

  if(act==="open-plan-chat"){ state.activePlanId = action.dataset.id; store.set("activePlanId", action.dataset.id); state.view="chat"; renderView(); closeMobileSidebar(); }
  else if(act==="open-plan-detail"){ state.planDetailId = action.dataset.id; state.view="plans"; renderView(); }
  else if(act==="back-to-plans"){ state.planDetailId = null; renderView(); }
  else if(act==="toggle-week"){
    const key = weekKey(action.dataset.plan, action.dataset.week);
    const isOpen = !state.openWeeks.has(key);
    if(isOpen) state.openWeeks.add(key); else state.openWeeks.delete(key);
    // Toggle the DOM directly rather than re-rendering, so the CSS grid-rows
    // transition actually animates instead of snapping.
    action.closest(".week-block").classList.toggle("open", isOpen);
    action.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }
  else if(act==="delete-plan"){
    if(confirm("Delete this plan permanently?")){
      state.plans = state.plans.filter(p=>p.id!==action.dataset.id);
      if(state.activePlanId===action.dataset.id) state.activePlanId=null;
      state.planDetailId=null;
      persistPlans(); renderView(); toast("Plan deleted","success");
    }
  }
  else if(act==="view-plan"){
    const plan = activePlan();
    if(plan){ state.planDetailId = plan.id; state.view="plans"; renderView(); }
  }
  else if(act==="print-plan"){ window.print(); }
  else if(act==="fill-suggestion"){
    const input = document.getElementById("chatInput");
    if(input){ input.value = action.dataset.text; input.focus(); }
  }
  else if(act==="toggle-class-done"){
    const plan = getPlan(action.dataset.plan);
    const cls = findClass(plan, action.dataset.class);
    if(cls){
      cls.done = !cls.done; plan.updatedAt=Date.now(); persistPlans();
      // A full re-render would rebuild any open <iframe> and restart the video,
      // so while one is playing, patch just the affected bits of the DOM instead.
      if(state.inlineOpen.size) patchDoneInPlace(action, cls, plan);
      else renderView();
    }
  }
  else if(act==="toggle-todo"){
    const plan = getPlan(action.dataset.plan);
    const week = (plan.weeks||[]).find(w=>String(w.weekNumber)===action.dataset.week);
    const day = week && (week.days||[]).find(d=>String(d.dayNumber)===action.dataset.day);
    const t = day && (day.todos||[]).find(t=>t.id===action.dataset.todo);
    if(t){ t.done = !t.done; plan.updatedAt=Date.now(); persistPlans(); renderView(); }
  }
  else if(act==="set-theme"){ state.settings.theme = action.dataset.theme; persistSettings(); applyTheme(); renderView(); }
  else if(act==="enable-notifs"){ requestNotifPermission(); }
  else if(act==="watch-class"){ openWatchModal(action.dataset.plan, action.dataset.class); }
  else if(act==="add-featured-path"){ addFeaturedPlan(action.dataset.path); }
  else if(act==="play-inline"){ playInline(action.dataset.plan, action.dataset.class); }
  else if(act==="close-inline"){
    state.inlineOpen.delete(action.dataset.class);
    renderView();
  }
  else if(act==="focus-mode"){ openWatchModal(action.dataset.plan, action.dataset.class); }
});

// Expands a lesson's video into a real inline iframe. When the lesson only has a
// channel/search link, first resolves it to a specific video via the YouTube Data
// API key (if one is set) so there's something embeddable to show.
async function playInline(planId, classId){
  const plan = getPlan(planId);
  const c = plan && findClass(plan, classId);
  if(!c) return;

  if(!getYtEmbed(c)){
    if(!ytApiKey()) return;
    const media = document.querySelector(`[data-media="${classId}"]`);
    if(media) media.classList.add("is-loading");
    try{
      const id = await resolveYouTubeVideoId(plan, c);
      if(!id){ toast("Couldn't find a video for this lesson.", "error"); if(media) media.classList.remove("is-loading"); return; }
    }catch(e){
      toast(e.message || "Couldn't find a video for this lesson.", "error");
      if(media) media.classList.remove("is-loading");
      return;
    }
  }
  state.inlineOpen.add(classId);
  renderView();
}

function patchDoneInPlace(checkbox, cls, plan){
  const card = checkbox.closest("[data-card]");
  if(card) card.classList.toggle("done", !!cls.done);
  checkbox.checked = !!cls.done;
  const fill = document.querySelector(".detail-head .progress-fill");
  if(fill) fill.style.width = planProgress(plan) + "%";
}

document.addEventListener("change", e=>{
  const action = e.target.closest("[data-action]");
  if(!action) return;
  const act = action.dataset.action;
  if(act==="set-completion"){
    const plan = getPlan(action.dataset.plan);
    const cls = findClass(plan, action.dataset.class);
    if(cls){
      cls.completionTime = action.value || null;
      plan.updatedAt = Date.now(); persistPlans();
      const fired = store.get("firedNotifs", {});
      const today = ymd(new Date());
      delete fired[`${plan.id}|${cls.id}|${today}|10`];
      delete fired[`${plan.id}|${cls.id}|${today}|5`];
      store.set("firedNotifs", fired);
      if(state.view==="today") renderView();
    }
  } else if(act==="set-start-date"){
    const plan = getPlan(action.dataset.id);
    if(plan){ plan.startDate = action.value; plan.updatedAt=Date.now(); persistPlans(); renderView(); }
  }
});

function findClass(plan, classId){
  if(!plan) return null;
  for(const w of (plan.weeks||[])) for(const d of (w.days||[])) {
    const c = (d.classes||[]).find(c=>c.id===classId);
    if(c) return c;
  }
  return null;
}
function findClassContext(plan, classId){
  if(!plan) return null;
  for(const w of (plan.weeks||[])) for(const d of (w.days||[])) {
    const idx = (d.classes||[]).findIndex(c=>c.id===classId);
    if(idx !== -1) return {week:w, day:d, classes:d.classes, idx};
  }
  return null;
}

/* ============================================================
   Watch modal — in-app YouTube player
============================================================ */
function renderWatchModal(planId, ctx, yt, resolving){
  const plan = getPlan(planId);
  const c = ctx.classes[ctx.idx];
  const root = document.getElementById("modalRoot");

  let playerBlock;
  if(resolving){
    playerBlock = `<div class="watch-noplayer"><p style="display:flex; align-items:center; justify-content:center; gap:6px;">${icon("search","ic-sm")} Finding the exact video for this lesson…</p></div>`;
  } else if(yt){
    const src = yt.kind==="playlist"
      ? `https://www.youtube-nocookie.com/embed/videoseries?list=${yt.id}`
      : `https://www.youtube-nocookie.com/embed/${yt.id}?rel=0`;
    playerBlock = `
      <div class="watch-player">
        <iframe src="${src}" title="${escapeHtml(c.title)}" frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>`;
  } else if(c.type === "rest"){
    playerBlock = `<div class="watch-noplayer"><p style="display:flex; align-items:center; justify-content:center; gap:6px;">${icon("moon","ic-sm")} It's a rest day — enjoy the break.</p></div>`;
  } else {
    playerBlock = `<div class="watch-noplayer">
      <p>${c.type==="video" ? "Couldn't find an embeddable video for this lesson." : "This lesson doesn't have an embeddable video."}</p>
      ${!ytApiKey() && c.type==="video" ? `<p style="font-size:12px;">Add a YouTube API key in Settings so Atlas can always find the exact video.</p>` : ""}
      ${c.resourceUrl ? `<a class="btn primary" href="${escapeHtml(c.resourceUrl)}" target="_blank" rel="noopener">Open resource ${icon("external","ic-sm")}</a>` : ""}
    </div>`;
  }

  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal watch-modal" data-class="${c.id}" role="dialog" aria-modal="true" aria-labelledby="watchModalTitle" tabindex="-1">
        <div class="watch-head">
          <div>
            <div class="watch-eyebrow">${escapeHtml(plan.title)} · Week ${ctx.week.weekNumber}, Day ${ctx.day.dayNumber}</div>
            <h2 id="watchModalTitle">${escapeHtml(c.title)}</h2>
          </div>
          <button class="icon-btn" id="watchClose" aria-label="Close">${icon("x")}</button>
        </div>
        ${playerBlock}
        <div class="watch-meta">
          ${escapeHtml(c.channel||"")}${c.channel?' · ':''}${c.durationMinutes} min
          ${c.notes ? `<p class="watch-notes">${escapeHtml(c.notes)}</p>` : ""}
        </div>
        <div class="watch-foot">
          <div class="watch-nav">
            <button class="btn small" id="watchPrev" ${ctx.idx<=0?'disabled':''}>${icon("arrowLeft","ic-sm")} Previous</button>
            <button class="btn small" id="watchNext" ${ctx.idx>=ctx.classes.length-1?'disabled':''}>Next ${icon("arrowRight","ic-sm")}</button>
          </div>
          <label class="watch-done-toggle">
            <input type="checkbox" class="chk" id="watchDoneChk" ${c.done?'checked':''}> Mark as complete
          </label>
          ${c.resourceUrl ? `<a href="${escapeHtml(c.resourceUrl)}" target="_blank" rel="noopener" class="watch-external">Open on YouTube ${icon("external","ic-sm")}</a>` : "<span></span>"}
        </div>
      </div>
    </div>`;

  document.getElementById("watchClose").onclick = closeModal;
  document.getElementById("modalOverlay").addEventListener("click", e=>{ if(e.target.id==="modalOverlay") closeModal(); });
  document.getElementById("watchDoneChk").onchange = e=>{
    c.done = e.target.checked; plan.updatedAt = Date.now(); persistPlans();
    if(state.view!=="chat") renderView();
  };
  const prevBtn = document.getElementById("watchPrev");
  const nextBtn = document.getElementById("watchNext");
  if(prevBtn) prevBtn.onclick = ()=>{ if(ctx.idx>0) openWatchModal(planId, ctx.classes[ctx.idx-1].id); };
  if(nextBtn) nextBtn.onclick = ()=>{ if(ctx.idx<ctx.classes.length-1) openWatchModal(planId, ctx.classes[ctx.idx+1].id); };
  setupModalA11y();
}

async function openWatchModal(planId, classId){
  const plan = getPlan(planId);
  const ctx = plan && findClassContext(plan, classId);
  if(!ctx) return;
  const c = ctx.classes[ctx.idx];
  let yt = getYtEmbed(c);

  if(yt || !(c.type === "video" && ytApiKey())){
    renderWatchModal(planId, ctx, yt, false);
    return;
  }

  renderWatchModal(planId, ctx, null, true);
  let resolveErr = null, resolvedId = null;
  try{ resolvedId = await resolveYouTubeVideoId(plan, c); }
  catch(e){ resolveErr = e; }
  yt = resolvedId ? {kind:"video", id:resolvedId} : null;

  const stillOpenOnThisClass = document.querySelector(`.watch-modal[data-class="${classId}"]`);
  if(!stillOpenOnThisClass) return;
  if(resolveErr) toast(resolveErr.message || "Couldn't find a video for this lesson.", "error");
  renderWatchModal(planId, ctx, yt, false);
  if(yt && state.view!=="chat") renderView();
}

// sw.js sitting alongside this file — silently does nothing when this page

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
