<title>Meridian — A Self-Taught Scholar's Atlas</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0D0F14;
    --paper-raised:#171B24;
    --paper-sunk:#0A0C10;
    --paper-2:#1F2430;
    --ink:#F4F6FB;
    --ink-soft:#9CA3B5;
    --ink-faint:#636B7E;
    --line:#262C3B;
    --line-soft:#1C2130;
    --accent:#FF7A59;
    --accent-strong:#FF9C82;
    --accent-soft:#3A2419;
    --brass:#FFC94D;
    --brass-soft:#3A2E12;
    --success:#2DD4BF;
    --success-soft:#0E2E2B;
    --critical:#FB5070;
    --critical-soft:#3A1420;
    --grad-1:#FFC94D;
    --grad-2:#FF6B6B;
    --grad-3:#FF3D9A;
    --brand-gradient: linear-gradient(135deg, var(--grad-1) 0%, var(--grad-2) 55%, var(--grad-3) 100%);
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 16px 40px -16px rgba(0,0,0,.6);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
    --radius: 16px;
    --radius-sm: 11px;
    --font-display: "Outfit","Plus Jakarta Sans",sans-serif;
    --font-body: "Plus Jakarta Sans","Outfit",sans-serif;
    --font-mono: "JetBrains Mono","SF Mono",Consolas,monospace;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased; position:relative;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(640px circle at 10% -8%, rgba(255,201,77,.12), transparent 60%),
      radial-gradient(760px circle at 104% 4%, rgba(255,61,154,.11), transparent 58%),
      radial-gradient(900px circle at 50% 120%, rgba(255,107,107,.07), transparent 60%);
  }
  h1,h2,h3,.display{ font-family:var(--font-display); font-weight:700; text-wrap:balance; letter-spacing:-.01em; }
  .mono, .tnum{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); color:var(--ink); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
  }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:999px; border:2px solid var(--paper); background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--ink-faint); background-clip:padding-box; }

  .uplabel{ text-transform:uppercase; letter-spacing:.09em; font-size:.68rem; color:var(--ink-faint); font-weight:700; }

  /* ---------- layout shell ---------- */
  .app{ display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
  .rail{
    background:rgba(23,27,36,.72); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:22px 16px; gap:22px;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:11px; padding:0 4px; }
  .brand-mark{
    width:40px; height:40px; border-radius:13px; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:1.05rem; color:#1A1220;
    background:var(--brand-gradient);
    box-shadow:0 8px 20px -8px rgba(255,61,154,.55);
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.2; }
  .brand-text strong{ font-family:var(--font-display); font-weight:700; font-size:1.1rem; }
  .brand-text span{ font-size:.7rem; color:var(--ink-faint); }

  .nav{ display:flex; flex-direction:column; gap:3px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; text-align:left;
    background:none; border:none; color:var(--ink-soft); cursor:pointer;
    padding:10px 12px; border-radius:12px; font-size:.87rem; font-weight:600;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{ flex:none; opacity:.7; transition:opacity .15s ease; }
  .nav-item:hover{ background:var(--paper-2); color:var(--ink); }
  .nav-item.active{
    background:linear-gradient(135deg, rgba(255,201,77,.16), rgba(255,61,154,.16));
    color:#fff; box-shadow:inset 0 0 0 1px rgba(255,122,89,.35);
  }
  .nav-item.active svg{ opacity:1; color:var(--accent-strong); }
  .nav-badge{ margin-left:auto; background:var(--critical); color:#fff; font-size:.65rem; font-weight:700;
    border-radius:999px; padding:1px 6px; font-family:var(--font-mono); }

  .rail-footer{ margin-top:auto; display:flex; flex-direction:column; gap:10px; }
  .streak-card{
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px;
    display:flex; align-items:center; gap:10px; background:var(--paper-2);
  }
  .streak-num{
    font-family:var(--font-display); font-weight:800; font-size:1.5rem; line-height:1;
    background:var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .streak-label{ font-size:.72rem; color:var(--ink-faint); line-height:1.25; }

  .main{ min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; gap:18px; padding:18px 30px;
    border-bottom:1px solid var(--line); background:rgba(13,15,20,.75);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{ font-size:1.4rem; margin:0; flex:none; }
  .ribbon{ display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; }
  .pill{
    display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
    font-size:.74rem; font-weight:700; border:1px solid var(--line); color:var(--ink-soft);
    background:var(--paper-2);
  }
  .pill .tnum{ font-weight:800; color:var(--ink); }
  .pill.accent{ border-color:transparent; background:rgba(255,122,89,.15); color:var(--accent-strong); }
  .pill.brass{ border-color:transparent; background:rgba(255,201,77,.15); color:var(--brass); }
  .pill.critical{ border-color:transparent; background:var(--critical-soft); color:var(--critical); }
  .pill.success{ border-color:transparent; background:var(--success-soft); color:var(--success); }

  .bell-btn{
    position:relative; width:36px; height:36px; border-radius:50%; border:1px solid var(--line);
    background:var(--paper-2); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
    transition:background .15s ease, border-color .15s ease;
  }
  .bell-btn:hover{ background:var(--paper); border-color:var(--accent); }
  .bell-dot{
    position:absolute; top:6px; right:7px; width:8px; height:8px; border-radius:50%;
    background:var(--critical); border:2px solid var(--paper); display:none;
    box-shadow:0 0 0 2px rgba(251,80,112,.3);
  }
  .bell-dot.show{ display:block; }

  .view{ padding:26px 30px 60px; max-width:1180px; width:100%; margin:0 auto; animation:viewIn .4s cubic-bezier(.16,1,.3,1) both; }
  .view[hidden]{ display:none; }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

  /* ---------- dashboard ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
  .stat-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; box-shadow:var(--shadow-sm);
  }
  .stat-card .uplabel{ margin-bottom:8px; display:block; }
  .stat-card .num{
    font-family:var(--font-display); font-weight:800; font-size:2rem; line-height:1;
    background:var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .stat-card .sub{ font-size:.76rem; color:var(--ink-faint); margin-top:6px; }

  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin:34px 0 14px; }
  .section-head h2{ font-size:1.15rem; margin:0; }
  .section-head .link-btn{ font-size:.78rem; }

  .link-btn{ background:none; border:none; color:var(--accent-strong); cursor:pointer; font-weight:700; padding:0; }
  .link-btn:hover{ text-decoration:underline; }

  .resume-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .resume-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:0; overflow:hidden; cursor:pointer; box-shadow:var(--shadow-sm); text-align:left;
    display:flex; flex-direction:column;
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .resume-card:hover{ border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow); }
  .resume-card-body{ padding:14px 16px; }
  .resume-card .plat{ font-size:.68rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; }
  .resume-card .ttl{ font-weight:700; margin-top:3px; font-size:.92rem; }

  /* ---------- thumbnails ---------- */
  .thumb-frame{
    position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; flex:none;
    background:var(--paper-2); border-radius:var(--radius-sm);
  }
  .thumb-frame.top{ border-radius:0; }
  .thumb-frame.sm{ width:112px; flex:none; border-radius:var(--radius-sm); }
  .thumb-frame .thumb-img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform .5s cubic-bezier(.16,1,.3,1);
  }
  .thumb-frame:hover .thumb-img{ transform:scale(1.09); }
  .thumb-frame::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%);
    opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  .thumb-frame:hover::after{ opacity:1; }
  .thumb-frame.placeholder{
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, rgba(255,201,77,.16), rgba(255,61,154,.13));
  }
  .thumb-frame.placeholder .seal{ width:44px; height:44px; font-size:1rem; border-color:transparent; background:var(--brand-gradient); color:#1A1220; }
  .thumb-play-badge{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.9); z-index:1;
    width:42px; height:42px; border-radius:50%; background:rgba(13,15,20,.55); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px -6px rgba(0,0,0,.6);
    transition:transform .25s cubic-bezier(.16,1,.3,1), background .25s ease;
  }
  .thumb-play-badge svg{ margin-left:2px; }
  .thumb-play-badge.sm{ width:30px; height:30px; }
  .thumb-play-badge.sm svg{ width:12px; height:12px; }
  .thumb-frame:hover .thumb-play-badge{ transform:translate(-50%,-50%) scale(1.08); background:var(--brand-gradient); }

  .focus-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start; }
  .card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); }
  .card-pad{ padding:18px 20px; }

  .suggestion{ display:flex; gap:12px; align-items:flex-start; padding:13px 0; border-top:1px solid var(--line-soft); }
  .suggestion:first-child{ border-top:none; padding-top:2px; }
  .suggestion .why{ font-size:.78rem; color:var(--ink-faint); margin-top:3px; }
  .suggestion .go{
    margin-left:auto; flex:none; border:1.5px solid var(--accent); color:var(--accent-strong); background:none;
    border-radius:999px; padding:6px 14px; font-size:.76rem; font-weight:700; cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .suggestion .go:hover{ background:var(--accent-soft); transform:translateY(-1px); }

  .todo-mini{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line-soft); }
  .todo-mini:first-child{ border-top:none; }
  .todo-mini .t{ font-size:.86rem; }
  .todo-mini .when{ margin-left:auto; font-size:.72rem; }

  .subject-legend{ display:flex; flex-direction:column; gap:9px; }
  .legend-row{ display:grid; grid-template-columns:120px 1fr 44px; align-items:center; gap:12px; }
  .legend-row .name{ font-size:.82rem; font-weight:600; }
  .legend-row .bar-track{ height:7px; border-radius:99px; background:var(--paper-sunk); overflow:hidden; }
  .legend-row .bar-fill{ height:100%; background:var(--brand-gradient); border-radius:99px; }
  .legend-row .frac{ font-size:.72rem; color:var(--ink-faint); text-align:right; }

  /* ---------- atlas ---------- */
  .atlas-layout{ display:grid; grid-template-columns:230px 1fr; gap:26px; align-items:start; }
  .route-list{ display:flex; flex-direction:column; gap:4px; position:sticky; top:88px; }
  .route-btn{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px;
    background:none; border:none; cursor:pointer; text-align:left; color:var(--ink-soft);
    transition:background .15s ease;
  }
  .route-btn:hover{ background:var(--paper-2); }
  .route-btn.active{ background:var(--paper-2); color:#fff; font-weight:700; }
  .seal{
    width:30px; height:30px; border-radius:50%; border:1.3px solid currentColor; flex:none;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display);
    font-size:.72rem; font-weight:700;
  }
  .route-btn .seal{ color:var(--ink-faint); }
  .route-btn.active .seal{ color:#1A1220; background:var(--brand-gradient); border-color:transparent;
    box-shadow:0 4px 14px -4px rgba(255,61,154,.55); }
  .route-btn .name{ font-size:.83rem; }

  .route-head{ margin-bottom:22px; }
  .route-head h2{ font-size:1.8rem; margin:0 0 4px; }
  .route-head p{ margin:0; color:var(--ink-soft); font-size:.92rem; max-width:62ch; }

  .path{ position:relative; padding-left:26px; }
  .path::before{ content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1.5px; background:var(--line); }
  .band{ position:relative; margin-bottom:34px; }
  .band:last-child{ margin-bottom:4px; }
  .band-node{
    position:absolute; left:-26px; top:2px; width:11px; height:11px; border-radius:50%;
    background:var(--brand-gradient); box-shadow:0 0 0 3px var(--paper), 0 0 14px -2px rgba(255,61,154,.6);
  }
  .band-title{ font-family:var(--font-display); font-weight:700; font-size:1.05rem; margin:0 0 4px; }
  .band-count{ font-size:.72rem; color:var(--ink-faint); font-weight:600; margin-left:8px; }
  .band-note{
    display:flex; gap:8px; font-size:.78rem; color:var(--ink-soft); background:var(--accent-soft);
    border-radius:var(--radius-sm); padding:9px 12px; margin:8px 0 14px; align-items:flex-start;
  }
  .band-note b{ color:var(--accent-strong); font-weight:700; flex:none; }
  .band-note.test{ background:var(--brass-soft); }
  .band-note.test b{ color:var(--brass); }

  .course-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:12px; }
  .ccard{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:0; overflow:hidden; display:flex; flex-direction:column; cursor:pointer; text-align:left;
    box-shadow:var(--shadow-sm); transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .ccard:hover{ border-color:var(--accent); transform:translateY(-3px); box-shadow:var(--shadow); }
  .ccard-body{ padding:13px 14px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .ccard-top{ display:flex; align-items:flex-start; gap:8px; }
  .ccard .plat{ font-size:.66rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700; }
  .ccard .ttl{ font-size:.89rem; font-weight:700; line-height:1.3; }
  .ccard .notes{ font-size:.78rem; color:var(--ink-soft); line-height:1.4; flex:1; }
  .ccard .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; }
  .tag{ font-size:.63rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:999px; }
  .tag.free{ background:var(--success-soft); color:var(--success); }
  .tag.freemium{ background:var(--brass-soft); color:var(--brass); }
  .tag.embed{ background:var(--accent-soft); color:var(--accent-strong); }
  .tag.status-new{ background:var(--paper-2); color:var(--ink-faint); }
  .tag.status-watching{ background:var(--accent-soft); color:var(--accent-strong); }
  .tag.status-practiced{ background:var(--brass-soft); color:var(--brass); }
  .tag.status-done{ background:var(--success-soft); color:var(--success); }

  /* ---------- reader ---------- */
  .scrim{ position:fixed; inset:0; background:rgba(5,6,9,.6); backdrop-filter:blur(2px); z-index:20; }
  .scrim[hidden]{ display:none; }
  .reader{
    position:fixed; top:12px; right:12px; bottom:12px; height:auto; width:min(560px,94vw);
    background:var(--paper-raised); border:1px solid var(--line); border-radius:20px;
    z-index:21; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.65);
  }
  .reader[hidden]{ display:none; }
  .reader-head{ padding:18px 20px 14px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:flex-start; }
  .reader-head .crumb{ font-size:.7rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; }
  .reader-head h3{ margin:4px 0 0; font-size:1.15rem; }
  .reader-close{
    margin-left:auto; flex:none; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:var(--paper-2); cursor:pointer; color:var(--ink-soft); font-size:1rem;
    transition:background .15s ease;
  }
  .reader-close:hover{ background:var(--paper-sunk); color:var(--ink); }
  .reader-body{ padding:18px 20px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:16px; }
  .reader-frame-wrap{ position:relative; width:100%; aspect-ratio:16/9; background:var(--paper-sunk); border-radius:var(--radius-sm); overflow:hidden; }
  .reader-frame-wrap iframe{ width:100%; height:100%; border:0; }
  .ext-card{
    border:1px dashed var(--line); border-radius:var(--radius); padding:22px; text-align:center; display:flex;
    flex-direction:column; align-items:center; gap:10px; background:var(--paper-2);
  }
  .ext-card .seal{ width:46px; height:46px; font-size:1rem; color:#1A1220; background:var(--brand-gradient); border-color:transparent; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:12px; cursor:pointer;
    font-weight:700; font-size:.83rem; padding:10px 18px; border:none; background:var(--brand-gradient);
    color:#1A1220; box-shadow:0 10px 24px -10px rgba(255,61,154,.5);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .btn:hover{ transform:translateY(-1px); filter:brightness(1.06); box-shadow:0 14px 30px -10px rgba(255,61,154,.6); }
  .btn:active{ transform:translateY(0); }
  .btn.ghost{ background:none; color:var(--accent-strong); box-shadow:none; border:1.5px solid var(--line); }
  .btn.ghost:hover{ background:var(--paper-2); border-color:var(--accent); transform:none; }
  .btn.subtle{ background:var(--paper-2); border:1px solid var(--line); color:var(--ink-soft); box-shadow:none; }
  .btn.subtle:hover{ background:var(--paper-sunk); color:var(--ink); transform:none; }
  .btn.block{ width:100%; }

  .segmented{ display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--paper-2); }
  .segmented button{ flex:1; padding:8px; background:none; border:none; cursor:pointer; font-size:.78rem; color:var(--ink-soft); font-weight:600; }
  .segmented button.on{ background:var(--brand-gradient); color:#1A1220; font-weight:700; }

  .timer-row{ display:flex; align-items:center; gap:10px; }
  .timer-row .clock{ font-family:var(--font-mono); font-size:1.3rem; font-variant-numeric:tabular-nums; }
  .timer-dot{ width:8px; height:8px; border-radius:50%; background:var(--ink-faint); }
  .timer-dot.live{ background:var(--critical); animation:pulse 1.6s infinite; box-shadow:0 0 0 3px rgba(251,80,112,.25); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .field label{ display:block; font-size:.72rem; color:var(--ink-faint); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
  textarea, input[type=text], input[type=date], input[type=time], input[type=password], input[type=datetime-local], select{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 11px; background:var(--paper-2);
    color:var(--ink); font-family:inherit; font-size:.86rem; transition:border-color .15s ease;
  }
  textarea:focus, input:focus, select:focus{ border-color:var(--accent); outline:none; }

  input[type=time]::-webkit-calendar-picker-indicator,
  input[type=datetime-local]::-webkit-calendar-picker-indicator{ filter:invert(.85); cursor:pointer; }
  .status-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .status-chip{
    border:1px solid var(--line); background:var(--paper-2); padding:6px 12px; border-radius:999px; font-size:.76rem;
    cursor:pointer; font-weight:600; color:var(--ink-soft); transition:background .15s ease, color .15s ease;
  }
  .status-chip.on{ background:var(--brand-gradient); border-color:transparent; color:#1A1220; font-weight:700; }

  /* ---------- coach ---------- */
  .coach-grid{ display:grid; grid-template-columns:280px 1fr; gap:20px; align-items:start; }
  .ring-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .ring-legend{ display:flex; gap:16px; }
  .lg-item{ display:flex; align-items:center; gap:6px; font-size:.78rem; }
  .lg-dot{ width:9px; height:9px; border-radius:50%; }
  .balance-pill{ text-align:center; padding:9px 14px; border-radius:999px; font-size:.82rem; font-weight:700; }

  .path-mini{ display:flex; align-items:center; gap:0; margin:10px 0 4px; }
  .path-mini .node{ width:9px; height:9px; border-radius:50%; background:var(--line); flex:none; }
  .path-mini .seg{ flex:1; height:2px; background:var(--line); }
  .path-mini .node.past, .path-mini .seg.past{ background:var(--accent); }
  .path-mini .node.here{ background:var(--brass); width:13px; height:13px; box-shadow:0 0 0 3px var(--brass-soft); }
  .path-mini-labels{ display:flex; justify-content:space-between; font-size:.62rem; color:var(--ink-faint); }

  table.log{ width:100%; border-collapse:collapse; font-size:.78rem; }
  table.log th{ text-align:left; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em; font-size:.65rem; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.log td{ padding:7px 8px; border-bottom:1px solid var(--line-soft); }
  .log-wrap{ overflow-x:auto; }

  /* ---------- todo ---------- */
  .todo-form{ display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:10px; align-items:end; }
  .todo-group-title{ display:flex; align-items:center; gap:8px; margin:26px 0 10px; }
  .todo-group-title h3{ margin:0; font-size:.95rem; }
  .todo-count{ background:var(--paper-2); color:var(--ink-faint); font-size:.7rem; font-weight:700; border-radius:999px; padding:2px 8px; }
  .todo-row{
    display:flex; align-items:center; gap:12px; padding:11px 14px; border:1px solid var(--line); border-radius:var(--radius-sm);
    background:var(--paper-raised); margin-bottom:8px; transition:border-color .15s ease;
  }
  .todo-row.overdue{ border-color:var(--critical); background:var(--critical-soft); }
  .todo-row.soon{ border-color:var(--brass); background:var(--brass-soft); }
  .check{
    width:19px; height:19px; border-radius:50%; border:1.5px solid var(--line); flex:none; cursor:pointer;
    background:var(--paper-2); display:flex; align-items:center; justify-content:center; transition:background .15s ease;
  }
  .check.done{ background:var(--success); border-color:var(--success); color:#08201C; }
  .todo-row .title{ font-size:.87rem; font-weight:600; }
  .todo-row.done .title{ text-decoration:line-through; color:var(--ink-faint); }
  .todo-row .meta{ font-size:.72rem; color:var(--ink-faint); display:flex; gap:8px; margin-top:2px; }
  .todo-row .rm{ margin-left:auto; background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:1rem; flex:none; }
  .todo-row .rm:hover{ color:var(--critical); }
  .empty-note{ color:var(--ink-faint); font-size:.85rem; padding:14px 0; }

  /* ---------- leaderboard ---------- */
  .lb-row{
    display:flex; align-items:center; gap:12px; padding:11px 14px; border:1px solid var(--line);
    border-radius:var(--radius-sm); background:var(--paper-raised); margin-bottom:8px; transition:border-color .15s ease;
  }
  .lb-row.mine{ border-color:var(--accent); background:var(--accent-soft); }
  .lb-rank{ width:26px; flex:none; font-weight:800; font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink-faint); text-align:center; }
  .lb-rank.top{
    background:var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .lb-name{ font-weight:700; font-size:.87rem; }

  /* ---------- notifications ---------- */
  .notif-perm{ display:flex; align-items:center; gap:14px; padding:16px 18px; }
  .notif-perm .txt{ flex:1; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid var(--line-soft); }
  .toggle-row:first-child{ border-top:none; }
  .switch{ width:38px; height:22px; border-radius:99px; background:var(--paper-2); border:1px solid var(--line); position:relative; cursor:pointer; flex:none; transition:background .15s ease; }
  .switch::after{ content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:2px; left:2px; transition:transform .15s; box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .switch.on{ background:var(--brand-gradient); border-color:transparent; }
  .switch.on::after{ transform:translateX(16px); }
  .feed-row{ display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line-soft); font-size:.82rem; }
  .feed-row:first-child{ border-top:none; }
  .feed-row time{ color:var(--ink-faint); font-size:.72rem; flex:none; }

  /* ---------- toast / drawer ---------- */
  .toast-stack{ position:fixed; bottom:20px; right:20px; z-index:40; display:flex; flex-direction:column; gap:8px; }
  .toast{
    background:var(--paper-2); color:var(--ink); padding:12px 16px 12px 14px; border-radius:12px; font-size:.83rem;
    max-width:320px; box-shadow:var(--shadow); display:flex; gap:10px; align-items:flex-start;
    border:1px solid var(--line); border-left:3px solid var(--grad-2);
    animation:toastIn .25s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes toastIn{ from{ opacity:0; transform:translateX(12px); } to{ opacity:1; transform:translateX(0); } }
  .toast b{ color:var(--brass); }

  .drawer{
    position:absolute; top:56px; right:30px; width:340px; max-height:70vh; overflow-y:auto;
    background:rgba(23,27,36,.92); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    z-index:30; padding:8px;
  }
  .drawer[hidden]{ display:none; }
  .drawer-item{ padding:10px 12px; border-radius:10px; font-size:.8rem; }
  .drawer-item:hover{ background:var(--paper-2); }
  .drawer-item .t{ font-weight:600; }
  .drawer-item .when{ font-size:.7rem; color:var(--ink-faint); margin-top:2px; }
  .drawer-empty{ padding:20px; text-align:center; color:var(--ink-faint); font-size:.82rem; }

  @media (max-width: 980px){
    .app{ grid-template-columns:1fr; }
    .rail{ position:static; height:auto; flex-direction:row; align-items:center; overflow-x:auto; }
    .nav{ flex-direction:row; }
    .rail-footer{ display:none; }
    .atlas-layout{ grid-template-columns:1fr; }

    .todo-form{ grid-template-columns:1fr 1fr; }
    .reader{ width:100vw; top:0; right:0; bottom:0; border-radius:0; border-left:1px solid var(--line); border-top:none; border-right:none; border-bottom:none; }
  }
</style>

const PLAY_ICON_SVG = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M5 3.3v9.4l8.2-4.7L5 3.3Z" fill="#fff"/></svg>`;
function youtubeThumbFromEmbed(embedSrc){
  if(!embedSrc) return null;
  const m = embedSrc.match(/\/embed\/([A-Za-z0-9_-]{11})(?:[?&]|$)/);
  if(!m || m[1]==="videoseries") return null; // "videoseries" is a reserved keyword, not a video id — happens to also be 11 chars
  return "https://img.youtube.com/vi/"+m[1]+"/mqdefault.jpg";
}
function courseThumbUrl(c){
  return c.thumb || (c.embeddable ? youtubeThumbFromEmbed(c.embedSrc) : null);
}
function renderThumbFrame(c, sizeClass){
  const url = courseThumbUrl(c);
  const cls = "thumb-frame"+(sizeClass?" "+sizeClass:"")+(url?"":" placeholder");
  if(url){
    const badgeCls = sizeClass==="sm" ? "thumb-play-badge sm" : "thumb-play-badge";
    return `<div class="${cls}"><img class="thumb-img" src="${url}" alt="" loading="lazy"/><div class="${badgeCls}">${PLAY_ICON_SVG}</div></div>`;
  }
  return `<div class="${cls}"><span class="seal">${SEALS[c.subject]||"?"}</span></div>`;
}
/* Any thumbnail image that 404s (deleted video, bad id) falls back to the
   gradient placeholder instead of showing a broken image icon. */
document.addEventListener("error", e=>{
  const img = e.target;
  if(img && img.tagName==="IMG" && img.classList && img.classList.contains("thumb-img")){
    const frame = img.closest(".thumb-frame");
    if(frame) frame.classList.add("placeholder");
    img.remove();
  }
}, true);

function bandOf(level){
  const l = (level||"").toLowerCase();
  if(l.includes("elementary")) return 1;
  if(l.includes("middle")) return 2;
  if(l.includes("high")) return 3;
  if(l.includes("college")) return 4;
  if(l.includes("all levels")||l.includes("beginner")) return 0;
  return 5;
}

function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function allCourses(){ return customCourses.length ? COURSES.concat(customCourses) : COURSES; }

/* ---------------- utility ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtMinutes(m){
  m = Math.round(m);
  if(m < 60) return m+"m";
  const h = Math.floor(m/60), r = m%60;
  return h+"h "+(r?r+"m":"").trim();
}
function fmtClock(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
  const pad = n => String(n).padStart(2,"0");
  return (h>0?pad(h)+":":"")+pad(m)+":"+pad(s);
}
function daysAgo(iso){ return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function coursesBySubject(subj){ return allCourses().filter(c=>c.subject===subj); }
function courseById(id){
  const nid = String(id);
  return allCourses().find(c=>String(c.id)===nid);
}

function toast(msg, tag){
  const stack = document.getElementById("toastStack");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = (tag?"<b>"+tag+" </b>":"") + msg;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .4s"; el.style.opacity="0"; setTimeout(()=>el.remove(),450); }, 5200);
}

/* ---------------- streak & activity stats ---------------- */
function currentStreak(){
  const days = new Set(activity.map(a=>a.ts.slice(0,10)));
  let n = 0, d = new Date();
  while(true){
    const iso = d.toISOString().slice(0,10);
    if(days.has(iso)){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}
function minutesSince(daysBack){
  const cutoff = Date.now() - daysBack*86400000;
  let video=0, practice=0;
  activity.forEach(a=>{ if(new Date(a.ts).getTime()>=cutoff){ if(a.type==="video") video+=a.minutes; else practice+=a.minutes; } });
  return {video, practice};
}
function totalHoursAllTime(){
  return activity.reduce((s,a)=>s+a.minutes,0)/60;
}

function requestBrowserPermission(){
  if(!("Notification" in window)){ toast("This browser doesn't expose desktop notifications here — in-app alerts will still work.","Heads up"); return; }

    if(p==="granted") toast("Desktop notifications enabled.","Done");
    else toast("Desktop permission not granted — you'll still get in-app alerts.","Noted");
    renderNotifications();
  });
}
function fireNotification(title, body){
  notifLog.unshift({ ts:new Date().toISOString(), message:title+" — "+body });
  notifLog = notifLog.slice(0,40);
  persistAll();
  toast(body, title);
  if("Notification" in window && Notification.permission==="granted"){

}
function checkDueTasks(){
  if(!settings.notifsOn) return;
  const now = Date.now();
  const lead = settings.leadMinutes*60000;
  todos.forEach(t=>{
    if(t.done || !t.due) return;
    const dueMs = new Date(t.due).getTime();
    const key = t.id;
    if(dueMs - now <= lead && dueMs - now > -3600000 && !settings.notifiedIds[key+":soon"]){
      settings.notifiedIds[key+":soon"] = true;
      fireNotification("Coming up", "“"+t.title+"” is due "+relativeDue(t.due)+".");
    }
    if(dueMs < now && !settings.notifiedIds[key+":over"]){
      settings.notifiedIds[key+":over"] = true;
      fireNotification("Overdue", "“"+t.title+"” was due "+relativeDue(t.due)+".");
    }
  });
  persistAll();
}
function relativeDue(iso){
  const d = new Date(iso), now = new Date();
  const diffMin = Math.round((d-now)/60000);
  if(Math.abs(diffMin) < 60) return diffMin>=0 ? "in "+diffMin+" min" : Math.abs(diffMin)+" min ago";
  const diffH = Math.round(diffMin/60);
  if(Math.abs(diffH) < 24) return diffH>=0 ? "in "+diffH+"h" : Math.abs(diffH)+"h ago";
  return d.toLocaleString(undefined,{month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
}
setInterval(checkDueTasks, 20000);

/* ---------------- AI coach heuristics ---------------- */
function generateSuggestions(){
  const out = [];
  if(aiPlan && aiPlan.milestones && aiPlan.milestones.length){
    const next = aiPlan.milestones.filter(m=>!m.done).slice(0,3);
    next.forEach(m=>{
      const c = courseById(m.course_id);
      if(c) out.push({ course:c, subject:c.subject, isFocus:true, why:"Week "+m.week+" of your plan — "+m.goal });
    });
    if(out.length) return out.slice(0,4);
  }
  const {video, practice} = minutesSince(7);
  const heavy = video > practice*2 && video > 20 ? "video" : (practice > video*2 && practice>20 ? "practice" : "balanced");

  const touchedSubjects = [...new Set(activity.map(a=>a.subject))];
  const focusSubject = touchedSubjects[0] || "Math";

  SUBJECTS.forEach(subj=>{
    const list = coursesBySubject(subj);
    const doneBands = list.filter(c=> (progress[c.id]||{}).status==="done").map(c=>bandOf(c.level));
    const maxDone = doneBands.length? Math.max(...doneBands) : -1;
    const nextBand = maxDone+1;
    let candidates = list.filter(c=> bandOf(c.level)===nextBand && (progress[c.id]||{}).status!=="done");
    if(!candidates.length) candidates = list.filter(c=> (progress[c.id]||{}).status!=="done");
    if(!candidates.length) return;

    let pick;
    if(heavy==="video") pick = candidates.find(c=> !/youtube/i.test(c.platform)) || candidates[0];
    else if(heavy==="practice") pick = candidates.find(c=> /youtube/i.test(c.platform)) || candidates[0];
    else pick = candidates[0];

    const isFocus = subj===focusSubject;
    out.push({
      course: pick, subject: subj, isFocus,
      why: isFocus
        ? "Continues your current thread in "+subj+"."
        : heavy==="video" ? "Balances recent video-heavy sessions with hands-on work."
        : heavy==="practice" ? "Adds a conceptual pass alongside your practice."
        : "Next step on the "+subj+" route."
    });
  });

  out.sort((a,b)=> (b.isFocus - a.isFocus));
  return out.slice(0,4);
}
function balanceState(){
  const {video, practice} = minutesSince(7);
  const total = video+practice;
  if(total < 10) return {label:"Not enough data yet", tone:"ink-faint", ratio:0.5};
  const ratio = video/(total);
  if(ratio > 0.72) return {label:"Video-heavy — add some practice", tone:"warning", ratio};
  if(ratio < 0.28) return {label:"Practice-heavy — good retention", tone:"success", ratio};
  return {label:"Well balanced this week", tone:"success", ratio};
}

/* ---------------- Claude API: direct browser calls ---------------- */
const ANTHROPIC_MODEL = "claude-opus-4-8";

async function callAnthropic(body){
  const key = (settings.anthropicApiKey||"").trim();
  if(!key) throw new Error("Add your Anthropic API key in Settings first.");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(Object.assign({ model: ANTHROPIC_MODEL }, body))
  });
  if(!res.ok){
    let msg = "HTTP "+res.status;
    try{ const errBody = await res.json(); msg = errBody?.error?.message || msg; }catch(e){}
    throw new Error(msg);
  }
  return res.json();
}

const PLAN_SCHEMA = {
  type: "object",
  properties: {
    summary: { type: "string", description: "2-3 sentence overview of the plan and why it's sequenced this way." },
    weekly_hours: { type: "integer", description: "Recommended study hours per week, close to the learner's stated budget." },
    milestones: {
      type: "array",
      items: {
        type: "object",
        properties: {
          week: { type: "integer", description: "1-indexed week number in the plan." },
          course_id: { type: "integer", description: "Must be one of the numeric ids provided in the catalog." },
          goal: { type: "string", description: "One sentence: what to accomplish with this resource this week." }
        },
        required: ["week","course_id","goal"],
        additionalProperties: false
      }
    },
    notification_recommendation: { type: "string", description: "One sentence recommending when/how often to be reminded, tailored to the learner's stated preference." }
  },
  required: ["summary","weekly_hours","milestones","notification_recommendation"],
  additionalProperties: false
};

const PLAN_SYSTEM_PROMPT =
  "You are the curriculum planner inside a personal learning app called Meridian. " +
  "Given a learner's profile and a catalog of available courses, build a sequential, week-by-week study plan. " +
  "Only reference course_id values that appear in the catalog provided — never invent one. " +
  "Order resources so foundational material comes before advanced material, matching the learner's stated level. " +
  "Keep the number of milestones realistic for the learner's weekly time budget " +
  "(roughly 1 milestone per subject every 1-2 weeks, not one per course). " +
  "Cover every subject the learner picked at least once.";

function finalizeMilestones(rawMilestones){
  const validIds = new Set(COURSES.map(c=>c.id));
  const milestones = (rawMilestones||[])
    .filter(m=> validIds.has(m.course_id))
    .map(m=> Object.assign({}, m, { done:false }));
  milestones.sort((a,b)=> a.week - b.week);
  return milestones;
}

async function generatePlan(p){
  const pool = COURSES
    .filter(c=> p.subjects.includes(c.subject))
    .map(c=>({ id:c.id, subject:c.subject, level:c.level, title:c.title, platform:c.platform, cost:c.cost }));
  const learner = {
    name: p.name || "the learner",
    age: p.age || null,
    grade_or_level: p.grade,
    goal: p.goal,
    weekly_hours_available: p.weeklyHours,
    reminder_preference: p.reminderPref
  };
  const data = await callAnthropic({
    max_tokens: 4096,
    thinking: { type: "adaptive" },
    output_config: { format: { type: "json_schema", schema: PLAN_SCHEMA } },
    system: PLAN_SYSTEM_PROMPT,
    messages: [{ role:"user", content: JSON.stringify({ learner, catalog: pool }) }]
  });
  if(data.stop_reason === "refusal") throw new Error("Claude declined to generate a plan for this request.");
  const textBlock = (data.content||[]).find(b=>b.type==="text");
  if(!textBlock) throw new Error("No plan came back — try again.");
  const plan = JSON.parse(textBlock.text);
  plan.milestones = finalizeMilestones(plan.milestones);
  plan.generatedAt = new Date().toISOString();
  return plan;
}

function applyPlanToTodos(plan, p){
  const now = new Date();
  const [h,m] = (p.reminderTime||"18:00").split(":").map(Number);
  plan.milestones.forEach(ms=>{
    const c = courseById(ms.course_id);
    if(!c) return;
    const due = new Date(now.getTime() + (ms.week-1)*7*86400000);
    due.setHours(h||18, m||0, 0, 0);
    todos.push({
      id: uid(), title: "Plan: "+c.title, subject: c.subject,
      due: due.toISOString().slice(0,16), priority: "Medium", done:false,
      createdAt: new Date().toISOString(), fromPlan:true
    });
  });
  settings.notifsOn = p.reminderPref !== "Off";
  if(p.reminderPref === "Daily digest") settings.leadMinutes = 60*12;
  else if(p.reminderPref === "Before each session") settings.leadMinutes = 30;
  persistAll();
}

/* ---------------- YouTube search: pull in more video content (direct browser call) ---------------- */
async function searchYoutube(query){
  const key = (settings.youtubeApiKey||"").trim();
  if(!key) throw new Error("Add a YouTube API key in Settings first.");
  const url = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=8&safeSearch=strict&q="
    + encodeURIComponent(query) + "&key=" + encodeURIComponent(key);
  const res = await fetch(url);
  if(!res.ok){
    let msg = "HTTP "+res.status;
    try{ const body = await res.json(); msg = body?.error?.message || msg; }catch(e){}
    throw new Error(msg);
  }
  const data = await res.json();
  return (data.items||[]).map(it=>({
    videoId: it.id.videoId,
    title: it.snippet.title,
    channel: it.snippet.channelTitle,
    thumb: it.snippet.thumbnails?.medium?.url || it.snippet.thumbnails?.default?.url
  }));
}
function addYoutubeCourse(video, subject, levelLabel){
  const c = {
    id: "yt-"+video.videoId, subject, level: levelLabel,
    platform: "YouTube — "+video.channel, title: video.title,
    link: "https://www.youtube.com/watch?v="+video.videoId,
    embeddable: true, embedSrc: "https://www.youtube.com/embed/"+video.videoId,
    thumb: video.thumb || null,
    cost: "Free", notes: "Added from a YouTube search inside Meridian."
  };
  if(!customCourses.some(x=>x.id===c.id)){
    customCourses.push(c);
    persistAll();
  }
  return c;
}

function toggleTimer(){
  const btn = document.getElementById("timerToggle");
  const dot = document.getElementById("timerDot");
  if(timerHandle){
    clearInterval(timerHandle); timerHandle = null;
    const elapsedMin = (Date.now()-timerStart)/60000;
    if(elapsedMin > 0.05 && openReaderCourse){
      activity.push({ ts:new Date().toISOString(), subject:openReaderCourse.subject, type:timerType, minutes:elapsedMin, courseId:openReaderCourse.id });
      persistAll();
      toast("Logged "+fmtMinutes(elapsedMin)+" of "+timerType+".", "Saved");
      addXp(Math.max(1, Math.round(elapsedMin/5)), "Logged "+fmtMinutes(elapsedMin)+" of "+timerType, true);
    }
    btn.textContent = "Start"; dot.classList.remove("live");
    renderRibbon();
  } else {
    timerStart = Date.now();
    timerHandle = setInterval(()=>{
      const sec = (Date.now()-timerStart)/1000;
      const clockEl = document.getElementById("timerClock");
      if(clockEl) clockEl.textContent = fmtClock(sec); else { clearInterval(timerHandle); timerHandle=null; }
    }, 1000);
    btn.textContent = "Stop"; dot.classList.add("live");
  }
}
function closeReader(){

const CHAT_CATALOG = COURSES.map(c=>({ id:c.id, subject:c.subject, level:c.level, title:c.title, platform:c.platform, cost:c.cost }));

const CHAT_SYSTEM_PROMPT =
  "You are Meridian's curriculum planner, chatting directly with a learner to build a personalized, " +
  "sequential study plan drawn from the course catalog below. Ask brief, natural questions — one or two " +
  "at a time, not a form — to learn: their age or grade/level, which subjects they want covered, what they " +
  "want to get out of it, how many hours per week they can study, and how they'd like to be reminded " +
  "(before each session, a daily digest, or off — and roughly what time of day). Keep replies short and " +
  "conversational. Once you have enough to build a good plan, call create_learning_plan — do not call it " +
  "prematurely. Only reference course_id values present in the catalog. Order milestones so foundational " +
  "material precedes advanced material for the learner's level, and cover every subject they mentioned.";

const CREATE_PLAN_TOOL = {
  name: "create_learning_plan",
  description: "Create the learner's sequential study plan once you have their subjects, level, goal, weekly time budget, and reminder preference.",
  input_schema: {
    type: "object",
    properties: {
      learner_name: { type: "string", description: "The learner's name, if they gave one." },
      weekly_hours: { type: "integer", description: "Recommended study hours per week." },
      reminder_preference: { type: "string", enum: ["Before each session","Daily digest","Off"] },
      reminder_time: { type: "string", description: "24-hour local time to send reminders, e.g. 18:00." },
      summary: { type: "string", description: "2-3 sentence overview of the plan and why it's sequenced this way." },
      notification_recommendation: { type: "string", description: "One sentence recommending when/how often to remind this learner." },
      milestones: {
        type: "array",
        items: {
          type: "object",
          properties: {
            week: { type: "integer" },
            course_id: { type: "integer", description: "Must be one of the numeric ids in the catalog." },
            goal: { type: "string" }
          },
          required: ["week","course_id","goal"],
          additionalProperties: false
        }
      }
    },
    required: ["weekly_hours","reminder_preference","summary","notification_recommendation","milestones"],
    additionalProperties: false
  }
};

async function sendChatMessage(){
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text) return;
  if(!settings.anthropicApiKey){
    toast("Add your Anthropic API key in Settings first.","Not configured");
    switchView("settings");
    return;
  }
  chatMessages.push({role:"user", content:text});
  persistAll();
  input.value = "";
  renderCoach();
  scrollChatToBottom();
  const typing = document.getElementById("chatTyping");
  if(typing) typing.hidden = false;
  try{
    const data = await callAnthropic({
      max_tokens: 1024,
      thinking: { type: "adaptive" },
      tools: [CREATE_PLAN_TOOL],
      tool_choice: { type: "auto" },
      system: [
        { type: "text", text: CHAT_SYSTEM_PROMPT },
        { type: "text", text: JSON.stringify(CHAT_CATALOG), cache_control: { type: "ephemeral" } }
      ],
      messages: chatMessages
    });
    if(data.stop_reason === "refusal"){
      chatMessages.push({role:"assistant", content: "Sorry, I can't help with that request."});
      persistAll();
    } else {
      const toolUse = (data.content||[]).find(b=>b.type==="tool_use" && b.name==="create_learning_plan");
      if(toolUse){
        const raw = toolUse.input || {};
        aiPlan = {
          summary: raw.summary || "",
          weekly_hours: raw.weekly_hours,
          milestones: finalizeMilestones(raw.milestones),
          notification_recommendation: raw.notification_recommendation || "",
          learner_name: raw.learner_name || "",
          reminder_preference: raw.reminder_preference || "Before each session",
          reminder_time: raw.reminder_time || "18:00"
        };
        const impliedSubjects = [...new Set(aiPlan.milestones.map(m=>{ const c = courseById(m.course_id); return c && c.subject; }).filter(Boolean))];
        profile = Object.assign({}, profile, {
          name: aiPlan.learner_name || (profile && profile.name) || "",
          weeklyHours: aiPlan.weekly_hours,
          subjects: impliedSubjects.length ? impliedSubjects : (profile && profile.subjects) || [],
          reminderPref: aiPlan.reminder_preference,
          reminderTime: aiPlan.reminder_time
        });
        applyPlanToTodos(aiPlan, profile);
        chatMessages = [];
        planViewMode = "view";
        persistAll();
        toast(aiPlan.milestones.length+"-step plan ready, with reminders scheduled.","Plan built");
      } else {
        const textBlock = (data.content||[]).find(b=>b.type==="text");
        chatMessages.push({role:"assistant", content: textBlock ? textBlock.text : "Could you tell me a bit more?"});
        persistAll();
      }
    }
  }catch(err){
    chatMessages.push({role:"assistant", content: "Sorry — "+(err.message||"something went wrong")+". Want to try again?"});
    persistAll();
  }finally{
    renderCoach(); renderBadges(); renderRibbon();
    if(!document.getElementById("view-dashboard").hidden) renderDashboard();
    scrollChatToBottom();
  }
}

    b.addEventListener("click", ()=>{ intakeMode = b.dataset.intakeMode; renderCoach(); });
  });
  const chatSendBtn = document.getElementById("chatSendBtn");
  if(chatSendBtn) chatSendBtn.addEventListener("click", sendChatMessage);
  const chatInput = document.getElementById("chatInput");
  if(chatInput) chatInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); sendChatMessage(); } });
  const chatResetBtn = document.getElementById("chatResetBtn");
  if(chatResetBtn) chatResetBtn.addEventListener("click", ()=>{ chatMessages = []; persistAll(); renderCoach(); });
  scrollChatToBottom();
  const subjRow = document.getElementById("pfSubjects");
  if(subjRow) subjRow.addEventListener("click", e=>{
    const b = e.target.closest("[data-subj]"); if(!b) return;
    b.classList.toggle("on");
  });
  const genBtn = document.getElementById("generatePlanBtn");
  if(genBtn) genBtn.addEventListener("click", async ()=>{
    const subjects = [...document.querySelectorAll("#pfSubjects .status-chip.on")].map(b=>b.dataset.subj);
    if(!subjects.length){ toast("Pick at least one subject.","Missing info"); return; }
    const p = {
      name: document.getElementById("pfName").value.trim(),
      age: document.getElementById("pfAge").value.trim(),
      grade: document.getElementById("pfGrade").value,
      weeklyHours: Number(document.getElementById("pfHours").value)||5,
      subjects,
      goal: document.getElementById("pfGoal").value.trim() || "Build a steady, well-rounded study habit.",
      reminderPref: document.getElementById("pfReminder").value,
      reminderTime: document.getElementById("pfTime").value || "18:00"
    };
    await generatePlanFlow(p, genBtn);
  });
  const cancelBtn = document.getElementById("cancelEditProfile");
  if(cancelBtn) cancelBtn.addEventListener("click", ()=>{ planViewMode="view"; renderCoach(); });
  const regenBtn = document.getElementById("regeneratePlanBtn");
  if(regenBtn) regenBtn.addEventListener("click", ()=> generatePlanFlow(profile, regenBtn));
  const editBtn = document.getElementById("editProfileBtn");
  if(editBtn) editBtn.addEventListener("click", ()=>{ planViewMode="form"; renderCoach(); });
  document.querySelectorAll("[data-plan-check]").forEach(chk=>{
    chk.addEventListener("click", ()=>{
      const [week, courseId] = chk.dataset.planCheck.split(":");
      const m = aiPlan.milestones.find(x=> String(x.week)===week && String(x.course_id)===courseId);
      if(m){
        m.done = !m.done; persistAll();
        if(m.done) addXp(40, "Completed a plan milestone");
        renderCoach();
      }
    });
  });
}
async function generatePlanFlow(p, btn){
  if(!settings.anthropicApiKey){
    toast("Add your Anthropic API key in Settings first.","Not configured");
    switchView("settings");
    return;
  }
  profile = p; persistAll();
  if(btn){ btn.disabled = true; btn.textContent = "Thinking…"; }
  try{
    const plan = await generatePlan(p);
    aiPlan = plan; persistAll();
    applyPlanToTodos(plan, p);
    planViewMode = "view";
    toast(plan.milestones.length+"-step plan ready, with reminders scheduled.","Plan built");
    renderCoach(); renderBadges(); renderRibbon();
    if(!document.getElementById("view-dashboard").hidden) renderDashboard();
  }catch(err){
    toast(err.message || "Something went wrong generating your plan.", "Couldn't build plan");
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = btn.id==="generatePlanBtn" ? "Generate my plan" : "Regenerate"; }
  }
}

      ${recent.length? `<table class="log"><thead><tr><th>When</th><th>Subject</th><th>Type</th><th>Duration</th></tr></thead><tbody>
        ${recent.map(a=>`<tr><td>${new Date(a.ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</td><td>${a.subject}</td><td style="text-transform:capitalize;">${a.type}</td><td class="tnum">${fmtMinutes(a.minutes)}</td></tr>`).join("")}

function routeMini(subj){
  const list = coursesBySubject(subj);
  const bandsPresent = [1,2,3,4];
  const doneBands = list.filter(c=>(progress[c.id]||{}).status==="done").map(c=>bandOf(c.level));
  const hereBand = doneBands.length? Math.max(...doneBands) : Math.min(...list.map(c=>bandOf(c.level)).filter(b=>b<5));
  return `
    <div style="margin-bottom:16px;">
      <div style="font-size:.82rem;font-weight:700;margin-bottom:4px;">${subj}</div>
      <div class="path-mini">
        ${bandsPresent.map((b,i)=>`
          ${i>0?`<span class="seg ${b<=hereBand?'past':''}"></span>`:""}
          <span class="node ${b<hereBand?'past':''} ${b===hereBand?'here':''}"></span>
        `).join("")}
      </div>
      <div class="path-mini-labels"><span>Elem</span><span>Middle</span><span>High</span><span>College</span></div>
    </div>
  `;
}
function drawRing(video, practice){
  const cvs = document.getElementById("ringCanvas"); if(!cvs) return;
  const ctx = cvs.getContext("2d");
  const cx=90, cy=90, r=68, lw=16;
  const total = video+practice;
  ctx.clearRect(0,0,180,180);
  const trackColor = getComputedStyle(document.documentElement).getPropertyValue("--paper-sunk").trim() || "#e4e9e9";
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.lineWidth=lw; ctx.strokeStyle=trackColor; ctx.stroke();
  if(total>0){
    const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    const brass = getComputedStyle(document.documentElement).getPropertyValue("--brass").trim();
    const vFrac = video/total;
    const start = -Math.PI/2;
    ctx.beginPath(); ctx.arc(cx,cy,r, start, start+Math.PI*2*vFrac); ctx.lineWidth=lw; ctx.strokeStyle=accent; ctx.lineCap="butt"; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,r, start+Math.PI*2*vFrac, start+Math.PI*2); ctx.lineWidth=lw; ctx.strokeStyle=brass; ctx.stroke();
  }
  ctx.font = "700 22px "+getComputedStyle(document.documentElement).getPropertyValue("--font-display");
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(fmtMinutes(total), cx, cy-4);
  ctx.font = "600 10px "+getComputedStyle(document.documentElement).getPropertyValue("--font-body");
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink-faint").trim();
  ctx.fillText("this week", cx, cy+15);
}

/* ---------------- To-Do ---------------- */
function renderTodo(){
  const el = document.getElementById("view-todo");
  el.innerHTML = `
    <div class="card card-pad">
      <div class="todo-form">
        <div class="field"><label>Task</label><input type="text" id="tTitle" placeholder="e.g. Finish Pre-Algebra unit 3"/></div>
        <div class="field"><label>Subject</label><select id="tSubject"><option value="General">General</option>${SUBJECTS.map(s=>`<option value="${s}">${s}</option>`).join("")}</select></div>
        <div class="field"><label>Due</label><input type="datetime-local" id="tDue"/></div>
        <div class="field"><label>Priority</label><select id="tPriority"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
        <button class="btn" id="addTodoBtn">Add</button>
      </div>
    </div>
    <div id="todoGroups"></div>
  `;
  document.getElementById("addTodoBtn").addEventListener("click", ()=>{
    const title = document.getElementById("tTitle").value.trim();
    if(!title){ toast("Give the task a title first.","Missing title"); return; }
    todos.unshift({
      id:uid(), title, subject:document.getElementById("tSubject").value,
      due: document.getElementById("tDue").value || null,
      priority: document.getElementById("tPriority").value, done:false, createdAt:new Date().toISOString()
    });
    persistAll(); renderTodo(); renderBadges();
    toast("Task added.","Saved");
  });
  renderTodoGroups();
}
function toggleTodoDone(id){
  const t = todos.find(x=>x.id===id); if(!t) return;
  t.done = !t.done; persistAll();
  if(t.done) addXp(10, "Completed: "+t.title);
  renderBadges();
  if(!document.getElementById("view-todo").hidden) renderTodoGroups();
  if(!document.getElementById("view-dashboard").hidden) renderDashboard();
}
function removeTodo(id){ todos = todos.filter(x=>x.id!==id); persistAll(); renderTodoGroups(); renderBadges(); }
function renderTodoGroups(){
  const wrap = document.getElementById("todoGroups"); if(!wrap) return;
  const now = Date.now();
  const overdue = todos.filter(t=>!t.done && t.due && new Date(t.due).getTime()<now);
  const upcoming = todos.filter(t=>!t.done && (!t.due || new Date(t.due).getTime()>=now));
  const done = todos.filter(t=>t.done);
  upcoming.sort((a,b)=> new Date(a.due||"9999")-new Date(b.due||"9999"));

  function group(title, list, opts){
    if(!list.length) return "";
    return `<div class="todo-group-title"><h3>${title}</h3><span class="todo-count">${list.length}</span></div>` +
      list.map(t=>{
        const soon = !t.done && t.due && new Date(t.due).getTime()-now < 3600000*3 && new Date(t.due).getTime()>=now;
        const cls = t.done?"done":(overdue.includes(t)?"overdue":(soon?"soon":""));
        return `<div class="todo-row ${cls}">
          <span class="check ${t.done?'done':''}" data-check="${t.id}">${t.done?'✓':''}</span>
          <div>
            <div class="title">${t.title}</div>
            <div class="meta"><span>${t.subject}</span>${t.due?`<span>${relativeDue(t.due)}</span>`:""}<span>${t.priority}</span></div>
          </div>
          <button class="rm" data-rm="${t.id}">✕</button>
        </div>`;
      }).join("");
  }
  wrap.innerHTML = group("Overdue", overdue) + group("Upcoming", upcoming) + group("Completed", done)
    || `<div class="empty-note">No tasks yet — add one above.</div>`;
  wrap.querySelectorAll("[data-rm]").forEach(b=> b.addEventListener("click", ()=> removeTodo(b.dataset.rm)));
}
