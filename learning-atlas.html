function renderTodayClass(it){
  const {plan, c} = it;
  let countdown = "";
  if(c.completionTime && !c.done){
    const [hh,mm] = c.completionTime.split(":").map(Number);
    const now = new Date(); const target = new Date(); target.setHours(hh,mm,0,0);
    const diff = Math.round((target-now)/60000);
    if(diff > 0 && diff <= 15) countdown = `<span class="count-badge warn">in ${diff} min</span>`;
    else if(diff <= 0) countdown = `<span class="count-badge ok">due</span>`;
  }
  const media = renderLessonMedia(plan, c, true);
  // The embedded player may only be a stand-in, so keep the lesson's real
  // resource one click away whenever it isn't what's playing.
  const emb = getYtEmbed(c);
  const openExternal = (c.resourceUrl && (!emb || emb.isAlt))
    ? `<a class="btn small" href="${escapeHtml(c.resourceUrl)}" target="_blank" rel="noopener">Open ${icon("external","ic-sm")}</a>` : "";
  return `
    <div class="class-card" data-card="${c.id}">
      <input type="checkbox" class="chk" ${c.done?'checked':''} data-action="toggle-class-done" data-plan="${plan.id}" data-class="${c.id}" title="Mark done">

      <div class="cc-main">

      <div class="cc-controls">

        <input type="time" value="${c.completionTime||''}" data-action="set-completion" data-plan="${plan.id}" data-class="${c.id}">
        ${openExternal}
      </div>
    </div>`;
}

function requestNotifPermission(){
  if(!("Notification" in window)){ toast("Notifications aren't supported in this browser.", "error"); return; }
  Notification.requestPermission().then(perm=>{
    if(perm==="granted"){
      state.settings.notifEnabled = true; persistSettings();
      toast("Notifications enabled", "success");
    } else {
      toast("Notification permission was not granted.", "error");
    }
    renderView();
  });
}

function exportData(){
  const blob = new Blob([JSON.stringify({settings:{...state.settings, apiKey:""}, plans: state.plans}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `atlas-backup-${ymd(new Date())}.json`;
  a.click();
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(Array.isArray(data.plans)){
        state.plans = data.plans;
        persistPlans();
        toast("Data imported", "success");
        renderView();
      } else toast("That file doesn't look like an Atlas backup.", "error");
    }catch(err){ toast("Could not read that file.", "error"); }
  };
  reader.readAsText(file);
}
function clearAllData(){
  if(!confirm("This deletes all plans and settings from this browser. Continue?")) return;
  Object.keys(localStorage).filter(k=>k.startsWith(LS_PREFIX)).forEach(k=>localStorage.removeItem(k));
  state.plans = []; state.activePlanId = null;
  state.settings = {theme:"dark", apiKey:"", model:"claude-sonnet-5", effort:"medium", notifEnabled:false,
    driveClientId:DEFAULT_DRIVE_CLIENT_ID, driveConnected:false, driveFileId:null, driveLastSync:null, ytApiKey:""};
  driveAccessToken = null;
  state.view = "chat";
  applyTheme(); renderView();
  toast("All data cleared", "success");
}

function buildFeaturedPlan(pathId){
  const def = FEATURED_PATHS.find(p=>p.id===pathId);
  if(!def) return null;
  const weeks = [1,2].map(weekNumber=>({
    weekNumber,
    theme: def.weekThemes[weekNumber-1] || "",
    days: [1,2,3,4,5,6,7].map(dayNumber=>{
      const d = def.days[(weekNumber-1)*7 + (dayNumber-1)];
      if(!d || d.rest){
        return {dayNumber, classes:[{id:uid(), title:"Rest day", type:"rest", resourceUrl:"", channel:"", durationMinutes:0, notes:"", done:false, completionTime:null}], todos:[]};
      }
      return {
        dayNumber,
        classes: d.classes.map(c=>({
          id:uid(), title:c.title, type:c.type, resourceUrl:c.resourceUrl, channel:c.channel||"",
          altVideoUrl:c.altVideoUrl||"", altChannel:c.altChannel||"",
          durationMinutes:c.duration||def.dailyMinutes, notes:c.notes||"", done:false, completionTime:null
        })),
        todos: (d.todos||[]).map(t=>({id:uid(), text:t, done:false}))
      };
    })
  }));
  return {
    id: uid(), title: def.title, subject: def.subject, level: def.level, language:"en",
    durationWeeks:2, dailyMinutes: def.dailyMinutes, daysOff:[], startDate: ymd(new Date()),
    weeks, chat:[], createdAt: Date.now(), updatedAt: Date.now(),
  };
}

function addFeaturedPlan(pathId){
  const plan = buildFeaturedPlan(pathId);
  if(!plan){ toast("Couldn't find that path.", "error"); return; }
  state.plans.push(plan);
  state.activePlanId = plan.id;
  state.planDetailId = plan.id;
  state.view = "plans";
  persistPlans();
  renderView();
  toast(`Added "${plan.title}" to My Plans`, "success");
}

let lastFocusedBeforeModal = null;
function modalEscHandler(e){ if(e.key === "Escape") closeModal(); }
function modalTrapHandler(e){
  if(e.key !== "Tab") return;
  const modal = document.querySelector(".modal");
  if(!modal) return;
  const focusables = modal.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
  if(!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
// Called right after building any modal's markup: traps focus inside it, closes on
// Escape, and returns focus to whatever triggered it once it's dismissed.
function setupModalA11y(){
  // Guarded so re-rendering the same modal in place (e.g. the watch modal's
  // resolving->resolved swap, or its Prev/Next) doesn't overwrite the original
  // pre-modal focus target with a button inside the modal itself.
  if(lastFocusedBeforeModal === null) lastFocusedBeforeModal = document.activeElement;
  const modal = document.querySelector(".modal");
  if(modal) modal.focus();
  document.addEventListener("keydown", modalEscHandler);
  document.addEventListener("keydown", modalTrapHandler);
}
function closeModal(){
  document.getElementById("modalRoot").innerHTML = "";
  document.removeEventListener("keydown", modalEscHandler);
  document.removeEventListener("keydown", modalTrapHandler);
  if(lastFocusedBeforeModal && document.contains(lastFocusedBeforeModal)) lastFocusedBeforeModal.focus();
  lastFocusedBeforeModal = null;
}

/* ============================================================
   Global event delegation
============================================================ */
// Makes every non-native interactive element (divs/spans used as buttons via
// data-action/data-nav/data-lang/data-day, all given tabindex="0" above) operable
// from the keyboard the same way a real <button> would be.
document.addEventListener("keydown", e=>{
  if(e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest("[data-action], [data-nav], [data-lang], [data-day]");
  if(!el || el.tagName==="BUTTON" || el.tagName==="A" || el.tagName==="INPUT") return;
  e.preventDefault();
  el.click();
});
document.addEventListener("click", e=>{
  const navBtn = e.target.closest("[data-nav]");
  if(navBtn){ state.view = navBtn.dataset.nav; state.planDetailId = null; renderView(); closeMobileSidebar(); return; }

  const action = e.target.closest("[data-action]");
  if(!action) return;
  const act = action.dataset.action;

  if(act==="open-plan-chat"){ state.activePlanId = action.dataset.id; store.set("activePlanId", action.dataset.id); state.view="chat"; renderView(); closeMobileSidebar(); }
  else if(act==="open-plan-detail"){ state.planDetailId = action.dataset.id; state.view="plans"; renderView(); }
  else if(act==="back-to-plans"){ state.planDetailId = null; renderView(); }
  else if(act==="toggle-week"){
    const key = weekKey(action.dataset.plan, action.dataset.week);
    const isOpen = !state.openWeeks.has(key);
    if(isOpen) state.openWeeks.add(key); else state.openWeeks.delete(key);
    // Toggle the DOM directly rather than re-rendering, so the CSS grid-rows
    // transition actually animates instead of snapping.
    action.closest(".week-block").classList.toggle("open", isOpen);
    action.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }
  else if(act==="delete-plan"){
    const id = action.dataset.id;
    const doomed = getPlan(id);
    if(doomed && confirm(`Remove "${doomed.title}"? This deletes the plan and its progress from this browser.`)){
      // Drop any player/accordion state belonging to the plan so it can't leak
      // into whatever gets created next.
      (doomed.weeks||[]).forEach(w=>{
        state.openWeeks.delete(weekKey(id, w.weekNumber));
        (w.days||[]).forEach(d=>(d.classes||[]).forEach(c=>state.inlineOpen.delete(c.id)));
      });
      state.plans = state.plans.filter(p=>p.id!==id);
      if(state.activePlanId===id) state.activePlanId=null;
      state.planDetailId=null;
      persistPlans(); renderView(); toast(`Removed "${doomed.title}"`,"success");
    }
  }
  else if(act==="view-plan"){
    const plan = activePlan();
    if(plan){ state.planDetailId = plan.id; state.view="plans"; renderView(); }
  }
  else if(act==="print-plan"){ window.print(); }
  else if(act==="fill-suggestion"){
    const input = document.getElementById("chatInput");
    if(input){ input.value = action.dataset.text; input.focus(); }
  }
  else if(act==="toggle-class-done"){
    const plan = getPlan(action.dataset.plan);
    const cls = findClass(plan, action.dataset.class);
    if(cls){
      cls.done = !cls.done; plan.updatedAt=Date.now(); persistPlans();
      // A full re-render would rebuild any open <iframe> and restart the video,
      // so while one is playing, patch just the affected bits of the DOM instead.
      if(state.inlineOpen.size) patchDoneInPlace(action, cls, plan);
      else renderView();
    }
  }
  else if(act==="toggle-todo"){
    const plan = getPlan(action.dataset.plan);
    const week = (plan.weeks||[]).find(w=>String(w.weekNumber)===action.dataset.week);
    const day = week && (week.days||[]).find(d=>String(d.dayNumber)===action.dataset.day);
    const t = day && (day.todos||[]).find(t=>t.id===action.dataset.todo);
    if(t){ t.done = !t.done; plan.updatedAt=Date.now(); persistPlans(); renderView(); }
  }
  else if(act==="set-theme"){ state.settings.theme = action.dataset.theme; persistSettings(); applyTheme(); renderView(); }
  else if(act==="enable-notifs"){ requestNotifPermission(); }
  else if(act==="watch-class"){ openWatchModal(action.dataset.plan, action.dataset.class); }
  else if(act==="add-featured-path"){ addFeaturedPlan(action.dataset.path); }
  else if(act==="play-inline"){ playInline(action.dataset.plan, action.dataset.class); }
  else if(act==="attach-video"){ openAttachVideoModal(action.dataset.plan, action.dataset.class); }
  else if(act==="close-inline"){
    state.inlineOpen.delete(action.dataset.class);
    renderView();
  }
  else if(act==="focus-mode"){ openWatchModal(action.dataset.plan, action.dataset.class); }
});

/* ============================================================
   Watch tracking — YouTube IFrame Player API
   Reports how far through each video the learner actually is, and completes
   the lesson on its own once the video finishes. Entirely best-effort: if the
   API script is blocked or fails, the embed is still a normal iframe and
   simply plays without tracking.
============================================================ */
const AUTO_DONE_AT = 0.95;   // treat "basically finished" as finished
const inlinePlayers = new Map();   // classId -> {player, el, timer}
let ytApiPromise = null;
let watchSaveTimer = null;

function watchPct(c){ return Math.min(1, Math.max(0, Number(c && c.watchPct) || 0)); }

function loadYouTubeApi(){
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise(resolve=>{
    if(window.YT && window.YT.Player) return resolve();
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function(){
      if(typeof prev === "function"){ try{ prev(); }catch(e){} }
      resolve();
    };
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.async = true;
    s.onerror = ()=> resolve();   // fail soft — playback still works, tracking doesn't
    document.head.appendChild(s);
    setTimeout(resolve, 8000);    // never hang forever on a blocked network
  });
  return ytApiPromise;
}

function findClassAnywhere(classId){
  for(const plan of state.plans){
    const c = findClass(plan, classId);
    if(c) return {plan, c};
  }
  return null;
}

function bindInlinePlayers(){
  // Drop players whose iframe was replaced or removed by a re-render.
  for(const [cid, rec] of Array.from(inlinePlayers)){
    if(rec.el !== document.getElementById("ytf-"+cid)){
      clearInterval(rec.timer);
      try{ rec.player && rec.player.destroy && rec.player.destroy(); }catch(e){}
      inlinePlayers.delete(cid);
    }
  }
  const frames = Array.from(document.querySelectorAll("iframe[data-yt-class]"))
    .filter(f => !inlinePlayers.has(f.dataset.ytClass));
  if(!frames.length) return;

  loadYouTubeApi().then(()=>{
    if(!(window.YT && window.YT.Player)){ frames.forEach(f=>markUntracked(f.dataset.ytClass)); return; }
    frames.forEach(f=>{
      const cid = f.dataset.ytClass;
      if(inlinePlayers.has(cid) || !document.contains(f)) return;
      attachPlayer(cid, f, false);
    });
  });
}

function attachPlayer(cid, f, isRetry){
  let player;
  try{
    player = new YT.Player(f, {
      events:{
        onReady: ()=>{ const r = inlinePlayers.get(cid); if(r) r.ready = true; },
        onStateChange: e=>{
          const r = inlinePlayers.get(cid);
          if(r) r.ready = true;   // any state callback proves the bridge is live
          if(e.data === YT.PlayerState.ENDED) handleVideoEnded(cid, player);
        }
      }
    });
  }catch(e){ markUntracked(cid); return; }

  const timer = setInterval(()=>{
    try{
      const dur = player.getDuration ? player.getDuration() : 0;
      const cur = player.getCurrentTime ? player.getCurrentTime() : 0;
      if(dur > 0){
        const rec = inlinePlayers.get(cid);
        if(rec) rec.ready = true;
        recordWatchProgress(cid, cur/dur, player);
      }
    }catch(e){}
  }, 1000);
  inlinePlayers.set(cid, {player, el:f, timer, ready:false});

  // The postMessage bridge to the embed sometimes never comes up (blocked
  // script, extension, slow network). Retry once, then say so plainly rather
  // than leaving the learner waiting for a tick that will never arrive.
  setTimeout(()=>{
    const rec = inlinePlayers.get(cid);
    if(!rec || rec.ready || rec.el !== document.getElementById("ytf-"+cid)) return;
    clearInterval(rec.timer);
    try{ rec.player && rec.player.destroy && rec.player.destroy(); }catch(e){}
    inlinePlayers.delete(cid);
    const el = document.getElementById("ytf-"+cid);
    if(!el) return;
    if(isRetry) markUntracked(cid);
    else attachPlayer(cid, el, true);
  }, isRetry ? 9000 : 6000);
}

// No progress bridge: hide the meaningless 0% readout and tell the learner to
// tick the box themselves, so nothing silently pretends to be tracking.
function markUntracked(cid){
  const label = document.querySelector(`[data-watchpct="${cid}"]`);
  if(label){
    label.textContent = "Tick when finished";
    label.classList.add("untracked");
  }
  const bar = document.querySelector(`[data-watchfill="${cid}"]`);
  if(bar && bar.parentElement) bar.parentElement.style.display = "none";
}

// Progress only ever moves forward — scrubbing backwards shouldn't lose credit.
function recordWatchProgress(classId, frac, player){
  const found = findClassAnywhere(classId);
  if(!found) return;
  const {plan, c} = found;
  const next = Math.min(1, Math.max(watchPct(c), frac));
  if(next - watchPct(c) < 0.005 && !(next >= AUTO_DONE_AT && !c.done)) return;
  c.watchPct = next;
  paintWatchProgress(classId, next);
  // localStorage (and the Drive sync it triggers) shouldn't run every second.
  clearTimeout(watchSaveTimer);
  watchSaveTimer = setTimeout(()=>{ plan.updatedAt = Date.now(); persistPlans(); }, 4000);
  if(next >= AUTO_DONE_AT) maybeAutoComplete(classId, player);
}

function paintWatchProgress(classId, frac){
  const pctText = Math.round(frac*100) + "% watched";
  const fill = document.querySelector(`[data-watchfill="${classId}"]`);
  if(fill) fill.style.width = Math.round(frac*100) + "%";
  const label = document.querySelector(`[data-watchpct="${classId}"]`);
  if(label) label.textContent = pctText;
}

function handleVideoEnded(classId, player){
  recordWatchProgress(classId, 1, player);
  maybeAutoComplete(classId, player);
}

// A playlist isn't finished just because its first video ended, so only
// auto-complete on the last entry. Single videos complete straight away.
function maybeAutoComplete(classId, player){
  const found = findClassAnywhere(classId);
  if(!found || found.c.done) return;
  try{
    const list = player && player.getPlaylist && player.getPlaylist();
    if(list && list.length > 1){
      const idx = player.getPlaylistIndex ? player.getPlaylistIndex() : 0;
      if(idx < list.length - 1) return;
    }
  }catch(e){}
  const {plan, c} = found;
  c.done = true;
  c.watchPct = 1;
  plan.updatedAt = Date.now();
  persistPlans();
  paintWatchProgress(classId, 1);
  syncDoneUI(classId, plan, true);
  toast(`Finished — "${c.title}" marked complete`, "success");
}

// Updates the checkbox/card/progress bar without a re-render, so the video the
// learner is watching is never torn down mid-playback.
function syncDoneUI(classId, plan, isDone){
  const card = document.querySelector(`[data-card="${classId}"]`);
  if(card) card.classList.toggle("done", !!isDone);
  const box = document.querySelector(`[data-action="toggle-class-done"][data-class="${classId}"]`);
  if(box) box.checked = !!isDone;
  const fill = document.querySelector(".detail-head .progress-fill");
  if(fill) fill.style.width = planProgress(plan) + "%";
}

// Manual escape hatch: attach any YouTube video/playlist to a lesson that has no
// embeddable one. Works with no API key — the learner just pastes a link, or
// jumps to a prefilled YouTube search to go find one.
function openAttachVideoModal(planId, classId){
  const plan = getPlan(planId);
  const c = plan && findClass(plan, classId);
  if(!c) return;
  const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(c.title + " " + (plan.subject||"") + " full course")}`;
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="avTitle" tabindex="-1">
        <h2 id="avTitle">Add a video</h2>
        <p class="desc">Paste any YouTube video or playlist link and it'll play inside this lesson. ${escapeHtml(c.title)}</p>
        <div class="field">
          <label>YouTube link</label>
          <input type="text" id="avUrl" placeholder="https://www.youtube.com/watch?v=… or /playlist?list=…">
        </div>
        <p class="desc" style="margin-bottom:18px;">
          Need one? <a href="${escapeHtml(searchUrl)}" target="_blank" rel="noopener">Search YouTube for this lesson ${icon("external","ic-sm")}</a>, then copy the link.
        </p>
        <div class="modal-actions">
          <button class="btn" id="avCancel">Cancel</button>
          <button class="btn primary" id="avSave">Add video</button>
        </div>
      </div>
    </div>`;
  document.getElementById("avCancel").onclick = closeModal;
  document.getElementById("modalOverlay").addEventListener("click", e=>{ if(e.target.id==="modalOverlay") closeModal(); });
  const save = ()=>{
    const url = document.getElementById("avUrl").value.trim();
    if(!extractYouTubeEmbed(url)){
      toast("That doesn't look like a YouTube video or playlist link.", "error");
      return;
    }
    c.altVideoUrl = url;
    c.altChannel = "Added by you";
    plan.updatedAt = Date.now();
    persistPlans();
    state.inlineOpen.add(classId);
    closeModal();
    renderView();
    toast("Video added to this lesson", "success");
  };
  document.getElementById("avSave").onclick = save;
  document.getElementById("avUrl").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); save(); } });
  setupModalA11y();
}

// Expands a lesson's video into a real inline iframe. When the lesson only has a
// channel/search link, first resolves it to a specific video via the YouTube Data
// API key (if one is set) so there's something embeddable to show.
async function playInline(planId, classId){
  const plan = getPlan(planId);
  const c = plan && findClass(plan, classId);
  if(!c) return;

  if(!getYtEmbed(c)){
    if(!ytApiKey()) return;
    const media = document.querySelector(`[data-media="${classId}"]`);
    if(media) media.classList.add("is-loading");
    try{
      const id = await resolveYouTubeVideoId(plan, c);
      if(!id){ toast("Couldn't find a video for this lesson.", "error"); if(media) media.classList.remove("is-loading"); return; }
    }catch(e){
      toast(e.message || "Couldn't find a video for this lesson.", "error");
      if(media) media.classList.remove("is-loading");
      return;
    }
  }
  state.inlineOpen.add(classId);
  renderView();
}

function patchDoneInPlace(checkbox, cls, plan){
  syncDoneUI(checkbox.dataset.class, plan, cls.done);
}

document.addEventListener("change", e=>{
  const action = e.target.closest("[data-action]");
  if(!action) return;
  const act = action.dataset.action;
  if(act==="set-completion"){
    const plan = getPlan(action.dataset.plan);
    const cls = findClass(plan, action.dataset.class);
    if(cls){
      cls.completionTime = action.value || null;
      plan.updatedAt = Date.now(); persistPlans();
      const fired = store.get("firedNotifs", {});
      const today = ymd(new Date());
      delete fired[`${plan.id}|${cls.id}|${today}|10`];
      delete fired[`${plan.id}|${cls.id}|${today}|5`];
      store.set("firedNotifs", fired);
      if(state.view==="today") renderView();
    }
  } else if(act==="set-start-date"){
    const plan = getPlan(action.dataset.id);
    if(plan){ plan.startDate = action.value; plan.updatedAt=Date.now(); persistPlans(); renderView(); }
  }
});

function findClass(plan, classId){
  if(!plan) return null;
  for(const w of (plan.weeks||[])) for(const d of (w.days||[])) {
    const c = (d.classes||[]).find(c=>c.id===classId);
    if(c) return c;
  }
  return null;
}
function findClassContext(plan, classId){
  if(!plan) return null;
  for(const w of (plan.weeks||[])) for(const d of (w.days||[])) {
    const idx = (d.classes||[]).findIndex(c=>c.id===classId);
    if(idx !== -1) return {week:w, day:d, classes:d.classes, idx};
  }
  return null;
}

/* ============================================================
   Watch modal — in-app YouTube player
============================================================ */
function renderWatchModal(planId, ctx, yt, resolving){
  const plan = getPlan(planId);
  const c = ctx.classes[ctx.idx];
  const root = document.getElementById("modalRoot");

  let playerBlock;
  if(resolving){
    playerBlock = `<div class="watch-noplayer"><p style="display:flex; align-items:center; justify-content:center; gap:6px;">${icon("search","ic-sm")} Finding the exact video for this lesson…</p></div>`;
  } else if(yt){
    const src = yt.kind==="playlist"
      ? `https://www.youtube-nocookie.com/embed/videoseries?list=${yt.id}`
      : `https://www.youtube-nocookie.com/embed/${yt.id}?rel=0`;
    playerBlock = `
      <div class="watch-player">
        <iframe src="${src}" title="${escapeHtml(c.title)}" frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>`;
  } else if(c.type === "rest"){
    playerBlock = `<div class="watch-noplayer"><p style="display:flex; align-items:center; justify-content:center; gap:6px;">${icon("moon","ic-sm")} It's a rest day — enjoy the break.</p></div>`;
  } else {
    playerBlock = `<div class="watch-noplayer">
      <p>${c.type==="video" ? "Couldn't find an embeddable video for this lesson." : "This lesson doesn't have an embeddable video."}</p>
      ${!ytApiKey() && c.type==="video" ? `<p style="font-size:12px;">Add a YouTube API key in Settings so Atlas can always find the exact video.</p>` : ""}
      ${c.resourceUrl ? `<a class="btn primary" href="${escapeHtml(c.resourceUrl)}" target="_blank" rel="noopener">Open resource ${icon("external","ic-sm")}</a>` : ""}
    </div>`;
  }

  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal watch-modal" data-class="${c.id}" role="dialog" aria-modal="true" aria-labelledby="watchModalTitle" tabindex="-1">
        <div class="watch-head">
          <div>
            <div class="watch-eyebrow">${escapeHtml(plan.title)} · Week ${ctx.week.weekNumber}, Day ${ctx.day.dayNumber}</div>
            <h2 id="watchModalTitle">${escapeHtml(c.title)}</h2>
          </div>
          <button class="icon-btn" id="watchClose" aria-label="Close">${icon("x")}</button>
        </div>
        ${playerBlock}
        <div class="watch-meta">
          ${escapeHtml(c.channel||"")}${c.channel?' · ':''}${c.durationMinutes} min
          ${c.notes ? `<p class="watch-notes">${escapeHtml(c.notes)}</p>` : ""}
        </div>
        <div class="watch-foot">
          <div class="watch-nav">
            <button class="btn small" id="watchPrev" ${ctx.idx<=0?'disabled':''}>${icon("arrowLeft","ic-sm")} Previous</button>
            <button class="btn small" id="watchNext" ${ctx.idx>=ctx.classes.length-1?'disabled':''}>Next ${icon("arrowRight","ic-sm")}</button>
          </div>
          <label class="watch-done-toggle">
            <input type="checkbox" class="chk" id="watchDoneChk" ${c.done?'checked':''}> Mark as complete
          </label>
          ${c.resourceUrl ? `<a href="${escapeHtml(c.resourceUrl)}" target="_blank" rel="noopener" class="watch-external">Open on YouTube ${icon("external","ic-sm")}</a>` : "<span></span>"}
        </div>
      </div>
    </div>`;

  document.getElementById("watchClose").onclick = closeModal;
  document.getElementById("modalOverlay").addEventListener("click", e=>{ if(e.target.id==="modalOverlay") closeModal(); });
  document.getElementById("watchDoneChk").onchange = e=>{
    c.done = e.target.checked; plan.updatedAt = Date.now(); persistPlans();
    if(state.view!=="chat") renderView();
  };
  const prevBtn = document.getElementById("watchPrev");
  const nextBtn = document.getElementById("watchNext");
  if(prevBtn) prevBtn.onclick = ()=>{ if(ctx.idx>0) openWatchModal(planId, ctx.classes[ctx.idx-1].id); };
  if(nextBtn) nextBtn.onclick = ()=>{ if(ctx.idx<ctx.classes.length-1) openWatchModal(planId, ctx.classes[ctx.idx+1].id); };
  setupModalA11y();
}

async function openWatchModal(planId, classId){
  const plan = getPlan(planId);
  const ctx = plan && findClassContext(plan, classId);
  if(!ctx) return;
  const c = ctx.classes[ctx.idx];
  let yt = getYtEmbed(c);

  if(yt || !(c.type === "video" && ytApiKey())){
    renderWatchModal(planId, ctx, yt, false);
    return;
  }

  renderWatchModal(planId, ctx, null, true);
  let resolveErr = null, resolvedId = null;
  try{ resolvedId = await resolveYouTubeVideoId(plan, c); }
  catch(e){ resolveErr = e; }
  yt = resolvedId ? {kind:"video", id:resolvedId} : null;

  const stillOpenOnThisClass = document.querySelector(`.watch-modal[data-class="${classId}"]`);
  if(!stillOpenOnThisClass) return;
  if(resolveErr) toast(resolveErr.message || "Couldn't find a video for this lesson.", "error");
  renderWatchModal(planId, ctx, yt, false);
  if(yt && state.view!=="chat") renderView();
}

}

})();
