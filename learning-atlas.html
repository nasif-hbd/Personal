<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Atlas — Your AI Learning Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23e07a4e'/%3E%3Ccircle cx='12' cy='12' r='7.2' fill='none' stroke='white' stroke-width='1.8'/%3E%3Cpath d='m14.1 9.9-1.4 3.8-3.8 1.4 1.4-3.8z' fill='white'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#0a0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================== Design tokens =====================
   Editorial / risograph-print system: paper ground, ink rules, hard offset
   shadows, zero gradients, zero blur. Structure carries the personality —
   flat colour blocks, ruled gutters, stamped labels.
========================================================== */
:root{
  --paper: #f2ede1;
  --paper-2: #e9e3d3;
  --panel: #fbf8f1;
  --ink: #16150f;
  --ink-soft: #4c4a3e;
  --ink-faint: #8a8676;
  --rule: #16150f;
  --accent: #e8431f;      /* vermillion */
  --accent-2: #1f43e8;    /* cobalt */
  --accent-3: #f2c318;    /* highlighter */
  --accent-4: #1c7a54;    /* pine */
  --accent-soft: #f8d8ce;
  --success: #1c7a54;
  --warn: #b5710a;
  --danger: #c22a12;
  --shadow-hard: 4px 4px 0 var(--ink);
  --shadow-hard-lg: 7px 7px 0 var(--ink);
  --bw: 2px;
  --font-display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --font: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(.2,.9,.3,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --dur-fast: .12s;
  --dur: .2s;
  --dur-slow: .35s;
}
:root[data-theme="dark"]{
  --paper: #14140f;
  --paper-2: #1c1c15;
  --panel: #1e1e17;
  --ink: #f2ede1;
  --ink-soft: #b8b3a2;
  --ink-faint: #85806f;
  --rule: #f2ede1;
  --accent: #ff6a3d;
  --accent-2: #6f8cff;
  --accent-3: #ffd645;
  --accent-4: #3fb98a;
  --accent-soft: #402016;
  --success: #3fb98a;
  --warn: #e8a33c;
  --danger: #ff6f57;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14140f; --paper-2:#1c1c15; --panel:#1e1e17;
    --ink:#f2ede1; --ink-soft:#b8b3a2; --ink-faint:#85806f; --rule:#f2ede1;
    --accent:#ff6a3d; --accent-2:#6f8cff; --accent-3:#ffd645; --accent-4:#3fb98a;
    --accent-soft:#402016; --success:#3fb98a; --warn:#e8a33c; --danger:#ff6f57;
  }
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--font);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  background-image:
    repeating-linear-gradient(45deg, rgba(0,0,0,.014) 0 2px, transparent 2px 9px);
}
:root[data-theme="dark"] body,
:root:not([data-theme="light"]) body{
  background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.016) 0 2px, transparent 2px 9px);
}
h1,h2,h3{font-family:var(--font-display); font-weight:400; letter-spacing:-.015em; line-height:1.08;}
::-webkit-scrollbar{width:12px;height:12px;}
::-webkit-scrollbar-track{background:var(--paper-2);}
::-webkit-scrollbar-thumb{background:var(--ink); border:3px solid var(--paper-2);}
a{color:var(--accent-2); text-underline-offset:3px;}
button{font-family:inherit;}
.hidden{display:none !important;}
.ic{width:16px; height:16px; flex:0 0 auto; display:inline-block; vertical-align:-3px;}
.ic.ic-sm{width:13px; height:13px;}
.ic.ic-lg{width:22px; height:22px;}
.ic.ic-xl{width:40px; height:40px;}
:is(button,a,[tabindex]):focus-visible{outline:3px solid var(--accent-2); outline-offset:2px;}

/* ===================== Motion ===================== */
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes riseIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@keyframes stampIn{from{opacity:0; transform:scale(1.06) rotate(-1.5deg);} to{opacity:1; transform:scale(1) rotate(0);}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ===================== Shell / top nav ===================== */
#app{display:flex; flex-direction:column; min-height:100vh;}
.topnav{
  position:sticky; top:0; z-index:60; background:var(--paper);
  border-bottom:var(--bw) solid var(--rule);
}
.topnav-inner{
  max-width:1180px; margin:0 auto; padding:0 22px;
  display:flex; align-items:stretch; gap:18px; min-height:60px;
}
.brand{
  display:flex; align-items:center; gap:11px; text-decoration:none; color:inherit;
  padding-right:20px; border-right:var(--bw) solid var(--rule); margin-right:2px;
}
.brand .mark{
  width:34px; height:34px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  background:var(--accent); color:#fff; border:var(--bw) solid var(--ink);
  transform:rotate(-3deg);
}
.brand .mark .ic{width:19px; height:19px;}
.brand .name{font-family:var(--font-display); font-size:19px; letter-spacing:-.02em; line-height:1;}
.brand .tag{font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-faint); margin-top:3px;}

.navrow{display:flex; align-items:stretch; gap:0; flex:1; overflow-x:auto; scrollbar-width:none;}
.navrow::-webkit-scrollbar{display:none;}
.navbtn{
  border:none; background:transparent; color:var(--ink-soft); cursor:pointer;
  font-family:var(--font-mono); font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.11em;
  padding:0 16px; white-space:nowrap; position:relative;
  transition:color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.navbtn:hover{color:var(--ink); background:var(--paper-2);}
.navbtn::after{
  content:""; position:absolute; left:12px; right:12px; bottom:0; height:4px;
  background:var(--accent); transform:scaleX(0); transform-origin:left;
  transition:transform var(--dur) var(--ease);
}
.navbtn.active{color:var(--ink);}
.navbtn.active::after{transform:scaleX(1);}

.topnav-right{display:flex; align-items:center; gap:10px; padding-left:16px; border-left:var(--bw) solid var(--rule);}
.icon-btn{
  border:var(--bw) solid var(--ink); background:var(--panel); color:var(--ink); cursor:pointer;
  width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; padding:0;
  transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.icon-btn:hover{background:var(--accent-3); transform:translate(-1px,-1px); box-shadow:2px 2px 0 var(--ink);}
.icon-btn:active{transform:translate(0,0); box-shadow:none;}
.icon-btn .ic{vertical-align:0;}

.key-status{
  font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em;
  color:var(--ink-faint); display:flex; align-items:center; gap:6px;
}
.key-status .pip{width:8px; height:8px; border:var(--bw) solid var(--ink); flex:0 0 auto;}
.key-status.ok .pip{background:var(--success);}
.key-status.bad .pip{background:var(--danger);}

/* Page head: slug line under the nav */
.pagehead{
  border-bottom:var(--bw) solid var(--rule); background:var(--paper-2);
}
.pagehead-inner{
  max-width:1180px; margin:0 auto; padding:12px 22px;
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
}
.pagehead h1{
  font-family:var(--font-mono); font-size:12px; font-weight:600; margin:0;
  text-transform:uppercase; letter-spacing:.16em;
}
.pagehead .sub{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); letter-spacing:.05em;}

main{flex:1; display:flex; flex-direction:column; min-width:0;}
.view{flex:1; max-width:1180px; width:100%; margin:0 auto; padding:30px 22px 90px;}
.view.view-anim{animation:fadeIn .16s var(--ease);}

/* ===================== Buttons / inputs ===================== */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:9px 16px;
  border:var(--bw) solid var(--ink); background:var(--panel); color:var(--ink);
  font-family:var(--font-mono); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.09em;
  cursor:pointer; box-shadow:var(--shadow-hard);
  transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.btn:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); background:var(--accent-3);}
.btn:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--ink);}
.btn.primary{background:var(--accent); color:#fff;}
.btn.primary:hover{background:var(--accent);}
.btn.danger{background:var(--panel); color:var(--danger);}
.btn.danger:hover{background:var(--danger); color:#fff;}
.btn.small{padding:6px 11px; font-size:10.5px; box-shadow:3px 3px 0 var(--ink);}
.btn.small:hover{box-shadow:5px 5px 0 var(--ink);}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:var(--shadow-hard);}

input[type=text], input[type=number], input[type=password], input[type=time], input[type=date], select, textarea{
  background:var(--panel); border:var(--bw) solid var(--ink); color:var(--ink);
  padding:10px 12px; font-size:14px; font-family:var(--font); width:100%; outline:none;
  transition:box-shadow var(--dur-fast) var(--ease);
}
input:focus, select:focus, textarea:focus{box-shadow:var(--shadow-hard);}
label{
  font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft); font-weight:600;
  display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.11em;
}
.field{margin-bottom:16px;}
.row{display:flex; gap:14px;}
.row > .field{flex:1;}

.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  padding:7px 13px; border:var(--bw) solid var(--ink); background:var(--panel); color:var(--ink-soft);
  font-family:var(--font-mono); font-size:11px; cursor:pointer; font-weight:600; letter-spacing:.05em;
  transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.chip:hover{transform:translate(-1px,-1px); box-shadow:2px 2px 0 var(--ink);}
.chip:active{transform:translate(0,0); box-shadow:none;}
.chip.selected{background:var(--ink); color:var(--paper);}

.card{background:var(--panel); border:var(--bw) solid var(--ink); padding:18px; box-shadow:var(--shadow-hard);}
.badge{
  display:inline-block; font-family:var(--font-mono); font-size:9.5px; font-weight:600;
  text-transform:uppercase; letter-spacing:.13em; padding:3px 8px;
  background:var(--ink); color:var(--paper); border:var(--bw) solid var(--ink);
}
.badge.gold{background:var(--accent-3); color:var(--ink);}

/* ===================== Chat ===================== */
.chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 220px); min-height:420px;}
.chat-scroll{flex:1; overflow-y:auto; padding:4px 2px 10px;}
.msg{display:flex; gap:14px; max-width:780px; margin:0 auto 22px; animation:riseIn var(--dur) var(--ease) both;}
.msg .avatar{
  width:34px; height:34px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  border:var(--bw) solid var(--ink);
}
.msg.user .avatar{background:var(--accent-3); color:var(--ink);}
.msg.assistant .avatar{background:var(--accent); color:#fff;}
.msg .bubble{
  background:var(--panel); border:var(--bw) solid var(--ink); padding:14px 16px; flex:1; min-width:0;
  box-shadow:var(--shadow-hard);
}
.msg.user .bubble{background:var(--paper-2);}
.msg .bubble p{margin:0 0 9px;}
.msg .bubble p:last-child{margin-bottom:0;}
.msg .bubble ul{margin:6px 0; padding-left:20px;}
.msg .bubble code{background:var(--paper-2); padding:1px 5px; font-family:var(--font-mono); font-size:12.5px; border:1px solid var(--ink);}
.msg .status-line{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-bottom:9px;
  display:flex; align-items:center; gap:7px; text-transform:uppercase; letter-spacing:.09em;
}
.plan-chip{
  margin-top:10px; padding:13px 15px; background:var(--accent-3); border:var(--bw) solid var(--ink);
  color:var(--ink); font-size:13.5px; cursor:pointer; font-weight:600; box-shadow:var(--shadow-hard);
  display:flex; align-items:center; gap:9px;
}
.plan-chip.plan-chip-loading{cursor:default; background:var(--paper-2); color:var(--ink-soft); box-shadow:none;}
.dotpulse{display:inline-flex; gap:4px;}
.dotpulse span{width:6px;height:6px; background:var(--accent); animation:pulse 1.2s infinite ease-in-out;}
.dotpulse span:nth-child(2){animation-delay:.2s;} .dotpulse span:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

.chat-empty{max-width:540px; margin:50px auto; text-align:center;}
.chat-empty .big-ic{margin-bottom:16px; color:var(--accent); display:flex; justify-content:center;}
.chat-empty h2{font-size:26px; margin:0 0 10px;}
.chat-empty p{color:var(--ink-soft); margin:0 0 22px; font-size:14px;}

.chat-input-bar{border-top:var(--bw) solid var(--rule); padding:16px 0 0; background:transparent;}
.chat-input-row{max-width:780px; margin:0 auto; display:flex; gap:10px; align-items:flex-end;}
.chat-input-row textarea{resize:none; min-height:46px; max-height:170px;}
.chat-hint{
  max-width:780px; margin:8px auto 0; font-family:var(--font-mono); font-size:10px;
  color:var(--ink-faint); text-transform:uppercase; letter-spacing:.1em;
}

/* ===================== Plans ===================== */
.plans-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px;}
.plan-card{cursor:pointer; transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);}
.plan-card:hover{transform:translate(-3px,-3px); box-shadow:var(--shadow-hard-lg);}
.plan-card:active{transform:translate(0,0); box-shadow:var(--shadow-hard);}
.plan-card h3{margin:10px 0 6px; font-size:19px;}
.plan-card .meta{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; margin-bottom:14px;}
.progress-track{height:10px; background:var(--paper-2); border:var(--bw) solid var(--ink); overflow:hidden; margin-top:10px;}
.progress-fill{height:100%; background:var(--accent); transition:width var(--dur-slow) var(--ease);}
.plan-card-foot{
  display:flex; justify-content:space-between; align-items:center; margin-top:12px;
  font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em;
}

.detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:26px; flex-wrap:wrap;}
.detail-head h2{margin:8px 0 8px; font-size:34px; max-width:15ch;}
.detail-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}

/* Week blocks — printed syllabus sections */
.week-block{margin-bottom:22px; border:var(--bw) solid var(--ink); background:var(--panel); box-shadow:var(--shadow-hard);}
.week-head{
  padding:15px 18px; cursor:pointer; display:flex; align-items:center; gap:12px; justify-content:space-between;
  background:var(--ink); color:var(--paper);
  transition:background var(--dur-fast) var(--ease);
}
.week-head .title{font-family:var(--font-display); font-size:17px; letter-spacing:-.01em;}
.week-head .theme{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.09em; opacity:.75;}
.week-body-grid{display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--dur-slow) var(--ease);}
.week-body{overflow:hidden; padding:0 18px; min-height:0;}
.week-block.open .week-body-grid{grid-template-rows:1fr;}
.week-block.open .week-body{padding:6px 18px 18px;}
.week-block.open .chev{transform:rotate(90deg);}
.chev{transition:transform var(--dur) var(--ease);}

/* Day rows — numbered gutter, ruled like a workbook */
.day-row{display:flex; gap:16px; padding:18px 0; border-top:2px dashed var(--ink);}
.day-row:first-child{border-top:none;}
.day-gutter{
  flex:0 0 46px; font-family:var(--font-display); font-size:26px; line-height:1;
  color:var(--ink); opacity:.22; padding-top:2px;
}
.day-main{flex:1; min-width:0;}
.day-head{
  display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:10.5px;
  color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.12em; margin-bottom:12px;
}
.day-head .date{color:var(--ink-faint); font-weight:400; letter-spacing:.06em;}
.day-head .today-flag{background:var(--accent); color:#fff; padding:2px 7px; letter-spacing:.1em;}

.class-card{
  display:flex; gap:14px; align-items:flex-start; padding:12px; background:var(--paper-2);
  border:var(--bw) solid var(--ink); margin-bottom:12px; flex-wrap:wrap;
  transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.class-card:hover{transform:translate(-2px,-2px); box-shadow:var(--shadow-hard);}
.class-card.done{opacity:.5;}
.class-card.done .cc-title{text-decoration:line-through;}
.class-card.rest-card{background:transparent; border-style:dashed; justify-content:center; padding:14px;}
.class-card.rest-card:hover{transform:none; box-shadow:none;}
.class-card .cc-main{flex:1; min-width:170px;}
.class-card .cc-title{font-size:15px; font-weight:600; line-height:1.3;}
.class-card .cc-meta{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); margin-top:5px; letter-spacing:.04em;}
.class-card .cc-controls{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
.class-card input[type=time]{width:112px; padding:5px 8px; font-size:12px; font-family:var(--font-mono);}

/* ===================== Inline video ===================== */
.lesson-media{flex:0 0 auto; width:150px;}
.lesson-media.sm{width:104px;}
.lesson-media.expanded{flex:1 1 100%; width:100%; max-width:720px; order:99; margin-top:4px;}
.lesson-facade{
  position:relative; display:block; width:100%; aspect-ratio:16/9; padding:0; cursor:pointer;
  border:var(--bw) solid var(--ink); background-size:cover; background-position:center; background-color:var(--paper);
  transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.lesson-facade:hover{transform:translate(-2px,-2px); box-shadow:var(--shadow-hard);}
.lesson-facade.icon-only{display:flex; align-items:center; justify-content:center; color:var(--ink);}
.lesson-facade .play-badge{
  position:absolute; inset:0; margin:auto; width:38px; height:26px;
  background:var(--accent); color:#fff; border:var(--bw) solid var(--ink);
  display:flex; align-items:center; justify-content:center;
  transition:transform var(--dur-fast) var(--ease-spring);
}
.lesson-facade:hover .play-badge{transform:scale(1.14);}
/* Icons are decoration — never let them swallow the click meant for the button. */
.lesson-facade .ic, .lesson-facade .play-badge{pointer-events:none;}
.week-block, .day-row{scroll-margin-top:130px;}
.lesson-embed{border:var(--bw) solid var(--ink); background:#000; animation:stampIn var(--dur) var(--ease);}
.lesson-embed .frame{position:relative; width:100%; padding-top:56.25%;}
.lesson-embed iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
.lesson-embed-bar{
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  padding:8px 10px; background:var(--ink); color:var(--paper);
  font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em;
}
.lesson-embed-bar .lb-actions{display:flex; gap:8px;}
.lesson-embed-bar button{
  background:transparent; border:1px solid var(--paper); color:var(--paper); cursor:pointer;
  font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; padding:3px 8px;
  transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.lesson-embed-bar button:hover{background:var(--paper); color:var(--ink);}

.todo-row{display:flex; align-items:flex-start; gap:10px; font-size:14px; padding:6px 2px;}
.todo-row.done .txt{text-decoration:line-through; color:var(--ink-faint);}
.chk{
  width:18px; height:18px; flex:0 0 auto; accent-color:var(--accent); cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-spring);
}
.chk:active{transform:scale(1.25);}

/* ===================== Today ===================== */
.today-list{display:flex; flex-direction:column; gap:14px; max-width:820px;}
.count-badge{
  font-family:var(--font-mono); font-size:9.5px; padding:3px 8px; font-weight:600;
  text-transform:uppercase; letter-spacing:.11em; border:var(--bw) solid var(--ink);
}
.count-badge.warn{background:var(--accent-3); color:var(--ink);}
.count-badge.ok{background:var(--accent); color:#fff;}

/* ===================== Home ===================== */
.home-hero{
  position:relative; border:var(--bw) solid var(--ink); background:var(--panel);
  box-shadow:var(--shadow-hard-lg); padding:32px 30px; margin-bottom:34px; overflow:hidden;
}
.home-hero::before{
  content:""; position:absolute; top:0; right:0; bottom:0; width:34%;
  background:repeating-linear-gradient(-45deg, var(--accent) 0 8px, transparent 8px 20px);
  opacity:.16; pointer-events:none;
}
.home-hero-inner{position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:22px; flex-wrap:wrap;}
.home-eyebrow{
  font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.2em;
  color:var(--ink-soft); margin-bottom:10px;
}
.home-title{font-size:44px; margin:0; max-width:14ch;}
.home-title em{font-style:normal; color:var(--accent); }

.stat-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:0; margin-bottom:38px; border:var(--bw) solid var(--ink); background:var(--panel); box-shadow:var(--shadow-hard);}
.stat-tile{padding:20px 22px; border-right:var(--bw) solid var(--ink);}
.stat-tile:last-child{border-right:none;}
.stat-value{font-family:var(--font-display); font-size:38px; line-height:1; display:flex; align-items:center; gap:8px;}
.stat-value .ic{color:var(--accent);}
.stat-label{font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); margin-top:8px; text-transform:uppercase; letter-spacing:.13em;}

.home-section{margin-bottom:40px;}
.home-section-head{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
.home-section-head h3{
  margin:0; font-size:13px; font-family:var(--font-mono); font-weight:600; text-transform:uppercase; letter-spacing:.16em;
  display:flex; align-items:center; gap:9px;
}
.home-section-head h3::before{
  content:""; width:16px; height:16px; background:var(--accent); border:var(--bw) solid var(--ink); flex:0 0 auto;
}
.section-rule{height:0; border-top:var(--bw) solid var(--ink); flex:1; min-width:20px;}

/* Featured paths — index cards on a pinboard */
.featured-grid{grid-template-columns:repeat(auto-fill, minmax(300px,1fr));}
.featured-card{
  position:relative; cursor:default; padding:0; overflow:hidden;
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.featured-card:hover{box-shadow:var(--shadow-hard-lg);}
.fc-band{
  padding:9px 16px; border-bottom:var(--bw) solid var(--ink);
  font-family:var(--font-mono); font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.14em;
  display:flex; justify-content:space-between; align-items:center; gap:10px;
}
.featured-card:nth-child(6n+1) .fc-band{background:var(--accent); color:#fff;}
.featured-card:nth-child(6n+2) .fc-band{background:var(--accent-2); color:#fff;}
.featured-card:nth-child(6n+3) .fc-band{background:var(--accent-3); color:var(--ink);}
.featured-card:nth-child(6n+4) .fc-band{background:var(--accent-4); color:#fff;}
.featured-card:nth-child(6n+5) .fc-band{background:var(--ink); color:var(--paper);}
.featured-card:nth-child(6n+6) .fc-band{background:var(--paper-2); color:var(--ink);}
.fc-body{padding:18px 16px 16px;}
.featured-card h3{margin:0 0 8px; font-size:20px; line-height:1.12;}
.featured-card .meta{font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.09em; margin-bottom:12px;}
.featured-card .blurb{font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin:0 0 18px;}
.featured-card-foot{display:flex; justify-content:flex-end;}

/* ===================== Settings ===================== */
.settings-section{max-width:680px; margin-bottom:26px;}
.settings-section h3{font-size:20px; margin:0 0 6px;}
.settings-section .desc{font-size:13.5px; color:var(--ink-soft); margin:0 0 16px; line-height:1.6;}
.settings-section code{font-family:var(--font-mono); font-size:12px; background:var(--paper-2); padding:1px 5px; border:1px solid var(--ink);}
.pwd-wrap{display:flex; gap:10px;}
.pwd-wrap input{flex:1;}

/* ===================== Modal ===================== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,20,15,.55); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px; animation:fadeIn var(--dur) var(--ease);
}
.modal{
  background:var(--panel); border:var(--bw) solid var(--ink); padding:26px;
  max-width:540px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-hard-lg);
  animation:stampIn var(--dur) var(--ease);
}
.modal h2{margin:0 0 6px; font-size:26px;}
.modal .desc{font-size:13.5px; color:var(--ink-soft); margin:0 0 20px;}
.modal-actions{display:flex; justify-content:flex-end; gap:12px; margin-top:10px;}

.watch-modal{max-width:880px; padding:22px;}
.watch-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px;}
.watch-eyebrow{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.15em; color:var(--ink-faint); margin-bottom:7px;}
.watch-head h2{margin:0; font-size:25px; line-height:1.14;}
.watch-player{position:relative; width:100%; padding-top:56.25%; overflow:hidden; background:#000; margin-bottom:18px; border:var(--bw) solid var(--ink);}
.watch-player iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
.watch-noplayer{padding:46px 20px; text-align:center; color:var(--ink-soft); background:var(--paper-2); border:var(--bw) dashed var(--ink); margin-bottom:18px;}
.watch-meta{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-bottom:18px; text-transform:uppercase; letter-spacing:.08em;}
.watch-notes{font-family:var(--font); color:var(--ink-soft); font-size:14px; margin:12px 0 0; line-height:1.6; text-transform:none; letter-spacing:0;}
.watch-foot{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; border-top:var(--bw) solid var(--ink); padding-top:18px;}
.watch-nav{display:flex; gap:10px;}
.watch-done-toggle{
  display:flex; align-items:center; gap:9px; font-family:var(--font-mono); font-size:11px; font-weight:600;
  color:var(--ink-soft); cursor:pointer; text-transform:uppercase; letter-spacing:.09em; margin:0;
}
.watch-external{font-family:var(--font-mono); font-size:10.5px; color:var(--accent-2); font-weight:600; text-transform:uppercase; letter-spacing:.09em;}

/* ===================== Toasts ===================== */
#toasts{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--panel); border:var(--bw) solid var(--ink); padding:12px 16px; box-shadow:var(--shadow-hard);
  font-size:13.5px; max-width:340px; animation:stampIn var(--dur) var(--ease-spring);
  display:flex; gap:10px; align-items:center;
  transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.toast .ic{color:var(--accent);}
.toast.error{border-color:var(--danger); color:var(--danger);}
.toast.error .ic{color:var(--danger);}
.toast.success .ic{color:var(--success);}
.toast.hide{opacity:0; transform:translate(6px,6px);}
.toast-msg{color:var(--ink);}
.toast.error .toast-msg{color:var(--danger);}

/* ===================== Responsive ===================== */
@media (max-width:900px){
  .topnav-inner{flex-wrap:wrap; padding:0 14px; gap:0;}
  .brand{border-right:none; padding:10px 0; flex:1;}
  .topnav-right{border-left:none; padding-left:0;}
  .navrow{order:3; flex:1 0 100%; border-top:var(--bw) solid var(--rule);}
  .navbtn{padding:11px 14px; flex:1; justify-content:center; text-align:center;}
  .view{padding:22px 14px 80px;}
  .pagehead-inner{padding:10px 14px;}
  .home-hero{padding:24px 20px;}
  .home-title{font-size:32px;}
  .detail-head h2{font-size:26px;}
  .stat-row{grid-template-columns:1fr;}
  .stat-tile{border-right:none; border-bottom:var(--bw) solid var(--ink);}
  .stat-tile:last-child{border-bottom:none;}
  .day-row{gap:10px;}
  .day-gutter{flex-basis:30px; font-size:19px;}
  .lesson-media{width:114px;}
  .featured-card{transform:none !important;}
}
@media print{
  .topnav, .pagehead, .chat-input-bar, .lesson-media{display:none !important;}
  body{background:#fff; color:#000;}
  .card, .week-block{box-shadow:none;}
}

    if(host === "youtube.com" || host === "youtube-nocookie.com"){
      if(u.pathname === "/watch"){
        const v = u.searchParams.get("v");
        return v ? {kind:"video", id:v} : null;
      }
      if(u.pathname === "/playlist"){
        const list = u.searchParams.get("list");
        return list ? {kind:"playlist", id:list} : null;
      }
      const m = u.pathname.match(/^\/(embed|shorts|live)\/([^/?]+)/);
      if(m){
        if(m[2] === "videoseries"){
          const list = u.searchParams.get("list");
          return list ? {kind:"playlist", id:list} : null;
        }
        return {kind:"video", id:m[2]};
      }
    }
  }catch(e){}
  return null;
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   Markdown-lite renderer (safe: escapes first)
============================================================ */
function inlineFormat(s){
  return s
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function blockFormat(escText){
  const lines = escText.split("\n");
  let html = "", inList = false;
  for(const raw of lines){
    const bullet = raw.match(/^\s*[-*]\s+(.*)/);
    if(bullet){
      if(!inList){ html += "<ul>"; inList = true; }
      html += `<li>${inlineFormat(bullet[1])}</li>`;
    } else {
      if(inList){ html += "</ul>"; inList = false; }
      if(raw.trim()==="") continue;
      html += `<p>${inlineFormat(raw)}</p>`;
    }
  }
  if(inList) html += "</ul>";
  return html;
}
function renderChatBubble(rawText){
  const fenceTag = "```cadence-plan";
  const idx = rawText.indexOf(fenceTag);
  let mainText = rawText, chip = "";
  if(idx !== -1){
    mainText = rawText.slice(0, idx);
    const after = rawText.slice(idx + fenceTag.length);
    const closed = after.includes("```");
    chip = closed
      ? `<div class="plan-chip" data-action="view-plan" tabindex="0" role="button">${icon("calendar","ic-sm")} <strong>Learning plan generated</strong> — click to view it</div>`
      : `<div class="plan-chip plan-chip-loading">${icon("hourglass","ic-sm")} Designing your curriculum <span class="dotpulse"><span></span><span></span><span></span></span></div>`;
  }
  return blockFormat(escapeHtml(mainText.trim())) + chip;
}

/* ============================================================
   Plan data helpers
============================================================ */
function computeDateForDay(plan, weekNumber, dayNumber){
  const offset = (weekNumber-1)*7 + (dayNumber-1);
  return ymd(addDays(plan.startDate, offset));
}
function planProgress(plan){
  let total=0, done=0;
  (plan.weeks||[]).forEach(w=>(w.days||[]).forEach(d=>(d.classes||[]).forEach(c=>{
    if(c.type==="rest") return;
    total++; if(c.done) done++;
  })));
  return total ? Math.round(done/total*100) : 0;
}
function classesScheduledOn(dateStr){
  const items = [];
  state.plans.forEach(plan=>{
    (plan.weeks||[]).forEach(week=>(week.days||[]).forEach(day=>{
      if(computeDateForDay(plan, week.weekNumber, day.dayNumber) !== dateStr) return;
      (day.classes||[]).forEach(c=>{ if(c.type!=="rest") items.push({plan, week, day, c}); });
    }));
  });
  return items;
}
function computeStreak(){
  let streak = 0;
  const cursor = new Date();
  for(let i=0;i<400;i++){
    const dateStr = ymd(cursor);
    const items = classesScheduledOn(dateStr);
    const allDone = items.length > 0 && items.every(it=>it.c.done);
    if(!allDone){
      if(i===0){ cursor.setDate(cursor.getDate()-1); continue; }
      break;
    }
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function completedThisWeek(){
  const today = new Date();
  let count = 0;
  for(let i=0;i<7;i++){
    const dateStr = ymd(addDays(ymd(today), -i));
    classesScheduledOn(dateStr).forEach(it=>{ if(it.c.done) count++; });
  }
  return count;
}
function extractPlanJSON(text){
  const re = /```cadence-plan\s*([\s\S]*?)```/g;
  let m, last=null;
  while((m = re.exec(text))) last = m[1];
  if(!last) return null;
  const raw = last.trim();
  try{ return JSON.parse(raw); }
  catch(e){
    try{ return JSON.parse(raw.replace(/,(\s*[}\]])/g, "$1")); }
    catch(e2){ return null; }
  }
}
function applyPlanData(plan, data){
  const oldClassIdx = {}, oldTodoIdx = {};
  (plan.weeks||[]).forEach(w=>(w.days||[]).forEach(d=>{
    (d.classes||[]).forEach(c=>{ oldClassIdx[`${w.weekNumber}|${d.dayNumber}|${c.title}`] = c; });
    (d.todos||[]).forEach(t=>{ oldTodoIdx[`${w.weekNumber}|${d.dayNumber}|${t.text}`] = t; });
  }));

  plan.title = data.title || plan.title;
  plan.subject = data.subject || plan.subject;
  plan.language = data.language || plan.language;
  plan.durationWeeks = Math.min(MAX_WEEKS, Number(data.durationWeeks)||plan.durationWeeks);
  plan.dailyMinutes = Number(data.dailyMinutes)||plan.dailyMinutes;

  plan.weeks = (data.weeks||[]).slice(0, MAX_WEEKS).map(w=>({
    weekNumber: Number(w.weekNumber)||1,
    theme: w.theme || "",
    days: (w.days||[]).slice(0,7).map(d=>({
      dayNumber: Number(d.dayNumber)||1,
      classes: (d.classes||[]).map(c=>{
        const old = oldClassIdx[`${w.weekNumber}|${d.dayNumber}|${c.title}`];
        return {
          id: (old && old.id) || uid(),
          title: c.title || "Untitled class",
          type: c.type || "video",
          resourceUrl: c.resourceUrl || "",
          channel: c.channel || "",
          durationMinutes: Number(c.durationMinutes)||plan.dailyMinutes,
          notes: c.notes || "",
          done: (old && old.done) || false,
          completionTime: (old && old.completionTime) || null,
        };
      }),
      todos: (d.todos||[]).map(t=>{
        const old = oldTodoIdx[`${w.weekNumber}|${d.dayNumber}|${t.text}`];
        return { id:(old && old.id)||uid(), text: t.text||"", done:(old && old.done)||false };
      })
    }))
  }));
  plan.updatedAt = Date.now();
  persistPlans();
}

/* ============================================================
   Claude API — system prompt, streaming call, continuation loop
============================================================ */
function buildSystemPrompt(plan){
  const langLabel = LANGS[plan.language] || "English";
  return `You are Atlas, an expert personal learning coach and curriculum designer helping one learner build a real, achievable self-study plan.

LEARNER CONTEXT
- Subject / goal: ${plan.subject}
- Content language for resources: ${langLabel}
- Current level: ${plan.level}
- Duration: ${plan.durationWeeks} week(s) (hard max ${MAX_WEEKS} weeks, ~3 months)
- Daily study time available: ${plan.dailyMinutes} minutes
- Rest days per week: ${(plan.daysOff&&plan.daysOff.length) ? plan.daysOff.join(", ") : "none specified, use your judgement"}
- Today's date: ${ymd(new Date())}

RESEARCH REQUIREMENT
Use the web_search and web_fetch tools to find REAL, currently available, FREE YouTube videos that teach this subject in ${langLabel}. Prefer well-known, reputable educators/channels for that language and subject.
- Every "video" class's resourceUrl MUST be a link to one specific, individual YouTube video (a real youtube.com/watch?v=... or youtu.be/... URL for one exact video) — NEVER a channel homepage, a playlist page, a search-results URL, or an instruction like "search this channel for X". The app embeds this exact URL as a video player, so it must point straight at one playable video.
- Never invent a URL — every resourceUrl must come from an actual search result you found this conversation, and should be plausible as a real, currently-playable video (use web_fetch to spot-check ones you're unsure of).
- If you cannot find a strong specific-video match for a day, pick the single best real individual video you did find (even if imperfect) rather than falling back to a channel or a "search for" note — a specific video is always required for type "video".

OUTPUT FORMAT
Once you have enough information (ask brief clarifying questions first if something important is missing), respond with a short friendly note OUTSIDE any code fence, then ALWAYS append the FULL current plan as one single fenced block starting with \`\`\`cadence-plan and ending with \`\`\`, containing STRICT JSON (no comments, no trailing commas) in exactly this shape:

\`\`\`cadence-plan
{
  "title": "short plan title",
  "subject": "${plan.subject}",
  "language": "${plan.language}",
  "durationWeeks": ${plan.durationWeeks},
  "dailyMinutes": ${plan.dailyMinutes},
  "weeks": [
    {
      "weekNumber": 1,
      "theme": "what this week focuses on",
      "days": [
        {
          "dayNumber": 1,
          "classes": [
            {
              "title": "class / video title",
              "type": "video",
              "resourceUrl": "https://www.youtube.com/watch?v=...",
              "channel": "channel name",
              "durationMinutes": 30,
              "notes": "what to do / focus on"
            }
          ],
          "todos": [ { "text": "short actionable todo for the day" } ]
        }
      ]
    }
  ]
}
\`\`\`

RULES FOR THE JSON
- Every week object must contain exactly 7 entries in "days" (dayNumber 1-7), even rest days — use "type":"rest" with an empty or near-empty classes array and a light todo like "Review this week's notes".
- classes[].type is one of: "video", "practice", "reading", "quiz", "rest".
- Total class duration for a day should roughly match the learner's daily study time.
- durationWeeks must never exceed ${MAX_WEEKS}.
- Always output the WHOLE plan (every week decided so far), never a partial diff — even when the learner only asked to tweak one part.
- Never include dates or clock times in the JSON — the learner sets their own daily completion time in the app.
- Talk to the learner in whichever language they write to you in, but keep resourceUrl/channel values exactly as found.
- Keep the prose outside the code fence brief (a few sentences) — the plan JSON itself carries the detail.`;
}

async function sendToClaude(plan, userText, {onStatus, onChunk} = {}){
  const apiKey = (state.settings.apiKey||"").trim();
  if(!apiKey) throw new Error("missing-api-key");

  plan.chat.push({role:"user", content:userText, ts:Date.now()});
  persistPlans();

  let apiMessages = plan.chat.map(m=>({role:m.role, content:m.content}));
  // Prompt caching: mark the message just before this turn's new user message as a
  // cache breakpoint. On every follow-up turn, everything up to and including it is
  // read from cache (~90% cheaper) instead of reprocessed at full price. Only kicks
  // in from the 2nd message onward, and only helps on models with a low-enough
  // minimum cacheable prefix (Opus 5 / Sonnet 5); it's a harmless no-op otherwise.
  if(apiMessages.length > 1){
    const idx = apiMessages.length - 2;
    const prior = apiMessages[idx];
    apiMessages[idx] = {role: prior.role, content: [{type:"text", text: prior.content, cache_control:{type:"ephemeral"}}]};
  }
  let fullText = "";
  let continuations = 0;
  let finalStopReason = null;

  while(true){
    const body = {
      model: state.settings.model || "claude-sonnet-5",
      max_tokens: 12000,
      stream: true,
      system: [{type:"text", text: buildSystemPrompt(plan), cache_control:{type:"ephemeral"}}],
      messages: apiMessages,
      tools: [
        {type:"web_search_20260209", name:"web_search", max_uses:3},
        {type:"web_fetch_20260209", name:"web_fetch", max_uses:2}
      ]
    };
    if(state.settings.effort) body.output_config = {effort: state.settings.effort};

    let resp;
    try{
      resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{
          "content-type":"application/json",
          "x-api-key": apiKey,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body: JSON.stringify(body)
      });
    }catch(networkErr){
      throw new Error("Network error reaching the Claude API. Check your connection.");
    }

    if(!resp.ok){
      let msg = `Request failed (HTTP ${resp.status})`;
      try{ const errBody = await resp.json(); if(errBody && errBody.error && errBody.error.message) msg = errBody.error.message; }catch(e){}
      if(resp.status===401) msg = "Invalid API key. Check it in Settings.";
      throw new Error(msg);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let turnText = "";

    readLoop:
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for(const part of parts){
        for(const line of part.split("\n")){
          if(!line.startsWith("data:")) continue;
          const jsonStr = line.slice(5).trim();
          if(!jsonStr) continue;
          let payload;
          try{ payload = JSON.parse(jsonStr); }catch(e){ continue; }

          if(payload.type === "content_block_start"){
            const cb = payload.content_block;
            if(cb && cb.type === "server_tool_use"){
              const q = (cb.input && (cb.input.query||cb.input.url)) || "the web";
              onStatus && onStatus(`${icon("search","ic-sm")} Researching: ${escapeHtml(q)}`);
            }
          } else if(payload.type === "content_block_delta"){
            if(payload.delta && payload.delta.type === "text_delta"){
              turnText += payload.delta.text;
              fullText += payload.delta.text;
              onChunk && onChunk(fullText);
            }
          } else if(payload.type === "message_delta"){
            if(payload.delta && payload.delta.stop_reason) finalStopReason = payload.delta.stop_reason;
          } else if(payload.type === "error"){
            throw new Error((payload.error && payload.error.message) || "Stream error");
          }
        }
      }
    }

    const hasOpenFence = fullText.includes("```cadence-plan");
    const fenceClosed = hasOpenFence && (fullText.split("```cadence-plan")[1]||"").includes("```");

    if(finalStopReason === "max_tokens" && (!hasOpenFence || !fenceClosed) && continuations < MAX_CONTINUATIONS){
      continuations++;
      apiMessages.push({role:"assistant", content: turnText});
      apiMessages.push({role:"user", content:"Continue exactly where you left off. Do not repeat any earlier text and do not restart the JSON — just continue the raw output so it can be concatenated with what you already wrote."});
      onStatus && onStatus(`${icon("pencil","ic-sm")} Plan is long — continuing (part ${continuations+1})…`);
      continue;
    }
    break;
  }

  plan.chat.push({role:"assistant", content: fullText, ts:Date.now()});
  persistPlans();

  const planData = extractPlanJSON(fullText);
  if(planData) applyPlanData(plan, planData);

  return {text: fullText, planUpdated: !!planData, stopReason: finalStopReason};
}

function fireNotification(title, body){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  try{ new Notification(title, {body}); }catch(e){}
}
function checkReminders(){
  if(!state.settings.notifEnabled) return;
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  const now = new Date();
  const todayStr = ymd(now);
  const fired = store.get("firedNotifs", {});
  let changed = false;

  state.plans.forEach(plan=>{
    (plan.weeks||[]).forEach(week=>{
      (week.days||[]).forEach(day=>{
        const dateStr = computeDateForDay(plan, week.weekNumber, day.dayNumber);
        if(dateStr !== todayStr) return;
        (day.classes||[]).forEach(cls=>{
          if(!cls.completionTime || cls.done) return;
          const [hh,mm] = cls.completionTime.split(":").map(Number);
          if(isNaN(hh)||isNaN(mm)) return;
          const target = new Date(now); target.setHours(hh,mm,0,0);
          const diffMin = (target - now)/60000;
          const key10 = `${plan.id}|${cls.id}|${dateStr}|10`;
          const key5  = `${plan.id}|${cls.id}|${dateStr}|5`;
          if(diffMin<=10.25 && diffMin>=9.25 && !fired[key10]){
            fireNotification("⏰ 10 minutes left", `"${cls.title}" (${plan.title}) is due to finish at ${cls.completionTime}.`);
            fired[key10]=true; changed=true;
          }
          if(diffMin<=5.25 && diffMin>=4.25 && !fired[key5]){
            fireNotification("⏰ 5 minutes left", `Wrap up "${cls.title}" (${plan.title}) — due ${cls.completionTime}.`);
            fired[key5]=true; changed=true;
          }
        });
      });
    });
  });
  if(changed) store.set("firedNotifs", fired);
  if(state.view === "today") renderView();
}
setInterval(checkReminders, 20000);

/* ============================================================
   Google Drive sync — data lives only in this browser unless the
   learner connects their own Google Drive. No server of ours is ever
   involved: this app talks to Google's APIs directly from the browser
   using an OAuth Client ID the learner creates for free themselves
   (just like their own Claude API key — we can't create that for them).
   One JSON file ("atlas-backup.json") in their own Drive is created and
   kept up to date; only files this app itself creates are ever touched
   (scope: drive.file), nothing else in their Drive is readable.
============================================================ */
const DRIVE_FILENAME = "atlas-backup.json";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
let driveAccessToken = null;
let driveTokenClient = null;

function ensureGisLoaded(cb){
  if(window.google && google.accounts && google.accounts.oauth2) return cb();
  const existing = document.getElementById("gisScript");
  if(existing){ existing.addEventListener("load", cb, {once:true}); return; }
  const s = document.createElement("script");
  s.id = "gisScript";
  s.src = "https://accounts.google.com/gsi/client";
  s.async = true; s.defer = true;
  s.onload = cb;
  s.onerror = ()=> toast("Couldn't reach Google's sign-in script. Check your connection.", "error");
  document.head.appendChild(s);
}

function driveClientId(){ return (state.settings.driveClientId||"").trim(); }

function requestDriveToken(interactive){
  return new Promise((resolve, reject)=>{
    const clientId = driveClientId();
    if(!clientId){ reject(new Error("Add your Google OAuth Client ID first.")); return; }
    ensureGisLoaded(()=>{
      try{
        driveTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: DRIVE_SCOPE,
          callback: (resp)=>{
            if(resp && resp.error){ reject(new Error(resp.error)); return; }
            driveAccessToken = resp.access_token;
            resolve(driveAccessToken);
          },
          error_callback: (err)=> reject(new Error((err && err.type) || "Google sign-in was cancelled or failed.")),
        });
        driveTokenClient.requestAccessToken({prompt: interactive ? "consent" : ""});
      }catch(e){ reject(e); }
    });
  });
}

async function ensureDriveToken(){
  if(driveAccessToken) return driveAccessToken;
  return requestDriveToken(false);
}

async function findOrCreateDriveFile(token){
  let fileId = state.settings.driveFileId;
  if(fileId){
    const check = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id,trashed`, {headers:{Authorization:`Bearer ${token}`}});
    if(check.ok){
      const j = await check.json();
      if(!j.trashed) return fileId;
    }
  }
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const searchResp = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {headers:{Authorization:`Bearer ${token}`}});
  if(searchResp.ok){
    const j = await searchResp.json();
    if(j.files && j.files.length){
      state.settings.driveFileId = j.files[0].id;
      persistSettings();
      return j.files[0].id;
    }
  }
  const createResp = await fetch("https://www.googleapis.com/drive/v3/files", {
    method:"POST",
    headers:{Authorization:`Bearer ${token}`, "Content-Type":"application/json"},
    body: JSON.stringify({name: DRIVE_FILENAME, mimeType:"application/json"})
  });
  if(!createResp.ok) throw new Error("Could not create the backup file in Drive.");
  const created = await createResp.json();
  state.settings.driveFileId = created.id;
  persistSettings();
  return created.id;
}

function currentBackupPayload(){
  return JSON.stringify({exportedAt: Date.now(), plans: state.plans}, null, 2);
}

// Per-plan last-write-wins merge, so opening Atlas on a second device picks up
// whatever changed elsewhere instead of silently overwriting it. Plans that exist
// on only one side are kept; plans on both sides keep whichever copy has the
// newer updatedAt. (Deleting a plan on one device can still have it reappear if
// another device syncs an older copy before seeing the deletion — acceptable for
// a single-user app; just delete it again.)
function mergePlansData(localPlans, drivePlans){
  const byId = new Map();
  (drivePlans||[]).forEach(p=>{ if(p && p.id) byId.set(p.id, p); });
  (localPlans||[]).forEach(p=>{
    if(!p || !p.id) return;
    const other = byId.get(p.id);
    if(!other || (p.updatedAt||0) >= (other.updatedAt||0)) byId.set(p.id, p);
  });
  return Array.from(byId.values());
}

async function syncToDrive(){
  if(!state.settings.driveConnected) return;
  try{
    const token = await ensureDriveToken();
    const fileId = await findOrCreateDriveFile(token);
    const resp = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method:"PATCH",
      headers:{Authorization:`Bearer ${token}`, "Content-Type":"application/json"},
      body: currentBackupPayload()
    });
    if(resp.ok){
      state.settings.driveLastSync = Date.now();
      persistSettings();
      if(state.view==="settings") renderView();
    }
  }catch(e){
    console.warn("Drive sync failed", e);
  }
}

async function connectDrive(){
  if(!driveClientId()){ toast("Paste your Google OAuth Client ID first.", "error"); return; }
  try{
    await requestDriveToken(true);
    state.settings.driveConnected = true;
    persistSettings();
    toast("Google Drive connected", "success");
    await syncToDrive();
    renderView();
  }catch(e){
    toast(e.message || "Could not connect to Google Drive.", "error");
  }
}

async function restoreFromDrive(){
  try{
    const token = await ensureDriveToken();
    const fileId = await findOrCreateDriveFile(token);
    const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {headers:{Authorization:`Bearer ${token}`}});
    if(!resp.ok) throw new Error("Could not read the Drive backup file.");
    const data = await resp.json();
    if(Array.isArray(data.plans)){
      state.plans = data.plans;
      store.set("plans", state.plans);
      toast("Restored from Google Drive", "success");
      renderView();
    } else {
      toast("That Drive file doesn't look like an Atlas backup.", "error");
    }
  }catch(e){
    toast(e.message || "Could not restore from Drive.", "error");
  }
}

// Runs once at startup when this browser was already connected to Drive. Tries a
// silent (non-interactive) token refresh — works if the user's still signed into
// Google in this browser, fails quietly on a brand-new device/profile (no popup,
// no error toast; they just click "Connect" in Settings once to link it). On
// success, merges Drive's copy into local storage so a plan edited on another
// device shows up here without any manual "Restore" click.
async function autoSyncFromDrive(){
  if(!state.settings.driveConnected) return;
  try{
    const token = await ensureDriveToken();
    const fileId = await findOrCreateDriveFile(token);
    const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {headers:{Authorization:`Bearer ${token}`}});
    if(!resp.ok) return;
    const data = await resp.json();
    if(!Array.isArray(data.plans)) return;
    const merged = mergePlansData(state.plans, data.plans);
    const changed = JSON.stringify(merged) !== JSON.stringify(state.plans);
    state.plans = merged;
    store.set("plans", state.plans);
    state.settings.driveLastSync = Date.now();
    persistSettings();
    if(changed){
      renderView();
      toast("Synced latest from Google Drive", "success");
    }
  }catch(e){
    console.warn("Auto-sync from Drive skipped", e);
  }
}

function disconnectDrive(){
  driveAccessToken = null;
  state.settings.driveConnected = false;
  persistSettings();
  toast("Disconnected from Google Drive (your Drive file is untouched)", "success");
  renderView();
}

function renderChat(container){
  const plan = activePlan();
  setTopbar("Chat", plan ? plan.title : "");

  if(!plan){
    container.innerHTML = `
      <div class="chat-empty">
        <div class="big-ic">${icon("compass","ic-xl")}</div>
        <h2>Design your first learning plan</h2>
        <p>Tell Atlas what you want to learn, in which language, and how much time you have. It'll search the web for real, free YouTube classes and build you a full routine — up to 3 months.</p>
        <button class="btn primary" id="btnEmptyNewPlan">${icon("plus","ic-sm")} Create a learning plan</button>
      </div>`;
    document.getElementById("btnEmptyNewPlan").onclick = openNewPlanModal;
    return;
  }

  const suggestions = [
    "Make it a bit more intensive, I have more free time on weekends.",
    "Swap week 2 to focus more on practice than videos.",
    "Regenerate the resources in Hindi instead.",
  ];

  container.innerHTML = `
    <div class="chat-wrap">
      <div class="chat-scroll" id="chatScroll">
        ${plan.chat.length ? plan.chat.map(renderMsg).join("") : `
          <div class="chat-empty">
            <div class="big-ic">${icon("sparkle","ic-xl")}</div>
            <h2>${escapeHtml(plan.title)}</h2>
            <p>Ready to build your ${plan.durationWeeks}-week ${LANGS[plan.language]||''} plan for <strong>${escapeHtml(plan.subject)}</strong>.</p>
            <button class="btn primary" id="btnGenerateNow">Generate the full plan</button>
          </div>`}
        <div id="streamTarget"></div>
      </div>
      <div class="chat-input-bar">
        <div class="chip-row" style="margin-bottom:10px;">
          ${plan.chat.length ? suggestions.map(s=>`<span class="chip" data-action="fill-suggestion" data-text="${escapeHtml(s)}" tabindex="0" role="button">${escapeHtml(s)}</span>`).join("") : ""}
        </div>
        <div class="chat-input-row">
          <textarea id="chatInput" placeholder="Ask Atlas to adjust your plan, add a topic, change language…" rows="1"></textarea>
          <button class="btn primary" id="btnSend">Send</button>
        </div>
        <div class="chat-hint">Enter to send · Shift+Enter for a new line</div>
      </div>
    </div>
  `;

  const scroll = document.getElementById("chatScroll");
  scroll.scrollTop = scroll.scrollHeight;

  const input = document.getElementById("chatInput");
  const btnSend = document.getElementById("btnSend");
  if(input){
    input.addEventListener("keydown", e=>{
      if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); doSend(); }
    });
    input.addEventListener("input", ()=>{ input.style.height="auto"; input.style.height=Math.min(160,input.scrollHeight)+"px"; });
  }
  if(btnSend) btnSend.onclick = doSend;
  const genBtn = document.getElementById("btnGenerateNow");
  if(genBtn) genBtn.onclick = ()=> runChatTurn(buildInitialMessage(plan));

  function doSend(){
    const text = input.value.trim();
    if(!text || state.sending) return;
    input.value=""; input.style.height="auto";
    runChatTurn(text);
  }
}

function renderMsg(m){
  const isUser = m.role === "user";
  return `
    <div class="msg ${isUser?'user':'assistant'}">
      <div class="avatar">${isUser?icon("user"):icon("compass")}</div>
      <div class="bubble">${isUser ? `<p>${escapeHtml(m.content)}</p>` : renderChatBubble(m.content)}</div>
    </div>`;
}

function buildInitialMessage(plan){
  const langLabel = LANGS[plan.language]||"English";
  let msg = `I want to learn "${plan.subject}" over ${plan.durationWeeks} week(s), studying about ${plan.dailyMinutes} minutes per day. My current level is ${plan.level}. Please use ${langLabel} language video resources.`;
  if(plan.daysOff && plan.daysOff.length) msg += ` I'd prefer to rest on: ${plan.daysOff.join(", ")}.`;
  msg += " Please research real free YouTube resources and design the full curriculum now.";
  return msg;
}

async function runChatTurn(userText){
  const plan = activePlan();
  if(!plan) return;
  if(!(state.settings.apiKey||"").trim()){
    toast("Add your Claude API key in Settings first.", "error");
    state.view = "settings"; renderView();
    return;
  }
  state.sending = true;
  const scroll = document.getElementById("chatScroll");

  // render the user's message immediately
  const userMsgHtml = renderMsg({role:"user", content:userText});
  document.getElementById("streamTarget").insertAdjacentHTML("beforebegin", userMsgHtml);

  const target = document.getElementById("streamTarget");
  target.innerHTML = `
    <div class="msg assistant" id="liveMsg">
      <div class="avatar">${icon("compass")}</div>
      <div class="bubble">
        <div class="status-line" id="liveStatus">${icon("sparkle","ic-sm")} Thinking <span class="dotpulse"><span></span><span></span><span></span></span></div>
        <div id="liveText"></div>
      </div>
    </div>`;
  scroll.scrollTop = scroll.scrollHeight;
  const liveText = document.getElementById("liveText");
  const liveStatus = document.getElementById("liveStatus");

  disableChatInput(true);
  try{
    const result = await sendToClaude(plan, userText, {
      onStatus: (s)=>{ liveStatus.innerHTML = s; },
      onChunk: (full)=>{ liveText.innerHTML = renderChatBubble(full); scroll.scrollTop = scroll.scrollHeight; }
    });
    if(result.planUpdated){
      toast("Learning plan updated", "success");
    }
    renderView(); // full re-render to reflect persisted state cleanly
    const scroll2 = document.getElementById("chatScroll");
    if(scroll2) scroll2.scrollTop = scroll2.scrollHeight;
  }catch(err){
    toast(err.message || "Something went wrong talking to Claude.", "error");
    liveStatus.innerHTML = "";
    liveText.innerHTML = `<p style="color:var(--danger); display:flex; align-items:center; gap:6px;">${icon("alert","ic-sm")} ${escapeHtml(err.message||"Request failed.")}</p>`;
  }finally{
    state.sending = false;
    disableChatInput(false);
  }
}
function disableChatInput(disabled){
  const i = document.getElementById("chatInput");
  const b = document.getElementById("btnSend");
  if(i) i.disabled = disabled;
  if(b) b.disabled = disabled;
}

// Builds the video slot for a lesson. Collapsed it's a lightweight facade (just a
// thumbnail — no YouTube JS loaded); once played it becomes a real <iframe> right
// inside the card, spanning its full width, and stays open across re-renders.
function ytEmbedSrc(yt, autoplay){
  const a = autoplay ? "1" : "0";
  return yt.kind === "playlist"
    ? `https://www.youtube-nocookie.com/embed/videoseries?list=${yt.id}&rel=0&autoplay=${a}`
    : `https://www.youtube-nocookie.com/embed/${yt.id}?rel=0&autoplay=${a}`;
}
function renderLessonMedia(plan, c, small){
  const yt = getYtEmbed(c);
  const canResolve = !yt && c.type === "video" && !!ytApiKey();
  if(!yt && !canResolve) return "";
  const attrs = `data-plan="${plan.id}" data-class="${c.id}"`;

  if(yt && state.inlineOpen.has(c.id)){
    return `
      <div class="lesson-media expanded" data-media="${c.id}">
        <div class="lesson-embed">
          <div class="frame">
            <iframe src="${ytEmbedSrc(yt, true)}" title="${escapeHtml(c.title)}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="lesson-embed-bar">
            <span>${yt.kind === "playlist" ? "Playlist" : "Now playing"}</span>
            <span class="lb-actions">
              <button data-action="focus-mode" ${attrs}>Focus mode</button>
              <button data-action="close-inline" ${attrs}>Close</button>
            </span>
          </div>
        </div>
      </div>`;
  }

  const label = canResolve ? `Find and play ${escapeHtml(c.title)}` : `Play ${escapeHtml(c.title)}`;
  let inner, extraCls = "", style = "";
  if(yt && yt.kind === "video"){
    style = ` style="background-image:url('https://img.youtube.com/vi/${yt.id}/hqdefault.jpg')"`;
    inner = `<span class="play-badge">${icon("play","ic-sm")}</span>`;
  } else if(yt){
    extraCls = " icon-only";
    inner = `${icon("playlist","ic-lg")}<span class="play-badge">${icon("play","ic-sm")}</span>`;
  } else {
    extraCls = " icon-only";
    inner = icon("search","ic-lg");
  }
  return `
    <div class="lesson-media${small?" sm":""}" data-media="${c.id}">
      <button class="lesson-facade${extraCls}" data-action="play-inline" ${attrs} aria-label="${label}"${style}>${inner}</button>
    </div>`;
}

// Subtle pointer-driven 3D tilt on feature cards. Skipped entirely for touch
// devices (no hover concept) and when the visitor's OS asks for reduced motion.
function attachTiltEffects(root){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(window.matchMedia && window.matchMedia("(hover: none)").matches) return;
  root.querySelectorAll(".featured-card").forEach(el=>{
    el.addEventListener("mousemove", e=>{
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = `perspective(1100px) rotateX(${(-py*5).toFixed(2)}deg) rotateY(${(px*5).toFixed(2)}deg) translate(-3px,-3px)`;
    });
    el.addEventListener("mouseleave", ()=>{ el.style.transform = ""; });
  });
}

function renderToday(container){
  setTopbar("Today", fmtDateNice(ymd(new Date())));
  const todayStr = ymd(new Date());
  const items = [];
  const todos = [];
  state.plans.forEach(plan=>{
    (plan.weeks||[]).forEach(week=>(week.days||[]).forEach(day=>{
      const dateStr = computeDateForDay(plan, week.weekNumber, day.dayNumber);
      if(dateStr !== todayStr) return;
      (day.classes||[]).forEach(c=>{ if(c.type!=="rest") items.push({plan, week, day, c}); });
      (day.todos||[]).forEach(t=> todos.push({plan, week, day, t}));
    }));
  });
  items.sort((a,b)=>{
    if(!a.c.completionTime) return 1;
    if(!b.c.completionTime) return -1;
    return a.c.completionTime.localeCompare(b.c.completionTime);
  });

  const notifBanner = (!("Notification" in window) || Notification.permission!=="granted" || !state.settings.notifEnabled)
    ? `<div class="card" style="margin-bottom:16px; border-color:var(--warn); display:flex; align-items:center; gap:6px;">${icon("bell","ic-sm")} Reminders are off. <button class="btn small" data-action="enable-notifs" style="margin-left:8px;">Enable notifications</button></div>`
    : "";

  container.innerHTML = `
    ${notifBanner}
    <h3 style="margin:0 0 10px;">Classes today</h3>
    <div class="today-list" style="margin-bottom:26px;">
      ${items.length ? items.map(it=>renderTodayClass(it)).join("") : `<div class="card" style="color:var(--ink-faint);">Nothing scheduled today. Enjoy the rest, or open a plan to add more.</div>`}
    </div>
    <h3 style="margin:0 0 10px;">To-dos today</h3>
    <div class="today-list">
      ${todos.length ? todos.map(it=>`
        <div class="card" style="display:flex; align-items:center; gap:10px; padding:12px 14px;">
          <input type="checkbox" class="chk" ${it.t.done?'checked':''} data-action="toggle-todo" data-plan="${it.plan.id}" data-week="${it.week.weekNumber}" data-day="${it.day.dayNumber}" data-todo="${it.t.id}">
          <span style="${it.t.done?'text-decoration:line-through;color:var(--ink-faint);':''}">${escapeHtml(it.t.text)}</span>
          <span class="badge" style="margin-left:auto;">${escapeHtml(it.plan.title)}</span>
        </div>`).join("") : `<div class="card" style="color:var(--ink-faint);">No to-dos for today.</div>`}
    </div>
  `;
}

function renderTodayClass(it){
  const {plan, c} = it;
  let countdown = "";
  if(c.completionTime && !c.done){
    const [hh,mm] = c.completionTime.split(":").map(Number);
    const now = new Date(); const target = new Date(); target.setHours(hh,mm,0,0);
    const diff = Math.round((target-now)/60000);
    if(diff > 0 && diff <= 15) countdown = `<span class="count-badge warn">in ${diff} min</span>`;
    else if(diff <= 0) countdown = `<span class="count-badge ok">due</span>`;
  }
  const media = renderLessonMedia(plan, c, true);
  const openExternal = (!media && c.resourceUrl)
    ? `<a class="btn small" href="${escapeHtml(c.resourceUrl)}" target="_blank" rel="noopener">Open ${icon("external","ic-sm")}</a>` : "";
  return `
    <div class="class-card" data-card="${c.id}">
      <input type="checkbox" class="chk" ${c.done?'checked':''} data-action="toggle-class-done" data-plan="${plan.id}" data-class="${c.id}" title="Mark done">
      ${media}
      <div class="cc-main">
        <div class="cc-title" ${c.done?'style="text-decoration:line-through; color:var(--ink-faint);"':''}>${escapeHtml(c.title)}</div>
        <div class="cc-meta">${escapeHtml(plan.title)} · ${c.durationMinutes} min ${c.channel? '· '+escapeHtml(c.channel):''}</div>
      </div>
      <div class="cc-controls">
        ${countdown}
        <input type="time" value="${c.completionTime||''}" data-action="set-completion" data-plan="${plan.id}" data-class="${c.id}">
        ${openExternal}
      </div>
    </div>`;
}

function requestNotifPermission(){
  if(!("Notification" in window)){ toast("Notifications aren't supported in this browser.", "error"); return; }
  Notification.requestPermission().then(perm=>{
    if(perm==="granted"){
      state.settings.notifEnabled = true; persistSettings();
      toast("Notifications enabled", "success");
    } else {
      toast("Notification permission was not granted.", "error");
    }
    renderView();
  });
}

function exportData(){
  const blob = new Blob([JSON.stringify({settings:{...state.settings, apiKey:""}, plans: state.plans}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `atlas-backup-${ymd(new Date())}.json`;
  a.click();
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(Array.isArray(data.plans)){
        state.plans = data.plans;
        persistPlans();
        toast("Data imported", "success");
        renderView();
      } else toast("That file doesn't look like an Atlas backup.", "error");
    }catch(err){ toast("Could not read that file.", "error"); }
  };
  reader.readAsText(file);
}
function clearAllData(){
  if(!confirm("This deletes all plans and settings from this browser. Continue?")) return;
  Object.keys(localStorage).filter(k=>k.startsWith(LS_PREFIX)).forEach(k=>localStorage.removeItem(k));
  state.plans = []; state.activePlanId = null;
  state.settings = {theme:"dark", apiKey:"", model:"claude-sonnet-5", effort:"medium", notifEnabled:false,
    driveClientId:DEFAULT_DRIVE_CLIENT_ID, driveConnected:false, driveFileId:null, driveLastSync:null, ytApiKey:""};
  driveAccessToken = null;
  state.view = "chat";
  applyTheme(); renderView();
  toast("All data cleared", "success");
}

function buildFeaturedPlan(pathId){
  const def = FEATURED_PATHS.find(p=>p.id===pathId);
  if(!def) return null;
  const weeks = [1,2].map(weekNumber=>({
    weekNumber,
    theme: def.weekThemes[weekNumber-1] || "",
    days: [1,2,3,4,5,6,7].map(dayNumber=>{
      const d = def.days[(weekNumber-1)*7 + (dayNumber-1)];
      if(!d || d.rest){
        return {dayNumber, classes:[{id:uid(), title:"Rest day", type:"rest", resourceUrl:"", channel:"", durationMinutes:0, notes:"", done:false, completionTime:null}], todos:[]};
      }
      return {
        dayNumber,
        classes: d.classes.map(c=>({
          id:uid(), title:c.title, type:c.type, resourceUrl:c.resourceUrl, channel:c.channel||"",
          durationMinutes:c.duration||def.dailyMinutes, notes:c.notes||"", done:false, completionTime:null
        })),
        todos: (d.todos||[]).map(t=>({id:uid(), text:t, done:false}))
      };
    })
  }));
  return {
    id: uid(), title: def.title, subject: def.subject, level: def.level, language:"en",
    durationWeeks:2, dailyMinutes: def.dailyMinutes, daysOff:[], startDate: ymd(new Date()),
    weeks, chat:[], createdAt: Date.now(), updatedAt: Date.now(),
  };
}

function addFeaturedPlan(pathId){
  const plan = buildFeaturedPlan(pathId);
  if(!plan){ toast("Couldn't find that path.", "error"); return; }
  state.plans.push(plan);
  state.activePlanId = plan.id;
  state.planDetailId = plan.id;
  state.view = "plans";
  persistPlans();
  renderView();
  toast(`Added "${plan.title}" to My Plans`, "success");
}
