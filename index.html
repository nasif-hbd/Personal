  </main>

</div>

<!-- Gradient used by the progress ring stroke; must exist in the document. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--accent)"/>
      <stop offset="100%" stop-color="var(--accent-2)"/>
    </linearGradient>
  </defs>
</svg>

<!-- Phone navigation. Eight tabs never fit a 390px header, and a horizontally
     scrolling strip hides half of them behind a gesture nobody discovers. The
     five most-used destinations get a thumb-reachable bar; the rest live one
     tap away in More. Hidden entirely above 720px. -->
<nav class="tabbar" id="tabbar" aria-label="Primary">

// Returns {kind:"video"|"playlist", id} for anything Mindora can actually embed, or
// null when the link is a channel page / search page / non-YouTube URL that can
// only be opened externally (or resolved on-demand via the YouTube Data API key).
// Resolution order for what plays inside the app:
//   1. a video already resolved via the YouTube Data API and cached on the class
//   2. the lesson's own resourceUrl, when it happens to be a YouTube link
//   3. altVideoUrl — a YouTube stand-in for lessons whose main resource can't be
//      embedded (Khan Academy, MIT OCW, edX and friends all forbid iframing)
// Anything flagged isAlt is surfaced as "alternative", with the primary resource
// still one click away, so the two never get confused for each other.
function getYtEmbed(c){
  if(!c || c.type === "rest") return null;
  if(c.resolvedYtId) return {kind:"video", id:c.resolvedYtId, isAlt:!!c.resolvedIsAlt, channel:c.resolvedIsAlt ? (c.altChannel||"") : (c.channel||"")};
  const primary = extractYouTubeEmbed(c.resourceUrl);
  if(primary) return Object.assign(primary, {isAlt:false, channel:c.channel||""});
  const alt = extractYouTubeEmbed(c.altVideoUrl);
  if(alt) return Object.assign(alt, {isAlt:true, channel:c.altChannel||""});
  return null;
}
function ytApiKey(){ return (state.settings.ytApiKey||"").trim(); }
async function resolveYouTubeVideoId(plan, c){
  const key = ytApiKey();
  if(!key) return null;
  const q = encodeURIComponent(`${c.title} ${c.channel||""}`.trim());
  const resp = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&q=${q}&key=${key}`);
  if(!resp.ok){
    if(resp.status === 403) throw new Error("YouTube API key was rejected (check its restrictions or daily quota).");
    throw new Error(`YouTube search failed (HTTP ${resp.status}).`);
  }
  const data = await resp.json();
  const item = data.items && data.items[0];
  const vid = item && item.id && item.id.videoId;
  if(!vid) return null;
  c.resolvedYtId = vid;
  // Anything we had to go find is an alternative to the lesson's own resource.
  c.resolvedIsAlt = true;
  if(item.snippet && item.snippet.channelTitle) c.altChannel = item.snippet.channelTitle;
  plan.updatedAt = Date.now();
  persistPlans();
  return vid;
}
function extractYouTubeEmbed(url){
  if(!url) return null;
  try{
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./,"").replace(/^m\./,"");
    if(host === "youtu.be"){
      const id = u.pathname.slice(1).split("/")[0];
      return id ? {kind:"video", id} : null;
    }
    if(host === "youtube.com" || host === "youtube-nocookie.com"){
      if(u.pathname === "/watch"){
        const v = u.searchParams.get("v");
        return v ? {kind:"video", id:v} : null;
      }
      if(u.pathname === "/playlist"){
        const list = u.searchParams.get("list");
        return list ? {kind:"playlist", id:list} : null;
      }
      const m = u.pathname.match(/^\/(embed|shorts|live)\/([^/?]+)/);
      if(m){
        if(m[2] === "videoseries"){
          const list = u.searchParams.get("list");
          return list ? {kind:"playlist", id:list} : null;
        }
        return {kind:"video", id:m[2]};
      }
    }
  }catch(e){}
  return null;
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============================================================
   Markdown-lite renderer (safe: escapes first)
============================================================ */
function inlineFormat(s){
  return s
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function blockFormat(escText){
  const lines = escText.split("\n");
  let html = "", inList = false;
  for(const raw of lines){
    const bullet = raw.match(/^\s*[-*]\s+(.*)/);
    if(bullet){
      if(!inList){ html += "<ul>"; inList = true; }
      html += `<li>${inlineFormat(bullet[1])}</li>`;
    } else {
      if(inList){ html += "</ul>"; inList = false; }
      if(raw.trim()==="") continue;
      html += `<p>${inlineFormat(raw)}</p>`;
    }
  }
  if(inList) html += "</ul>";
  return html;
}
function renderChatBubble(rawText){
  const fenceTag = "```cadence-plan";
  const idx = rawText.indexOf(fenceTag);
  let mainText = rawText, chip = "";
  if(idx !== -1){
    mainText = rawText.slice(0, idx);
    const after = rawText.slice(idx + fenceTag.length);
    const closed = after.includes("```");
    chip = closed
      ? `<div class="plan-chip" data-action="view-plan" tabindex="0" role="button">${icon("calendar","ic-sm")} <strong>Learning plan generated</strong> — click to view it</div>`
      : `<div class="plan-chip plan-chip-loading">${icon("hourglass","ic-sm")} Designing your curriculum <span class="dotpulse"><span></span><span></span><span></span></span></div>`;
  }
  return blockFormat(escapeHtml(mainText.trim())) + chip;
}

/* ============================================================
   Plan data helpers
============================================================ */
function computeDateForDay(plan, weekNumber, dayNumber){
  const offset = (weekNumber-1)*7 + (dayNumber-1);
  return ymd(addDays(plan.startDate, offset));
}
function planProgress(plan){
  let total=0, done=0;
  (plan.weeks||[]).forEach(w=>(w.days||[]).forEach(d=>(d.classes||[]).forEach(c=>{
    if(c.type==="rest") return;
    total++; if(c.done) done++;
  })));
  return total ? Math.round(done/total*100) : 0;
}
function classesScheduledOn(dateStr){
  const items = [];
  state.plans.forEach(plan=>{
    (plan.weeks||[]).forEach(week=>(week.days||[]).forEach(day=>{
      if(computeDateForDay(plan, week.weekNumber, day.dayNumber) !== dateStr) return;
      (day.classes||[]).forEach(c=>{ if(c.type!=="rest") items.push({plan, week, day, c}); });
    }));
  });
  return items;
}
function computeStreak(){
  let streak = 0;
  const cursor = new Date();
  for(let i=0;i<400;i++){
    const dateStr = ymd(cursor);
    const items = classesScheduledOn(dateStr);
    const allDone = items.length > 0 && items.every(it=>it.c.done);
    if(!allDone){
      if(i===0){ cursor.setDate(cursor.getDate()-1); continue; }
      break;
    }
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function completedThisWeek(){
  const today = new Date();
  let count = 0;
  for(let i=0;i<7;i++){
    const dateStr = ymd(addDays(ymd(today), -i));
    classesScheduledOn(dateStr).forEach(it=>{ if(it.c.done) count++; });
  }
  return count;
}
/* ============================================================
   Study system — notes, recall cards, scheduling

   All of it lives inside the plan object rather than a parallel collection,
   so the existing per-plan last-write-wins merge carries it to other devices
   for free. A second store key would have needed its own merge strategy, and
   two merge strategies is how data goes missing.

   Every accessor tolerates a missing field: plans saved before this existed
   are still loaded verbatim from localStorage and Drive.
============================================================ */

// --- timestamped notes ---------------------------------------------------
// A note can carry the video position it was written at. Clicking it seeks the
// player back to that second — the whole point of taking notes while watching.
function classNotes(c){ return (c && Array.isArray(c.userNotes)) ? c.userNotes : []; }

function addClassNote(planId, classId, text, atSeconds){
  const found = findClassAnywhere(classId);
  if(!found || !text.trim()) return null;
  const c = found.c;
  if(!Array.isArray(c.userNotes)) c.userNotes = [];
  const note = {
    id: uid(),
    text: text.trim(),
    // null rather than 0: "no timestamp" and "the very start" are different,
    // and 0 would render a misleading 0:00 jump link on a typed note.
    at: (typeof atSeconds === "number" && isFinite(atSeconds) && atSeconds > 0) ? Math.floor(atSeconds) : null,
    createdAt: Date.now(),
  };
  c.userNotes.push(note);
  const plan = found.plan || getPlan(planId);
  if(plan) plan.updatedAt = Date.now();
  persistPlans();
  return note;
}

function deleteClassNote(classId, noteId){
  const found = findClassAnywhere(classId);
  if(!found) return;
  found.c.userNotes = classNotes(found.c).filter(n=>n.id !== noteId);
  if(found.plan) found.plan.updatedAt = Date.now();
  persistPlans();
}

function fmtClock(seconds){
  const s = Math.max(0, Math.floor(seconds||0));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  const pad = (n)=>String(n).padStart(2,"0");
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
}

// Current position of a lesson's player, when one is open and reporting.
function playerSeconds(classId){
  const entry = inlinePlayers.get(classId);
  try{
    if(entry && entry.player && typeof entry.player.getCurrentTime === "function"){
      return entry.player.getCurrentTime() || 0;
    }
  }catch(e){}
  return 0;
}

function seekPlayer(classId, seconds){
  const entry = inlinePlayers.get(classId);
  try{
    if(entry && entry.player && typeof entry.player.seekTo === "function"){
      entry.player.seekTo(seconds, true);
      if(typeof entry.player.playVideo === "function") entry.player.playVideo();
      return true;
    }
  }catch(e){}
  return false;
}

// --- end-of-video quiz ---------------------------------------------------
// A lesson is not finished because the video reached the end — it is finished
// when the learner can answer questions about it. Below the pass mark the
// watch progress is wiped and the lesson has to be done again.
const QUIZ_PASS = 0.75;

/** Accept whatever the model produced and keep only well-formed questions. */
function normalizeQuiz(raw){
  if(!Array.isArray(raw)) return [];
  return raw.map(q=>{
    if(!q || typeof q !== "object") return null;
    const question = String(q.q || q.question || "").trim();
    const options = Array.isArray(q.options) ? q.options.map(o=>String(o).trim()).filter(Boolean) : [];
    const answer = Number(q.answer);
    // A question with no correct option among its choices is unanswerable, and
    // shipping one would lock a learner out of their own lesson forever.
    if(!question || options.length < 2 || !Number.isInteger(answer)) return null;
    if(answer < 0 || answer >= options.length) return null;
    return {id: q.id || uid(), q: question, options, answer};
  }).filter(Boolean);
}

/**
 * Write a quiz about one specific lesson, on demand.
 *
 * Plans built before quizzes existed have none, and a lesson with no
 * questions would simply complete itself — so the check gets generated the
 * moment the video ends, from that lesson's own title, channel and notes.
 * Deliberately a bare request rather than going through sendToClaude: this
 * must not appear in the learner's chat history.
 */
async function generateQuizFor(plan, c){
  const via = backendUrl();
  if(!via && !legacyKey()) throw new Error("AI isn't available in this app.");

  const brief = [
    `Lesson: ${c.title}`,
    c.channel ? `Source: ${c.channel}` : "",
    c.notes ? `Focus: ${c.notes}` : "",
    c.resourceUrl ? `URL: ${c.resourceUrl}` : "",
    `Subject: ${plan.subject || plan.title}`,
  ].filter(Boolean).join("\n");

  const system = `You write short comprehension checks for a learner who has just watched one video lesson.

Reply with NOTHING but a JSON array of exactly 4 questions:
[{"q":"...","options":["...","...","...","..."],"answer":0}]

- "answer" is the 0-based index of the correct option.
- Ask about the substance of the topic, not the video's packaging: never about its length, title wording, channel, or thumbnail.
- Wrong options must be plausible to someone who half-watched, never absurd.
- Keep each question answerable in one line and unambiguous — exactly one option is defensibly correct.`;

  const messages = [{role:"user", content:`Write the quiz for this lesson.\n\n${brief}`}];
  let text = "";

  if(via){
    const resp = await fetch(via + "/api/chat", {
      method:"POST",
      headers: Object.assign({"content-type":"application/json"}, backendHeaders()),
      // tools off: this is a closed-book writing task, and a web search would
      // add seconds to something the learner is waiting on.
      body: JSON.stringify({messages, system, model: state.settings.model, tools: false}),
    });
    rememberVisitorToken(resp);
    if(!resp.ok) throw new Error(`Server replied ${resp.status}`);
    text = await readSseText(resp);
  }else{
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{
        "content-type":"application/json", "x-api-key": legacyKey(),
        "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true",
      },
      body: JSON.stringify({model: state.settings.model, max_tokens: 1500, system, messages}),
    });
    if(!resp.ok) throw new Error(`Anthropic replied ${resp.status}`);
    const data = await resp.json();
    text = (data.content||[]).map(b=>b.text||"").join("");
  }

  const match = text.match(/\[[\s\S]*\]/);
  if(!match) throw new Error("The model didn't return a quiz.");
  const quiz = normalizeQuiz(JSON.parse(match[0]));
  if(quiz.length < 2) throw new Error("The quiz came back unusable.");

  c.quiz = quiz;
  plan.updatedAt = Date.now();
  persistPlans();
  return quiz;
}

/** Collect the text deltas out of an SSE response body. */
async function readSseText(resp){
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "", out = "";
  for(;;){
    const {done, value} = await reader.read();
    if(done) break;
    buffer += decoder.decode(value, {stream:true});
    const lines = buffer.split("\n");
    buffer = lines.pop();
    for(const line of lines){
      if(!line.startsWith("data:")) continue;
      try{
        const evt = JSON.parse(line.slice(5).trim());
        if(evt.type === "content_block_delta" && evt.delta && evt.delta.text) out += evt.delta.text;
      }catch(e){}
    }
  }
  return out;
}

function classQuiz(c){ return (c && Array.isArray(c.quiz)) ? c.quiz : []; }

/**
 * Should finishing this lesson go through a quiz first?
 *
 * Video lessons always do — that is the whole point, and one gets written on
 * the spot if none exists. Reading and practice lessons are self-evidencing
 * and complete normally, so ticking one never spends a Claude call.
 */
function needsQuizGate(c){
  if(!c || c.type === "rest" || c.done) return false;
  if(quizPending(c)) return true;
  // Gate on whether a video actually plays, not on c.type. "type" describes
  // the original resource — a Coursera or Khan page is "reading" — while the
  // lesson still plays a video through altVideoUrl. 94 of the 121 lessons in
  // the shipped paths are typed "reading" and nearly all of them play video,
  // so keying off the type skipped almost every quiz.
  return !!getYtEmbed(c) && !classQuiz(c).length && aiAvailable();
}

/**
 * Route a completion through its quiz. Returns true when it took over, so the
 * caller knows not to mark the lesson done itself.
 */
function gateOnQuiz(plan, c){
  if(!needsQuizGate(c)) return false;
  if(classQuiz(c).length) openQuizModal(plan.id, c.id);
  else startQuizAfterVideo(plan, c);
  return true;
}
function quizAttempts(c){ return (c && Array.isArray(c.quizAttempts)) ? c.quizAttempts : []; }
function bestQuizScore(c){
  return quizAttempts(c).reduce((best, a)=>Math.max(best, Number(a.score)||0), 0);
}
function quizPassed(c){ return classQuiz(c).length > 0 && bestQuizScore(c) >= QUIZ_PASS; }
/** True when this lesson still owes a passing quiz before it can be done. */
function quizPending(c){ return classQuiz(c).length > 0 && !quizPassed(c); }

/**
 * Grade a set of answers. Returns {score, correct, total, passed, wrong[]}.
 * Passing completes the lesson; failing clears watch progress, because
 * "do the task again" has to mean something the app can actually enforce.
 */
function submitQuiz(planId, classId, answers){
  const found = findClassAnywhere(classId);
  if(!found) return null;
  const {plan, c} = found;
  const questions = classQuiz(c);
  if(!questions.length) return null;

  const wrong = [];
  let correct = 0;
  questions.forEach((q, i)=>{
    if(answers[i] === q.answer) correct++;
    else wrong.push(i);
  });
  const score = correct / questions.length;
  const passed = score >= QUIZ_PASS;

  if(!Array.isArray(c.quizAttempts)) c.quizAttempts = [];
  c.quizAttempts.push({at: Date.now(), score, correct, total: questions.length, passed});

  if(passed){
    c.done = true;
    c.doneAt = Date.now();
    c.watchPct = 1;
  }else{
    c.done = false;
    c.doneAt = null;
    // Back to the start: the lesson has to be watched again, not just retried.
    c.watchPct = 0;
  }
  plan.updatedAt = Date.now();
  persistPlans();
  return {score, correct, total: questions.length, passed, wrong};
}

function addQuizQuestion(planId, classId, question){
  const found = findClassAnywhere(classId);
  if(!found) return false;
  const clean = normalizeQuiz([question]);
  if(!clean.length) return false;
  if(!Array.isArray(found.c.quiz)) found.c.quiz = [];
  found.c.quiz.push(clean[0]);
  found.plan.updatedAt = Date.now();
  persistPlans();
  return true;
}

function deleteQuizQuestion(classId, questionId){
  const found = findClassAnywhere(classId);
  if(!found) return;
  found.c.quiz = classQuiz(found.c).filter(q=>q.id !== questionId);
  found.plan.updatedAt = Date.now();
  persistPlans();
}

// --- recall cards (SM-2) -------------------------------------------------
// A trimmed SuperMemo-2: the scheduling that made spaced repetition work, with
// the four-button grading people actually understand.
const CARD_START_EASE = 2.5;
const CARD_MIN_EASE = 1.3;

function planCards(plan){ return (plan && Array.isArray(plan.cards)) ? plan.cards : []; }
function allCards(){
  return state.plans.flatMap(p => planCards(p).map(card => ({card, plan:p})));
}
function cardsDue(now){
  const at = now || Date.now();
  return allCards().filter(({card}) => (card.due||0) <= at);
}

function addCard(planId, {front, back, classId}){
  const plan = getPlan(planId);
  if(!plan || !front.trim() || !back.trim()) return null;
  if(!Array.isArray(plan.cards)) plan.cards = [];
  const card = {
    id: uid(), classId: classId||null,
    front: front.trim(), back: back.trim(),
    // Due immediately: a card you just made is one you have not yet recalled.
    due: Date.now(), interval: 0, ease: CARD_START_EASE,
    reps: 0, lapses: 0, createdAt: Date.now(), lastReviewed: null,
  };
  plan.cards.push(card);
  plan.updatedAt = Date.now();
  persistPlans();
  return card;
}

function deleteCard(planId, cardId){
  const plan = getPlan(planId);
  if(!plan) return;
  plan.cards = planCards(plan).filter(c=>c.id !== cardId);
  plan.updatedAt = Date.now();
  persistPlans();
}

/**
 * Grade a card. quality: 0 again, 1 hard, 2 good, 3 easy.
 *
 * SM-2 proper takes 0–5; this maps the four buttons people can actually judge
 * onto that curve. "Again" resets the interval but only dents the ease factor,
 * so one bad day doesn't permanently bury a card you know.
 */
function gradeCard(planId, cardId, quality){
  const plan = getPlan(planId);
  if(!plan) return null;
  const card = planCards(plan).find(c=>c.id === cardId);
  if(!card) return null;

  const DAY = 86400000;
  if(quality === 0){
    card.lapses = (card.lapses||0) + 1;
    card.reps = 0;
    card.interval = 0;
    card.ease = Math.max(CARD_MIN_EASE, (card.ease||CARD_START_EASE) - 0.2);
    card.due = Date.now() + 60000;          // back in a minute, same session
  }else{
    const adjust = {1:-0.15, 2:0, 3:0.15}[quality] || 0;
    card.ease = Math.max(CARD_MIN_EASE, (card.ease||CARD_START_EASE) + adjust);
    card.reps = (card.reps||0) + 1;
    if(card.reps === 1)      card.interval = quality === 1 ? 1 : quality === 3 ? 4 : 1;
    else if(card.reps === 2) card.interval = quality === 1 ? 3 : quality === 3 ? 8 : 6;
    else                     card.interval = Math.round((card.interval||1) * card.ease * (quality===1 ? 0.6 : quality===3 ? 1.3 : 1));
    card.interval = Math.max(1, Math.min(365, card.interval));
    card.due = Date.now() + card.interval * DAY;
  }
  card.lastReviewed = Date.now();
  plan.updatedAt = Date.now();
  persistPlans();
  return card;
}

// --- catch-up rescheduling ----------------------------------------------
/**
 * Count days whose lessons are unfinished and already in the past.
 * Falling behind is the normal reason people abandon a plan, so the app needs
 * to name it rather than silently accumulate a wall of red.
 */
function overdueDays(plan){
  const today = ymd(new Date());
  const out = [];
  (plan.weeks||[]).forEach(w=>(w.days||[]).forEach(d=>{
    const date = computeDateForDay(plan, w.weekNumber, d.dayNumber);
    if(date >= today) return;
    const real = (d.classes||[]).filter(c=>c.type !== "rest");
    if(real.length && !real.every(c=>c.done)) out.push({week:w.weekNumber, day:d.dayNumber, date});
  }));
  return out;
}

/**
 * Shift the plan's start date forward so the first unfinished day lands today.
 * Nothing is deleted and no progress is lost — every date is derived from
 * startDate, so moving it moves the whole remaining schedule together.
 */
function catchUpPlan(planId){
  const plan = getPlan(planId);
  if(!plan) return 0;
  const behind = overdueDays(plan);
  if(!behind.length) return 0;
  const first = behind[0];
  const offset = (plan.weeks.findIndex(w=>w.weekNumber===first.week)) * 7 + (first.day - 1);
  const newStart = ymd(addDays(ymd(new Date()), -offset));
  const shifted = Math.round((new Date(newStart) - new Date(plan.startDate)) / 86400000);
  plan.startDate = newStart;
  plan.updatedAt = Date.now();
  persistPlans();
  return shifted;
}

// --- calendar export -----------------------------------------------------
/**
 * A plan as an .ics file, so lessons land in whatever calendar someone already
 * lives in. All-day events keep it timezone-proof: a fixed clock time would be
 * wrong for anyone who travels, and the plan has no time-of-day anyway.
 */
function planToICS(plan){
  const stamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0] + "Z";
  const esc = (s)=>String(s||"").replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\r?\n/g,"\\n");
  // RFC 5545 caps lines at 75 octets; longer ones continue with a leading space.
  const fold = (line)=>line.match(/.{1,73}/g).join("\r\n ");

  const events = [];
  (plan.weeks||[]).forEach(w=>(w.days||[]).forEach(d=>{
    const real = (d.classes||[]).filter(c=>c.type !== "rest");
    if(!real.length) return;
    const date = computeDateForDay(plan, w.weekNumber, d.dayNumber).replace(/-/g,"");
    const end = ymd(addDays(computeDateForDay(plan, w.weekNumber, d.dayNumber), 1)).replace(/-/g,"");
    const titles = real.map(c=>c.title).join(" · ");
    const body = real.map(c=>`${c.title}${c.durationMinutes?` (${c.durationMinutes} min)`:""}${c.resourceUrl?`\n${c.resourceUrl}`:""}`).join("\n\n");
    events.push([
      "BEGIN:VEVENT",
      `UID:${plan.id}-${w.weekNumber}-${d.dayNumber}@mindora`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${date}`,
      `DTEND;VALUE=DATE:${end}`,
      fold(`SUMMARY:${esc(plan.title)} — Day ${(w.weekNumber-1)*7 + d.dayNumber}`),
      fold(`DESCRIPTION:${esc(body)}`),
      fold(`X-MINDORA-LESSONS:${esc(titles)}`),
      "END:VEVENT",
    ].join("\r\n"));
  }));

  return [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mindora//Learning Plan//EN",
    "CALSCALE:GREGORIAN","METHOD:PUBLISH",
    fold(`X-WR-CALNAME:${esc(plan.title)}`),
    ...events, "END:VCALENDAR",
  ].join("\r\n");
}

function downloadICS(planId){
  const plan = getPlan(planId);
  if(!plan) return;
  const blob = new Blob([planToICS(plan)], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${plan.title.replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").toLowerCase()||"mindora-plan"}.ics`;
  a.click();
  URL.revokeObjectURL(url);
  toast("Calendar file downloaded — open it to add the plan.", "success");
}

// --- statistics ----------------------------------------------------------
/** Completions per day for the last `days` days, oldest first. */
function activityHistory(days){
  const counts = new Map();
  state.plans.forEach(plan=>(plan.weeks||[]).forEach(w=>(w.days||[]).forEach(d=>{
    (d.classes||[]).forEach(c=>{
      if(!c.done) return;
      // doneAt is when it was actually ticked. Plans finished before that field
      // existed fall back to the day the lesson was scheduled for, so the chart
      // still says something true rather than nothing.
      const when = c.doneAt
        ? ymd(new Date(c.doneAt))
        : computeDateForDay(plan, w.weekNumber, d.dayNumber);
      counts.set(when, (counts.get(when)||0) + 1);
    });
  })));
  const today = ymd(new Date());
  return Array.from({length: days}, (_, i) => {
    const date = ymd(addDays(today, -(days - 1 - i)));
    return {date, count: counts.get(date) || 0};
  });
}

function studyStats(){
  let done = 0, total = 0, minutes = 0, watchedMinutes = 0;
  state.plans.forEach(plan=>(plan.weeks||[]).forEach(w=>(w.days||[]).forEach(d=>{
    (d.classes||[]).forEach(c=>{
      if(c.type === "rest") return;
      total++;
      if(c.done){ done++; minutes += c.durationMinutes||0; }
      watchedMinutes += (c.durationMinutes||0) * watchPct(c);
    });
  })));
  const bySubject = new Map();
  state.plans.forEach(plan=>{
    const key = plan.subject || plan.title || "Other";
    const p = planProgress(plan);
    const entry = bySubject.get(key) || {subject:key, done:0, total:0};
    entry.done += p.done; entry.total += p.total;
    bySubject.set(key, entry);
  });
  return {
    done, total, minutes,
    watchedMinutes: Math.round(watchedMinutes),
    streak: computeStreak(),
    thisWeek: completedThisWeek(),
    cards: allCards().length,
    dueCards: cardsDue().length,
    notes: state.plans.reduce((n,plan)=>n + (plan.weeks||[]).reduce((m,w)=>m + (w.days||[]).reduce((k,d)=>
      k + (d.classes||[]).reduce((j,c)=>j + classNotes(c).length, 0), 0), 0), 0),
    bySubject: Array.from(bySubject.values()).sort((a,b)=>b.total-a.total),
  };
}

function extractPlanJSON(text){
  const re = /```cadence-plan\s*([\s\S]*?)```/g;
  let m, last=null;
  while((m = re.exec(text))) last = m[1];
  if(!last) return null;
  const raw = last.trim();
  try{ return JSON.parse(raw); }
  catch(e){
    try{ return JSON.parse(raw.replace(/,(\s*[}\]])/g, "$1")); }
    catch(e2){ return null; }
  }
}
function applyPlanData(plan, data){
  // Carry per-lesson progress across a regeneration. Matching on title alone
  // loses everything the moment a lesson is renamed — by hand or by Claude —
  // so fall back to the slot it occupied.
  const oldClassIdx = {}, oldClassSlot = {}, oldTodoIdx = {};
  (plan.weeks||[]).forEach(w=>(w.days||[]).forEach(d=>{
    (d.classes||[]).forEach((c,i)=>{
      oldClassIdx[`${w.weekNumber}|${d.dayNumber}|${c.title}`] = c;
      oldClassSlot[`${w.weekNumber}|${d.dayNumber}|#${i}`] = c;
    });
    (d.todos||[]).forEach(t=>{ oldTodoIdx[`${w.weekNumber}|${d.dayNumber}|${t.text}`] = t; });
  }));

  plan.title = data.title || plan.title;
  plan.subject = data.subject || plan.subject;
  plan.language = data.language || plan.language;
  plan.durationWeeks = Math.min(MAX_WEEKS, Number(data.durationWeeks)||plan.durationWeeks);
  plan.dailyMinutes = Number(data.dailyMinutes)||plan.dailyMinutes;

  plan.weeks = (data.weeks||[]).slice(0, MAX_WEEKS).map(w=>({
    weekNumber: Number(w.weekNumber)||1,
    theme: w.theme || "",
    days: (w.days||[]).slice(0,7).map(d=>({
      dayNumber: Number(d.dayNumber)||1,
      classes: (d.classes||[]).map((c,i)=>{
        const old = oldClassIdx[`${w.weekNumber}|${d.dayNumber}|${c.title}`]
                 || oldClassSlot[`${w.weekNumber}|${d.dayNumber}|#${i}`];
        return {
          id: (old && old.id) || uid(),
          title: c.title || "Untitled class",
          type: c.type || "video",
          resourceUrl: c.resourceUrl || "",
          channel: c.channel || "",
          altVideoUrl: c.altVideoUrl || "",
          altChannel: c.altChannel || "",
          durationMinutes: Number(c.durationMinutes)||plan.dailyMinutes,
          notes: c.notes || "",
          done: (old && old.done) || false,
          completionTime: (old && old.completionTime) || null,
          // Keep any video we already looked up, so regenerating a plan doesn't
          // spend YouTube quota re-finding the same clip.
          resolvedYtId: (old && old.resolvedYtId) || null,
          resolvedIsAlt: (old && old.resolvedIsAlt) || false,
          // Keep the questions the model just wrote, but never discard a
          // learner's own edits or their attempt history by regenerating.
          quiz: normalizeQuiz(c.quiz) .length ? normalizeQuiz(c.quiz) : ((old && old.quiz) || []),
          quizAttempts: (old && old.quizAttempts) || [],
          userNotes: (old && old.userNotes) || [],
          watchPct: (old && old.watchPct) || 0,
          doneAt: (old && old.doneAt) || null,
        };
      }),
      todos: (d.todos||[]).map(t=>{
        const old = oldTodoIdx[`${w.weekNumber}|${d.dayNumber}|${t.text}`];
        return { id:(old && old.id)||uid(), text: t.text||"", done:(old && old.done)||false };
      })
    }))
  }));
  plan.updatedAt = Date.now();
  persistPlans();
}

/* ============================================================
   Claude API — system prompt, streaming call, continuation loop
============================================================ */
function buildSystemPrompt(plan){
  const langLabel = LANGS[plan.language] || "English";
  return `You are Mindora, an expert personal learning coach and curriculum designer helping one learner build a real, achievable self-study plan.

LEARNER CONTEXT
- Subject / goal: ${plan.subject}
- Content language for resources: ${langLabel}
- Current level: ${plan.level}
- Duration: ${plan.durationWeeks} week(s) (hard max ${MAX_WEEKS} weeks, ~6 months)
- Daily study time available: ${plan.dailyMinutes} minutes
- Rest days per week: ${(plan.daysOff&&plan.daysOff.length) ? plan.daysOff.join(", ") : "none specified, use your judgement"}
- Today's date: ${ymd(new Date())}

RESEARCH REQUIREMENT
Use the web_search and web_fetch tools to find REAL, currently available, FREE YouTube videos that teach this subject in ${langLabel}. Prefer well-known, reputable educators/channels for that language and subject.
- Every "video" class's resourceUrl MUST be a link to one specific, individual YouTube video (a real youtube.com/watch?v=... or youtu.be/... URL for one exact video) — NEVER a channel homepage, a playlist page, a search-results URL, or an instruction like "search this channel for X". The app embeds this exact URL as a video player, so it must point straight at one playable video.
- Never invent a URL — every resourceUrl must come from an actual search result you found this conversation, and should be plausible as a real, currently-playable video (use web_fetch to spot-check ones you're unsure of).
- If you cannot find a strong specific-video match for a day, pick the single best real individual video you did find (even if imperfect) rather than falling back to a channel or a "search for" note — a specific video is always required for type "video".

OUTPUT FORMAT
Once you have enough information (ask brief clarifying questions first if something important is missing), respond with a short friendly note OUTSIDE any code fence, then ALWAYS append the FULL current plan as one single fenced block starting with \`\`\`cadence-plan and ending with \`\`\`, containing STRICT JSON (no comments, no trailing commas) in exactly this shape:

\`\`\`cadence-plan
{
  "title": "short plan title",
  "subject": "${plan.subject}",
  "language": "${plan.language}",
  "durationWeeks": ${plan.durationWeeks},
  "dailyMinutes": ${plan.dailyMinutes},
  "weeks": [
    {
      "weekNumber": 1,
      "theme": "what this week focuses on",
      "days": [
        {
          "dayNumber": 1,
          "classes": [
            {
              "title": "class / video title",
              "type": "video",
              "resourceUrl": "https://www.youtube.com/watch?v=...",
              "channel": "channel name",
              "altVideoUrl": "https://www.youtube.com/watch?v=... (a YouTube stand-in when resourceUrl can't be embedded)",
              "altChannel": "channel name for altVideoUrl",
              "durationMinutes": 30,
              "notes": "what to do / focus on",
              "quiz": [
                {
                  "q": "a question answerable only by someone who actually watched",
                  "options": ["option A", "option B", "option C", "option D"],
                  "answer": 0
                }
              ]
            }
          ],
          "todos": [ { "text": "short actionable todo for the day" } ]
        }
      ]
    }
  ]
}
\`\`\`

RULES FOR THE JSON
- Every week object must contain exactly 7 entries in "days" (dayNumber 1-7), even rest days — use "type":"rest" with an empty or near-empty classes array and a light todo like "Review this week's notes".
- classes[].type is one of: "video", "practice", "reading", "quiz", "rest".
- EVERY non-rest class must be watchable inside the app. Whenever resourceUrl is NOT an embeddable YouTube link — i.e. it points at Khan Academy, MIT OCW, edX, Coursera, freeCodeCamp, British Council, a YouTube channel page, or a search page, none of which allow iframing — also set "altVideoUrl" to a real, specific YouTube video or playlist covering the same topic (plus "altChannel"). Same sourcing rule as resourceUrl: it must come from an actual search result, never invented. Omit altVideoUrl only when resourceUrl is already an embeddable YouTube video/playlist.
- Give every non-rest class a "quiz" of 4 multiple-choice questions, each with 4 options and "answer" as the 0-based index of the correct one. Write them so only someone who actually watched can answer — test what was explained, not what could be guessed from the title. Keep the wrong options plausible rather than silly. The learner must score ${Math.round(QUIZ_PASS*100)}% to complete the lesson, so pitch the difficulty at genuine understanding, not trivia or exact wording.
- Total class duration for a day should roughly match the learner's daily study time.
- durationWeeks must never exceed ${MAX_WEEKS}.
- Always output the WHOLE plan (every week decided so far), never a partial diff — even when the learner only asked to tweak one part.
- Never include dates or clock times in the JSON — the learner sets their own daily completion time in the app.
- Talk to the learner in whichever language they write to you in, but keep resourceUrl/channel values exactly as found.
- Keep the prose outside the code fence brief (a few sentences) — the plan JSON itself carries the detail.`;
}

async function sendToClaude(plan, userText, {onStatus, onChunk} = {}){
  const apiKey = legacyKey();
  // The server holds the key in shared mode; visitors never supply one.
  if(!aiAvailable()) throw new Error("AI features aren't switched on for this app yet.");

  plan.chat.push({role:"user", content:userText, ts:Date.now()});
  persistPlans();

  let apiMessages = plan.chat.map(m=>({role:m.role, content:m.content}));
  // Prompt caching: mark the message just before this turn's new user message as a
  // cache breakpoint. On every follow-up turn, everything up to and including it is
  // read from cache (~90% cheaper) instead of reprocessed at full price. Only kicks
  // in from the 2nd message onward, and only helps on models with a low-enough
  // minimum cacheable prefix (Opus 5 / Sonnet 5); it's a harmless no-op otherwise.
  if(apiMessages.length > 1){
    const idx = apiMessages.length - 2;
    const prior = apiMessages[idx];
    apiMessages[idx] = {role: prior.role, content: [{type:"text", text: prior.content, cache_control:{type:"ephemeral"}}]};
  }
  let fullText = "";
  let continuations = 0;
  let finalStopReason = null;

  while(true){
    const body = {
      model: state.settings.model || "claude-sonnet-5",
      max_tokens: 12000,
      stream: true,
      system: [{type:"text", text: buildSystemPrompt(plan), cache_control:{type:"ephemeral"}}],
      messages: apiMessages,
      tools: [
        {type:"web_search_20260209", name:"web_search", max_uses:3},
        {type:"web_fetch_20260209", name:"web_fetch", max_uses:2}
      ]
    };
    if(state.settings.effort) body.output_config = {effort: state.settings.effort};

    let resp;
    const via = backendUrl();
    try{
      if(via){
        // Shared mode: the server injects the owner's key and enforces caps.
        resp = await fetch(via + "/api/chat", {
          method:"POST",
          headers: Object.assign({"content-type":"application/json"}, backendHeaders()),
          body: JSON.stringify({
            messages: apiMessages,
            system: body.system,
            model: state.settings.model,
            effort: state.settings.effort || null,
          })
        });
        rememberVisitorToken(resp);
      } else {
        resp = await fetch("https://api.anthropic.com/v1/messages", {
          method:"POST",
          headers:{
            "content-type":"application/json",
            "x-api-key": apiKey,
            "anthropic-version":"2023-06-01",
            "anthropic-dangerous-direct-browser-access":"true"
          },
          body: JSON.stringify(body)
        });
      }
    }catch(networkErr){
      throw new Error(via
        ? "Couldn't reach the Mindora server. It may be asleep or offline."
        : "Network error reaching the Claude API. Check your connection.");
    }

    if(!resp.ok){
      let msg = `Request failed (HTTP ${resp.status})`;
      try{ const errBody = await resp.json(); if(errBody && errBody.error && errBody.error.message) msg = errBody.error.message; }catch(e){}
      if(resp.status===401) msg = backendUrl()
        ? "This app's AI access was rejected by the server."
        : "AI credentials were rejected.";
      if(resp.status===402){
        // The subscription lapsed or ran out mid-session. Re-read the real
        // status from the server rather than guessing, then show the paywall.
        await refreshEntitlement();
        state.sending = false;
        state.view = "upgrade";
        renderView();
        toast(msg, "error");
        return;
      }
      throw new Error(msg);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let turnText = "";

    readLoop:
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for(const part of parts){
        for(const line of part.split("\n")){
          if(!line.startsWith("data:")) continue;
          const jsonStr = line.slice(5).trim();
          if(!jsonStr) continue;
          let payload;
          try{ payload = JSON.parse(jsonStr); }catch(e){ continue; }

          if(payload.type === "content_block_start"){
            const cb = payload.content_block;
            if(cb && cb.type === "server_tool_use"){
              const q = (cb.input && (cb.input.query||cb.input.url)) || "the web";
              onStatus && onStatus(`${icon("search","ic-sm")} Researching: ${escapeHtml(q)}`);
            }
          } else if(payload.type === "content_block_delta"){
            if(payload.delta && payload.delta.type === "text_delta"){
              turnText += payload.delta.text;
              fullText += payload.delta.text;
              onChunk && onChunk(fullText);
            }
          } else if(payload.type === "message_delta"){
            if(payload.delta && payload.delta.stop_reason) finalStopReason = payload.delta.stop_reason;
          } else if(payload.type === "error"){
            throw new Error((payload.error && payload.error.message) || "Stream error");
          }
        }
      }
    }

    const hasOpenFence = fullText.includes("```cadence-plan");
    const fenceClosed = hasOpenFence && (fullText.split("```cadence-plan")[1]||"").includes("```");

    if(finalStopReason === "max_tokens" && (!hasOpenFence || !fenceClosed) && continuations < MAX_CONTINUATIONS){
      continuations++;
      apiMessages.push({role:"assistant", content: turnText});
      apiMessages.push({role:"user", content:"Continue exactly where you left off. Do not repeat any earlier text and do not restart the JSON — just continue the raw output so it can be concatenated with what you already wrote."});
      onStatus && onStatus(`${icon("pencil","ic-sm")} Plan is long — continuing (part ${continuations+1})…`);
      continue;
    }
    break;
  }

  plan.chat.push({role:"assistant", content: fullText, ts:Date.now()});
  persistPlans();

  const planData = extractPlanJSON(fullText);
  if(planData) applyPlanData(plan, planData);

  return {text: fullText, planUpdated: !!planData, stopReason: finalStopReason};
}

function fireNotification(title, body){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  try{ new Notification(title, {body}); }catch(e){}
}
function checkReminders(){
  if(!state.settings.notifEnabled) return;
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  const now = new Date();
  const todayStr = ymd(now);
  const fired = store.get("firedNotifs", {});
  let changed = false;

  state.plans.forEach(plan=>{
    (plan.weeks||[]).forEach(week=>{
      (week.days||[]).forEach(day=>{
        const dateStr = computeDateForDay(plan, week.weekNumber, day.dayNumber);
        if(dateStr !== todayStr) return;
        (day.classes||[]).forEach(cls=>{
          if(!cls.completionTime || cls.done) return;
          const [hh,mm] = cls.completionTime.split(":").map(Number);
          if(isNaN(hh)||isNaN(mm)) return;
          const target = new Date(now); target.setHours(hh,mm,0,0);
          const diffMin = (target - now)/60000;
          const key10 = `${plan.id}|${cls.id}|${dateStr}|10`;
          const key5  = `${plan.id}|${cls.id}|${dateStr}|5`;
          if(diffMin<=10.25 && diffMin>=9.25 && !fired[key10]){
            fireNotification("⏰ 10 minutes left", `"${cls.title}" (${plan.title}) is due to finish at ${cls.completionTime}.`);
            fired[key10]=true; changed=true;
          }
          if(diffMin<=5.25 && diffMin>=4.25 && !fired[key5]){
            fireNotification("⏰ 5 minutes left", `Wrap up "${cls.title}" (${plan.title}) — due ${cls.completionTime}.`);
            fired[key5]=true; changed=true;
          }
        });
      });
    });
  });
  if(changed) store.set("firedNotifs", fired);
  if(state.view === "today") renderView();
}
setInterval(checkReminders, 20000);

/* ============================================================
   Google Drive sync — data lives only in this browser unless the
   learner connects their own Google Drive. No server of ours is ever
   involved: this app talks to Google's APIs directly from the browser
   using an OAuth Client ID the learner creates for free themselves
   (just like their own Claude API key — we can't create that for them).
   One JSON file ("atlas-backup.json") in their own Drive is created and
   kept up to date; only files this app itself creates are ever touched
   (scope: drive.file), nothing else in their Drive is readable.
============================================================ */
const DRIVE_FILENAME = "atlas-backup.json";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
let driveAccessToken = null;
let driveTokenClient = null;

function ensureGisLoaded(cb){
  if(window.google && google.accounts && google.accounts.oauth2) return cb();
  const existing = document.getElementById("gisScript");
  if(existing){ existing.addEventListener("load", cb, {once:true}); return; }
  const s = document.createElement("script");
  s.id = "gisScript";
  s.src = "https://accounts.google.com/gsi/client";
  s.async = true; s.defer = true;
  s.onload = cb;
  s.onerror = ()=> toast("Couldn't reach Google's sign-in script. Check your connection.", "error");
  document.head.appendChild(s);
}

function driveClientId(){ return (state.settings.driveClientId||"").trim(); }

function requestDriveToken(interactive){
  return new Promise((resolve, reject)=>{
    const clientId = driveClientId();
    if(!clientId){ reject(new Error("Add your Google OAuth Client ID first.")); return; }
    ensureGisLoaded(()=>{
      try{
        driveTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: DRIVE_SCOPE,
          callback: (resp)=>{
            if(resp && resp.error){ reject(new Error(resp.error)); return; }
            driveAccessToken = resp.access_token;
            resolve(driveAccessToken);
          },
          error_callback: (err)=> reject(new Error((err && err.type) || "Google sign-in was cancelled or failed.")),
        });
        driveTokenClient.requestAccessToken({prompt: interactive ? "consent" : ""});
      }catch(e){ reject(e); }
    });
  });
}

async function ensureDriveToken(){
  if(driveAccessToken) return driveAccessToken;
  return requestDriveToken(false);
}

async function findOrCreateDriveFile(token){
  let fileId = state.settings.driveFileId;
  if(fileId){
    const check = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id,trashed`, {headers:{Authorization:`Bearer ${token}`}});
    if(check.ok){
      const j = await check.json();
      if(!j.trashed) return fileId;
    }
  }
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const searchResp = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {headers:{Authorization:`Bearer ${token}`}});
  if(searchResp.ok){
    const j = await searchResp.json();
    if(j.files && j.files.length){
      state.settings.driveFileId = j.files[0].id;
      persistSettings();
      return j.files[0].id;
    }
  }
  const createResp = await fetch("https://www.googleapis.com/drive/v3/files", {
    method:"POST",
    headers:{Authorization:`Bearer ${token}`, "Content-Type":"application/json"},
    body: JSON.stringify({name: DRIVE_FILENAME, mimeType:"application/json"})
  });
  if(!createResp.ok) throw new Error("Could not create the backup file in Drive.");
  const created = await createResp.json();
  state.settings.driveFileId = created.id;
  persistSettings();
  return created.id;
}

function currentBackupPayload(){
  return JSON.stringify({exportedAt: Date.now(), plans: state.plans}, null, 2);
}

// Per-plan last-write-wins merge, so opening Mindora on a second device picks up
// whatever changed elsewhere instead of silently overwriting it. Plans that exist
// on only one side are kept; plans on both sides keep whichever copy has the
// newer updatedAt. (Deleting a plan on one device can still have it reappear if
// another device syncs an older copy before seeing the deletion — acceptable for
// a single-user app; just delete it again.)
function mergePlansData(localPlans, drivePlans){
  const byId = new Map();
  (drivePlans||[]).forEach(p=>{ if(p && p.id) byId.set(p.id, p); });
  (localPlans||[]).forEach(p=>{
    if(!p || !p.id) return;
    const other = byId.get(p.id);
    if(!other || (p.updatedAt||0) >= (other.updatedAt||0)) byId.set(p.id, p);
  });
  return Array.from(byId.values());
}

async function syncToDrive(){
  if(!state.settings.driveConnected) return;
  try{
    const token = await ensureDriveToken();
    const fileId = await findOrCreateDriveFile(token);
    const resp = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method:"PATCH",
      headers:{Authorization:`Bearer ${token}`, "Content-Type":"application/json"},
      body: currentBackupPayload()
    });
    if(resp.ok){
      state.settings.driveLastSync = Date.now();
      persistSettings();
      if(state.view==="settings") renderView();
    }
  }catch(e){
    console.warn("Drive sync failed", e);
  }
}

async function connectDrive(){
  if(!driveClientId()){ toast("Paste your Google OAuth Client ID first.", "error"); return; }
  try{
    await requestDriveToken(true);
    state.settings.driveConnected = true;
    persistSettings();
    toast("Google Drive connected", "success");
    await syncToDrive();
    renderView();
  }catch(e){
    toast(e.message || "Could not connect to Google Drive.", "error");
  }
}

async function restoreFromDrive(){
  try{
    const token = await ensureDriveToken();
    const fileId = await findOrCreateDriveFile(token);
    const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {headers:{Authorization:`Bearer ${token}`}});
    if(!resp.ok) throw new Error("Could not read the Drive backup file.");
    const data = await resp.json();
    if(Array.isArray(data.plans)){
      state.plans = data.plans;
      store.set("plans", state.plans);
      toast("Restored from Google Drive", "success");
      renderView();
    } else {
      toast("That Drive file doesn't look like a Mindora backup.", "error");
    }
  }catch(e){
    toast(e.message || "Could not restore from Drive.", "error");
  }
}

// Runs once at startup when this browser was already connected to Drive. Tries a
// silent (non-interactive) token refresh — works if the user's still signed into
// Google in this browser, fails quietly on a brand-new device/profile (no popup,
// no error toast; they just click "Connect" in Settings once to link it). On
// success, merges Drive's copy into local storage so a plan edited on another
// device shows up here without any manual "Restore" click.
async function autoSyncFromDrive(){
  if(!state.settings.driveConnected) return;
  try{
    const token = await ensureDriveToken();
    const fileId = await findOrCreateDriveFile(token);
    const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {headers:{Authorization:`Bearer ${token}`}});
    if(!resp.ok) return;
    const data = await resp.json();
    if(!Array.isArray(data.plans)) return;
    const merged = mergePlansData(state.plans, data.plans);
    const changed = JSON.stringify(merged) !== JSON.stringify(state.plans);
    state.plans = merged;
    store.set("plans", state.plans);
    state.settings.driveLastSync = Date.now();
    persistSettings();
    if(changed){
      renderView();
      toast("Synced latest from Google Drive", "success");
    }
  }catch(e){
    console.warn("Auto-sync from Drive skipped", e);
  }
}

function disconnectDrive(){
  driveAccessToken = null;
  state.settings.driveConnected = false;
  persistSettings();
  toast("Disconnected from Google Drive (your Drive file is untouched)", "success");
  renderView();
}

function renderSidebar(){
  document.querySelectorAll(".navbtn, .tabbtn").forEach(b=>{
    const isActive = b.dataset.nav === state.view;
    b.classList.toggle("active", isActive);
    b.setAttribute("aria-current", isActive ? "page" : "false");
  });
  // "More" lights up when the current view lives behind it, so the bar never
  // shows nothing selected.
  const more = document.getElementById("btnMore");
  if(more){
    const inSheet = ["chat","catalog","insights","settings","upgrade"].includes(state.view);
    more.classList.toggle("active", inSheet);
  }
  const sheetPro = document.getElementById("sheetUpgrade");
  if(sheetPro) sheetPro.hidden = !billingAvailable();
  const ks = document.getElementById("keyStatus");
  const ready = aiAvailable();
  ks.className = "key-status " + (ready ? "ok" : "bad");
  ks.innerHTML = `<span class="pip"></span> ${ready ? "AI ready" : "AI off"}`;
  ks.title = ready ? "AI is available in this app" : "AI features aren't switched on for this app";

  const due = cardsDue().length;
  [document.getElementById("dueDot"), document.getElementById("tabDueDot")].forEach(dot=>{
    if(!dot) return;
    dot.hidden = due === 0;
    dot.textContent = due > 99 ? "99+" : String(due);
  });

  const pill = document.getElementById("planPill");
  if(pill){
    // The pill is a nudge, not a status. While nothing is required it is a
    // request, so it goes away entirely.
    if(!paymentRequired()){
      pill.hidden = true;
    }else{
      pill.hidden = false;
      const pro = isPro(), pending = planPending();
      pill.className = "plan-pill " + (pro ? "pro" : pending ? "pending" : "free");
      pill.textContent = pro ? "Pro" : pending ? "Pending" : "Upgrade";
      pill.title = pro
        ? "Your subscription is active"
        : pending ? "Payment submitted — waiting for verification" : "Unlock the Mindora assistant";
    }
  }
}

function setTopbar(title, sub){
  document.getElementById("topTitle").textContent = title;
  document.getElementById("topSub").textContent = sub || "";
}

function renderView(){
  renderSidebar();
  const v = document.getElementById("view");
  v.classList.remove("view-anim");
  void v.offsetWidth;
  v.classList.add("view-anim");
  if(state.view === "home") renderHome(v);
  else if(state.view === "chat") renderChat(v);
  else if(state.view === "plans") renderPlans(v);
  else if(state.view === "catalog") renderCatalog(v);
  else if(state.view === "today") renderToday(v);
  else if(state.view === "settings") renderSettings(v);
  else if(state.view === "upgrade") renderUpgrade(v);
  else if(state.view === "review") renderReview(v);
  else if(state.view === "insights") renderInsights(v);
  // Any iframe rebuilt by that render is a brand-new element, so re-attach the
  // YouTube player objects that report watch progress back to us.
  bindInlinePlayers();
}

// Session state lives outside `state` because it is transient: a half-finished
// review should not survive a reload as a partially-graded queue.
let reviewQueue = [], reviewIndex = 0, reviewRevealed = false, reviewDone = 0;

function startReview(){
  reviewQueue = cardsDue().sort((a,b)=>(a.card.due||0)-(b.card.due||0));
  reviewIndex = 0; reviewRevealed = false; reviewDone = 0;
}

function renderReview(container){
  const stats = studyStats();
  setTopbar("Review", stats.dueCards ? `${stats.dueCards} due` : "");

  if(!stats.cards){
    container.innerHTML = `
      <div class="chat-empty">
        <div class="big-ic">${icon("lightbulb","ic-xl")}</div>
        <h2>Recall beats rewatching</h2>
        <p>Add a card from any lesson — the question on one side, the answer on the other.
        Mindora then shows it again just before you'd forget it, which is what actually moves
        something into long-term memory.</p>
        <button class="btn primary" data-nav="plans">${icon("arrowRight","ic-sm")} Open a plan to add cards</button>
      </div>`;
    return;
  }

  if(!reviewQueue.length || reviewIndex >= reviewQueue.length){
    const next = allCards().map(({card})=>card.due||0).filter(d=>d>Date.now()).sort((a,b)=>a-b)[0];
    container.innerHTML = `
      <div class="review-wrap">
        <div class="chat-empty">
          <div class="big-ic">${icon("checkCircle","ic-xl")}</div>
          <h2>${reviewDone ? `${reviewDone} card${reviewDone===1?"":"s"} reviewed` : "Nothing due right now"}</h2>
          <p>${next
            ? `Next card is due ${fmtDateNice(ymd(new Date(next)))}. Spacing them out is the point — reviewing early doesn't help.`
            : "You're all caught up."}</p>
          ${stats.dueCards ? `<button class="btn primary" id="btnStartReview">Start reviewing ${stats.dueCards}</button>` : ""}
        </div>
        ${renderCardLibrary()}
      </div>`;
    const start = document.getElementById("btnStartReview");
    if(start) start.onclick = ()=>{ startReview(); renderView(); };
    return;
  }

  const {card, plan} = reviewQueue[reviewIndex];
  const progress = Math.round((reviewIndex / reviewQueue.length) * 100);

  container.innerHTML = `
    <div class="review-wrap">
      <div class="review-progress"><div style="width:${progress}%"></div></div>
      <div class="review-meta">
        <span>${reviewIndex + 1} of ${reviewQueue.length}</span>
        <span>${escapeHtml(plan.title)}</span>
      </div>

      <div class="review-card${reviewRevealed?" revealed":""}" id="reviewCard">
        <div class="review-face front">
          <span class="review-label">Question</span>

            <span class="review-hint">or press Space</span>` : ""}

            .map(([q,label,cls,key])=>`
              <button class="grade ${cls}" data-action="grade-card" data-q="${q}">
                <strong>${label}</strong><span>${gradePreview(card, q)}</span><kbd>${key}</kbd>
              </button>`).join("")}

  if(reveal) reveal.onclick = ()=>{ reviewRevealed = true; renderView(); };

/** What the next interval would be, shown on the button before committing. */
function gradePreview(card, quality){
  if(quality === 0) return "< 1 min";
  const reps = (card.reps||0) + 1;
  const ease = Math.max(CARD_MIN_EASE, (card.ease||CARD_START_EASE) + ({1:-0.15,2:0,3:0.15}[quality]||0));
  let interval;
  if(reps === 1)      interval = quality === 1 ? 1 : quality === 3 ? 4 : 1;
  else if(reps === 2) interval = quality === 1 ? 3 : quality === 3 ? 8 : 6;
  else                interval = Math.round((card.interval||1) * ease * (quality===1?0.6:quality===3?1.3:1));
  interval = Math.max(1, Math.min(365, interval));
  return interval === 1 ? "1 day" : interval < 30 ? `${interval} days`
       : interval < 365 ? `${Math.round(interval/30)} mo` : "1 year";
}

function submitGrade(quality){
  const entry = reviewQueue[reviewIndex];
  if(!entry || !reviewRevealed) return;
  gradeCard(entry.plan.id, entry.card.id, quality);
  reviewDone++;
  if(quality === 0){
    // "Again" goes to the back of this session's queue, not away — the whole
    // point is to see it once more before you stop.
    reviewQueue.push(entry);
  }
  reviewIndex++;
  reviewRevealed = false;
  renderView();
}

let paletteOpen = false, paletteResults = [], paletteIndex = 0;

/**
 * Subsequence match: "clc" finds "Calculus". Returns a score so exact prefixes
 * beat scattered letters, or -1 when it doesn't match at all.
 */
function fuzzyScore(needle, haystack){
  const n = needle.toLowerCase(), h = haystack.toLowerCase();
  if(!n) return 0;
  if(h.startsWith(n)) return 1000 - h.length;
  const direct = h.indexOf(n);
  if(direct >= 0) return 600 - direct - h.length * 0.1;
  let i = 0, score = 0, streak = 0;
  for(let j = 0; j < h.length && i < n.length; j++){
    if(h[j] === n[i]){
      streak++; score += 10 + streak * 2;
      if(j === 0 || h[j-1] === " ") score += 15;   // word starts count for more
      i++;
    }else streak = 0;
  }
  return i === n.length ? score - h.length * 0.05 : -1;
}

function go(view){
  closePalette();
  state.view = view;
  if(view !== "plans") state.planDetailId = null;
  location.hash = HASH_VIEWS.includes(view) ? "#" + view : "";
  renderView();
}

function openPalette(){
  if(paletteOpen) return;
  paletteOpen = true;
  const el = document.getElementById("palette");
  el.hidden = false;
  requestAnimationFrame(()=>el.classList.add("open"));
  const input = document.getElementById("paletteInput");
  input.value = "";
  updatePalette("");
  input.focus();
}

function closePalette(){
  if(!paletteOpen) return;
  paletteOpen = false;
  const el = document.getElementById("palette");
  el.classList.remove("open");
  // Focus must leave the search field, or every keyboard shortcut afterwards
  // sees an <input> as the target and bails out as "the user is typing".
  const input = document.getElementById("paletteInput");
  if(input && document.activeElement === input) input.blur();
  setTimeout(()=>{ if(!paletteOpen) el.hidden = true; }, 160);
}

function updatePalette(query){
  const all = paletteCommands();
  paletteResults = (query
    ? all.map(item=>({item, score: Math.max(
        fuzzyScore(query, item.label),
        item.hint ? fuzzyScore(query, item.hint) - 200 : -1,
      )}))
      .filter(r=>r.score >= 0)
      .sort((a,b)=>b.score - a.score)
      .map(r=>r.item)
    : all.filter(i=>i.kind === "Go" || i.kind === "Do")
  ).slice(0, 40);

  paletteIndex = 0;
  paintPalette();
}

function paintPalette(){
  const list = document.getElementById("paletteList");
  if(!paletteResults.length){
    list.innerHTML = `<div class="palette-empty">Nothing matches that.</div>`;
    return;
  }
  list.innerHTML = paletteResults.map((item, i)=>`
    <button class="palette-item${i === paletteIndex ? " active" : ""}" data-i="${i}" role="option"
      aria-selected="${i === paletteIndex}">
      <span class="palette-ic">${icon(item.icon || "arrowRight","ic-sm")}</span>
      <span class="palette-label">${escapeHtml(item.label)}</span>
      ${item.hint ? `<span class="palette-hint">${escapeHtml(item.hint)}</span>` : ""}
      <span class="palette-kind">${item.kind}</span>
    </button>`).join("");
  const active = list.querySelector(".palette-item.active");
  if(active) active.scrollIntoView({block:"nearest"});
}

function movePalette(delta){
  if(!paletteResults.length) return;
  paletteIndex = (paletteIndex + delta + paletteResults.length) % paletteResults.length;
  paintPalette();
}

function runPalette(index){
  const item = paletteResults[index];
  if(!item) return;
  closePalette();
  // Let the palette finish closing before a handler opens a modal, or focus
  // lands back in the palette input as it disappears.
  setTimeout(()=>item.run(), 60);
}

        <div class="big-ic">${icon("sparkle","ic-xl")}</div>
        <h2>${planPending() ? "Verifying your payment" : "Unlock the Mindora assistant"}</h2>
        <p>${planPending()
          ? "We check transactions by hand, usually within a few hours. Your plans and progress are safe in the meantime."
          : "Chat is part of Mindora Pro. Everything else — ready-made paths, the catalog, progress tracking — stays free."}</p>
        <button class="btn primary" data-nav="upgrade">
          ${planPending() ? "See status" : "See plans"} ${icon("arrowRight","ic-sm")}
        </button>
      </div>`;
    return;
  }

  if(!plan){
    container.innerHTML = `
      <div class="chat-empty">
        <div class="big-ic">${icon("compass","ic-xl")}</div>
        <h2>Design your first learning plan</h2>
        <p>Tell Mindora what you want to learn, in which language, and how much time you have. It'll search the web for real, free YouTube classes and build you a full routine — up to 6 months.</p>
        <button class="btn primary" id="btnEmptyNewPlan">${icon("plus","ic-sm")} Create a learning plan</button>
      </div>`;
    document.getElementById("btnEmptyNewPlan").onclick = openNewPlanModal;
    return;
  }

  const suggestions = [
    "Make it a bit more intensive, I have more free time on weekends.",
    "Swap week 2 to focus more on practice than videos.",
    "Regenerate the resources in Hindi instead.",
  ];

  container.innerHTML = `
    <div class="chat-wrap">
      <div class="chat-scroll" id="chatScroll">
        ${plan.chat.length ? plan.chat.map(renderMsg).join("") : `
          <div class="chat-empty">
            <div class="big-ic">${icon("sparkle","ic-xl")}</div>
            <h2>${escapeHtml(plan.title)}</h2>
            <p>Ready to build your ${plan.durationWeeks}-week ${LANGS[plan.language]||''} plan for <strong>${escapeHtml(plan.subject)}</strong>.</p>
            <button class="btn primary" id="btnGenerateNow">Generate the full plan</button>
          </div>`}
        <div id="streamTarget"></div>
      </div>
      <div class="chat-input-bar">
        <div class="chip-row" style="margin-bottom:10px;">
          ${plan.chat.length ? suggestions.map(s=>`<span class="chip" data-action="fill-suggestion" data-text="${escapeHtml(s)}" tabindex="0" role="button">${escapeHtml(s)}</span>`).join("") : ""}
        </div>
        <div class="chat-input-row">
          <textarea id="chatInput" placeholder="Ask Mindora to adjust your plan, add a topic, change language…" rows="1"></textarea>
          <button class="btn primary" id="btnSend">Send</button>
        </div>
        <div class="chat-hint">Enter to send · Shift+Enter for a new line</div>
      </div>
    </div>
  `;

  const scroll = document.getElementById("chatScroll");
  scroll.scrollTop = scroll.scrollHeight;

  const input = document.getElementById("chatInput");
  const btnSend = document.getElementById("btnSend");
  if(input){
    input.addEventListener("keydown", e=>{
      if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); doSend(); }
    });
    input.addEventListener("input", ()=>{ input.style.height="auto"; input.style.height=Math.min(160,input.scrollHeight)+"px"; });
  }
  if(btnSend) btnSend.onclick = doSend;
  const genBtn = document.getElementById("btnGenerateNow");
  if(genBtn) genBtn.onclick = ()=> runChatTurn(buildInitialMessage(plan));

  function doSend(){
    const text = input.value.trim();
    if(!text || state.sending) return;
    input.value=""; input.style.height="auto";
    runChatTurn(text);
  }
}

function renderMsg(m){
  const isUser = m.role === "user";
  return `
    <div class="msg ${isUser?'user':'assistant'}">
      <div class="avatar">${isUser?icon("user"):icon("compass")}</div>
      <div class="bubble">${isUser ? `<p>${escapeHtml(m.content)}</p>` : renderChatBubble(m.content)}</div>
    </div>`;
}

function buildInitialMessage(plan){
  const langLabel = LANGS[plan.language]||"English";
  let msg = `I want to learn "${plan.subject}" over ${plan.durationWeeks} week(s), studying about ${plan.dailyMinutes} minutes per day. My current level is ${plan.level}. Please use ${langLabel} language video resources.`;
  if(plan.daysOff && plan.daysOff.length) msg += ` I'd prefer to rest on: ${plan.daysOff.join(", ")}.`;
  msg += " Please research real free YouTube resources and design the full curriculum now.";
  return msg;
}

async function runChatTurn(userText){
  const plan = activePlan();
  if(!plan) return;
  if(!aiAvailable()){
    toast("AI features aren't switched on for this app yet.", "error");
    return;
  }
  state.sending = true;
  const scroll = document.getElementById("chatScroll");

  // render the user's message immediately
  const userMsgHtml = renderMsg({role:"user", content:userText});
  document.getElementById("streamTarget").insertAdjacentHTML("beforebegin", userMsgHtml);

  const target = document.getElementById("streamTarget");
  target.innerHTML = `
    <div class="msg assistant" id="liveMsg">
      <div class="avatar">${icon("compass")}</div>
      <div class="bubble">
        <div class="status-line" id="liveStatus">${icon("sparkle","ic-sm")} Thinking <span class="dotpulse"><span></span><span></span><span></span></span></div>
        <div id="liveText"></div>
      </div>
    </div>`;
  scroll.scrollTop = scroll.scrollHeight;
  const liveText = document.getElementById("liveText");
  const liveStatus = document.getElementById("liveStatus");

  disableChatInput(true);
  try{
    const result = await sendToClaude(plan, userText, {
      onStatus: (s)=>{ liveStatus.innerHTML = s; },
      onChunk: (full)=>{ liveText.innerHTML = renderChatBubble(full); scroll.scrollTop = scroll.scrollHeight; }
    });
    if(result.planUpdated){
      toast("Learning plan updated", "success");
    }
    renderView(); // full re-render to reflect persisted state cleanly
    const scroll2 = document.getElementById("chatScroll");
    if(scroll2) scroll2.scrollTop = scroll2.scrollHeight;
  }catch(err){
    toast(err.message || "Something went wrong talking to Claude.", "error");
    liveStatus.innerHTML = "";
    liveText.innerHTML = `<p style="color:var(--danger); display:flex; align-items:center; gap:6px;">${icon("alert","ic-sm")} ${escapeHtml(err.message||"Request failed.")}</p>`;
  }finally{
    state.sending = false;
    disableChatInput(false);
  }
}
function disableChatInput(disabled){
  const i = document.getElementById("chatInput");
  const b = document.getElementById("btnSend");
  if(i) i.disabled = disabled;
  if(b) b.disabled = disabled;
}

function renderPlanDetail(container, plan){
  setTopbar(plan.title, `${plan.durationWeeks} weeks · starts ${fmtDateNice(plan.startDate)}`);

  // First time this plan is opened, expand whichever week contains today

  const hasAnyOpen = (plan.weeks||[]).some(w=>state.openWeeks.has(weekKey(plan.id, w.weekNumber)));

    const current = plan.weeks.find(w=>(w.days||[]).some(d=>computeDateForDay(plan, w.weekNumber, d.dayNumber) === todayStr));

  const behind = overdueDays(plan);

        <button class="btn small" data-action="print-plan">${icon("printer","ic-sm")} Print</button>
        <button class="btn small danger" data-action="delete-plan" data-id="${plan.id}">Delete</button>
      </div>
    </div>
    ${behind.length ? `
      <div class="catchup">
        ${icon("hourglass","ic-sm")}
        <div>
          <strong>${behind.length} day${behind.length===1?"":"s"} behind.</strong>
          Falling behind is the usual reason a plan gets abandoned — shift the remaining

function weekKey(planId, weekNumber){ return `${planId}|${weekNumber}`; }
function renderWeekBlock(plan, week){

function renderDayRow(plan, week, day){

        ${(day.todos||[]).length ? `<div style="margin-top:6px;">${day.todos.map(t=>{

// Builds the video slot for a lesson. Collapsed it's a lightweight facade (just a
// thumbnail — no YouTube JS loaded); once played it becomes a real <iframe> right
// inside the card, spanning its full width, and stays open across re-renders.
function ytEmbedSrc(yt, autoplay){
  const a = autoplay ? "1" : "0";
  // enablejsapi lets the IFrame Player API report playback position back to us;
  // origin is required alongside it, but only meaningful over http(s).
  const origin = location.protocol.startsWith("http") ? `&origin=${encodeURIComponent(location.origin)}` : "";
  return yt.kind === "playlist"
    ? `https://www.youtube-nocookie.com/embed/videoseries?list=${yt.id}&rel=0&autoplay=${a}&enablejsapi=1${origin}`
    : `https://www.youtube-nocookie.com/embed/${yt.id}?rel=0&autoplay=${a}&enablejsapi=1${origin}`;
}
function renderLessonMedia(plan, c, small){
  const yt = getYtEmbed(c);
  const canResolve = !yt && c.type !== "rest" && !!ytApiKey();
  if(!yt && !canResolve) return "";
  const attrs = `data-plan="${plan.id}" data-class="${c.id}"`;

  if(yt && state.inlineOpen.has(c.id)){
    const what = yt.kind === "playlist" ? "Playlist" : "Now playing";
    return `
      <div class="lesson-media expanded" data-media="${c.id}">
        <div class="lesson-embed">
          <div class="frame">
            <iframe id="ytf-${c.id}" data-yt-class="${c.id}" src="${ytEmbedSrc(yt, true)}" title="${escapeHtml(c.title)}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="watch-bar" title="How much of this video you've watched">
            <div class="watch-bar-fill" data-watchfill="${c.id}" style="width:${Math.round(watchPct(c)*100)}%"></div>
          </div>
          <div class="lesson-embed-bar">
            <span>${yt.isAlt ? "Alt video" : what}${yt.channel ? " · " + escapeHtml(yt.channel) : ""}</span>
            <span class="lb-actions">
              <span class="watch-pct" data-watchpct="${c.id}">${Math.round(watchPct(c)*100)}% watched</span>
              <button data-action="focus-mode" ${attrs}>Focus mode</button>
              <button data-action="close-inline" ${attrs}>Close</button>
            </span>
          </div>
        </div>
      </div>`;
  }

  const label = canResolve
    ? `Find an alternative video for ${escapeHtml(c.title)}`
    : (yt.isAlt ? `Play alternative video for ${escapeHtml(c.title)}` : `Play ${escapeHtml(c.title)}`);
  let inner, extraCls = "", style = "";
  if(yt && yt.kind === "video"){
    style = ` style="background-image:url('https://img.youtube.com/vi/${yt.id}/hqdefault.jpg')"`;
    inner = `<span class="play-badge">${icon("play","ic-sm")}</span>`;
  } else if(yt){
    extraCls = " icon-only";
    inner = `${icon("playlist","ic-lg")}<span class="play-badge">${icon("play","ic-sm")}</span>`;
  } else {
    extraCls = " icon-only";
    inner = icon("search","ic-lg");
  }
  const flag = (yt && yt.isAlt) ? `<span class="alt-flag">Alt</span>` : "";
  const seen = watchPct(c);
  const seenBar = seen > 0.01
    ? `<span class="facade-progress" title="${Math.round(seen*100)}% watched"><span style="width:${Math.round(seen*100)}%"></span></span>` : "";
  return `
    <div class="lesson-media${small?" sm":""}" data-media="${c.id}">
      <button class="lesson-facade${extraCls}" data-action="play-inline" ${attrs} aria-label="${label}"${style}>${inner}${flag}${seenBar}</button>
    </div>`;
}

  const media = renderLessonMedia(plan, c, false);

        <div class="cc-meta">${escapeHtml(c.channel||"")} ${c.channel?'· ':''}${c.durationMinutes} min${c.notes ? ' · '+escapeHtml(c.notes) : ''}</div>

        ${openExternal}

          title="Notes" aria-label="Notes for ${escapeHtml(c.title)}">

        </button>
        <button class="icon-btn sm" data-action="add-card" data-plan="${plan.id}" data-class="${c.id}"
          title="Make a recall card" aria-label="Make a recall card from ${escapeHtml(c.title)}">${icon("lightbulb","ic-sm")}</button>
        ${quizCount ? `
          <button class="btn small quiz-btn${quizPassed(c)?" passed":""}" data-action="take-quiz"
            data-plan="${plan.id}" data-class="${c.id}"
            title="${quizPassed(c) ? `Passed with ${Math.round(bestQuizScore(c)*100)}%` : `${quizCount} questions · ${Math.round(QUIZ_PASS*100)}% to pass`}">
            ${icon(quizPassed(c) ? "checkCircle" : "clipboard","ic-sm")}
            ${quizPassed(c) ? `${Math.round(bestQuizScore(c)*100)}%` : "Quiz"}
          </button>` : `
          <button class="icon-btn sm" data-action="edit-quiz" data-plan="${plan.id}" data-class="${c.id}"
            title="Add a quiz" aria-label="Add a quiz to ${escapeHtml(c.title)}">${icon("clipboard","ic-sm")}</button>`}
        ${editBtn}
        <input type="time" value="${c.completionTime||''}" data-action="set-completion" data-plan="${plan.id}" data-class="${c.id}" title="Notify me 10 & 5 min before this time">
        <input type="checkbox" class="chk" ${c.done?'checked':''} data-action="toggle-class-done" data-plan="${plan.id}" data-class="${c.id}" title="Mark done">
      </div>
      <div class="notes-panel" data-notes-for="${c.id}" ${state.notesOpen.has(c.id)?"":"hidden"}>
        ${renderNotesPanel(plan, c)}

}

/**
 * Notes for one lesson. When its video is open and playing, the composer
 * stamps the current position, and each stamped note becomes a link that
 * seeks the player back to that exact second.
 */
function renderNotesPanel(plan, c){
  const notes = classNotes(c).slice().sort((a,b)=>{
    // Timestamped notes read best in video order; typed ones follow, newest last.
    if(a.at !== null && b.at !== null) return a.at - b.at;
    if(a.at !== null) return -1;
    if(b.at !== null) return 1;
    return a.createdAt - b.createdAt;
  });
  return `
    <div class="notes-list">
      ${notes.length ? notes.map(n=>`
        <div class="note">
          ${n.at !== null ? `<button class="note-at" data-action="seek-note" data-class="${c.id}" data-at="${n.at}"
            title="Jump to ${fmtClock(n.at)}">${fmtClock(n.at)}</button>` : `<span class="note-at plain">—</span>`}
          <span class="note-text">${escapeHtml(n.text)}</span>
          <button class="icon-btn xs" data-action="delete-note" data-class="${c.id}" data-note="${n.id}"
            title="Delete note" aria-label="Delete note">${icon("x","ic-sm")}</button>
        </div>`).join("") : `<p class="desc note-empty">No notes yet. While a video plays, anything you write here is stamped with the moment you wrote it.</p>`}
    </div>
    <div class="note-compose">
      <input type="text" class="note-input" data-note-input="${c.id}"
        placeholder="Write a note${inlinePlayers.has(c.id)?" — timestamped automatically":""}…" autocomplete="off">
      <button class="btn small primary" data-action="save-note" data-plan="${plan.id}" data-class="${c.id}">Add</button>
    </div>`;
}

function toggleNotes(classId){
  if(state.notesOpen.has(classId)) state.notesOpen.delete(classId);
  else state.notesOpen.add(classId);
  const panel = document.querySelector(`[data-notes-for="${classId}"]`);
  if(panel){
    // Toggled in place rather than via renderView, so an open video keeps playing.
    panel.hidden = !state.notesOpen.has(classId);
    if(!panel.hidden){
      const input = panel.querySelector(".note-input");
      if(input) input.focus();
    }
  }else{
    renderView();
  }
}

function saveNoteFromField(planId, classId){
  const input = document.querySelector(`[data-note-input="${classId}"]`);
  if(!input || !input.value.trim()) return;
  const at = playerSeconds(classId);
  const note = addClassNote(planId, classId, input.value, at);
  input.value = "";
  paintNotes(classId);
  if(note && note.at !== null) toast(`Note saved at ${fmtClock(note.at)}`, "success");
}

/** Repaint one lesson's notes without a full re-render, so video keeps playing. */
function paintNotes(classId){
  const found = findClassAnywhere(classId);
  const panel = document.querySelector(`[data-notes-for="${classId}"]`);
  if(!found || !panel) return;
  panel.innerHTML = renderNotesPanel(found.plan, found.c);
  const input = panel.querySelector(".note-input");
  if(input) input.focus();
  // The count badge lives outside the panel, so update it separately.
  const badge = document.querySelector(`[data-action="toggle-notes"][data-class="${classId}"]`);
  if(badge){
    const n = classNotes(found.c).length;
    badge.classList.toggle("has-notes", n > 0);
    const chip = badge.querySelector(".note-count");
    if(n && chip) chip.textContent = n;
    else if(n && !chip) badge.insertAdjacentHTML("beforeend", `<span class="note-count">${n}</span>`);
    else if(!n && chip) chip.remove();
  }
}
