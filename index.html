<style>
/* ===================== Design tokens =====================
   Dark, glassy, neon-lit. Translucent surfaces over an aurora field,
   hairline borders that catch light, and cyan/violet edge glow.
========================================================== */
:root{
  --bg: #08060f;
  --bg-2: #0d0a1a;
  --surface: rgba(255,255,255,.04);
  --surface-2: rgba(255,255,255,.07);
  --surface-solid: #14101f;
  --line: rgba(255,255,255,.10);
  --line-2: rgba(255,255,255,.18);
  --text: #f4f1fb;
  --text-dim: #a79fc0;
  --text-faint: #6d6488;
  --accent: #5b8cff;
  --accent-2: #a855f7;
  --accent-3: #c084fc;
  --accent-rgb: 91,140,255;
  --accent-soft: rgba(91,140,255,.16);
  --glow: 0 0 26px -4px rgba(91,140,255,.55);
  --glow-2: 0 0 32px -6px rgba(168,85,247,.5);
  --gold: #fbbf24;
  --gold-soft: rgba(251,191,36,.15);
  --success: #34d399;
  --warn: #fbbf24;
  --danger: #fb7185;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 22px;
  --shadow: 0 14px 40px -16px rgba(0,0,0,.8);
  --shadow-lg: 0 40px 90px -30px rgba(0,0,0,.9);
  --blur: blur(16px) saturate(150%);
  --font-display: "Sora", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(.22,1,.36,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --dur-fast: .14s;
  --dur: .24s;
  --dur-slow: .4s;
}
:root[data-theme="light"]{
  --bg: #f4f1fb;
  --bg-2: #ebe6f7;
  --surface: rgba(255,255,255,.74);
  --surface-2: rgba(255,255,255,.94);
  --surface-solid: #ffffff;
  --line: rgba(30,20,60,.10);
  --line-2: rgba(30,20,60,.18);
  --text: #16102a;
  --text-dim: #574c72;
  --text-faint: #8b81a6;
  --accent: #2b4acb;
  --accent-2: #7c3aed;
  --accent-3: #9333ea;
  --accent-rgb: 43,74,203;
  --accent-soft: rgba(43,74,203,.12);
  --glow: 0 0 24px -6px rgba(43,74,203,.4);
  --glow-2: 0 0 30px -8px rgba(124,58,237,.35);
  --gold: #b45309;
  --gold-soft: rgba(180,83,9,.12);
  --success: #059669;
  --danger: #e11d48;
  --shadow: 0 14px 40px -18px rgba(15,23,42,.28);
  --shadow-lg: 0 40px 90px -34px rgba(15,23,42,.34);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f1fb; --bg-2:#ebe6f7;
    --surface:rgba(255,255,255,.74); --surface-2:rgba(255,255,255,.94); --surface-solid:#ffffff;
    --line:rgba(30,20,60,.10); --line-2:rgba(30,20,60,.18);
    --text:#16102a; --text-dim:#574c72; --text-faint:#8b81a6;
    --accent:#2b4acb; --accent-2:#7c3aed; --accent-3:#9333ea;
    --accent-rgb:43,74,203; --accent-soft:rgba(43,74,203,.12);
    --glow:0 0 24px -6px rgba(43,74,203,.4); --glow-2:0 0 30px -8px rgba(124,58,237,.35);
    --gold:#b45309; --gold-soft:rgba(180,83,9,.12); --success:#059669; --danger:#e11d48;
    --shadow:0 14px 40px -18px rgba(15,23,42,.28); --shadow-lg:0 40px 90px -34px rgba(15,23,42,.34);
  }
}

*{box-sizing:border-box;}
/* Any rule that sets `display` on an element outranks the `hidden` attribute,
   which is how a "hidden" full-screen overlay ends up silently swallowing
   every click in the app. This makes hidden mean hidden, everywhere. */
[hidden]{display:none !important;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:14.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
/* Living aurora — three coloured fields that drift slowly against each other,
   so the background is never quite the same twice. Pauses for reduced motion. */
body::before{
  content:""; position:fixed; inset:-20%; z-index:-2; pointer-events:none;
  background:
    radial-gradient(760px 560px at 12% 8%,  rgba(59,63,196,.32), transparent 62%),
    radial-gradient(700px 520px at 88% 12%, rgba(168,85,247,.24), transparent 60%),
    radial-gradient(680px 520px at 52% 96%, rgba(91,140,255,.16), transparent 62%);
  animation:auroraDrift 34s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes auroraDrift{
  0%   { transform:translate3d(0,0,0) scale(1); }
  50%  { transform:translate3d(2.5%,-2%,0) scale(1.08); }
  100% { transform:translate3d(-2%,2.5%,0) scale(1.04); }
}
:root[data-theme="light"] body::before,
:root:not([data-theme="dark"]) body::before{ opacity:.55; }
body::after{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
  background-image:
    linear-gradient(to right, var(--line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--line) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 90% 60% at 50% 0%, #000 30%, transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%, #000 30%, transparent 78%);
}
h1,h2,h3{font-family:var(--font-display); font-weight:700; letter-spacing:-.025em; line-height:1.15;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}
a{color:var(--accent); text-underline-offset:3px;}
button{font-family:inherit;}
.hidden{display:none !important;}
.ic{width:16px; height:16px; flex:0 0 auto; display:inline-block; vertical-align:-3px;}
.ic.ic-sm{width:13px; height:13px;}
.ic.ic-lg{width:22px; height:22px;}
.ic.ic-xl{width:40px; height:40px;}
:is(button,a,[tabindex]):focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:8px;}

/* ===================== Motion ===================== */
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
@keyframes popIn{from{opacity:0; transform:scale(.96) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);}}
@keyframes sweep{from{transform:translateX(-120%);} to{transform:translateX(220%);}}
@keyframes glowPulse{0%,100%{opacity:.55;} 50%{opacity:1;}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ===================== Signature effects =====================
   Three things carry the look: a spotlight that follows the pointer across
   panels, a slowly-rotating gradient edge on hero surfaces, and content that
   rises into place as it scrolls in. All three are disabled for anyone who
   asks for reduced motion, and the spotlight is skipped on touch entirely.
============================================================== */
.spot{position:relative; isolation:isolate;}
.spot::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  z-index:1; opacity:0; transition:opacity .35s var(--ease);
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),
             rgba(var(--accent-rgb),.16), transparent 62%);
}
@media (hover:hover){ .spot:hover::after{opacity:1;} }
.spot > *{position:relative; z-index:2;}

/* A still gradient edge. This was a conic border rotating on a 9s loop —
   perpetual motion in the corner of the eye on the busiest screen in the app,
   and it fought the content for attention rather than framing it. */
.edge-lit{position:relative;}
.edge-lit::before{
  content:""; position:absolute; inset:-1px; border-radius:inherit; z-index:0; pointer-events:none;
  background:linear-gradient(135deg,
    rgba(var(--accent-rgb),.55) 0%, rgba(var(--accent-rgb),.10) 42%,
    transparent 62%, rgba(168,85,247,.32) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  padding:1px;
}

/* Scroll reveal — set by IntersectionObserver, never leaving content hidden
   if the observer is unavailable. */
.reveal{opacity:0; transform:translateY(18px); transition:opacity .55s var(--ease), transform .55s var(--ease);}
.reveal.in{opacity:1; transform:none;}

@media (prefers-reduced-motion: reduce){
  body::before{animation:none;}
  .spot::after{display:none;}
  .reveal{opacity:1; transform:none; transition:none;}
}

/* ===================== Shell / top nav ===================== */
#app{display:flex; flex-direction:column; min-height:100vh;}
.topnav{
  position:sticky; top:0; z-index:60;
  background:color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--line);
}
.topnav-inner{
  max-width:1240px; margin:0 auto; padding:0 24px;
  display:flex; align-items:center; gap:20px; min-height:64px;
}
.brand{display:flex; align-items:center; gap:11px; text-decoration:none; color:inherit; flex:0 0 auto;}
.brand .mark{
  width:38px; height:38px; flex:0 0 auto; border-radius:11px; padding:4px;
  background:#fff; box-shadow:var(--glow); object-fit:contain;
}
.brand .name{font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:-.02em; line-height:1.1;}
.brand .tag{font-family:var(--font-mono); font-size:8.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--text-faint); margin-top:3px; white-space:nowrap;}

.navrow{display:flex; align-items:center; gap:2px; flex:1; overflow-x:auto; scrollbar-width:none;}
.navrow::-webkit-scrollbar{display:none;}
.navbtn{
  border:1px solid transparent; background:transparent; color:var(--text-dim); cursor:pointer;
  font-size:13.5px; font-weight:500; padding:8px 14px; border-radius:99px; white-space:nowrap;
  transition:color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.navbtn:hover{color:var(--text); background:var(--surface);}
.navbtn.active{
  color:var(--text); background:var(--surface-2); border-color:var(--line-2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), var(--glow);
}

.topnav-right{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
.icon-btn{
  border:1px solid var(--line); background:var(--surface); color:var(--text-dim); cursor:pointer;
  width:36px; height:36px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; padding:0;
  transition:transform var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.icon-btn:hover{color:var(--text); border-color:var(--accent); box-shadow:var(--glow); transform:translateY(-1px);}
.icon-btn:active{transform:translateY(0) scale(.94);}
.icon-btn .ic{vertical-align:0;}

.key-status{
  font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.14em;
  color:var(--text-faint); display:flex; align-items:center; gap:7px;
  padding:6px 11px; border:1px solid var(--line); border-radius:99px; background:var(--surface);
}
.key-status .pip{width:6px; height:6px; border-radius:50%; flex:0 0 auto; animation:glowPulse 2.4s ease-in-out infinite;}
.key-status.ok .pip{background:var(--success); box-shadow:0 0 10px var(--success);}
.key-status.bad .pip{background:var(--danger); box-shadow:0 0 10px var(--danger);}

/* --- empty states ------------------------------------------------------ */
/* A bordered grey box with muted text tells you nothing is there and nothing
   to do about it. These say what the state means and offer the next step. */
.empty-note{
  display:flex; align-items:center; gap:15px; flex-wrap:wrap;
  padding:18px 20px; border-radius:14px;
  border:1px dashed var(--line-2); background:var(--surface);
}
.empty-note > div{flex:1 1 260px; min-width:0;}
.empty-note strong{display:block; font-size:14.5px; font-weight:650;}
.empty-note p{margin:3px 0 0; font-size:13.5px; color:var(--text-muted);}
.empty-ic{
  flex:0 0 auto; width:36px; height:36px; border-radius:11px; display:grid; place-items:center;
  background:rgba(var(--accent-rgb),.12); color:var(--accent);
}

/* --- quiz -------------------------------------------------------------- */
.quiz-btn{padding:5px 11px; font-size:12px; gap:5px;}
.quiz-btn.passed{color:var(--success); border-color:rgba(52,211,153,.4);}
.quiz-modal{max-width:620px;}
.quiz-head h2{margin:0 0 4px;}
.quiz-body{
  /* Long quizzes must scroll inside the dialog, not push its buttons off. */
  max-height:min(52vh, 460px); overflow-y:auto; margin:18px 0 4px; padding-right:4px;
}
.quiz-q{border:0; padding:0; margin:0 0 22px;}
.quiz-q legend{
  display:flex; gap:10px; align-items:flex-start; padding:0; margin-bottom:11px;
  font-size:15px; font-weight:600; line-height:1.45;
}
.quiz-n{
  flex:0 0 auto; width:23px; height:23px; border-radius:50%; display:grid; place-items:center;
  background:rgba(var(--accent-rgb),.14); color:var(--accent);
  font-family:var(--font-mono); font-size:11px; font-weight:700;
}
.quiz-opt{
  display:flex; align-items:flex-start; gap:11px; padding:10px 13px; margin-bottom:7px;
  border:1px solid var(--line); border-radius:11px; cursor:pointer; font-size:14px;
  transition:border-color .15s var(--ease), background .15s var(--ease);
}
.quiz-opt:hover{border-color:rgba(var(--accent-rgb),.45);}
.quiz-opt:has(input:checked){
  border-color:var(--accent); background:rgba(var(--accent-rgb),.09);
}
.quiz-opt input{margin-top:2px; flex:0 0 auto; accent-color:var(--accent);}
.quiz-opt:focus-within{outline:2px solid var(--accent); outline-offset:2px;}

.quiz-result{text-align:center; padding:10px 0 4px;}
.quiz-score{
  font-size:54px; font-weight:800; letter-spacing:-2px; line-height:1;
}
.quiz-score span{font-size:24px; opacity:.55; margin-left:2px;}
.quiz-result.pass .quiz-score{color:var(--success);}
.quiz-result.fail .quiz-score{color:var(--gold);}
.quiz-result h2{margin:12px 0 6px;}
.quiz-result p{margin:0 auto; color:var(--text-muted); max-width:44ch; font-size:14.5px;}
.quiz-review{margin-top:22px; padding-top:16px; border-top:1px solid var(--line);}
.quiz-review h3{font-size:13px; margin:0 0 10px; color:var(--text-faint);}
.quiz-missed{
  font-size:13.5px; padding:9px 12px; margin-bottom:7px; border-radius:9px;
  background:var(--surface); border-left:3px solid var(--gold); color:var(--text-dim);
}
.quiz-preparing{text-align:center; padding:22px 0 10px;}
.quiz-preparing h2{margin:20px 0 6px;}
.quiz-preparing .desc{margin:0 auto; max-width:38ch;}
.quiz-spinner{
  width:38px; height:38px; margin:0 auto; border-radius:50%;
  border:3px solid var(--line); border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){
  .quiz-spinner{animation-duration:2.4s;}
}

.quiz-list{display:flex; flex-direction:column; gap:8px; margin:14px 0 18px;}
.quiz-item{
  display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  padding:11px 13px; border:1px solid var(--line); border-radius:11px; background:var(--surface);
}
.quiz-item strong{font-size:14px; font-weight:600;}
.quiz-item .desc{margin:3px 0 0; font-size:12.5px;}

/* --- desktop sidebar --------------------------------------------------- */
/* Above 900px the header becomes a fixed left rail. No markup moves: the same
   brand / nav / actions row simply stacks vertically, so the phone layout and
   every existing handler keep working untouched.
   The icons only appear here — in a horizontal bar they add noise, in a rail
   they carry the scan. */
.nav-ic{display:none;}

@media (min-width:901px){
  #app{
    display:grid;
    grid-template-columns:var(--rail) 1fr;
    --rail:236px;
    min-height:100vh;
  }
  .topnav{
    /* Sticky rather than fixed so it participates in the grid column and can
       never overlap content at narrow zoom levels. */
    position:sticky; top:0; align-self:start;
    height:100vh; border-bottom:0; border-right:1px solid var(--line);
    background:color-mix(in srgb, var(--bg) 86%, transparent);
  }
  .topnav-inner{
    flex-direction:column; align-items:stretch; gap:22px;
    max-width:none; margin:0; padding:20px 14px;
    height:100%; overflow-y:auto; scrollbar-width:thin;
  }
  .brand{padding:0 8px;}

  .navrow{
    flex-direction:column; align-items:stretch; gap:2px;
    flex:0 0 auto; overflow:visible;
    -webkit-mask-image:none; mask-image:none;
  }
  .navbtn{
    display:flex; align-items:center; gap:11px;
    padding:9px 12px; border-radius:10px; font-size:14px; text-align:left;
  }
  .nav-ic{display:flex; flex:0 0 auto; color:var(--text-faint);}
  .nav-ic svg{width:18px; height:18px;}
  .navbtn:hover .nav-ic{color:var(--text-dim);}
  .navbtn.active .nav-ic{color:var(--accent);}
  .nav-text{display:flex; align-items:center; gap:7px; flex:1; min-width:0;}
  .navbtn.active{
    /* A left marker reads as "you are here" better than a pill in a vertical
       list, where pills all look like separate buttons. */
    background:rgba(var(--accent-rgb),.10); border-color:transparent;
    box-shadow:inset 2px 0 0 var(--accent);
    border-radius:0 10px 10px 0;
  }

  .topnav-right{
    /* Two icon buttons side by side, everything else full width — stacking
       all four made the foot of the rail read as a fifth nav list. */
    display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:center;
    margin-top:auto; padding-top:16px; border-top:1px solid var(--line);
  }
  .topnav-right .key-status,
  .topnav-right .plan-pill,
  #btnNewPlan{grid-column:1 / -1;}
  .topnav-right .key-status{justify-content:center;}
  .topnav-right .icon-btn{width:100%; height:38px;}
  #btnNewPlan{justify-content:center;}
  .plan-pill{text-align:center;}

  /* The page heading belongs to the content column, not the whole viewport. */
  .pagehead-inner, .view{max-width:1120px;}
}

/* Laptops in the 901–1180px band: narrow the rail so content keeps its room. */
@media (min-width:901px) and (max-width:1180px){
  #app{--rail:210px;}
  .brand .tag{display:none;}
}

/* --- catalog ---------------------------------------------------------- */
/* 348 courses as identical strips was a wall nobody could scan. Cards give
   each one a shape, and the subject sits top-left so the eye can skim by it. */
.course-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:12px; align-items:stretch;
}
.course-card{
  display:flex; flex-direction:column; gap:6px; padding:16px 17px 14px;
  border:1px solid var(--line); border-radius:14px; background:var(--surface);
  color:var(--text); text-decoration:none; position:relative; overflow:hidden;
  transition:transform .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.course-card::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg, var(--accent), var(--accent-2));
  opacity:.65;
}
.course-card:hover{
  transform:translateY(-2px); border-color:rgba(var(--accent-rgb),.5); box-shadow:var(--shadow);
}
.course-card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.cx-subject{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--accent);
}
.cx-title{
  font-size:14.5px; font-weight:650; line-height:1.35; text-wrap:balance;
  /* Titles run long and wildly uneven; three lines keeps the grid honest. */
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.cx-platform{font-size:12.5px; color:var(--text-muted);}
.cx-foot{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-top:auto; padding-top:10px;
}
.cx-tags{display:flex; gap:5px; flex-wrap:wrap;}
.cx-tag{
  font-size:10px; letter-spacing:.03em; padding:2px 7px; border-radius:99px;
  border:1px solid var(--line); color:var(--text-faint); white-space:nowrap;
}
.cx-tag.free{color:var(--success); border-color:rgba(52,211,153,.35);}
.cx-tag.plays{color:var(--accent); border-color:rgba(var(--accent-rgb),.35);}
.cx-go{display:flex; color:var(--text-faint); flex:0 0 auto;}
.course-card:hover .cx-go{color:var(--accent);}
.more-row{
  display:flex; align-items:center; justify-content:center; gap:14px;
  margin-top:20px; font-size:13px; color:var(--text-faint);
}

/* --- settings --------------------------------------------------------- */
/* Setup steps are a one-time, owner-only chore. Folded away they stop
   dominating a screen everyone else has to read past. */
.setup{
  margin-top:14px; border-top:1px solid var(--line); padding-top:12px;
}
.setup summary{
  cursor:pointer; font-size:13px; font-weight:600; color:var(--accent);
  list-style:none; display:flex; align-items:center; gap:7px;
}
.setup summary::-webkit-details-marker{display:none;}
.setup summary::before{
  content:"›"; display:inline-block; transition:transform .18s var(--ease);
  font-size:16px; line-height:1;
}
.setup[open] summary::before{transform:rotate(90deg);}
.setup summary:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px;}
.setup-steps{
  margin:12px 0 0; padding-left:20px; font-size:13.5px; line-height:1.6;
  color:var(--text-muted);
}
.setup-steps li{margin-bottom:6px;}
.setup .desc{margin:10px 0 0; font-size:12.5px;}

/* --- plan detail ------------------------------------------------------ */
/* Each day used ~220px for a single lesson. Tightening the rhythm means a
   week fits on one screen instead of three. */
.day-row{padding:12px 0 !important;}
.class-card{padding:10px !important; margin-bottom:8px !important; gap:11px !important;}
.class-card:hover{transform:none;}
.cc-title{font-size:14.5px;}
.cc-meta{font-size:12px;}
/* Reminder time is a niche control that was as loud as the lesson title. */
.cc-controls input[type="time"]{
  width:34px; opacity:.4; transition:width .18s var(--ease), opacity .18s var(--ease);
}
.cc-controls input[type="time"]:hover,
.cc-controls input[type="time"]:focus,
.class-card:hover .cc-controls input[type="time"]{width:120px; opacity:1;}

/* The add-lesson/add-to-do row was hidden with opacity alone, which still
   reserves its box — roughly 40px of invisible dead space on every day, so a
   fortnight's plan carried half a screen of nothing. Collapse the height too. */
.day-actions{
  max-height:0; margin-top:0; overflow:hidden;
  transition:max-height .2s var(--ease), opacity .2s var(--ease), margin-top .2s var(--ease);
}
.day-row:hover .day-actions,
.day-row:focus-within .day-actions{opacity:1; max-height:60px; margin-top:9px;}
@media (hover:none){
  /* No hover on touch, so keep them permanently available rather than
     unreachable. */
  .day-actions{opacity:1; max-height:60px; margin-top:9px;}
}

/* --- command palette --- */
.palette-overlay{
  position:fixed; inset:0; z-index:200; display:flex; justify-content:center;
  align-items:flex-start; padding:12vh 16px 16px;
  background:rgba(4,3,10,.62); backdrop-filter:blur(7px);
  opacity:0; transition:opacity .16s ease;
}
.palette-overlay.open{opacity:1;}
.palette-box{
  width:min(660px,100%); max-height:70vh; display:flex; flex-direction:column;
  background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden;
  box-shadow:0 28px 80px rgba(0,0,0,.5);
  transform:translateY(-8px) scale(.99); transition:transform .16s ease;
}
.palette-overlay.open .palette-box{transform:none;}
.palette-search{display:flex; align-items:center; gap:11px; padding:15px 17px; border-bottom:1px solid var(--line);}
.palette-search-ic{display:flex; color:var(--text-faint);}
.palette-search input{
  flex:1; border:0; background:transparent; color:var(--text); font-size:16px; padding:0; outline:none;
}
.palette-list{overflow-y:auto; padding:7px; flex:1; min-height:60px;}
.palette-item{
  width:100%; display:flex; align-items:center; gap:11px; padding:10px 12px;
  border:0; background:transparent; color:var(--text); border-radius:10px;
  cursor:pointer; text-align:left; font:inherit;
}
.palette-item.active{background:rgba(var(--accent-rgb),.14);}
.palette-ic{display:flex; color:var(--text-faint); flex:0 0 auto;}
.palette-item.active .palette-ic{color:var(--accent);}
.palette-label{flex:0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.palette-hint{
  flex:1 1 auto; font-size:12px; color:var(--text-faint);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.palette-kind{
  flex:0 0 auto; font-family:var(--font-mono); font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--text-faint);
  border:1px solid var(--line); border-radius:99px; padding:2px 8px;
}
.palette-empty{padding:26px; text-align:center; color:var(--text-faint); font-size:14px;}
.palette-foot{
  display:flex; gap:16px; padding:9px 16px; border-top:1px solid var(--line);
  font-size:11px; color:var(--text-faint); background:var(--surface);
}
kbd{
  font-family:var(--font-mono); font-size:10px; padding:2px 6px; border-radius:5px;
  border:1px solid var(--line); background:var(--surface); color:var(--text-dim);
}
.shortcut-list{display:flex; flex-direction:column; gap:2px; margin-top:12px;}
.shortcut-row{
  display:flex; justify-content:space-between; align-items:center; gap:14px;
  padding:9px 2px; border-bottom:1px solid var(--line); font-size:14px;
}
.shortcut-row:last-child{border-bottom:0;}
.shortcut-row em{font-style:normal; color:var(--text-faint); font-size:11px;}

/* --- review --- */
.due-dot{
  display:inline-grid; place-items:center; min-width:17px; height:17px; padding:0 5px;
  margin-left:6px; border-radius:99px; font-size:10px; font-weight:700;
  background:var(--accent); color:#fff;
}
.review-wrap{max-width:660px; margin:0 auto; display:flex; flex-direction:column; gap:16px;}
.review-progress{height:3px; border-radius:99px; background:var(--surface); overflow:hidden;}
.review-progress div{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .3s ease;}
.review-meta{
  display:flex; justify-content:space-between; font-family:var(--font-mono);
  font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--text-faint);
}
.review-card{
  background:var(--panel); border:1px solid var(--line); border-radius:18px;
  padding:34px 28px; min-height:230px; display:flex; flex-direction:column;
  justify-content:center; gap:20px; text-align:center;
}
.review-card.revealed{text-align:left;}
.review-face p{font-size:20px; line-height:1.45; margin:0; white-space:pre-wrap;}
.review-face.back{border-top:1px solid var(--line); padding-top:20px;}
.review-face.back p{font-size:17px; color:var(--text-dim);}
.review-label{
  display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--text-faint); margin-bottom:10px;
}
.review-hint{display:block; margin-top:9px; font-size:12px; color:var(--text-faint);}
.grade-row{display:grid; grid-template-columns:repeat(4,1fr); gap:9px;}
.grade{
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:13px 6px;
  border-radius:12px; border:1px solid var(--line); background:var(--panel);
  color:var(--text); cursor:pointer; font:inherit;
  transition:transform .15s ease, border-color .15s ease;
}
.grade:hover{transform:translateY(-2px);}
.grade strong{font-size:14px;}
.grade span{font-size:11px; color:var(--text-faint);}
.grade kbd{margin-top:3px;}
.grade.again:hover{border-color:var(--danger);} .grade.again strong{color:var(--danger);}
.grade.hard:hover{border-color:var(--gold);}   .grade.hard strong{color:var(--gold);}
.grade.good:hover{border-color:var(--accent);} .grade.good strong{color:var(--accent);}
.grade.easy:hover{border-color:var(--success);}.grade.easy strong{color:var(--success);}
@media (max-width:560px){ .grade-row{grid-template-columns:repeat(2,1fr);} }

.card-list{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
.mini-card{
  display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  padding:12px 14px; border:1px solid var(--line); border-radius:11px; background:var(--surface);
}
.mini-card strong{font-size:14px;}
.mini-card .desc{margin:3px 0 0; font-size:13px;}
.card-meta{font-family:var(--font-mono); font-size:10px; color:var(--text-faint);}

/* --- insights --- */
.insights-wrap{display:flex; flex-direction:column; gap:16px;}
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px;}
.stat-tile{
  background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px;
  display:flex; flex-direction:column; gap:3px; position:relative; overflow:hidden;
}
.stat-tile b{font-size:34px; font-weight:800; letter-spacing:-1.5px; line-height:1.05;}
.stat-tile span:last-child{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--text-faint);
}
.stat-ic{
  position:absolute; top:14px; right:14px; color:var(--accent); opacity:.5;
}
.heat-scroll{overflow-x:auto; padding-bottom:6px; margin-top:12px;}
.heatmap{display:flex; gap:3px; min-width:max-content;}
.heat-week{display:flex; flex-direction:column; gap:3px;}
.heat-day{width:11px; height:11px; border-radius:3px; background:var(--surface); display:block;}
.heat-day.l1{background:rgba(var(--accent-rgb),.30);}
.heat-day.l2{background:rgba(var(--accent-rgb),.52);}
.heat-day.l3{background:rgba(var(--accent-rgb),.76);}
.heat-day.l4{background:var(--accent);}
.heat-key{
  display:flex; align-items:center; gap:4px; margin-top:11px;
  font-size:11px; color:var(--text-faint);
}
.heat-key span:first-child{margin-right:3px;} .heat-key span:last-child{margin-left:3px;}
.bars{display:flex; align-items:flex-end; gap:7px; height:130px; margin-top:14px;}
.bar-col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; height:100%;}
.bar{
  width:100%; border-radius:5px 5px 2px 2px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2)); min-height:3px;
  transition:height .4s cubic-bezier(.2,.7,.3,1);
}
.bar-col span{font-family:var(--font-mono); font-size:9px; color:var(--text-faint);}
.insight-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px;}
.subject-row{margin-top:13px;}
.subject-top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;}
.subject-bar{height:6px; border-radius:99px; background:var(--surface); overflow:hidden;}
.subject-bar div{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.total-list{margin-top:12px;}
.total-row{
  display:flex; justify-content:space-between; gap:12px; padding:9px 0;
  border-bottom:1px solid var(--line); font-size:14px;
}
.total-row:last-child{border-bottom:0;}
.total-row span{color:var(--text-muted);}

/* --- lesson notes --- */
.notes-panel{
  /* .class-card is a wrapping flex row, so a full basis is what forces this
     onto its own line beneath the controls rather than squeezing in beside
     them. grid-column would be ignored here. */
  flex:1 0 100%; margin-top:11px; padding-top:12px; border-top:1px solid var(--line);
}
.notes-list{display:flex; flex-direction:column; gap:5px; margin-bottom:10px;}
.note{display:flex; align-items:flex-start; gap:9px; font-size:13.5px; line-height:1.5;}
.note-at{
  flex:0 0 auto; font-family:var(--font-mono); font-size:11px; font-weight:600;
  color:var(--accent); background:rgba(var(--accent-rgb),.12);
  border:1px solid rgba(var(--accent-rgb),.28); border-radius:6px;
  padding:1px 7px; cursor:pointer; min-width:46px; text-align:center;
}
.note-at:hover{background:rgba(var(--accent-rgb),.22);}
.note-at.plain{
  color:var(--text-faint); background:transparent; border-color:var(--line); cursor:default;
}
.note-text{flex:1; word-break:break-word;}
.note-empty{margin:0 0 10px; font-size:12.5px;}
.note-compose{display:flex; gap:8px;}
.note-input{
  flex:1; padding:8px 11px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface); color:var(--text); font:inherit; font-size:13.5px;
}
.icon-btn.xs{width:22px; height:22px; flex:0 0 auto; opacity:.5;}
.icon-btn.xs:hover{opacity:1; color:var(--danger);}
.icon-btn.has-notes{color:var(--accent); border-color:rgba(var(--accent-rgb),.4);}
.note-count{
  position:absolute; top:-4px; right:-4px; min-width:14px; height:14px; padding:0 3px;
  border-radius:99px; background:var(--accent); color:#fff;
  font-size:9px; font-weight:700; display:grid; place-items:center;
}
.icon-btn{position:relative;}

/* --- catch up --- */
.catchup{
  display:flex; align-items:center; gap:13px; flex-wrap:wrap; margin-bottom:18px;
  padding:14px 16px; border-radius:13px; font-size:13.5px;
  border:1px solid rgba(251,191,36,.35); background:rgba(251,191,36,.08);
}
.catchup>div{flex:1 1 260px;}
.catchup .ic-sm{color:var(--gold); flex:0 0 auto;}

/* --- subscription surfaces --- */
.plan-pill{
  font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.14em;
  padding:6px 13px; border-radius:99px; border:1px solid var(--line);
  background:var(--surface); color:var(--text-faint); cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.plan-pill:hover{transform:translateY(-1px); border-color:var(--accent);}
.plan-pill.pro{
  border-color:transparent; color:#fff;
  background:linear-gradient(120deg,var(--accent),var(--accent-2));
  box-shadow:0 4px 16px rgba(var(--accent-rgb),.35);
}
.plan-pill.pending{border-color:var(--gold); color:var(--gold);}
.plan-pill.free{border-color:rgba(var(--accent-rgb),.45); color:var(--accent);}

.upgrade-wrap{display:flex; flex-direction:column; gap:20px; max-width:940px; margin:0 auto;}
.upgrade-hero{padding:8px 2px 0;}
.upgrade-hero h1{font-size:clamp(30px,4.6vw,46px); line-height:1.08; letter-spacing:-1.6px; margin:12px 0 12px;}
.upgrade-hero .grad{
  background:linear-gradient(100deg,var(--accent),var(--accent-3));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.upgrade-hero p{color:var(--text-muted); max-width:56ch; margin:0;}
.eyebrow{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--accent); display:inline-flex; align-items:center; gap:7px;
}
.notice{
  display:flex; gap:11px; align-items:flex-start; margin-top:18px; padding:13px 15px;
  border:1px solid rgba(var(--accent-rgb),.35); border-radius:12px;
  background:rgba(var(--accent-rgb),.07); font-size:14px;
}
.notice.pending{border-color:rgba(245,158,11,.4); background:rgba(245,158,11,.08);}
.notice p{margin:0;}

.plan-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;}
.plan-card{
  position:relative; text-align:left; padding:22px; border-radius:16px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  display:flex; flex-direction:column; gap:4px;
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.plan-card:hover{transform:translateY(-3px); border-color:rgba(var(--accent-rgb),.55);}
.plan-card.featured{border-color:rgba(var(--accent-rgb),.4);}
.plan-card.selected{
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent), 0 12px 34px rgba(var(--accent-rgb),.22);
}
.plan-card .badge{position:absolute; top:14px; right:14px;}
.plan-name{font-family:var(--font-mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint);}
.plan-price{font-size:38px; font-weight:800; letter-spacing:-1.6px; line-height:1.1;}
.plan-period{font-size:13px; color:var(--text-muted);}
.plan-cta{
  margin-top:14px; display:inline-flex; align-items:center; gap:6px;
  font-size:13px; font-weight:600; color:var(--accent);
}

.method-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
.method-card{
  display:flex; flex-direction:column; gap:3px; padding:14px; border-radius:12px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--text); text-align:left;
  transition:border-color .18s ease, transform .18s ease;
}
.method-card:hover{transform:translateY(-2px); border-color:rgba(var(--accent-rgb),.5);}
.method-card.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.method-name{font-weight:650; font-size:14px;}
.method-account{font-family:var(--font-mono); font-size:11px; color:var(--text-faint);}

.pay-steps{display:flex; flex-direction:column; gap:14px; margin:16px 0 18px;}
.pay-step{display:flex; gap:12px; align-items:flex-start; font-size:14px;}
.pay-step .desc{display:block; margin-top:3px;}
.step-n{
  flex:0 0 auto; width:24px; height:24px; border-radius:50%;
  display:grid; place-items:center; font-size:12px; font-weight:700;
  background:rgba(var(--accent-rgb),.14); color:var(--accent);
}
.copyable{
  font-family:var(--font-mono); font-size:14px; font-weight:600; cursor:pointer;
  background:rgba(var(--accent-rgb),.1); color:var(--accent);
  border:1px solid rgba(var(--accent-rgb),.3); border-radius:7px; padding:2px 9px;
  display:inline-flex; align-items:center; gap:6px;
}
.copyable:hover{background:rgba(var(--accent-rgb),.18);}

.code-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;}
.code-row input{flex:1 1 220px;}

.feature-list{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; margin-top:14px;}
.feature{display:flex; gap:11px; align-items:flex-start;}
.feature strong{display:block; font-size:14px; margin-bottom:2px;}
.feature .desc{margin:0; font-size:13px;}
.feature-ic{
  flex:0 0 auto; width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
  background:rgba(var(--accent-rgb),.12); color:var(--accent);
}
.pro-active{
  border-color:rgba(var(--accent-rgb),.4);
  background:linear-gradient(140deg, rgba(var(--accent-rgb),.10), transparent 62%), var(--panel);
}
.chat-empty.locked .big-ic{color:var(--accent);}

.pagehead{border-bottom:1px solid var(--line);}
.pagehead-inner{
  max-width:1240px; margin:0 auto; padding:11px 24px;
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
}
.pagehead h1{
  font-family:var(--font-mono); font-size:11px; font-weight:600; margin:0;
  text-transform:uppercase; letter-spacing:.2em; color:var(--text-dim);
}
.pagehead .sub{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); letter-spacing:.08em;}

main{flex:1; display:flex; flex-direction:column; min-width:0;}
.view{flex:1; max-width:1240px; width:100%; margin:0 auto; padding:32px 24px 96px;}
.view.view-anim{animation:fadeIn .18s var(--ease);}

/* ===================== Buttons / inputs ===================== */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:11px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--text);
  font-weight:600; font-size:13px; cursor:pointer; position:relative; overflow:hidden;
  transition:transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.btn:hover{transform:translateY(-1px); border-color:var(--accent); box-shadow:var(--glow); background:var(--surface-2);}
.btn:active{transform:translateY(0) scale(.97);}
.btn.primary{
  border:none; color:#04121a; font-weight:700;
  background:linear-gradient(120deg, var(--accent), var(--accent-2));
  box-shadow:0 8px 26px -10px rgba(34,211,238,.7);
}
:root[data-theme="light"] .btn.primary{color:#fff;}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .btn.primary{color:#fff;} }
.btn.primary::after{
  content:""; position:absolute; top:0; bottom:0; width:36%; pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.42), transparent);
  transform:translateX(-120%);
}
.btn.primary:hover::after{animation:sweep .75s var(--ease);}
.btn.primary:hover{box-shadow:0 12px 34px -10px rgba(34,211,238,.85);}
.btn.danger{color:var(--danger); border-color:rgba(251,113,133,.35);}
.btn.danger:hover{background:rgba(251,113,133,.12); border-color:var(--danger); box-shadow:0 0 24px -6px rgba(251,113,133,.5);}
.btn.small{padding:6px 12px; font-size:12px; border-radius:9px;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}

input[type=text], input[type=number], input[type=password], input[type=time], input[type=date], select, textarea{
  background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:11px;
  padding:10px 13px; font-size:13.5px; font-family:inherit; width:100%; outline:none;
  transition:border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
input:focus, select:focus, textarea:focus{border-color:var(--accent); box-shadow:var(--glow); background:var(--surface-2);}
/* Scoped away from labels that are styled as something else (the file-picker
   is a <label class="btn">, and would otherwise render uppercase mono). */
label:not(.btn):not(.watch-done-toggle):not(.quiz-opt){
  font-family:var(--font-mono); font-size:10px; color:var(--text-faint); font-weight:500;
  display:block; margin-bottom:7px; text-transform:uppercase; letter-spacing:.14em;
}
.field{margin-bottom:16px;}
.row{display:flex; gap:14px;}
.row > .field{flex:1;}

.chip-row{display:flex; flex-wrap:wrap; gap:9px;}
.chip{
  padding:7px 14px; border-radius:99px; border:1px solid var(--line); background:var(--surface);
  color:var(--text-dim); font-size:12.5px; cursor:pointer; font-weight:500;
  transition:transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.chip:hover{transform:translateY(-1px); border-color:var(--accent); color:var(--text);}
.chip:active{transform:translateY(0) scale(.96);}
.chip.selected{
  background:var(--accent-soft); border-color:var(--accent); color:var(--accent);
  box-shadow:var(--glow);
}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px;
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
}
.badge{
  display:inline-block; font-family:var(--font-mono); font-size:9.5px; font-weight:600;
  text-transform:uppercase; letter-spacing:.15em; padding:4px 10px; border-radius:99px;
  background:var(--accent-soft); color:var(--accent); border:1px solid rgba(34,211,238,.28);
}
.badge.gold{background:var(--gold-soft); color:var(--gold); border-color:rgba(251,191,36,.3);}

/* ===================== Chat ===================== */
.chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 230px); min-height:430px;}
.chat-scroll{flex:1; overflow-y:auto; padding:4px 2px 12px;}
.msg{display:flex; gap:13px; max-width:800px; margin:0 auto 22px; animation:riseIn var(--dur) var(--ease) both;}
.msg .avatar{
  width:34px; height:34px; border-radius:11px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; border:1px solid var(--line);
}
.msg.user .avatar{background:var(--surface-2); color:var(--text-dim);}
.msg.assistant .avatar{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border:none; box-shadow:var(--glow);}
.msg .bubble{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 17px;
  flex:1; min-width:0; backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
}
.msg.user .bubble{background:var(--accent-soft); border-color:rgba(34,211,238,.2);}
.msg .bubble p{margin:0 0 9px;}
.msg .bubble p:last-child{margin-bottom:0;}
.msg .bubble ul{margin:6px 0; padding-left:20px;}
.msg .bubble code{background:rgba(0,0,0,.3); padding:2px 6px; border-radius:6px; font-family:var(--font-mono); font-size:12.5px;}
.msg .status-line{
  font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-bottom:10px;
  display:flex; align-items:center; gap:8px; text-transform:uppercase; letter-spacing:.12em;
}
.status-line .ic, .plan-chip-loading .ic{color:var(--accent); animation:glowPulse 1.6s ease-in-out infinite;}
.plan-chip{
  margin-top:10px; padding:14px 16px; border-radius:var(--radius); cursor:pointer; font-size:13.5px; font-weight:600;
  background:linear-gradient(120deg, var(--accent-soft), rgba(139,92,246,.12));
  border:1px solid rgba(34,211,238,.3); color:var(--text); box-shadow:var(--glow);
  display:flex; align-items:center; gap:10px;
  transition:transform var(--dur-fast) var(--ease);
}
.plan-chip:hover{transform:translateY(-2px);}
.plan-chip.plan-chip-loading{
  cursor:default; background:var(--surface); border-color:var(--line); color:var(--text-dim); box-shadow:none; transform:none;
}
.dotpulse{display:inline-flex; gap:4px;}
.dotpulse span{width:6px;height:6px;border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); animation:pulse 1.2s infinite ease-in-out;}
.dotpulse span:nth-child(2){animation-delay:.2s;} .dotpulse span:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,80%,100%{opacity:.25; transform:scale(.8);} 40%{opacity:1; transform:scale(1);}}

.chat-empty{max-width:560px; margin:56px auto; text-align:center;}
.chat-empty .big-ic{margin-bottom:18px; color:var(--accent); display:flex; justify-content:center; filter:drop-shadow(0 0 16px rgba(34,211,238,.6));}
.chat-empty h2{font-size:28px; margin:0 0 10px;}
.chat-empty p{color:var(--text-dim); margin:0 0 24px; font-size:14px;}

.chat-input-bar{border-top:1px solid var(--line); padding:16px 0 0;}
.chat-input-row{max-width:800px; margin:0 auto; display:flex; gap:10px; align-items:flex-end;}
.chat-input-row textarea{resize:none; min-height:46px; max-height:170px;}
.chat-hint{
  max-width:800px; margin:9px auto 0; font-family:var(--font-mono); font-size:9.5px;
  color:var(--text-faint); text-transform:uppercase; letter-spacing:.14em;
}

/* ===================== Plans ===================== */
.plans-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(285px,1fr)); gap:18px;}
.plan-card{
  cursor:pointer; position:relative; overflow:hidden;
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.plan-card::before{
  content:""; position:absolute; inset:0; border-radius:var(--radius); pointer-events:none; opacity:0;
  background:linear-gradient(120deg, rgba(34,211,238,.10), transparent 45%, rgba(139,92,246,.10));
  transition:opacity var(--dur) var(--ease);
}
.plan-card:hover{transform:translateY(-4px); border-color:var(--line-2); box-shadow:var(--shadow-lg), var(--glow);}
.plan-card:hover::before{opacity:1;}
.plan-card:active{transform:translateY(-1px);}
.plan-card h3{margin:12px 0 6px; font-size:18px;}
.plan-card .meta{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); letter-spacing:.06em; margin-bottom:14px;}
.progress-track{height:6px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden; margin-top:10px;}
.progress-fill{
  height:100%; border-radius:99px; transition:width var(--dur-slow) var(--ease);
  background:linear-gradient(90deg, var(--accent), var(--accent-2));
  box-shadow:0 0 14px rgba(34,211,238,.7);
}
.plan-card-foot{
  display:flex; justify-content:space-between; align-items:center; margin-top:12px;
  font-family:var(--font-mono); font-size:10px; color:var(--text-faint); letter-spacing:.06em;
}

.detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:28px; flex-wrap:wrap;}
.detail-head h2{margin:8px 0 8px; font-size:32px; max-width:18ch;}
.detail-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}

/* Week blocks */
.week-block{
  margin-bottom:16px; border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden;
  background:var(--surface); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  transition:border-color var(--dur) var(--ease);
}
.week-block.open{border-color:var(--line-2);}
.week-head{
  padding:16px 20px; cursor:pointer; display:flex; align-items:center; gap:12px; justify-content:space-between;
  transition:background var(--dur-fast) var(--ease);
}
.week-head:hover{background:var(--surface-2);}
.week-head .title{font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:-.02em;}
.week-head .theme{font-size:12.5px; color:var(--text-dim); font-weight:400;}
.week-body-grid{display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--dur-slow) var(--ease);}
.week-body{overflow:hidden; padding:0 20px; min-height:0;}
.week-block.open .week-body-grid{grid-template-rows:1fr;}
.week-block.open .week-body{padding:4px 20px 20px;}
.week-block.open .chev{transform:rotate(90deg);}
.chev{transition:transform var(--dur) var(--ease); color:var(--text-faint);}

/* Day rows */
.day-row{display:flex; gap:16px; padding:18px 0; border-top:1px solid var(--line);}
.day-row:first-child{border-top:none;}
.day-gutter{
  flex:0 0 40px; font-family:var(--font-mono); font-size:19px; font-weight:600; line-height:1;
  color:transparent; background:linear-gradient(140deg, var(--accent), var(--accent-2));
  -webkit-background-clip:text; background-clip:text; opacity:.65; padding-top:3px;
}
.day-main{flex:1; min-width:0;}
.day-head{
  display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:10px;
  color:var(--text-dim); font-weight:500; text-transform:uppercase; letter-spacing:.16em; margin-bottom:12px;
}
.day-head .date{color:var(--text-faint); letter-spacing:.08em;}
.day-head .today-flag{
  background:var(--accent-soft); color:var(--accent); padding:3px 9px; border-radius:99px;
  border:1px solid rgba(34,211,238,.3); letter-spacing:.12em; box-shadow:var(--glow);
}

.class-card{
  display:flex; gap:14px; align-items:flex-start; padding:12px; border-radius:14px;
  background:var(--surface); border:1px solid var(--line); margin-bottom:11px; flex-wrap:wrap;
  transition:transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.class-card:hover{transform:translateY(-2px); border-color:var(--line-2); box-shadow:var(--shadow);}
.class-card.done{opacity:.45;}
.class-card.done .cc-title{text-decoration:line-through;}
.class-card.rest-card{background:transparent; border-style:dashed; justify-content:center; padding:14px;}
.class-card.rest-card:hover{transform:none; box-shadow:none;}
.class-card .cc-main{flex:1; min-width:170px;}
.class-card .cc-title{font-size:14.5px; font-weight:600; line-height:1.35;}
.class-card .cc-meta{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-top:5px; letter-spacing:.04em;}
.class-card .cc-controls{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
.class-card input[type=time]{width:114px; padding:6px 9px; font-size:12px; font-family:var(--font-mono);}

/* ===================== Inline video ===================== */
.lesson-media{flex:0 0 auto; width:158px;}
.lesson-media.sm{width:112px;}
.lesson-media.expanded{flex:1 1 100%; width:100%; max-width:760px; order:99; margin-top:6px;}
.lesson-facade{
  position:relative; display:block; width:100%; aspect-ratio:16/9; padding:0; cursor:pointer;
  border:1px solid var(--line-2); border-radius:12px; overflow:hidden;
  background-size:cover; background-position:center; background-color:var(--surface-2);
  transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.lesson-facade::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,.45));
}
.lesson-facade:hover{transform:scale(1.03); border-color:var(--accent); box-shadow:var(--glow);}
.lesson-facade.icon-only{display:flex; align-items:center; justify-content:center; color:var(--text-dim);}
.lesson-facade .play-badge{
  position:absolute; inset:0; margin:auto; width:40px; height:40px; border-radius:50%; z-index:1;
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 22px rgba(34,211,238,.75);
  transition:transform var(--dur-fast) var(--ease-spring);
}
.lesson-facade:hover .play-badge{transform:scale(1.16);}
.lesson-facade .ic, .lesson-facade .play-badge, .lesson-facade .alt-flag{pointer-events:none;}
.lesson-facade .alt-flag{
  position:absolute; left:6px; bottom:6px; z-index:2;
  font-family:var(--font-mono); font-size:8px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  padding:2px 6px; border-radius:99px; color:var(--accent);
  background:rgba(4,6,14,.72); border:1px solid rgba(34,211,238,.4);
}
.week-block, .day-row{scroll-margin-top:130px;}

.lesson-embed{
  border:1px solid var(--line-2); border-radius:14px; overflow:hidden; background:#000;
  box-shadow:var(--shadow), var(--glow); animation:popIn var(--dur) var(--ease);
}
.lesson-embed .frame{position:relative; width:100%; padding-top:56.25%;}
.lesson-embed iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
.lesson-embed-bar{
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  padding:9px 12px; background:var(--surface-solid); color:var(--text-dim);
  font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.14em;
  border-top:1px solid var(--line);
}
.lesson-embed-bar .lb-actions{display:flex; gap:8px;}
.lesson-embed-bar button{
  background:var(--surface); border:1px solid var(--line); color:var(--text-dim); cursor:pointer;
  font-family:var(--font-mono); font-size:9px; text-transform:uppercase; letter-spacing:.12em;
  padding:4px 10px; border-radius:99px;
  transition:color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.lesson-embed-bar button:hover{color:var(--accent); border-color:var(--accent);}
.watch-bar{height:4px; background:rgba(255,255,255,.10); overflow:hidden;}
.watch-bar-fill{
  height:100%; width:0; background:linear-gradient(90deg, var(--accent), var(--accent-2));
  box-shadow:0 0 12px rgba(34,211,238,.8); transition:width .6s linear;
}
.watch-pct{color:var(--text-faint); align-self:center;}
.watch-pct.untracked{color:var(--warn);}
.facade-progress{
  position:absolute; left:0; right:0; bottom:0; height:4px; z-index:2;
  background:rgba(0,0,0,.55);
}
.facade-progress > span{
  display:block; height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2));
  box-shadow:0 0 10px rgba(34,211,238,.9);
}
.plan-card-remove{
  position:absolute; top:10px; right:10px; z-index:3; width:26px; height:26px; padding:0;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--text-faint);
  opacity:0; transition:opacity var(--dur) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.plan-card:hover .plan-card-remove, .plan-card-remove:focus-visible{opacity:1;}
.plan-card-remove:hover{color:var(--danger); border-color:var(--danger);}
@media (hover: none){ .plan-card-remove{opacity:1;} }

.todo-row{display:flex; align-items:center; gap:10px; font-size:13.5px; padding:4px 2px;}
.todo-input{
  flex:1; min-width:0; background:transparent; border:1px solid transparent; color:var(--text);
  padding:5px 8px; border-radius:8px; font-size:13.5px; font-family:inherit;
  transition:border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.todo-input:hover{border-color:var(--line);}
.todo-input:focus{border-color:var(--accent); background:var(--surface); box-shadow:none;}
.todo-row.done .todo-input{text-decoration:line-through; color:var(--text-faint);}
.row-del{
  flex:0 0 auto; width:24px; height:24px; padding:0; display:inline-flex;
  align-items:center; justify-content:center; cursor:pointer; border-radius:7px;
  background:transparent; border:1px solid transparent; color:var(--text-faint);
  opacity:0; transition:opacity var(--dur) var(--ease), color var(--dur-fast) var(--ease);
}
.todo-row:hover .row-del, .row-del:focus-visible{opacity:1;}
.row-del:hover{color:var(--danger); border-color:var(--danger);}
@media (hover:none){ .row-del{opacity:1;} }
.day-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; opacity:0; transition:opacity var(--dur) var(--ease);}
.day-row:hover .day-actions, .day-actions:focus-within{opacity:1;}
@media (hover:none){ .day-actions{opacity:1;} }
.icon-btn.sm{width:30px; height:30px; border-radius:9px;}
.todo-row.done .txt{text-decoration:line-through; color:var(--text-faint);}
.chk{
  width:17px; height:17px; flex:0 0 auto; accent-color:var(--accent); cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-spring);
}
.chk:active{transform:scale(1.25);}

/* ===================== Today ===================== */
.today-list{display:flex; flex-direction:column; gap:12px; max-width:860px;}
.count-badge{
  font-family:var(--font-mono); font-size:9.5px; padding:4px 10px; border-radius:99px; font-weight:600;
  text-transform:uppercase; letter-spacing:.12em; border:1px solid transparent;
}
.count-badge.warn{background:var(--gold-soft); color:var(--gold); border-color:rgba(251,191,36,.3);}
.count-badge.ok{background:var(--accent-soft); color:var(--accent); border-color:rgba(34,211,238,.3); box-shadow:var(--glow);}

/* ===================== Home ===================== */
.home-hero{
  position:relative; border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden;
  background:var(--surface); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow-lg); padding:38px 34px; margin-bottom:32px;
}
.home-hero::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(560px 260px at 88% -30%, rgba(139,92,246,.30), transparent 68%),
    radial-gradient(460px 220px at 8% 130%, rgba(34,211,238,.22), transparent 68%);
}
.home-hero::after{
  content:""; position:absolute; top:0; left:0; right:0; height:1px; pointer-events:none;
  background:linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
  opacity:.8;
}
.home-hero-inner{position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap;}
.home-eyebrow{
  font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.24em;
  color:var(--accent); margin-bottom:12px;
}
.home-title{font-size:46px; margin:0; max-width:15ch; letter-spacing:-.035em;}
.home-title em{
  font-style:normal; color:transparent;
  background:linear-gradient(120deg, var(--accent), var(--accent-2), var(--accent-3));
  -webkit-background-clip:text; background-clip:text;
}

.stat-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:16px; margin-bottom:40px;}
.stat-tile{
  padding:22px 24px; border-radius:var(--radius); border:1px solid var(--line); background:var(--surface);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); position:relative; overflow:hidden;
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.stat-tile::after{
  content:""; position:absolute; top:0; left:18px; right:18px; height:1px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent); opacity:.55;
}
.stat-tile:hover{transform:translateY(-3px); border-color:var(--line-2);}
.stat-value{
  font-family:var(--font-display); font-size:38px; font-weight:700; line-height:1; letter-spacing:-.04em;
  display:flex; align-items:center; gap:9px;
}
.stat-value .ic{color:var(--accent); filter:drop-shadow(0 0 10px rgba(34,211,238,.8));}
.stat-label{font-family:var(--font-mono); font-size:9.5px; color:var(--text-faint); margin-top:9px; text-transform:uppercase; letter-spacing:.18em;}

.home-section{margin-bottom:42px;}
.home-section-head{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.home-section-head h3{
  margin:0; font-size:11px; font-family:var(--font-mono); font-weight:600; text-transform:uppercase; letter-spacing:.22em;
  color:var(--text-dim); display:flex; align-items:center; gap:10px; white-space:nowrap;
}
.home-section-head h3::before{
  content:""; width:7px; height:7px; border-radius:50%; flex:0 0 auto;
  background:var(--accent); box-shadow:0 0 12px var(--accent);
}
.section-rule{height:1px; flex:1; min-width:20px; background:linear-gradient(90deg, var(--line-2), transparent);}

/* ===================== Bento home ===================== */
.bento{
  display:grid; gap:16px; margin-bottom:40px;
  grid-template-columns:repeat(4, 1fr);
  grid-template-areas:
    "hero hero hero ring"
    "s1   s2   s3   ring";
}
.bento-hero{grid-area:hero; padding:34px 32px; display:flex; flex-direction:column; justify-content:center;}
.bento-ring{grid-area:ring; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;}
.bento-stat:nth-of-type(3){grid-area:s1;}
.bento-stat:nth-of-type(4){grid-area:s2;}
.bento-stat:nth-of-type(5){grid-area:s3;}
.bento-stat{display:flex; flex-direction:column; justify-content:center;}
.hero-sub{color:var(--text-dim); font-size:14.5px; margin:14px 0 22px; max-width:52ch; line-height:1.6;}
.hero-actions{display:flex; gap:12px; flex-wrap:wrap;}

/* Progress ring — stroke-dashoffset carries the percentage. */
.ring{position:relative; width:150px; height:150px;}
.ring svg{width:100%; height:100%; transform:rotate(-90deg);}
.ring circle{fill:none; stroke-width:9; stroke-linecap:round;}
.ring-track{stroke:var(--line);}
.ring-fill{
  stroke:url(#ringGrad); stroke-dasharray:327;
  stroke-dashoffset:calc(327 - (327 * var(--pct,0) / 100));
  filter:drop-shadow(0 0 8px rgba(var(--accent-rgb),.7));
  transition:stroke-dashoffset 1s var(--ease);
}
.ring-label{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px;
}
.ring-label b{font-family:var(--font-display); font-size:34px; font-weight:700; letter-spacing:-.03em;}
.ring-label span{font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.18em; color:var(--text-faint);}

@media (max-width:1000px){
  .bento{grid-template-columns:repeat(2, 1fr);
    grid-template-areas:
      "hero hero"
      "ring s1"
      "s2   s3";}
}
@media (max-width:640px){
  .bento{grid-template-columns:1fr;
    grid-template-areas:"hero" "ring" "s1" "s2" "s3";}
  .bento-hero{padding:26px 20px;}
}

/* Featured paths */
.featured-grid{grid-template-columns:repeat(auto-fill, minmax(300px,1fr));}
.featured-card{
  position:relative; cursor:default; padding:0; overflow:hidden;
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.featured-card:hover{border-color:var(--line-2); box-shadow:var(--shadow-lg), var(--glow);}
.fc-band{
  padding:10px 16px; border-bottom:1px solid var(--line);
  font-family:var(--font-mono); font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.16em;
  display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--text);
  position:relative;
}
.fc-band::after{
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg, var(--accent), transparent);
}
.featured-card:nth-child(6n+1) .fc-band{background:linear-gradient(120deg, rgba(34,211,238,.22), transparent);}
.featured-card:nth-child(6n+2) .fc-band{background:linear-gradient(120deg, rgba(139,92,246,.22), transparent);}
.featured-card:nth-child(6n+3) .fc-band{background:linear-gradient(120deg, rgba(244,114,182,.20), transparent);}
.featured-card:nth-child(6n+4) .fc-band{background:linear-gradient(120deg, rgba(52,211,153,.20), transparent);}
.featured-card:nth-child(6n+5) .fc-band{background:linear-gradient(120deg, rgba(251,191,36,.20), transparent);}
.featured-card:nth-child(6n+6) .fc-band{background:linear-gradient(120deg, rgba(148,163,184,.20), transparent);}
.featured-card:nth-child(6n+2) .fc-band::after{background:linear-gradient(90deg, var(--accent-2), transparent);}
.featured-card:nth-child(6n+3) .fc-band::after{background:linear-gradient(90deg, var(--accent-3), transparent);}
.featured-card:nth-child(6n+4) .fc-band::after{background:linear-gradient(90deg, var(--success), transparent);}
.featured-card:nth-child(6n+5) .fc-band::after{background:linear-gradient(90deg, var(--gold), transparent);}
.fc-body{padding:18px 17px 17px;}
.featured-card h3{margin:0 0 8px; font-size:19px;}
.featured-card .meta{font-family:var(--font-mono); font-size:10px; color:var(--text-faint); letter-spacing:.07em; margin-bottom:12px;}
.featured-card .blurb{font-size:13px; color:var(--text-dim); line-height:1.62; margin:0 0 18px;}
.featured-card-foot{display:flex; justify-content:flex-end;}

/* ===================== Settings ===================== */
/* Multi-column rather than grid: these cards differ wildly in height, and a
   grid aligns rows — which left a short card like Appearance stranded beside
   a tall one with a column of dead space under it. Columns pack them. */
.settings-grid{columns:2; column-gap:18px;}
.settings-section{
  break-inside:avoid; -webkit-column-break-inside:avoid;
  margin:0 0 18px; width:100%;
}
/* Cards that hold long prose read better spanning the full width. */
.settings-section.wide{column-span:all;}
@media (max-width:900px){ .settings-grid{columns:1;} }
.settings-section h3{font-size:19px; margin:0 0 8px;}
.settings-section .desc{font-size:13.5px; color:var(--text-dim); margin:0 0 16px; line-height:1.65;}
.settings-section code{font-family:var(--font-mono); font-size:12px; background:rgba(0,0,0,.3); padding:2px 6px; border-radius:6px;}
.adv{margin-top:18px; border-top:1px solid var(--line); padding-top:14px;}
.adv > summary{
  cursor:pointer; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.14em; color:var(--text-faint); list-style:none; user-select:none;
  transition:color var(--dur-fast) var(--ease);
}
.adv > summary::-webkit-details-marker{display:none;}
.adv > summary::before{content:"+ "; color:var(--accent);}
.adv[open] > summary::before{content:"\2212 ";}
.adv > summary:hover{color:var(--text-dim);}
.pwd-wrap{display:flex; gap:10px;}
.pwd-wrap input{flex:1;}

/* ===================== Modal ===================== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(4,6,14,.72); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px; animation:fadeIn var(--dur) var(--ease);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.modal{
  background:var(--surface-solid); border:1px solid var(--line-2); border-radius:var(--radius-lg); padding:26px;
  max-width:560px; width:100%; max-height:88vh; overflow-y:auto;
  box-shadow:var(--shadow-lg), var(--glow); animation:popIn var(--dur) var(--ease);
}
.modal h2{margin:0 0 6px; font-size:24px;}
.modal .desc{font-size:13.5px; color:var(--text-dim); margin:0 0 20px;}
.modal-actions{display:flex; justify-content:flex-end; gap:12px; margin-top:10px;}

.watch-modal{max-width:900px; padding:24px;}
.watch-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px;}
.watch-eyebrow{font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.2em; color:var(--accent); margin-bottom:8px;}
.watch-head h2{margin:0; font-size:24px; line-height:1.2;}
.watch-player{
  position:relative; width:100%; padding-top:56.25%; overflow:hidden; background:#000;
  margin-bottom:18px; border-radius:14px; border:1px solid var(--line-2); box-shadow:var(--glow);
}
.watch-player iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
.watch-noplayer{
  padding:48px 20px; text-align:center; color:var(--text-dim); background:var(--surface);
  border:1px dashed var(--line-2); border-radius:14px; margin-bottom:18px;
}
.watch-meta{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-bottom:18px; letter-spacing:.08em;}
.watch-notes{font-family:var(--font); color:var(--text-dim); font-size:13.5px; margin:12px 0 0; line-height:1.65; letter-spacing:0;}
.watch-foot{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:18px;}
.watch-nav{display:flex; gap:10px;}
.watch-done-toggle{
  display:flex; align-items:center; gap:9px; font-size:13px; font-weight:500;
  color:var(--text-dim); cursor:pointer; margin:0;
}
.watch-external{font-family:var(--font-mono); font-size:10px; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.12em; text-decoration:none;}
.watch-external:hover{text-decoration:underline;}

/* ===================== Toasts ===================== */
#toasts{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--surface-solid); border:1px solid var(--line-2); border-radius:13px; padding:13px 16px;
  box-shadow:var(--shadow-lg); font-size:13.5px; max-width:340px;
  animation:popIn var(--dur) var(--ease-spring);
  display:flex; gap:10px; align-items:center;
  transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.toast .ic{color:var(--accent);}
.toast.error{border-color:rgba(251,113,133,.5);}
.toast.error .ic{color:var(--danger);}
.toast.success{border-color:rgba(52,211,153,.5);}
.toast.success .ic{color:var(--success);}
.toast.hide{opacity:0; transform:translateY(8px) scale(.96);}
.toast-msg{color:var(--text);}
.toast.error .toast-msg{color:var(--danger);}

/* ===================== Installed-app chrome ===================== */
.update-bar, .offline-pill{
  position:fixed; left:50%; transform:translateX(-50%); z-index:300;
  display:flex; align-items:center; gap:12px; padding:12px 16px;
  background:var(--surface-solid); border:1px solid var(--line-2); border-radius:14px;
  box-shadow:var(--shadow-lg); font-size:13.5px;
  animation:popIn var(--dur) var(--ease-spring);
  /* Sit above the iOS home indicator on installed devices. */
  bottom:calc(20px + env(safe-area-inset-bottom, 0px));
}
.offline-pill{
  bottom:auto; top:calc(12px + env(safe-area-inset-top, 0px));
  color:var(--warn); border-color:rgba(251,191,36,.45); font-size:12.5px;
}
.offline-pill .ic{color:var(--warn);}

/* Respect notches and rounded corners when installed full-screen. */
.topnav-inner{
  padding-left:max(24px, env(safe-area-inset-left));
  padding-right:max(24px, env(safe-area-inset-right));
}
.view{
  padding-left:max(24px, env(safe-area-inset-left));
  padding-right:max(24px, env(safe-area-inset-right));
  padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));
}

/* ===================== Responsive ===================== */
/* --- phone navigation --------------------------------------------------- */
.tabbar{display:none;}
.sheet-overlay{display:none;}

@media (max-width:900px){
  .topnav-inner{flex-wrap:wrap; gap:10px; min-height:56px;
    padding-left:max(14px, env(safe-area-inset-left)); padding-right:max(14px, env(safe-area-inset-right));}
  .brand{padding:10px 0; flex:1;}
  /* The tagline costs a whole line on a phone and says nothing the logo doesn't. */
  .brand .tag{display:none;}
  .brand .name{font-size:16px;}
  .brand .mark{width:32px; height:32px;}
  .navrow{
    order:3; flex:1 0 100%; border-top:1px solid var(--line); padding:7px 0; gap:2px;
    -webkit-mask-image:linear-gradient(90deg, #000 88%, transparent);
    mask-image:linear-gradient(90deg, #000 88%, transparent);
  }
  .navbtn{padding:9px 12px; font-size:12.5px;}
  .topnav-right{gap:7px;}
  .key-status{padding:5px 9px; font-size:9px;}
  .update-bar, .offline-pill{left:12px; right:12px; transform:none; justify-content:center;}
  .view{padding-top:24px; padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px));
    padding-left:max(14px, env(safe-area-inset-left)); padding-right:max(14px, env(safe-area-inset-right));}
  .pagehead-inner{padding:10px 14px;}
  .home-hero{padding:26px 20px;}
  .home-title{font-size:32px;}
  .detail-head h2{font-size:25px;}
  .day-row{gap:11px;}
  .day-gutter{flex-basis:26px; font-size:15px;}
  .lesson-media{width:118px;}
  .featured-card{transform:none !important;}
  body::after{background-size:44px 44px;}
}

@media (max-width:720px){
  /* One compact header row. The scrolling tab strip is replaced entirely by
     the bottom bar, so nothing is hidden behind a sideways swipe. */
  .navrow{display:none;}
  .topnav-inner{flex-wrap:nowrap; min-height:54px; gap:8px;}
  .brand{padding:8px 0; min-width:0;}
  .brand .name{font-size:15.5px; white-space:nowrap;}
  .brand .mark{width:29px; height:29px;}
  .topnav-right{gap:6px; flex:0 0 auto;}
  /* "AI OFF" is a developer's concern, not a learner's — the state still
     shows in Settings, and it was eating a third of the header. */
  .key-status{display:none;}
  .plan-pill{padding:6px 10px;}
  /* Collapse to a square icon button. The label is hidden rather than removed
     so the accessible name survives; the sweep pseudo-element on .btn.primary
     is left alone. */
  #btnNewPlan{width:38px; height:38px; padding:0; justify-content:center; gap:0;}
  #btnNewPlan .btn-label{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip-path:inset(50%); white-space:nowrap;
  }
  #btnNewPlan .btn-ic svg{width:19px; height:19px;}
  .icon-btn{width:38px; height:38px;}

  .tabbar{
    display:grid; grid-template-columns:repeat(5,1fr);
    position:fixed; left:0; right:0; bottom:0; z-index:120;
    /* Near-opaque: --panel is translucent, so content was legible straight
       through the bar. The blur only softens what shows at the edges. */
    background:color-mix(in srgb, var(--surface-solid) 94%, transparent);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .tabbtn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    /* 54px clears the 44px minimum tap target with room for the label. */
    min-height:54px; padding:7px 2px 6px; border:0; background:transparent;
    color:var(--text-faint); font:inherit; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .tabbtn .tab-label{font-size:10px; letter-spacing:.02em;}
  .tabbtn svg{width:21px; height:21px;}
  .tabbtn.active{color:var(--accent);}
  .tabbtn:active{background:rgba(var(--accent-rgb),.10);}
  .tab-ic-wrap{position:relative; display:flex;}
  .tab-dot{
    position:absolute; top:-3px; right:-6px; min-width:15px; height:15px; padding:0 4px;
    border-radius:99px; background:var(--accent); color:#fff;
    font-size:9px; font-weight:700; display:grid; place-items:center;
  }

  .sheet-overlay{
    display:flex; align-items:flex-end; position:fixed; inset:0; z-index:150;
    background:rgba(4,3,10,.55); backdrop-filter:blur(4px);
    opacity:0; transition:opacity .2s ease;
  }
  .sheet-overlay.open{opacity:1;}
  .sheet{
    /* Opaque, not var(--panel): the panel token is translucent, and the page
       behind was reading straight through the sheet and its tiles. */
    width:100%; background:var(--surface-solid); border-top:1px solid var(--line);
    border-radius:20px 20px 0 0; padding:10px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    transform:translateY(100%); transition:transform .24s cubic-bezier(.2,.8,.3,1);
  }
  .sheet-overlay.open .sheet{transform:none;}
  .sheet-grab{width:38px; height:4px; border-radius:99px; background:var(--line-2); margin:0 auto 16px;}
  .sheet-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
  .sheet-item{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    min-height:80px; border-radius:14px; border:1px solid var(--line);
    background:color-mix(in srgb, var(--text) 6%, var(--surface-solid));
    color:var(--text); font:inherit; font-size:12.5px; cursor:pointer;
  }
  .sheet-item svg{width:21px; height:21px; color:var(--accent);}
  .sheet-item:active{border-color:var(--accent);}

  /* Content must clear the fixed bar, not sit under it. */
  .view{padding-bottom:calc(78px + env(safe-area-inset-bottom, 0px));}
  .chat-input-bar{bottom:calc(60px + env(safe-area-inset-bottom, 0px));}

  /* --- density: desktop spacing reads as clumsy at 390px --- */
  .home-title{font-size:28px; letter-spacing:-1px;}
  .home-hero{padding:22px 17px;}
  .card, .settings-section{padding:15px;}
  .view{padding-top:18px;}
  h2{font-size:21px;}
  h3{font-size:15px;}
  .stat-tile{padding:15px;}
  .stat-tile b{font-size:27px;}
  .upgrade-hero h1{font-size:27px;}
  .plan-price{font-size:31px;}
  /* The toast sat above the tab bar at desktop width and read as a banner.
     Pin it to the content width and keep it clear of the bar. */
  #toasts{left:12px; right:12px; bottom:calc(72px + env(safe-area-inset-bottom, 0px)); align-items:stretch;}
  .toast{font-size:12.5px; padding:10px 13px; max-width:none; border-radius:11px;}

  /* A long plan title shouldn't become a three-line pill beside a to-do. */
  .todo-row .badge, .badge{
    max-width:42vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* Lesson controls wrapped into a cramped second row; give them their own
     line with real tap targets instead. */
  .cc-controls{width:100%; justify-content:flex-start; flex-wrap:wrap; gap:7px;}
  .cc-controls .icon-btn.sm{width:36px; height:36px;}
  .cc-controls input[type="time"]{min-height:36px;}
  .cc-controls .chk{width:26px; height:26px;}
  .lesson-media{width:104px;}
  .detail-actions{width:100%;}
  .detail-actions .btn{flex:1 1 auto;}
  .grade-row{grid-template-columns:repeat(2,1fr);}
  .review-card{padding:24px 18px;}
  .review-face p{font-size:18px;}
}

@media (max-width:400px){
  /* Five labels stop fitting around here; the icons still carry the meaning. */
  .tabbtn .tab-label{font-size:9.5px;}
  .brand .name{font-size:14.5px;}
}
@media print{
  .topnav, .pagehead, .chat-input-bar, .lesson-media{display:none !important;}
  body{background:#fff; color:#000;}
  body::before, body::after{display:none;}
  .card, .week-block{box-shadow:none;}
}
</style>

<body>
<div id="app">

  <header class="topnav">

        <img class="mark" src="icon.svg" width="38" height="38" alt="" aria-hidden="true">

      <nav class="navrow" aria-label="Main">

        <button class="navbtn" data-nav="chat"><span class="nav-ic" data-icon-slot="chat"></span><span class="nav-text">Chat</span></button>
        <button class="navbtn" data-nav="plans"><span class="nav-ic" data-icon-slot="clipboard"></span><span class="nav-text">Plans</span></button>

        <button class="navbtn" data-nav="insights"><span class="nav-ic" data-icon-slot="flame"></span><span class="nav-text">Insights</span></button>
        <button class="navbtn" data-nav="settings"><span class="nav-ic" data-icon-slot="settings"></span><span class="nav-text">Settings</span></button>
      </nav>

      <div class="topnav-right">
        <button class="plan-pill" id="planPill" data-nav="upgrade" hidden></button>
        <span class="key-status" id="keyStatus"></span>
        <button class="icon-btn" id="btnThemeToggle" title="Toggle theme"></button>
        <button class="icon-btn" data-action="open-palette" title="Search everything (Ctrl K)" aria-label="Search everything">
          <span data-icon-slot="search"></span>
