<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Atlas — Your AI Learning Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23e07a4e'/%3E%3Ccircle cx='12' cy='12' r='7.2' fill='none' stroke='white' stroke-width='1.8'/%3E%3Cpath d='m14.1 9.9-1.4 3.8-3.8 1.4 1.4-3.8z' fill='white'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#0a0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== Design tokens ===================== */
:root{
  --bg: #0d0e12;
  --bg-elev: #131419;
  --card: #17181e;
  --card-hover: #1d1f27;
  --border: #262832;
  --text: #f0f1f5;
  --text-dim: #9a9dae;
  --text-faint: #63667a;
  --accent: #ff7a59;
  --accent-2: #8b7bff;
  --accent-soft: rgba(255,122,89,.15);
  --gold: #f2b84b;
  --gold-soft: rgba(242,184,75,.15);
  --success: #22c55e;
  --warn: #f59e0b;
  --danger: #f4645c;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 10px 30px -12px rgba(0,0,0,.55);
  --shadow-lg: 0 30px 70px -24px rgba(0,0,0,.6);
  --font-display: "Manrope", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.16,1,.3,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --dur-fast: .15s;
  --dur: .25s;
  --dur-slow: .4s;
}
:root[data-theme="light"]{
  --bg: #f7f7f9;
  --bg-elev: #ffffff;
  --card: #ffffff;
  --card-hover: #f1f1f5;
  --border: #e5e6ec;
  --text: #15161b;
  --text-dim: #5c5f6e;
  --text-faint: #8d90a0;
  --accent: #e8603f;
  --accent-2: #6f5cf0;
  --accent-soft: rgba(232,96,63,.10);
  --gold: #b8842e;
  --gold-soft: rgba(184,132,46,.12);
  --shadow: 0 10px 30px -14px rgba(30,30,45,.16);
  --shadow-lg: 0 30px 70px -24px rgba(30,30,45,.22);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg: #f7f7f9; --bg-elev:#ffffff; --card:#ffffff; --card-hover:#f1f1f5;
    --border:#e5e6ec; --text:#15161b; --text-dim:#5c5f6e; --text-faint:#8d90a0;
    --accent:#e8603f; --accent-2:#6f5cf0; --accent-soft:rgba(232,96,63,.10);
    --gold:#b8842e; --gold-soft:rgba(184,132,46,.12);
    --shadow: 0 10px 30px -14px rgba(30,30,45,.16);
    --shadow-lg: 0 30px 70px -24px rgba(30,30,45,.22);
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
@media (prefers-reduced-motion: no-preference){
  html{scroll-behavior:smooth;}
}
body{
  margin:0; color:var(--text); font-family:var(--font);
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 620px at 12% -8%, var(--accent-soft), transparent 60%),
    radial-gradient(900px 520px at 105% 0%, rgba(139,123,255,.09), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  transition:background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
h1,h2,h3{font-family:var(--font-display); font-weight:800; letter-spacing:-.01em;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}
a{color:var(--accent-2);}
button{font-family:inherit;}
.hidden{display:none !important;}
.ic{width:16px; height:16px; flex:0 0 auto; display:inline-block; vertical-align:-3px; transition:transform var(--dur) var(--ease);}
.ic.ic-sm{width:13px; height:13px;}
.ic.ic-lg{width:22px; height:22px;}
.ic.ic-xl{width:38px; height:38px;}

/* ===================== Motion ===================== */
@keyframes fadeSlideUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes popIn{from{opacity:0; transform:scale(.94) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);}}
@keyframes shimmer{0%{background-position:-200% 0;} 100%{background-position:200% 0;}}
.msg{animation:fadeSlideUp var(--dur) var(--ease) both;}
.card, .stat-tile, .class-card, .today-list > *{transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), opacity var(--dur) var(--ease);}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
}

/* ===================== Layout ===================== */
#app{display:flex; height:100vh; overflow:hidden;}
.sidebar{
  width:266px; flex:0 0 266px; background:var(--bg-elev); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:20px 14px; gap:6px; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:11px; padding:4px 8px 20px; }
.brand .mark{
  width:36px; height:36px; border-radius:11px; flex:0 0 auto; color:#fff;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 6px 16px -6px rgba(255,122,89,.5);
}
.brand .mark .ic{width:20px; height:20px;}
.brand .name{font-family:var(--font-display); font-weight:600; font-size:18px; letter-spacing:.2px; line-height:1.2;}
.brand .tag{font-size:10.5px; color:var(--text-faint); margin-top:1px; letter-spacing:.03em;}

.navbtn{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius-sm);
  color:var(--text-dim); cursor:pointer; border:none; background:transparent; text-align:left;
  font-size:14px; font-weight:500; width:100%; transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.navbtn:hover{background:var(--card-hover); color:var(--text);}
.navbtn:active{transform:scale(.98);}
.navbtn.active{background:var(--accent-soft); color:var(--accent);}
.navbtn .ic{width:18px; height:18px; flex:0 0 auto; transition:transform var(--dur) var(--ease-spring);}
.navbtn.active .ic{transform:scale(1.08);}
.navbtn .count{margin-left:auto; font-size:11px; background:var(--border); color:var(--text-dim); padding:1px 7px; border-radius:20px;}

.sidebar hr{border:none; border-top:1px solid var(--border); margin:12px 4px;}
.sidebar-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); padding:6px 12px 2px;}

.plan-item{
  display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--radius-sm);
  cursor:pointer; color:var(--text-dim); font-size:13.5px; transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.plan-item:hover{background:var(--card-hover); color:var(--text); transform:translateX(2px);}
.plan-item:active{transform:scale(.98);}
.plan-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.plan-item .dot{width:7px;height:7px;border-radius:50%; background:var(--accent-2); flex:0 0 auto;}
.plan-item .lbl{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.newplan-btn{
  margin-top:8px; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 12px; border-radius:var(--radius-sm); border:1px dashed var(--border);
  background:transparent; color:var(--text-dim); cursor:pointer; font-size:13.5px; font-weight:600;
  transition:border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.newplan-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft); transform:translateY(-1px);}
.newplan-btn:active{transform:scale(.98);}

.sidebar-footer{margin-top:auto; padding-top:10px;}
.key-status{font-size:11.5px; color:var(--text-faint); padding:8px 10px; display:flex; align-items:center; gap:6px;}
.key-status .pip{width:7px;height:7px;border-radius:50%;}
.key-status.ok .pip{background:var(--success);}
.key-status.bad .pip{background:var(--danger);}

main{flex:1; display:flex; flex-direction:column; min-width:0; height:100vh;}
.topbar{
  height:56px; flex:0 0 56px; display:flex; align-items:center; gap:12px; padding:0 20px;
  border-bottom:1px solid var(--border); background:var(--bg-elev);
}
.topbar h1{font-size:15.5px; font-weight:700; margin:0;}
.topbar .sub{font-size:12px; color:var(--text-faint);}
.topbar .spacer{flex:1;}
.icon-btn{
  border:none; background:transparent; color:var(--text-dim); cursor:pointer; padding:7px 9px;
  border-radius:var(--radius-sm); font-size:14px; transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  display:inline-flex; align-items:center; justify-content:center;
}
.icon-btn:hover{background:var(--card-hover); color:var(--text); transform:scale(1.06);}
.icon-btn:active{transform:scale(.92);}
.icon-btn .ic{vertical-align:0;}
.hamburger{display:none;}

.view{flex:1; overflow-y:auto; padding:22px 26px 60px;}
.view.view-anim{animation:fadeIn .18s var(--ease);}

/* ===================== Buttons / inputs ===================== */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:10px; border:none;
  font-weight:600; font-size:13.5px; cursor:pointer; background:var(--card);
  color:var(--text); border:1px solid var(--border);
  transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), filter var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.btn:hover{background:var(--card-hover); transform:translateY(-1px);}
.btn:active{transform:translateY(0) scale(.96);}
.btn.primary{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border:none; box-shadow:0 8px 20px -10px rgba(255,122,89,.5);}
.btn.primary:hover{filter:brightness(1.08); box-shadow:0 10px 26px -8px rgba(255,122,89,.6);}
.btn.danger{color:var(--danger); border-color:rgba(244,100,92,.4);}
.btn.danger:hover{background:rgba(244,100,92,.1);}
.btn.small{padding:6px 11px; font-size:12.5px;}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}

input[type=text], input[type=number], input[type=password], input[type=time], input[type=date], select, textarea{
  background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:9px;
  padding:9px 11px; font-size:13.5px; font-family:inherit; width:100%; outline:none;
  transition:border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
input:focus, select:focus, textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
label{font-size:12.5px; color:var(--text-dim); font-weight:600; display:block; margin-bottom:5px;}
.field{margin-bottom:14px;}
.row{display:flex; gap:12px;}
.row > .field{flex:1;}

.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  padding:7px 13px; border-radius:20px; border:1px solid var(--border); background:var(--bg);
  color:var(--text-dim); font-size:12.5px; cursor:pointer; font-weight:600;
  transition:border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.chip:hover{border-color:var(--accent); transform:translateY(-1px);}
.chip:active{transform:scale(.96);}
.chip.selected{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}

.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
.badge{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  padding:2px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent);}
.badge.gold{background:var(--gold-soft); color:var(--gold);}

/* ===================== Chat ===================== */
.chat-wrap{display:flex; flex-direction:column; height:100%;}
.chat-scroll{flex:1; overflow-y:auto; padding:24px 8px 10px;}
.msg{display:flex; gap:12px; max-width:760px; margin:0 auto 20px;}
.msg .avatar{width:30px; height:30px; border-radius:9px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:15px;}
.msg.user .avatar{background:var(--accent-soft); color:var(--accent);}
.msg.assistant .avatar{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff;}
.msg .bubble{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 15px; flex:1; min-width:0;}
.msg.user .bubble{background:var(--accent-soft); border-color:transparent;}
.msg .bubble p{margin:0 0 8px;}
.msg .bubble p:last-child{margin-bottom:0;}
.msg .bubble ul{margin:6px 0; padding-left:20px;}
.msg .bubble code{background:var(--bg); padding:1px 5px; border-radius:5px; font-size:12.5px;}
.msg .status-line{font-size:12px; color:var(--text-faint); font-style:italic; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.plan-chip{
  margin-top:6px; padding:12px 14px; border-radius:11px; background:linear-gradient(135deg, var(--accent-soft), transparent);
  border:1px solid var(--accent); color:var(--accent); font-size:13px; cursor:pointer; font-weight:600;
}
.plan-chip.plan-chip-loading{cursor:default; color:var(--text-dim); border-color:var(--border); background:var(--bg);}
.dotpulse{display:inline-flex; gap:3px;}
.dotpulse span{width:5px;height:5px;border-radius:50%; background:var(--accent); animation:pulse 1.2s infinite ease-in-out;}
.dotpulse span:nth-child(2){animation-delay:.2s;} .dotpulse span:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8);} 40%{opacity:1;transform:scale(1);}}
@keyframes gentlePulse{0%,100%{opacity:.55; transform:scale(.92);} 50%{opacity:1; transform:scale(1.08);}}
.status-line .ic, .plan-chip-loading .ic{animation:gentlePulse 1.5s ease-in-out infinite; color:var(--accent);}

.chat-empty{max-width:520px; margin:60px auto; text-align:center;}
.chat-empty .big-ic{margin-bottom:14px; color:var(--accent); display:flex; justify-content:center;}
.chat-empty h2{font-size:19px; margin:0 0 8px;}
.chat-empty p{color:var(--text-dim); margin:0 0 20px; font-size:13.5px;}

.chat-input-bar{
  border-top:1px solid var(--border); padding:14px 18px; background:var(--bg-elev);
}
.chat-input-row{max-width:760px; margin:0 auto; display:flex; gap:10px; align-items:flex-end;}
.chat-input-row textarea{resize:none; min-height:44px; max-height:160px;}
.chat-hint{max-width:760px; margin:6px auto 0; font-size:11px; color:var(--text-faint);}

/* ===================== Plans ===================== */
.plans-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:16px;}
.plan-card{cursor:pointer;}
.plan-card:hover{border-color:var(--accent); transform:translateY(-4px); box-shadow:var(--shadow);}
.plan-card:active{transform:translateY(-1px) scale(.99);}
.plan-card h3{margin:2px 0 4px; font-size:16px;}
.plan-card .meta{font-size:12px; color:var(--text-faint); margin-bottom:12px;}
.progress-track{height:6px; border-radius:5px; background:var(--bg); overflow:hidden; margin-top:10px;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:5px; transition:width var(--dur-slow) var(--ease);}
.plan-card-foot{display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:11.5px; color:var(--text-faint);}

.detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.detail-head h2{margin:0 0 6px; font-size:22px;}
.detail-actions{display:flex; gap:8px; flex-wrap:wrap;}

.week-block{margin-bottom:14px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--card);}
.week-head{
  padding:13px 16px; cursor:pointer; display:flex; align-items:center; gap:10px;
  justify-content:space-between; transition:.15s;
}
.week-head:hover{background:var(--card-hover);}
.week-head .title{font-family:var(--font-display); font-weight:600; font-size:15px;}
.week-head .theme{font-size:12px; color:var(--text-dim); font-weight:400; font-family:var(--font);}
.week-body-grid{display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--dur-slow) var(--ease);}
.week-body{overflow:hidden; padding:0 14px; min-height:0;}
.week-block.open .week-body-grid{grid-template-rows:1fr;}
.week-block.open .week-body{padding:6px 14px 14px;}
.week-block.open .chev{transform:rotate(90deg);}
.chev{transition:transform var(--dur) var(--ease); color:var(--text-faint); font-size:12px;}

.day-row{padding:12px 4px; border-top:1px solid var(--border);}
.day-row:first-child{border-top:none;}
.day-head{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:9px;}
.day-head .date{color:var(--text-faint); font-weight:500; text-transform:none; letter-spacing:0;}

.class-card{
  display:flex; gap:12px; align-items:center; padding:9px; border-radius:12px; background:var(--bg);
  border:1px solid var(--border); margin-bottom:8px; flex-wrap:wrap;
}
.class-card:hover{border-color:var(--accent); transform:translateY(-1px);}
.class-card.done{opacity:.5;}
.class-card.rest-card{opacity:.75; padding:10px 12px; background:transparent;}
.class-card .cc-main{flex:1; min-width:160px;}
.class-card .cc-title{font-size:13.5px; font-weight:600;}
.class-card .cc-meta{font-size:11px; color:var(--text-faint); margin-top:3px;}
.class-card .cc-controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.class-card input[type=time]{width:110px; padding:5px 8px; font-size:12px;}

.lesson-thumb{
  position:relative; width:126px; height:71px; flex:0 0 auto; border-radius:9px;
  background-size:cover; background-position:center; background-color:var(--card-hover);
  cursor:pointer; overflow:hidden;
}
.lesson-thumb.sm{width:92px; height:52px; border-radius:8px;}
.lesson-thumb.lesson-thumb-icon{display:flex; align-items:center; justify-content:center; color:var(--text-faint); background:var(--card-hover);}
.lesson-thumb::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 50%, rgba(0,0,0,.35));}
.lesson-thumb .play-badge{
  position:absolute; inset:0; margin:auto; width:32px; height:32px; border-radius:50%;
  background:rgba(10,10,14,.6); color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:12px; z-index:1; transition:.15s; backdrop-filter:blur(2px);
}
.lesson-thumb:hover .play-badge{background:var(--accent); transform:scale(1.1);}

.todo-row{display:flex; align-items:center; gap:8px; font-size:13px; padding:5px 2px;}
.todo-row.done .txt{text-decoration:line-through; color:var(--text-faint);}
.chk{width:16px; height:16px; accent-color:var(--accent); cursor:pointer; transition:transform var(--dur-fast) var(--ease-spring);}
.chk:active{transform:scale(1.25);}

/* ===================== Today ===================== */
.today-list{display:flex; flex-direction:column; gap:10px; max-width:760px;}
.count-badge{font-size:11.5px; padding:3px 9px; border-radius:20px; font-weight:700;}
.count-badge.warn{background:rgba(245,158,11,.15); color:var(--warn);}
.count-badge.ok{background:rgba(34,197,94,.15); color:var(--success);}

/* ===================== Home ===================== */
.home-hero{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px;}
.home-eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); font-weight:700; margin-bottom:6px;}
.home-title{font-size:26px; margin:0;}
.stat-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:14px; margin-bottom:30px; max-width:760px;}
.stat-tile{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px;}
.stat-value{font-family:var(--font-display); font-size:30px; font-weight:600; line-height:1.1;}
.stat-label{font-size:12px; color:var(--text-faint); margin-top:4px; font-weight:600;}
.home-section{margin-bottom:30px;}
.home-section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.home-section-head h3{margin:0; font-size:16px;}

/* ===================== Settings ===================== */
.settings-section{max-width:640px; margin-bottom:28px;}
.settings-section h3{font-size:14px; margin:0 0 4px;}
.settings-section .desc{font-size:12.5px; color:var(--text-faint); margin:0 0 14px;}
.pwd-wrap{display:flex; gap:8px;}
.pwd-wrap input{flex:1;}

/* ===================== Modal ===================== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px; backdrop-filter:blur(3px); animation:fadeIn var(--dur) var(--ease);
}
.modal{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:18px; padding:24px;
  max-width:520px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg);
  animation:popIn var(--dur) var(--ease);
}
.modal h2{margin:0 0 4px; font-size:18px;}
.modal .desc{font-size:12.5px; color:var(--text-faint); margin:0 0 18px;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:6px;}

/* ===================== Watch modal (in-app YouTube player) ===================== */
.watch-modal{max-width:840px; padding:20px;}
.watch-head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:14px;}
.watch-eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:700; margin-bottom:5px;}
.watch-head h2{margin:0; font-size:20px; line-height:1.25;}
.watch-player{position:relative; width:100%; padding-top:56.25%; border-radius:14px; overflow:hidden; background:#000; margin-bottom:16px; box-shadow:var(--shadow);}
.watch-player iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
.watch-noplayer{padding:44px 20px; text-align:center; color:var(--text-dim); background:var(--bg); border:1px dashed var(--border); border-radius:14px; margin-bottom:16px;}
.watch-meta{font-size:12.5px; color:var(--text-faint); margin-bottom:18px;}
.watch-notes{color:var(--text-dim); font-size:13.5px; margin:10px 0 0; line-height:1.55;}
.watch-foot{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; border-top:1px solid var(--border); padding-top:16px;}
.watch-nav{display:flex; gap:8px;}
.watch-done-toggle{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--text-dim); cursor:pointer;}
.watch-external{font-size:12.5px; color:var(--accent-2); font-weight:600; text-decoration:none;}
.watch-external:hover{text-decoration:underline;}
@media (max-width:640px){
  .watch-foot{flex-direction:column; align-items:stretch;}
  .watch-nav{justify-content:space-between;}
}

/* ===================== Toasts ===================== */
#toasts{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--card); border:1px solid var(--border); border-radius:10px; padding:11px 15px;
  box-shadow:var(--shadow-lg); font-size:13px; max-width:320px; animation:popIn var(--dur) var(--ease-spring);
  display:flex; gap:8px; align-items:center; transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.toast.error{border-color:rgba(244,100,92,.5); color:var(--danger);}
.toast.success{border-color:rgba(34,197,94,.5); color:var(--success);}
.toast.hide{opacity:0; transform:translateY(8px) scale(.96);}
.toast-msg{color:var(--text);}
.toast.error .toast-msg, .toast.success .toast-msg{color:inherit;}

/* ===================== Responsive ===================== */
@media (max-width:860px){
  .sidebar{position:fixed; left:0; top:0; bottom:0; z-index:90; transform:translateX(-100%); transition:transform var(--dur-slow) var(--ease);}
  .sidebar.open{transform:translateX(0); box-shadow:var(--shadow);}
  .hamburger{display:inline-flex;}
  .view{padding:16px;}
  .lesson-thumb{width:96px; height:56px;}
}
@media print{
  .sidebar, .topbar, .chat-input-bar{display:none !important;}
  body{background:#fff; color:#000;}
}

/* ============================================================
   Constants & tiny utilities
============================================================ */
const LS_PREFIX = "atlas_v1_";
const MAX_WEEKS = 13;
const MAX_CONTINUATIONS = 2;
const MODELS = [
  {id:"claude-opus-5", label:"Claude Opus 5 — most capable ($5 / $25 per M tokens)"},
  {id:"claude-sonnet-5", label:"Claude Sonnet 5 — near-Opus quality, ~40% cheaper ($3 / $15)"},

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function ymd(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function addDays(dateStr, n){ const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return d; }
function fmtDateNice(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  return d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
}
function getYtId(c){
  if(c.resolvedYtId) return c.resolvedYtId;
  return c.type === "video" ? extractYouTubeId(c.resourceUrl) : null;
}
function ytApiKey(){ return (state.settings.ytApiKey||"").trim(); }
async function resolveYouTubeVideoId(plan, c){
  const key = ytApiKey();
  if(!key) return null;
  const q = encodeURIComponent(`${c.title} ${c.channel||""}`.trim());
  const resp = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&q=${q}&key=${key}`);
  if(!resp.ok){
    if(resp.status === 403) throw new Error("YouTube API key was rejected (check its restrictions or daily quota).");
    throw new Error(`YouTube search failed (HTTP ${resp.status}).`);
  }
  const data = await resp.json();
  const vid = data.items && data.items[0] && data.items[0].id && data.items[0].id.videoId;
  if(!vid) return null;
  c.resolvedYtId = vid;
  plan.updatedAt = Date.now();
  persistPlans();
  return vid;
}
function extractYouTubeId(url){
  if(!url) return null;
  try{
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./,"").replace(/^m\./,"");
    if(host === "youtu.be") return u.pathname.slice(1).split("/")[0] || null;
    if(host === "youtube.com" || host === "youtube-nocookie.com"){
      if(u.pathname === "/watch") return u.searchParams.get("v");
      const m = u.pathname.match(/^\/(embed|shorts|live)\/([^/?]+)/);
      if(m) return m[2];
    }
  }catch(e){}
  return null;
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   Markdown-lite renderer (safe: escapes first)
============================================================ */
function inlineFormat(s){
  return s
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function blockFormat(escText){
  const lines = escText.split("\n");
  let html = "", inList = false;
  for(const raw of lines){
    const bullet = raw.match(/^\s*[-*]\s+(.*)/);
    if(bullet){
      if(!inList){ html += "<ul>"; inList = true; }
      html += `<li>${inlineFormat(bullet[1])}</li>`;
    } else {
      if(inList){ html += "</ul>"; inList = false; }
      if(raw.trim()==="") continue;
      html += `<p>${inlineFormat(raw)}</p>`;
    }
  }
  if(inList) html += "</ul>";
  return html;
}
function renderChatBubble(rawText){
  const fenceTag = "```cadence-plan";
  const idx = rawText.indexOf(fenceTag);
  let mainText = rawText, chip = "";
  if(idx !== -1){
    mainText = rawText.slice(0, idx);
    const after = rawText.slice(idx + fenceTag.length);
    const closed = after.includes("```");
    chip = closed
      ? `<div class="plan-chip" data-action="view-plan">${icon("calendar","ic-sm")} <strong>Learning plan generated</strong> — click to view it</div>`
      : `<div class="plan-chip plan-chip-loading">${icon("hourglass","ic-sm")} Designing your curriculum <span class="dotpulse"><span></span><span></span><span></span></span></div>`;
  }
  return blockFormat(escapeHtml(mainText.trim())) + chip;
}

/* ============================================================
   Plan data helpers
============================================================ */
function computeDateForDay(plan, weekNumber, dayNumber){
  const offset = (weekNumber-1)*7 + (dayNumber-1);
  return ymd(addDays(plan.startDate, offset));
}
function planProgress(plan){
  let total=0, done=0;
  (plan.weeks||[]).forEach(w=>(w.days||[]).forEach(d=>(d.classes||[]).forEach(c=>{
    if(c.type==="rest") return;
    total++; if(c.done) done++;
  })));
  return total ? Math.round(done/total*100) : 0;
}
function classesScheduledOn(dateStr){
  const items = [];
  state.plans.forEach(plan=>{
    (plan.weeks||[]).forEach(week=>(week.days||[]).forEach(day=>{
      if(computeDateForDay(plan, week.weekNumber, day.dayNumber) !== dateStr) return;
      (day.classes||[]).forEach(c=>{ if(c.type!=="rest") items.push({plan, week, day, c}); });
    }));
  });
  return items;
}
function computeStreak(){
  let streak = 0;
  const cursor = new Date();
  for(let i=0;i<400;i++){
    const dateStr = ymd(cursor);
    const items = classesScheduledOn(dateStr);
    const allDone = items.length > 0 && items.every(it=>it.c.done);
    if(!allDone){
      if(i===0){ cursor.setDate(cursor.getDate()-1); continue; }
      break;
    }
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function completedThisWeek(){
  const today = new Date();
  let count = 0;
  for(let i=0;i<7;i++){
    const dateStr = ymd(addDays(ymd(today), -i));
    classesScheduledOn(dateStr).forEach(it=>{ if(it.c.done) count++; });
  }
  return count;
}
function extractPlanJSON(text){
  const re = /```cadence-plan\s*([\s\S]*?)```/g;
  let m, last=null;
  while((m = re.exec(text))) last = m[1];
  if(!last) return null;
  const raw = last.trim();
  try{ return JSON.parse(raw); }
  catch(e){
    try{ return JSON.parse(raw.replace(/,(\s*[}\]])/g, "$1")); }
    catch(e2){ return null; }
  }
}
function applyPlanData(plan, data){
  const oldClassIdx = {}, oldTodoIdx = {};
  (plan.weeks||[]).forEach(w=>(w.days||[]).forEach(d=>{
    (d.classes||[]).forEach(c=>{ oldClassIdx[`${w.weekNumber}|${d.dayNumber}|${c.title}`] = c; });
    (d.todos||[]).forEach(t=>{ oldTodoIdx[`${w.weekNumber}|${d.dayNumber}|${t.text}`] = t; });
  }));

  plan.title = data.title || plan.title;
  plan.subject = data.subject || plan.subject;
  plan.language = data.language || plan.language;
  plan.durationWeeks = Math.min(MAX_WEEKS, Number(data.durationWeeks)||plan.durationWeeks);
  plan.dailyMinutes = Number(data.dailyMinutes)||plan.dailyMinutes;

  plan.weeks = (data.weeks||[]).slice(0, MAX_WEEKS).map(w=>({
    weekNumber: Number(w.weekNumber)||1,
    theme: w.theme || "",
    days: (w.days||[]).slice(0,7).map(d=>({
      dayNumber: Number(d.dayNumber)||1,
      classes: (d.classes||[]).map(c=>{
        const old = oldClassIdx[`${w.weekNumber}|${d.dayNumber}|${c.title}`];
        return {
          id: (old && old.id) || uid(),
          title: c.title || "Untitled class",
          type: c.type || "video",
          resourceUrl: c.resourceUrl || "",
          channel: c.channel || "",
          durationMinutes: Number(c.durationMinutes)||plan.dailyMinutes,
          notes: c.notes || "",
          done: (old && old.done) || false,
          completionTime: (old && old.completionTime) || null,
        };
      }),
      todos: (d.todos||[]).map(t=>{
        const old = oldTodoIdx[`${w.weekNumber}|${d.dayNumber}|${t.text}`];
        return { id:(old && old.id)||uid(), text: t.text||"", done:(old && old.done)||false };
      })
    }))
  }));
  plan.updatedAt = Date.now();
  persistPlans();
}

/* ============================================================
   Claude API — system prompt, streaming call, continuation loop
============================================================ */
function buildSystemPrompt(plan){
  const langLabel = LANGS[plan.language] || "English";
  return `You are Atlas, an expert personal learning coach and curriculum designer helping one learner build a real, achievable self-study plan.

LEARNER CONTEXT
- Subject / goal: ${plan.subject}
- Content language for resources: ${langLabel}
- Current level: ${plan.level}
- Duration: ${plan.durationWeeks} week(s) (hard max ${MAX_WEEKS} weeks, ~3 months)
- Daily study time available: ${plan.dailyMinutes} minutes
- Rest days per week: ${(plan.daysOff&&plan.daysOff.length) ? plan.daysOff.join(", ") : "none specified, use your judgement"}
- Today's date: ${ymd(new Date())}

RESEARCH REQUIREMENT
Use the web_search and web_fetch tools to find REAL, currently available, FREE YouTube videos that teach this subject in ${langLabel}. Prefer well-known, reputable educators/channels for that language and subject.
- Every "video" class's resourceUrl MUST be a link to one specific, individual YouTube video (a real youtube.com/watch?v=... or youtu.be/... URL for one exact video) — NEVER a channel homepage, a playlist page, a search-results URL, or an instruction like "search this channel for X". The app embeds this exact URL as a video player, so it must point straight at one playable video.
- Never invent a URL — every resourceUrl must come from an actual search result you found this conversation, and should be plausible as a real, currently-playable video (use web_fetch to spot-check ones you're unsure of).
- If you cannot find a strong specific-video match for a day, pick the single best real individual video you did find (even if imperfect) rather than falling back to a channel or a "search for" note — a specific video is always required for type "video".

OUTPUT FORMAT
Once you have enough information (ask brief clarifying questions first if something important is missing), respond with a short friendly note OUTSIDE any code fence, then ALWAYS append the FULL current plan as one single fenced block starting with \`\`\`cadence-plan and ending with \`\`\`, containing STRICT JSON (no comments, no trailing commas) in exactly this shape:

\`\`\`cadence-plan
{
  "title": "short plan title",
  "subject": "${plan.subject}",
  "language": "${plan.language}",
  "durationWeeks": ${plan.durationWeeks},
  "dailyMinutes": ${plan.dailyMinutes},
  "weeks": [
    {
      "weekNumber": 1,
      "theme": "what this week focuses on",
      "days": [
        {
          "dayNumber": 1,
          "classes": [
            {
              "title": "class / video title",
              "type": "video",
              "resourceUrl": "https://www.youtube.com/watch?v=...",
              "channel": "channel name",
              "durationMinutes": 30,
              "notes": "what to do / focus on"
            }
          ],
          "todos": [ { "text": "short actionable todo for the day" } ]
        }
      ]
    }
  ]
}
\`\`\`

RULES FOR THE JSON
- Every week object must contain exactly 7 entries in "days" (dayNumber 1-7), even rest days — use "type":"rest" with an empty or near-empty classes array and a light todo like "Review this week's notes".
- classes[].type is one of: "video", "practice", "reading", "quiz", "rest".
- Total class duration for a day should roughly match the learner's daily study time.
- durationWeeks must never exceed ${MAX_WEEKS}.
- Always output the WHOLE plan (every week decided so far), never a partial diff — even when the learner only asked to tweak one part.
- Never include dates or clock times in the JSON — the learner sets their own daily completion time in the app.
- Talk to the learner in whichever language they write to you in, but keep resourceUrl/channel values exactly as found.
- Keep the prose outside the code fence brief (a few sentences) — the plan JSON itself carries the detail.`;
}

async function sendToClaude(plan, userText, {onStatus, onChunk} = {}){
  const apiKey = (state.settings.apiKey||"").trim();
  if(!apiKey) throw new Error("missing-api-key");

  plan.chat.push({role:"user", content:userText, ts:Date.now()});
  persistPlans();

  let apiMessages = plan.chat.map(m=>({role:m.role, content:m.content}));
  // Prompt caching: mark the message just before this turn's new user message as a
  // cache breakpoint. On every follow-up turn, everything up to and including it is
  // read from cache (~90% cheaper) instead of reprocessed at full price. Only kicks
  // in from the 2nd message onward, and only helps on models with a low-enough
  // minimum cacheable prefix (Opus 5 / Sonnet 5); it's a harmless no-op otherwise.
  if(apiMessages.length > 1){
    const idx = apiMessages.length - 2;
    const prior = apiMessages[idx];
    apiMessages[idx] = {role: prior.role, content: [{type:"text", text: prior.content, cache_control:{type:"ephemeral"}}]};
  }
  let fullText = "";
  let continuations = 0;
  let finalStopReason = null;

  while(true){
    const body = {
      model: state.settings.model || "claude-sonnet-5",
      max_tokens: 12000,
      stream: true,
      system: [{type:"text", text: buildSystemPrompt(plan), cache_control:{type:"ephemeral"}}],
      messages: apiMessages,
      tools: [
        {type:"web_search_20260209", name:"web_search", max_uses:3},
        {type:"web_fetch_20260209", name:"web_fetch", max_uses:2}
      ]
    };
    if(state.settings.effort) body.output_config = {effort: state.settings.effort};

    let resp;
    try{
      resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{
          "content-type":"application/json",
          "x-api-key": apiKey,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body: JSON.stringify(body)
      });
    }catch(networkErr){
      throw new Error("Network error reaching the Claude API. Check your connection.");
    }

    if(!resp.ok){
      let msg = `Request failed (HTTP ${resp.status})`;
      try{ const errBody = await resp.json(); if(errBody && errBody.error && errBody.error.message) msg = errBody.error.message; }catch(e){}
      if(resp.status===401) msg = "Invalid API key. Check it in Settings.";
      throw new Error(msg);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let turnText = "";

    readLoop:
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for(const part of parts){
        for(const line of part.split("\n")){
          if(!line.startsWith("data:")) continue;
          const jsonStr = line.slice(5).trim();
          if(!jsonStr) continue;
          let payload;
          try{ payload = JSON.parse(jsonStr); }catch(e){ continue; }

          if(payload.type === "content_block_start"){
            const cb = payload.content_block;
            if(cb && cb.type === "server_tool_use"){
              const q = (cb.input && (cb.input.query||cb.input.url)) || "the web";
              onStatus && onStatus(`${icon("search","ic-sm")} Researching: ${escapeHtml(q)}`);
            }
          } else if(payload.type === "content_block_delta"){
            if(payload.delta && payload.delta.type === "text_delta"){
              turnText += payload.delta.text;
              fullText += payload.delta.text;
              onChunk && onChunk(fullText);
            }
          } else if(payload.type === "message_delta"){
            if(payload.delta && payload.delta.stop_reason) finalStopReason = payload.delta.stop_reason;
          } else if(payload.type === "error"){
            throw new Error((payload.error && payload.error.message) || "Stream error");
          }
        }
      }
    }

    const hasOpenFence = fullText.includes("```cadence-plan");
    const fenceClosed = hasOpenFence && (fullText.split("```cadence-plan")[1]||"").includes("```");

    if(finalStopReason === "max_tokens" && (!hasOpenFence || !fenceClosed) && continuations < MAX_CONTINUATIONS){
      continuations++;
      apiMessages.push({role:"assistant", content: turnText});
      apiMessages.push({role:"user", content:"Continue exactly where you left off. Do not repeat any earlier text and do not restart the JSON — just continue the raw output so it can be concatenated with what you already wrote."});
      onStatus && onStatus(`${icon("pencil","ic-sm")} Plan is long — continuing (part ${continuations+1})…`);
      continue;
    }
    break;
  }

  plan.chat.push({role:"assistant", content: fullText, ts:Date.now()});
  persistPlans();

  const planData = extractPlanJSON(fullText);
  if(planData) applyPlanData(plan, planData);

  return {text: fullText, planUpdated: !!planData, stopReason: finalStopReason};
}

function fireNotification(title, body){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  try{ new Notification(title, {body}); }catch(e){}
}
function checkReminders(){
  if(!state.settings.notifEnabled) return;
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  const now = new Date();
  const todayStr = ymd(now);
  const fired = store.get("firedNotifs", {});
  let changed = false;

  state.plans.forEach(plan=>{
    (plan.weeks||[]).forEach(week=>{
      (week.days||[]).forEach(day=>{
        const dateStr = computeDateForDay(plan, week.weekNumber, day.dayNumber);
        if(dateStr !== todayStr) return;
        (day.classes||[]).forEach(cls=>{
          if(!cls.completionTime || cls.done) return;
          const [hh,mm] = cls.completionTime.split(":").map(Number);
          if(isNaN(hh)||isNaN(mm)) return;
          const target = new Date(now); target.setHours(hh,mm,0,0);
          const diffMin = (target - now)/60000;
          const key10 = `${plan.id}|${cls.id}|${dateStr}|10`;
          const key5  = `${plan.id}|${cls.id}|${dateStr}|5`;
          if(diffMin<=10.25 && diffMin>=9.25 && !fired[key10]){
            fireNotification("⏰ 10 minutes left", `"${cls.title}" (${plan.title}) is due to finish at ${cls.completionTime}.`);
            fired[key10]=true; changed=true;
          }
          if(diffMin<=5.25 && diffMin>=4.25 && !fired[key5]){
            fireNotification("⏰ 5 minutes left", `Wrap up "${cls.title}" (${plan.title}) — due ${cls.completionTime}.`);
            fired[key5]=true; changed=true;
          }
        });
      });
    });
  });
  if(changed) store.set("firedNotifs", fired);
  if(state.view === "today") renderView();
}
setInterval(checkReminders, 20000);

/* ============================================================
   Google Drive sync — data lives only in this browser unless the
   learner connects their own Google Drive. No server of ours is ever
   involved: this app talks to Google's APIs directly from the browser
   using an OAuth Client ID the learner creates for free themselves
   (just like their own Claude API key — we can't create that for them).
   One JSON file ("atlas-backup.json") in their own Drive is created and
   kept up to date; only files this app itself creates are ever touched
   (scope: drive.file), nothing else in their Drive is readable.
============================================================ */
const DRIVE_FILENAME = "atlas-backup.json";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
let driveAccessToken = null;
let driveTokenClient = null;

function ensureGisLoaded(cb){
  if(window.google && google.accounts && google.accounts.oauth2) return cb();
  const existing = document.getElementById("gisScript");
  if(existing){ existing.addEventListener("load", cb, {once:true}); return; }
  const s = document.createElement("script");
  s.id = "gisScript";
  s.src = "https://accounts.google.com/gsi/client";
  s.async = true; s.defer = true;
  s.onload = cb;
  s.onerror = ()=> toast("Couldn't reach Google's sign-in script. Check your connection.", "error");
  document.head.appendChild(s);
}

function driveClientId(){ return (state.settings.driveClientId||"").trim(); }

function requestDriveToken(interactive){
  return new Promise((resolve, reject)=>{
    const clientId = driveClientId();
    if(!clientId){ reject(new Error("Add your Google OAuth Client ID first.")); return; }
    ensureGisLoaded(()=>{
      try{
        driveTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: DRIVE_SCOPE,
          callback: (resp)=>{
            if(resp && resp.error){ reject(new Error(resp.error)); return; }
            driveAccessToken = resp.access_token;
            resolve(driveAccessToken);
          },
          error_callback: (err)=> reject(new Error((err && err.type) || "Google sign-in was cancelled or failed.")),
        });
        driveTokenClient.requestAccessToken({prompt: interactive ? "consent" : ""});
      }catch(e){ reject(e); }
    });
  });
}

async function ensureDriveToken(){
  if(driveAccessToken) return driveAccessToken;
  return requestDriveToken(false);
}

async function findOrCreateDriveFile(token){
  let fileId = state.settings.driveFileId;
  if(fileId){
    const check = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id,trashed`, {headers:{Authorization:`Bearer ${token}`}});
    if(check.ok){
      const j = await check.json();
      if(!j.trashed) return fileId;
    }
  }
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const searchResp = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {headers:{Authorization:`Bearer ${token}`}});
  if(searchResp.ok){
    const j = await searchResp.json();
    if(j.files && j.files.length){
      state.settings.driveFileId = j.files[0].id;
      persistSettings();
      return j.files[0].id;
    }
  }
  const createResp = await fetch("https://www.googleapis.com/drive/v3/files", {
    method:"POST",
    headers:{Authorization:`Bearer ${token}`, "Content-Type":"application/json"},
    body: JSON.stringify({name: DRIVE_FILENAME, mimeType:"application/json"})
  });
  if(!createResp.ok) throw new Error("Could not create the backup file in Drive.");
  const created = await createResp.json();
  state.settings.driveFileId = created.id;
  persistSettings();
  return created.id;
}

function currentBackupPayload(){
  return JSON.stringify({exportedAt: Date.now(), plans: state.plans}, null, 2);
}

async function syncToDrive(){
  if(!state.settings.driveConnected) return;
  try{
    const token = await ensureDriveToken();
    const fileId = await findOrCreateDriveFile(token);
    const resp = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method:"PATCH",
      headers:{Authorization:`Bearer ${token}`, "Content-Type":"application/json"},
      body: currentBackupPayload()
    });
    if(resp.ok){
      state.settings.driveLastSync = Date.now();
      persistSettings();
      if(state.view==="settings") renderView();
    }
  }catch(e){
    console.warn("Drive sync failed", e);
  }
}

async function connectDrive(){
  if(!driveClientId()){ toast("Paste your Google OAuth Client ID first.", "error"); return; }
  try{
    await requestDriveToken(true);
    state.settings.driveConnected = true;
    persistSettings();
    toast("Google Drive connected", "success");
    await syncToDrive();
    renderView();
  }catch(e){
    toast(e.message || "Could not connect to Google Drive.", "error");
  }
}

async function restoreFromDrive(){
  try{
    const token = await ensureDriveToken();
    const fileId = await findOrCreateDriveFile(token);
    const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {headers:{Authorization:`Bearer ${token}`}});
    if(!resp.ok) throw new Error("Could not read the Drive backup file.");
    const data = await resp.json();
    if(Array.isArray(data.plans)){
      state.plans = data.plans;
      store.set("plans", state.plans);
      toast("Restored from Google Drive", "success");
      renderView();
    } else {
      toast("That Drive file doesn't look like an Atlas backup.", "error");
    }
  }catch(e){
    toast(e.message || "Could not restore from Drive.", "error");
  }
}

function disconnectDrive(){
  driveAccessToken = null;
  state.settings.driveConnected = false;
  persistSettings();
  toast("Disconnected from Google Drive (your Drive file is untouched)", "success");
  renderView();
}

function renderChat(container){
  const plan = activePlan();
  setTopbar("Chat", plan ? plan.title : "");

  if(!plan){
    container.innerHTML = `
      <div class="chat-empty">
        <div class="big-ic">${icon("compass","ic-xl")}</div>
        <h2>Design your first learning plan</h2>
        <p>Tell Atlas what you want to learn, in which language, and how much time you have. It'll search the web for real, free YouTube classes and build you a full routine — up to 3 months.</p>
        <button class="btn primary" id="btnEmptyNewPlan">${icon("plus","ic-sm")} Create a learning plan</button>
      </div>`;
    document.getElementById("btnEmptyNewPlan").onclick = openNewPlanModal;
    return;
  }

  const suggestions = [
    "Make it a bit more intensive, I have more free time on weekends.",
    "Swap week 2 to focus more on practice than videos.",
    "Regenerate the resources in Hindi instead.",
  ];

  container.innerHTML = `
    <div class="chat-wrap">
      <div class="chat-scroll" id="chatScroll">
        ${plan.chat.length ? plan.chat.map(renderMsg).join("") : `
          <div class="chat-empty">
            <div class="big-ic">${icon("sparkle","ic-xl")}</div>
            <h2>${escapeHtml(plan.title)}</h2>
            <p>Ready to build your ${plan.durationWeeks}-week ${LANGS[plan.language]||''} plan for <strong>${escapeHtml(plan.subject)}</strong>.</p>
            <button class="btn primary" id="btnGenerateNow">Generate the full plan</button>
          </div>`}
        <div id="streamTarget"></div>
      </div>
      <div class="chat-input-bar">
        <div class="chip-row" style="margin-bottom:10px;">
          ${plan.chat.length ? suggestions.map(s=>`<span class="chip" data-action="fill-suggestion" data-text="${escapeHtml(s)}">${escapeHtml(s)}</span>`).join("") : ""}
        </div>
        <div class="chat-input-row">
          <textarea id="chatInput" placeholder="Ask Atlas to adjust your plan, add a topic, change language…" rows="1"></textarea>
          <button class="btn primary" id="btnSend">Send</button>
        </div>
        <div class="chat-hint">Enter to send · Shift+Enter for a new line</div>
      </div>
    </div>
  `;

  const scroll = document.getElementById("chatScroll");
  scroll.scrollTop = scroll.scrollHeight;

  const input = document.getElementById("chatInput");
  const btnSend = document.getElementById("btnSend");
  if(input){
    input.addEventListener("keydown", e=>{
      if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); doSend(); }
    });
    input.addEventListener("input", ()=>{ input.style.height="auto"; input.style.height=Math.min(160,input.scrollHeight)+"px"; });
  }
  if(btnSend) btnSend.onclick = doSend;
  const genBtn = document.getElementById("btnGenerateNow");
  if(genBtn) genBtn.onclick = ()=> runChatTurn(buildInitialMessage(plan));

  function doSend(){
    const text = input.value.trim();
    if(!text || state.sending) return;
    input.value=""; input.style.height="auto";
    runChatTurn(text);
  }
}

function renderMsg(m){
  const isUser = m.role === "user";

    <div class="msg ${isUser?'user':'assistant'}">

      <div class="bubble">${isUser ? `<p>${escapeHtml(m.content)}</p>` : renderChatBubble(m.content)}</div>
    </div>`;
}

function buildInitialMessage(plan){
  const langLabel = LANGS[plan.language]||"English";
  let msg = `I want to learn "${plan.subject}" over ${plan.durationWeeks} week(s), studying about ${plan.dailyMinutes} minutes per day. My current level is ${plan.level}. Please use ${langLabel} language video resources.`;
  if(plan.daysOff && plan.daysOff.length) msg += ` I'd prefer to rest on: ${plan.daysOff.join(", ")}.`;
  msg += " Please research real free YouTube resources and design the full curriculum now.";
  return msg;
}

async function runChatTurn(userText){
  const plan = activePlan();
  if(!plan) return;
  if(!(state.settings.apiKey||"").trim()){
    toast("Add your Claude API key in Settings first.", "error");
    state.view = "settings"; renderView();
    return;
  }
  state.sending = true;
  const scroll = document.getElementById("chatScroll");

  // render the user's message immediately
  const userMsgHtml = renderMsg({role:"user", content:userText});
  document.getElementById("streamTarget").insertAdjacentHTML("beforebegin", userMsgHtml);

  const target = document.getElementById("streamTarget");
  target.innerHTML = `
    <div class="msg assistant" id="liveMsg">
      <div class="avatar">${icon("compass")}</div>
      <div class="bubble">
        <div class="status-line" id="liveStatus">${icon("sparkle","ic-sm")} Thinking <span class="dotpulse"><span></span><span></span><span></span></span></div>
        <div id="liveText"></div>
      </div>
    </div>`;
  scroll.scrollTop = scroll.scrollHeight;
  const liveText = document.getElementById("liveText");
  const liveStatus = document.getElementById("liveStatus");

  disableChatInput(true);
  try{
    const result = await sendToClaude(plan, userText, {
      onStatus: (s)=>{ liveStatus.innerHTML = s; },
      onChunk: (full)=>{ liveText.innerHTML = renderChatBubble(full); scroll.scrollTop = scroll.scrollHeight; }
    });
    if(result.planUpdated){
      toast("Learning plan updated", "success");
    }
    renderView(); // full re-render to reflect persisted state cleanly
    const scroll2 = document.getElementById("chatScroll");
    if(scroll2) scroll2.scrollTop = scroll2.scrollHeight;
  }catch(err){
    toast(err.message || "Something went wrong talking to Claude.", "error");
    liveStatus.innerHTML = "";
    liveText.innerHTML = `<p style="color:var(--danger); display:flex; align-items:center; gap:6px;">${icon("alert","ic-sm")} ${escapeHtml(err.message||"Request failed.")}</p>`;
  }finally{
    state.sending = false;
    disableChatInput(false);
  }
}
function disableChatInput(disabled){
  const i = document.getElementById("chatInput");
  const b = document.getElementById("btnSend");
  if(i) i.disabled = disabled;
  if(b) b.disabled = disabled;
}

function renderWeekBlock(plan, week){
  return `

      <div class="week-head" data-action="toggle-week" data-week="${week.weekNumber}">
        <div><span class="title">Week ${week.weekNumber}</span> — <span class="theme">${escapeHtml(week.theme||"")}</span></div>

function renderDayRow(plan, week, day){
  const dateStr = computeDateForDay(plan, week.weekNumber, day.dayNumber);
  const isToday = dateStr === ymd(new Date());
  return `
    <div class="day-row">
      <div class="day-head">Day ${day.dayNumber} <span class="date">· ${fmtDateNice(dateStr)}${isToday?' · Today':''}</span></div>
      ${(day.classes||[]).map(c=>renderClassCard(plan, c)).join("")}
      ${(day.todos||[]).length ? `<div style="margin-top:4px;">${day.todos.map(t=>`
        <div class="todo-row ${t.done?'done':''}">
          <input type="checkbox" class="chk" ${t.done?'checked':''} data-action="toggle-todo" data-plan="${plan.id}" data-week="${week.weekNumber}" data-day="${day.dayNumber}" data-todo="${t.id}">
          <span class="txt">${escapeHtml(t.text)}</span>
        </div>`).join("")}</div>` : ""}
    </div>`;
}

function renderClassCard(plan, c){
  if(c.type === "rest"){
    return `<div class="class-card rest-card"><div class="cc-main"><div class="cc-title">${icon("moon","ic-sm")} Rest day</div></div></div>`;
  }
  const typeIcon = {video:icon("play","ic-sm"), practice:icon("wrench","ic-sm"), reading:icon("bookOpen","ic-sm"), quiz:icon("clipboard","ic-sm")}[c.type] || icon("play","ic-sm");
  const ytId = getYtId(c);
  const canResolve = !ytId && c.type === "video" && !!ytApiKey();
  const media = ytId
    ? `<div class="lesson-thumb" data-action="watch-class" data-plan="${plan.id}" data-class="${c.id}" style="background-image:url('https://img.youtube.com/vi/${ytId}/hqdefault.jpg')"><span class="play-badge">${icon("play")}</span></div>`
    : (canResolve ? `<div class="lesson-thumb lesson-thumb-icon" data-action="watch-class" data-plan="${plan.id}" data-class="${c.id}">${icon("search","ic-lg")}</div>` : "");
  const actionBtn = (ytId || canResolve)
    ? `<button class="btn small primary" data-action="watch-class" data-plan="${plan.id}" data-class="${c.id}">${icon("play","ic-sm")} Watch</button>`
    : (c.resourceUrl ? `<a class="btn small" href="${escapeHtml(c.resourceUrl)}" target="_blank" rel="noopener">Open ${icon("external","ic-sm")}</a>` : "");
  return `
    <div class="class-card ${c.done?'done':''}">
      ${media}
      <div class="cc-main">
        <div class="cc-title">${ytId?'':typeIcon+' '}${escapeHtml(c.title)}</div>
        <div class="cc-meta">${escapeHtml(c.channel||"")} ${c.channel?'· ':''}${c.durationMinutes} min${c.notes ? ' · '+escapeHtml(c.notes) : ''}</div>
      </div>

        ${actionBtn}

        <input type="checkbox" class="chk" ${c.done?'checked':''} data-action="toggle-class-done" data-plan="${plan.id}" data-class="${c.id}" title="Mark done">
      </div>
    </div>`;
}

    if(!b.c.completionTime) return -1;
    return a.c.completionTime.localeCompare(b.c.completionTime);
  });
  const streak = computeStreak();
  const completed = completedThisWeek();

  container.innerHTML = `
    <div class="home-hero">

function renderToday(container){
  setTopbar("Today", fmtDateNice(ymd(new Date())));
  const todayStr = ymd(new Date());
  const items = [];
  const todos = [];
  state.plans.forEach(plan=>{
    (plan.weeks||[]).forEach(week=>(week.days||[]).forEach(day=>{
      const dateStr = computeDateForDay(plan, week.weekNumber, day.dayNumber);
      if(dateStr !== todayStr) return;
      (day.classes||[]).forEach(c=>{ if(c.type!=="rest") items.push({plan, week, day, c}); });
      (day.todos||[]).forEach(t=> todos.push({plan, week, day, t}));
    }));
  });
  items.sort((a,b)=>{
    if(!a.c.completionTime) return 1;
    if(!b.c.completionTime) return -1;
    return a.c.completionTime.localeCompare(b.c.completionTime);
  });

  const notifBanner = (!("Notification" in window) || Notification.permission!=="granted" || !state.settings.notifEnabled)
    ? `<div class="card" style="margin-bottom:16px; border-color:var(--warn); display:flex; align-items:center; gap:6px;">${icon("bell","ic-sm")} Reminders are off. <button class="btn small" data-action="enable-notifs" style="margin-left:8px;">Enable notifications</button></div>`
    : "";

  container.innerHTML = `
    ${notifBanner}
    <h3 style="margin:0 0 10px;">Classes today</h3>
    <div class="today-list" style="margin-bottom:26px;">
      ${items.length ? items.map(it=>renderTodayClass(it)).join("") : `<div class="card" style="color:var(--text-faint);">Nothing scheduled today. Enjoy the rest, or open a plan to add more.</div>`}
    </div>
    <h3 style="margin:0 0 10px;">To-dos today</h3>
    <div class="today-list">
      ${todos.length ? todos.map(it=>`
        <div class="card" style="display:flex; align-items:center; gap:10px; padding:12px 14px;">
          <input type="checkbox" class="chk" ${it.t.done?'checked':''} data-action="toggle-todo" data-plan="${it.plan.id}" data-week="${it.week.weekNumber}" data-day="${it.day.dayNumber}" data-todo="${it.t.id}">
          <span style="${it.t.done?'text-decoration:line-through;color:var(--text-faint);':''}">${escapeHtml(it.t.text)}</span>
          <span class="badge" style="margin-left:auto;">${escapeHtml(it.plan.title)}</span>
        </div>`).join("") : `<div class="card" style="color:var(--text-faint);">No to-dos for today.</div>`}
    </div>
  `;
}

function renderTodayClass(it){
  const {plan, c} = it;
  let countdown = "";
  if(c.completionTime && !c.done){
    const [hh,mm] = c.completionTime.split(":").map(Number);
    const now = new Date(); const target = new Date(); target.setHours(hh,mm,0,0);
    const diff = Math.round((target-now)/60000);
    if(diff > 0 && diff <= 15) countdown = `<span class="count-badge warn">in ${diff} min</span>`;
    else if(diff <= 0) countdown = `<span class="count-badge ok">due</span>`;
  }
  const ytId = getYtId(c);
  const canResolve = !ytId && c.type === "video" && !!ytApiKey();
  const media = ytId
    ? `<div class="lesson-thumb sm" data-action="watch-class" data-plan="${plan.id}" data-class="${c.id}" style="background-image:url('https://img.youtube.com/vi/${ytId}/hqdefault.jpg')"><span class="play-badge">${icon("play")}</span></div>`
    : (canResolve ? `<div class="lesson-thumb sm lesson-thumb-icon" data-action="watch-class" data-plan="${plan.id}" data-class="${c.id}">${icon("search","ic-lg")}</div>` : "");
  const actionBtn = (ytId || canResolve)
    ? `<button class="btn small primary" data-action="watch-class" data-plan="${plan.id}" data-class="${c.id}">${icon("play","ic-sm")} Watch</button>`
    : (c.resourceUrl ? `<a class="btn small" href="${escapeHtml(c.resourceUrl)}" target="_blank" rel="noopener">Open ${icon("external","ic-sm")}</a>` : "");
  return `
    <div class="card" style="display:flex; align-items:center; gap:12px; padding:12px 14px; flex-wrap:wrap;">
      <input type="checkbox" class="chk" ${c.done?'checked':''} data-action="toggle-class-done" data-plan="${plan.id}" data-class="${c.id}">
      ${media}
      <div style="flex:1; min-width:180px;">
        <div style="font-weight:600; ${c.done?'text-decoration:line-through;color:var(--text-faint);':''}">${escapeHtml(c.title)}</div>
        <div style="font-size:11.5px; color:var(--text-faint);">${escapeHtml(plan.title)} · ${c.durationMinutes} min ${c.channel? '· '+escapeHtml(c.channel):''}</div>
      </div>
      ${countdown}
      <input type="time" value="${c.completionTime||''}" data-action="set-completion" data-plan="${plan.id}" data-class="${c.id}">
      ${actionBtn}
    </div>`;
}

    toast("Switched to Sonnet 5 + medium effort", "success");
  };
  document.getElementById("btnAskNotif").onclick = requestNotifPermission;
  document.getElementById("btnTestNotif").onclick = ()=> fireNotification("Test reminder", "This is what your class reminders will look like.");
  document.getElementById("notifToggle").onchange = e=>{ state.settings.notifEnabled = e.target.checked; persistSettings(); };
  document.getElementById("btnExport").onclick = exportData;
  document.getElementById("importFile").onchange = importData;
  document.getElementById("btnClearAll").onclick = clearAllData;
  document.getElementById("ytApiKeyInput").onchange = e=>{ state.settings.ytApiKey = e.target.value.trim(); persistSettings(); };

  if(s.driveConnected){
    document.getElementById("btnDriveSyncNow").onclick = async ()=>{ await syncToDrive(); toast("Synced to Drive", "success"); renderView(); };
    document.getElementById("btnDriveRestore").onclick = ()=>{
      if(confirm("Replace what's in this browser with the latest backup from Drive?")) restoreFromDrive();
    };
    document.getElementById("btnDriveDisconnect").onclick = disconnectDrive;
  } else {
    document.getElementById("driveClientIdInput").onchange = e=>{ state.settings.driveClientId = e.target.value.trim(); persistSettings(); };
    document.getElementById("btnDriveConnect").onclick = connectDrive;
  }
}

function requestNotifPermission(){
  if(!("Notification" in window)){ toast("Notifications aren't supported in this browser.", "error"); return; }
  Notification.requestPermission().then(perm=>{
    if(perm==="granted"){
      state.settings.notifEnabled = true; persistSettings();
      toast("Notifications enabled", "success");
    } else {
      toast("Notification permission was not granted.", "error");
    }
    renderView();
  });
}

function exportData(){
  const blob = new Blob([JSON.stringify({settings:{...state.settings, apiKey:""}, plans: state.plans}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `atlas-backup-${ymd(new Date())}.json`;
  a.click();
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(Array.isArray(data.plans)){
        state.plans = data.plans;
        persistPlans();
        toast("Data imported", "success");
        renderView();
      } else toast("That file doesn't look like an Atlas backup.", "error");
    }catch(err){ toast("Could not read that file.", "error"); }
  };
  reader.readAsText(file);
}
function clearAllData(){
  if(!confirm("This deletes all plans and settings from this browser. Continue?")) return;
  Object.keys(localStorage).filter(k=>k.startsWith(LS_PREFIX)).forEach(k=>localStorage.removeItem(k));
  state.plans = []; state.activePlanId = null;
  state.settings = {theme:"dark", apiKey:"", model:"claude-sonnet-5", effort:"medium", notifEnabled:false,
    driveClientId:"", driveConnected:false, driveFileId:null, driveLastSync:null, ytApiKey:""};
  driveAccessToken = null;
  state.view = "chat";
  applyTheme(); renderView();
  toast("All data cleared", "success");
}

/* ============================================================
   New plan modal
============================================================ */
function openNewPlanModal(){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <h2>Create a learning plan</h2>
        <p class="desc">Atlas will research free YouTube resources and design your full routine.</p>
        <div class="field">
          <label>What do you want to learn?</label>
          <input type="text" id="npSubject" placeholder="e.g. Web development, Guitar, IELTS, Data Structures">
        </div>
        <div class="field">
          <label>Content language</label>
          <div class="chip-row">
            <span class="chip selected" data-lang="en">English</span>
            <span class="chip" data-lang="bn">বাংলা Bangla</span>
            <span class="chip" data-lang="hi">हिन्दी Hindi</span>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>Current level</label>
            <select id="npLevel">
              <option>Beginner</option><option>Intermediate</option><option>Advanced</option>
            </select>
          </div>
          <div class="field">
            <label>Duration (weeks, max 13)</label>
            <input type="number" id="npWeeks" min="1" max="13" value="2">
          </div>
        </div>
        <div class="field">
          <label>Daily study time (minutes)</label>
          <input type="number" id="npMinutes" min="10" max="480" value="45">
        </div>
        <p class="desc" style="margin-top:-6px; display:flex; gap:6px;">${icon("lightbulb","ic-sm")} <span>Tip: start with 2 weeks — it's cheaper to generate and you can ask Atlas to extend it later in chat once you like the direction.</span></p>
        <div class="field">
          <label>Rest days (optional)</label>
          <div class="chip-row" id="npDaysOff">
            ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<span class="chip" data-day="${d}">${d}</span>`).join("")}
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn" id="npCancel">Cancel</button>
          <button class="btn primary" id="npCreate">Create & generate</button>
        </div>
      </div>
    </div>`;
  let selLang = "en";
  root.querySelectorAll("[data-lang]").forEach(chip=>{
    chip.onclick = ()=>{ root.querySelectorAll("[data-lang]").forEach(c=>c.classList.remove("selected")); chip.classList.add("selected"); selLang = chip.dataset.lang; };
  });
  root.querySelectorAll("#npDaysOff [data-day]").forEach(chip=>{
    chip.onclick = ()=> chip.classList.toggle("selected");
  });
  document.getElementById("npCancel").onclick = closeModal;
  document.getElementById("modalOverlay").addEventListener("click", e=>{ if(e.target.id==="modalOverlay") closeModal(); });
  document.getElementById("npCreate").onclick = ()=>{
    const subject = document.getElementById("npSubject").value.trim();
    if(!subject){ toast("Tell Atlas what you want to learn first.", "error"); return; }
    if(!(state.settings.apiKey||"").trim()){
      toast("Add your Claude API key in Settings first.", "error");
      closeModal(); state.view="settings"; renderView();
      return;
    }
    const weeks = Math.max(1, Math.min(MAX_WEEKS, Number(document.getElementById("npWeeks").value)||2));
    const minutes = Math.max(10, Number(document.getElementById("npMinutes").value)||45);
    const level = document.getElementById("npLevel").value;
    const daysOff = Array.from(root.querySelectorAll("#npDaysOff .selected")).map(c=>c.dataset.day);

    const plan = {

      title: subject,
      subject, level, language: selLang,
      durationWeeks: weeks, dailyMinutes: minutes, daysOff,

      createdAt: Date.now(), updatedAt: Date.now(),
    };
    state.plans.push(plan);
    state.activePlanId = plan.id;
    state.view = "chat";
    persistPlans(); store.set("activePlanId", plan.id);
