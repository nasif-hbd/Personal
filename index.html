// Answers for the open attempt. Transient by design: a half-finished quiz
// should not survive a reload as a partially-filled paper.
let quizAnswers = [];

/**
 * The video just finished and this lesson has no questions yet: write some,
 * then open them. The learner sees a waiting state rather than a frozen app.
 *
 * If generation fails the lesson completes anyway. Someone who watched the
 * whole thing should never be held hostage by a network error.
 */
async function startQuizAfterVideo(plan, c){
  showQuizPreparing(c);
  try{
    await generateQuizFor(plan, c);
    openQuizModal(plan.id, c.id);
    renderView();
  }catch(err){
    closeModal();
    c.done = true;
    c.doneAt = Date.now();
    plan.updatedAt = Date.now();
    persistPlans();
    syncDoneUI(c.id, plan, true);
    toast(`Couldn't write a quiz (${err.message}) — lesson marked complete.`, "info");
  }
}

function showQuizPreparing(c){
  document.getElementById("modalRoot").innerHTML = `

          <p class="desc">A few questions on <strong>${escapeHtml(c.title)}</strong>, to check it stuck.</p>

function openQuizModal(planId, classId){
  const found = findClassAnywhere(classId);

function paintQuiz(planId, classId, result){
  const found = findClassAnywhere(classId);
  if(!found) return;
  const {c} = found;
  const questions = classQuiz(c);
  const pass = Math.round(QUIZ_PASS * 100);
  const attempts = quizAttempts(c).length;

  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal quiz-modal" role="dialog" aria-modal="true" aria-labelledby="quizTitle" tabindex="-1">
        ${result ? `
          <div class="quiz-result ${result.passed ? "pass" : "fail"}">
            <div class="quiz-score">${Math.round(result.score * 100)}<span>%</span></div>
            <h2 id="quizTitle">${result.passed ? "Passed" : "Not quite"}</h2>
            <p>${result.correct} of ${result.total} correct. ${result.passed
              ? "Lesson marked complete."
              : `You need ${pass}% to complete this lesson. Your watch progress has been reset — watch it again, then retake the quiz.`}</p>
          </div>
          ${result.passed ? "" : `
            <div class="quiz-review">
              <h3>Worth rewatching</h3>
              ${result.wrong.map(i=>`<div class="quiz-missed">${escapeHtml(questions[i].q)}</div>`).join("")}
            </div>`}
          <div class="modal-actions">
            <button class="btn" data-action="close-modal">Close</button>
            ${result.passed ? "" : `
              <button class="btn primary" data-action="retake-quiz" data-plan="${planId}" data-class="${classId}">
                ${icon("refresh","ic-sm")} Try again
              </button>`}
          </div>
        ` : `
          <div class="quiz-head">
            <h2 id="quizTitle">Quick check</h2>
            <p class="desc">${escapeHtml(c.title)} · ${questions.length} question${questions.length===1?"":"s"} ·
            ${pass}% to pass${attempts ? ` · attempt ${attempts + 1}` : ""}</p>
          </div>
          <div class="quiz-body">
            ${questions.map((q, qi)=>`
              <fieldset class="quiz-q">
                <legend><span class="quiz-n">${qi + 1}</span>${escapeHtml(q.q)}</legend>
                ${q.options.map((opt, oi)=>`
                  <label class="quiz-opt">
                    <input type="radio" name="q${qi}" value="${oi}" data-action="quiz-pick" data-q="${qi}">
                    <span>${escapeHtml(opt)}</span>
                  </label>`).join("")}
              </fieldset>`).join("")}
          </div>
          <div class="modal-actions">
            <button class="btn" data-action="close-modal">Later</button>
            <button class="btn primary" id="btnSubmitQuiz" data-plan="${planId}" data-class="${classId}" disabled>
              Submit answers
            </button>
          </div>
        `}
      </div>
    </div>`;
  setupModalA11y();
  document.getElementById("modalOverlay").addEventListener("click", e=>{ if(e.target.id==="modalOverlay") closeModal(); });

  const submit = document.getElementById("btnSubmitQuiz");
  if(submit){
    submit.onclick = ()=>{
      const res = submitQuiz(planId, classId, quizAnswers);
      if(!res) return;
      paintQuiz(planId, classId, res);
      toast(res.passed
        ? `Passed with ${Math.round(res.score*100)}% — lesson complete.`
        : `${Math.round(res.score*100)}% — ${Math.round(QUIZ_PASS*100)}% needed. Watch it again.`,
        res.passed ? "success" : "error");
      renderView();
    };
  }
}

function pickQuizAnswer(qIndex, value){
  quizAnswers[qIndex] = value;

}

function calmMotion(){
  return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}
function pointerDevice(){
  return !(window.matchMedia && window.matchMedia("(hover: none)").matches);
}

// Pointer-driven 3D tilt on feature cards. Touch devices have no hover, and a
// reduced-motion preference opts out of all of it.
function attachTiltEffects(root){
  if(calmMotion() || !pointerDevice()) return;
  root.querySelectorAll(".featured-card").forEach(el=>{
    el.addEventListener("mousemove", e=>{
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = `perspective(1100px) rotateX(${(-py*5).toFixed(2)}deg) rotateY(${(px*5).toFixed(2)}deg) translate(-3px,-3px)`;
    });
    el.addEventListener("mouseleave", ()=>{ el.style.transform = ""; });
  });
}

// The spotlight is pure CSS; JS only feeds it the pointer position. One
// listener on the container rather than per-card, so a hundred cards cost the
// same as one.
let spotlightBound = false;
function attachSpotlight(root){
  if(calmMotion() || !pointerDevice() || spotlightBound) return;
  spotlightBound = true;
  document.addEventListener("pointermove", (e)=>{
    const card = e.target.closest && e.target.closest(".spot");
    if(!card) return;
    const r = card.getBoundingClientRect();
    card.style.setProperty("--mx", (e.clientX - r.left) + "px");
    card.style.setProperty("--my", (e.clientY - r.top) + "px");
  }, {passive:true});
}

// Reveal on scroll. If IntersectionObserver is missing the class is simply
// dropped, so content is never left invisible.
let revealObserver = null;
function attachReveals(root){
  const targets = root.querySelectorAll(".reveal");
  if(!targets.length) return;
  if(calmMotion() || !("IntersectionObserver" in window)){
    targets.forEach(el=>el.classList.add("in"));
    return;
  }
  if(!revealObserver){
    revealObserver = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          entry.target.classList.add("in");
          revealObserver.unobserve(entry.target);
        }
      });
    }, {rootMargin:"0px 0px -8% 0px", threshold:0.05});
  }
  targets.forEach(el=>revealObserver.observe(el));
}

// Counts a stat up to its value — reads the target from data-count so the
// markup still carries the real number for anyone with motion turned off.
function animateCounters(root){
  root.querySelectorAll("[data-count]").forEach(el=>{
    const target = Number(el.dataset.count) || 0;
    if(calmMotion() || target === 0){ el.textContent = String(target); return; }
    const started = performance.now();
    const dur = 700;
    function step(now){
      const t = Math.min(1, (now - started) / dur);
      // ease-out so it decelerates into the final number
      const value = Math.round(target * (1 - Math.pow(1 - t, 3)));
      el.textContent = String(value);
      if(t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

    else if(diff <= 0) countdown = `<span class="count-badge ok">due</span>`;

  // The embedded player may only be a stand-in, so keep the lesson's real

}

  document.getElementById("modelSelect").onchange = e=>{ state.settings.model = e.target.value; persistSettings(); };

  document.getElementById("btnCostSaving").onclick = ()=>{
    state.settings.model = "claude-sonnet-5";
    state.settings.effort = "medium";
    persistSettings(); renderView();
    toast("Switched to Sonnet 5 + medium effort", "success");
  };
  document.getElementById("btnAskNotif").onclick = requestNotifPermission;
  document.getElementById("btnTestNotif").onclick = ()=> fireNotification("Test reminder", "This is what your class reminders will look like.");
  document.getElementById("notifToggle").onchange = e=>{ state.settings.notifEnabled = e.target.checked; persistSettings(); };
  document.getElementById("btnExport").onclick = exportData;
  document.getElementById("importFile").onchange = importData;
  document.getElementById("btnClearAll").onclick = clearAllData;
  document.getElementById("ytApiKeyInput").onchange = e=>{ state.settings.ytApiKey = e.target.value.trim(); persistSettings(); };
  const accessInput = document.getElementById("accessCodeInput");
  if(accessInput) accessInput.onchange = e=>{ state.settings.accessCode = e.target.value.trim(); persistSettings(); };
  // Saving the server address in the app means nobody has to edit and
  // redeploy index.html just to point at their own backend.
  const saveBackend = document.getElementById("btnSaveBackend");
  if(saveBackend) saveBackend.onclick = async ()=>{
    const input = document.getElementById("backendUrlInput");
    const msg = document.getElementById("backendMsg");
    // People paste with a trailing slash, a trailing /api, or no scheme at all.
    let url = input.value.trim().replace(/\/+$/,"").replace(/\/api$/,"");
    if(url && !/^https?:\/\//i.test(url)){
      // Real hosts are https; a machine on your own network won't have a
      // certificate, so forcing https there would fail every time.
      const local = /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\d+\.\d+\.\d+\.\d+)(:\d+)?$/i.test(url);
      url = (local ? "http://" : "https://") + url;
    }
    input.value = url;

    state.settings.backendUrl = url;
    persistSettings();

    if(!url){
      msg.textContent = "Cleared — the app will run without a server.";
      msg.style.color = "var(--text-faint)";
      billingConfig = null; state.entitlement = null;
      renderView();
      return;
    }
    saveBackend.disabled = true;
    msg.textContent = "Checking…"; msg.style.color = "var(--text-faint)";
    try{
      const resp = await fetch(url + "/api/health");
      if(!resp.ok) throw new Error(`the server answered with error ${resp.status}`);
      const h = await resp.json();
      const summary = h.chat
        ? "Connected. AI is on" + (h.billing && h.billing.enabled ? " and payments are set up." : ", but no payment methods are set up yet.")
        : "Connected, but the server has no Claude key yet.";
      await loadBilling();
      // A toast, not the inline message: refreshing the view to pick up the
      // new server rebuilds this whole panel and would wipe anything written
      // into it, leaving the save looking like it did nothing.
      toast(summary, h.chat ? "success" : "info");
      renderView();
    }catch(e){
      msg.textContent = `Couldn't reach it — ${e.message}. Check the address and that the server is awake.`;
      msg.style.color = "var(--danger)";
    }finally{
      saveBackend.disabled = false;
    }
  };

  const testBtn = document.getElementById("btnTestBackend");
  if(testBtn) testBtn.onclick = async ()=>{
    const via = backendUrl();
    if(!via){ toast("No server is configured for this app.", "error"); return; }
    try{
      const resp = await fetch(via + "/api/health");
      if(!resp.ok) throw new Error(`Server replied ${resp.status}`);
      const h = await resp.json();
      const bits = [
        h.chat ? "Claude ready" : "no Claude key on server",
        `storage: ${h.storage}`,
        h.quota ? `${h.quota.remaining}/${h.quota.cap} requests left today` : "",
        h.accessCode ? "access code required" : "",
      ].filter(Boolean);
      toast("Connected — " + bits.join(" · "), "success");
    }catch(e){
      toast("Couldn't reach that server: " + (e.message||"unknown error"), "error");
    }
  };

  if(s.driveConnected){
    document.getElementById("btnDriveSyncNow").onclick = async ()=>{ await syncToDrive(); toast("Synced to Drive", "success"); renderView(); };
    document.getElementById("btnDriveRestore").onclick = ()=>{
      if(confirm("Replace what's in this browser with the latest backup from Drive?")) restoreFromDrive();
    };
    document.getElementById("btnDriveDisconnect").onclick = disconnectDrive;
  } else {
    document.getElementById("driveClientIdInput").onchange = e=>{ state.settings.driveClientId = e.target.value.trim(); persistSettings(); };
    document.getElementById("btnDriveConnect").onclick = connectDrive;
  }
}

function requestNotifPermission(){
  if(!("Notification" in window)){ toast("Notifications aren't supported in this browser.", "error"); return; }
  Notification.requestPermission().then(perm=>{
    if(perm==="granted"){
      state.settings.notifEnabled = true; persistSettings();
      toast("Notifications enabled", "success");
    } else {
      toast("Notification permission was not granted.", "error");
    }
    renderView();
  });
}

function exportData(){
  const blob = new Blob([JSON.stringify({settings:{...state.settings, apiKey:""}, plans: state.plans}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `mindora-backup-${ymd(new Date())}.json`;
  a.click();
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(Array.isArray(data.plans)){
        state.plans = data.plans;
        persistPlans();
        toast("Data imported", "success");
        renderView();
      } else toast("That file doesn't look like a Mindora backup.", "error");
    }catch(err){ toast("Could not read that file.", "error"); }
  };
  reader.readAsText(file);
}
function clearAllData(){
  if(!confirm("This deletes all plans and settings from this browser. Continue?")) return;
  Object.keys(localStorage).filter(k=>k.startsWith(LS_PREFIX)).forEach(k=>localStorage.removeItem(k));
  state.plans = []; state.activePlanId = null;
  state.settings = {theme:"dark", apiKey:"", model:"claude-sonnet-5", effort:"medium", notifEnabled:false,
    driveClientId:DEFAULT_DRIVE_CLIENT_ID, driveConnected:false, driveFileId:null, driveLastSync:null, ytApiKey:"", backendUrl:"", accessCode:""};
  driveAccessToken = null;
  state.view = "chat";
  applyTheme(); renderView();
  toast("All data cleared", "success");
}

function buildFeaturedPlan(pathId){
  const def = featuredPaths().find(p=>p.id===pathId);
  if(!def) return null;
  const weeks = [1,2].map(weekNumber=>({
    weekNumber,
    theme: def.weekThemes[weekNumber-1] || "",
    days: [1,2,3,4,5,6,7].map(dayNumber=>{
      const d = def.days[(weekNumber-1)*7 + (dayNumber-1)];
      if(!d || d.rest){
        return {dayNumber, classes:[{id:uid(), title:"Rest day", type:"rest", resourceUrl:"", channel:"", durationMinutes:0, notes:"", done:false, completionTime:null}], todos:[]};
      }
      return {
        dayNumber,
        classes: d.classes.map(c=>({
          id:uid(), title:c.title, type:c.type, resourceUrl:c.resourceUrl, channel:c.channel||"",
          altVideoUrl:c.altVideoUrl||"", altChannel:c.altChannel||"",
          durationMinutes:c.duration||def.dailyMinutes, notes:c.notes||"", done:false, completionTime:null
        })),
        todos: (d.todos||[]).map(t=>({id:uid(), text:t, done:false}))
      };
    })
  }));
  return {
    id: uid(), title: def.title, subject: def.subject, level: def.level, language:"en",
    durationWeeks:2, dailyMinutes: def.dailyMinutes, daysOff:[], startDate: ymd(new Date()),
    weeks, chat:[], createdAt: Date.now(), updatedAt: Date.now(),
  };
}

function addFeaturedPlan(pathId){
  const plan = buildFeaturedPlan(pathId);
  if(!plan){ toast("Couldn't find that path.", "error"); return; }
  state.plans.push(plan);
  state.activePlanId = plan.id;
  state.planDetailId = plan.id;
  state.view = "plans";
  persistPlans();
  renderView();
  toast(`Added "${plan.title}" to My Plans`, "success");
}

let lastFocusedBeforeModal = null;
function modalEscHandler(e){ if(e.key === "Escape") closeModal(); }
function modalTrapHandler(e){
  if(e.key !== "Tab") return;
  const modal = document.querySelector(".modal");
  if(!modal) return;
  const focusables = modal.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
  if(!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
// Called right after building any modal's markup: traps focus inside it, closes on
// Escape, and returns focus to whatever triggered it once it's dismissed.
function setupModalA11y(){
  // Guarded so re-rendering the same modal in place (e.g. the watch modal's
  // resolving->resolved swap, or its Prev/Next) doesn't overwrite the original
  // pre-modal focus target with a button inside the modal itself.
  if(lastFocusedBeforeModal === null) lastFocusedBeforeModal = document.activeElement;
  const modal = document.querySelector(".modal");
  if(modal) modal.focus();
  document.addEventListener("keydown", modalEscHandler);
  document.addEventListener("keydown", modalTrapHandler);
}
function closeModal(){
  document.getElementById("modalRoot").innerHTML = "";
  document.removeEventListener("keydown", modalEscHandler);
  document.removeEventListener("keydown", modalTrapHandler);
  if(lastFocusedBeforeModal && document.contains(lastFocusedBeforeModal)) lastFocusedBeforeModal.focus();
  lastFocusedBeforeModal = null;
}

    ["G then R", "Review"],
    ["G then I", "Insights"],
    ["N", "New learning plan"],
    ["Space", "Reveal answer while reviewing"],
    ["1 – 4", "Grade a card: again, hard, good, easy"],
    ["?", "This list"],
    ["Esc", "Close anything open"],
  ];
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="scTitle" tabindex="-1"
        onclick="event.stopPropagation()">
        <h2 id="scTitle">Keyboard shortcuts</h2>
        <div class="shortcut-list">
          ${rows.map(([keys,what])=>`
            <div class="shortcut-row">
              <span>${what}</span>
              <span>${keys.split(" ").map(k=>
                ["then","/","–"].includes(k) ? `<em>${k}</em>` : `<kbd>${escapeHtml(k)}</kbd>`
              ).join(" ")}</span>
            </div>`).join("")}
        </div>
        <div class="modal-actions"><button class="btn primary" data-action="close-modal">Got it</button></div>
      </div>
    </div>`;
  setupModalA11y();
}

/* ============================================================
   Keyboard shortcuts

   Anything typed into a field belongs to that field, so every handler bails
   out on an editable target first. Without that, typing "n" in a note would
   open the new-plan modal.
============================================================ */
let chordPending = false, chordTimer = null;

function isTyping(target){
  const el = target || document.activeElement;
  if(!el) return false;
  return el.isContentEditable || ["INPUT","TEXTAREA","SELECT"].includes(el.tagName);
}

document.addEventListener("keydown", e=>{
  // The palette is modal: it owns the keyboard while open.
  if(paletteOpen){
    if(e.key === "Escape"){ e.preventDefault(); closePalette(); }
    else if(e.key === "ArrowDown"){ e.preventDefault(); movePalette(1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); movePalette(-1); }
    else if(e.key === "Enter"){ e.preventDefault(); runPalette(paletteIndex); }
    return;
  }

  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){
    e.preventDefault();
    openPalette();
    return;
  }

  if(e.metaKey || e.ctrlKey || e.altKey || isTyping(e.target)) return;

  // Two-key chords: G then a destination, the way Gmail and GitHub do it.
  if(chordPending){
    const dest = {h:"home", t:"today", p:"plans", c:"catalog", r:"review", i:"insights", s:"settings"}[e.key.toLowerCase()];
    clearTimeout(chordTimer);
    chordPending = false;
    if(dest){ e.preventDefault(); go(dest); }
    return;
  }

  if(e.key.toLowerCase() === "g"){
    chordPending = true;
    chordTimer = setTimeout(()=>{ chordPending = false; }, 1200);
    return;
  }

  if(e.key === "?"){ e.preventDefault(); openShortcutsModal(); return; }
  if(e.key.toLowerCase() === "n" && !document.querySelector(".modal")){ e.preventDefault(); openNewPlanModal(); return; }

  if(state.view === "review"){
    if(e.key === " " && !reviewRevealed && reviewQueue[reviewIndex]){
      e.preventDefault(); reviewRevealed = true; renderView(); return;
    }
    if(reviewRevealed && ["1","2","3","4"].includes(e.key)){
      e.preventDefault(); submitGrade(Number(e.key) - 1); return;
    }
  }
});

/* ============================================================
   Global event delegation
============================================================ */
// Makes every non-native interactive element (divs/spans used as buttons via
// data-action/data-nav/data-lang/data-day, all given tabindex="0" above) operable
// from the keyboard the same way a real <button> would be.
document.addEventListener("keydown", e=>{
  if(e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest("[data-action], [data-nav], [data-lang], [data-day]");
  if(!el || el.tagName==="BUTTON" || el.tagName==="A" || el.tagName==="INPUT") return;
  e.preventDefault();
  el.click();
});
document.addEventListener("click", e=>{
  const navBtn = e.target.closest("[data-nav]");
  if(navBtn){ state.view = navBtn.dataset.nav; state.planDetailId = null; renderView(); closeMobileSidebar(); return; }

  const action = e.target.closest("[data-action]");
  if(!action) return;
  const act = action.dataset.action;

  if(act==="open-plan-chat"){ state.activePlanId = action.dataset.id; store.set("activePlanId", action.dataset.id); state.view="chat"; renderView(); closeMobileSidebar(); }
  else if(act==="open-plan-detail"){ state.planDetailId = action.dataset.id; state.view="plans"; renderView(); }
  else if(act==="back-to-plans"){ state.planDetailId = null; renderView(); }
  else if(act==="toggle-week"){
    const key = weekKey(action.dataset.plan, action.dataset.week);
    const isOpen = !state.openWeeks.has(key);
    if(isOpen) state.openWeeks.add(key); else state.openWeeks.delete(key);
    // Toggle the DOM directly rather than re-rendering, so the CSS grid-rows
    // transition actually animates instead of snapping.
    action.closest(".week-block").classList.toggle("open", isOpen);
    action.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }
  else if(act==="delete-plan"){
    const id = action.dataset.id;
    const doomed = getPlan(id);
    if(doomed && confirm(`Remove "${doomed.title}"? This deletes the plan and its progress from this browser.`)){
      // Drop any player/accordion state belonging to the plan so it can't leak
      // into whatever gets created next.
      (doomed.weeks||[]).forEach(w=>{
        state.openWeeks.delete(weekKey(id, w.weekNumber));
        (w.days||[]).forEach(d=>(d.classes||[]).forEach(c=>state.inlineOpen.delete(c.id)));
      });
      state.plans = state.plans.filter(p=>p.id!==id);
      if(state.activePlanId===id) state.activePlanId=null;
      state.planDetailId=null;
      persistPlans(); renderView(); toast(`Removed "${doomed.title}"`,"success");
    }
  }
  else if(act==="view-plan"){
    const plan = activePlan();
    if(plan){ state.planDetailId = plan.id; state.view="plans"; renderView(); }
  }
  else if(act==="print-plan"){ window.print(); }
  else if(act==="fill-suggestion"){
    const input = document.getElementById("chatInput");
    if(input){ input.value = action.dataset.text; input.focus(); }
  }
  else if(act==="toggle-class-done"){
    const plan = getPlan(action.dataset.plan);
    const cls = findClass(plan, action.dataset.class);
    if(cls && !cls.done && needsQuizGate(cls)){
      // Ticking the box is a claim to have learned it; the quiz is what
      // checks. Re-render first so the checkbox springs back visibly.
      renderView();
      gateOnQuiz(plan, cls);
      return;
    }
    if(cls){
      cls.done = !cls.done;
      // When it was actually ticked. Distinct from completionTime, which is a
      // clock time like "14:30" used for reminders — reading that as a date
      // would put every completion on the same wrong day in the charts.
      cls.doneAt = cls.done ? Date.now() : null;
      plan.updatedAt=Date.now(); persistPlans();
      // A full re-render would rebuild any open <iframe> and restart the video,
      // so while one is playing, patch just the affected bits of the DOM instead.
      if(state.inlineOpen.size) patchDoneInPlace(action, cls, plan);
      else renderView();
    }
  }
  else if(act==="toggle-todo"){
    const plan = getPlan(action.dataset.plan);
    const week = (plan.weeks||[]).find(w=>String(w.weekNumber)===action.dataset.week);
    const day = week && (week.days||[]).find(d=>String(d.dayNumber)===action.dataset.day);
    const t = day && (day.todos||[]).find(t=>t.id===action.dataset.todo);
    if(t){ t.done = !t.done; plan.updatedAt=Date.now(); persistPlans(); renderView(); }
  }
  else if(act==="set-theme"){ state.settings.theme = action.dataset.theme; persistSettings(); applyTheme(); renderView(); }
  else if(act==="enable-notifs"){ requestNotifPermission(); }
  else if(act==="watch-class"){ openWatchModal(action.dataset.plan, action.dataset.class); }
  else if(act==="grade-card"){ submitGrade(Number(action.dataset.q)); }
  else if(act==="delete-card"){ deleteCard(action.dataset.plan, action.dataset.card); renderView(); }
  else if(act==="add-card"){ openAddCardModal(action.dataset.plan, action.dataset.class); }
  else if(act==="take-quiz"){ openQuizModal(action.dataset.plan, action.dataset.class); }
  else if(act==="edit-quiz"){ openEditQuizModal(action.dataset.plan, action.dataset.class); }
  else if(act==="retake-quiz"){ openQuizModal(action.dataset.plan, action.dataset.class); }
  else if(act==="quiz-pick"){ pickQuizAnswer(Number(action.dataset.q), Number(action.value)); }
  else if(act==="delete-question"){
    deleteQuizQuestion(action.dataset.class, action.dataset.question);
    const ctx = findClassAnywhere(action.dataset.class);
    if(ctx) openEditQuizModal(ctx.plan.id, action.dataset.class);
    renderView();
  }
  else if(act==="toggle-notes"){ toggleNotes(action.dataset.class); }
  else if(act==="save-note"){ saveNoteFromField(action.dataset.plan, action.dataset.class); }
  else if(act==="delete-note"){ deleteClassNote(action.dataset.class, action.dataset.note); paintNotes(action.dataset.class); }
  else if(act==="seek-note"){
    const at = Number(action.dataset.at);
    if(!seekPlayer(action.dataset.class, at)){
      toast("Open the video first, then the timestamp will jump straight there.", "info");
    }
  }
  else if(act==="export-ics"){ downloadICS(action.dataset.plan); }
  else if(act==="catch-up"){
    const moved = catchUpPlan(action.dataset.plan);
    if(moved) toast(`Schedule shifted ${moved} day${Math.abs(moved)===1?"":"s"} — you're back on track.`, "success");
    renderView();
  }
  else if(act==="open-palette"){ openPalette(); }
  else if(act==="pick-plan"){ pickPlan(action.dataset.plan); }
  else if(act==="pick-method"){ pickMethod(action.dataset.method); }
  else if(act==="copy-account"){
    const value = action.dataset.value;
    navigator.clipboard?.writeText(value).then(
      ()=> toast(`Copied ${value}`, "success"),
      ()=> toast("Couldn't copy — select it by hand.", "error"),
    );
  }
  else if(act==="add-featured-path"){ addFeaturedPlan(action.dataset.path); }
  else if(act==="play-inline"){ playInline(action.dataset.plan, action.dataset.class); }
  else if(act==="attach-video"){ openAttachVideoModal(action.dataset.plan, action.dataset.class); }
  else if(act==="edit-lesson"){ openEditLessonModal(action.dataset.plan, action.dataset.class); }
  else if(act==="add-lesson"){ addLessonToDay(action.dataset.plan, action.dataset.week, action.dataset.day); }
  else if(act==="add-todo"){
    const d = findDay(action.dataset.plan, action.dataset.week, action.dataset.day);
    if(d){
      d.day.todos = d.day.todos || [];
      d.day.todos.push({id:uid(), text:"", done:false});
      d.plan.updatedAt = Date.now(); persistPlans(); renderView();
      // Focus the new empty field so it can be typed into straight away.
      const inputs = document.querySelectorAll(`[data-action="edit-todo"][data-day="${action.dataset.day}"][data-week="${action.dataset.week}"]`);
      const last = inputs[inputs.length-1];
      if(last) last.focus();
    }
  }
  else if(act==="delete-todo"){
    const d = findDay(action.dataset.plan, action.dataset.week, action.dataset.day);
    if(d){
      d.day.todos = (d.day.todos||[]).filter(t=>t.id!==action.dataset.todo);
      d.plan.updatedAt = Date.now(); persistPlans(); renderView();
    }
  }
  else if(act==="catalog-subject"){
    catalogSubject = action.dataset.subject || "";
    catalogLimit = 80;
    renderView();
  }
  else if(act==="catalog-more"){ catalogLimit += 80; renderView(); }
  else if(act==="close-inline"){
    state.inlineOpen.delete(action.dataset.class);
    renderView();
  }
  else if(act==="focus-mode"){ openWatchModal(action.dataset.plan, action.dataset.class); }
});

/* ============================================================
   Shared backend (optional)
   When a backend URL is set, Mindora stops asking each visitor for their own
   Claude key and Google Drive: the server holds the owner's credentials,
   enforces spend caps, and stores each visitor's plans in the owner's Drive
   under a separate file. With no backend set, everything below is inert and
   the app works exactly as before — own key, own Drive.
============================================================ */
function backendUrl(){
  const configured = (state.settings.backendUrl||"").trim() || DEFAULT_BACKEND_URL;
  return configured.trim().replace(/\/+$/,"");
}
// True when this build ships a server. Visitors are never asked for an API
// key — there is no key UI anywhere in the app; the server holds it.
function sharedMode(){ return !!backendUrl(); }
// A key previously saved in this browser still works, silently, so an owner
// who set one up before the server existed doesn't lose AI overnight. It is
// never displayed, never editable, and the server takes precedence.
function legacyKey(){ return (state.settings.apiKey||"").trim(); }
function aiAvailable(){ return !!backendUrl() || !!legacyKey(); }
// True inside the packaged Android/iOS shell. Google refuses OAuth started
// from an embedded WebView (error: disallowed_useragent), so the browser-side
// Drive sign-in cannot work there and we say so instead of offering a button
// that is guaranteed to fail. The shared server keeps native plans in sync.
function nativeShell(){
  return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
}

/* ============================================================
   Subscriptions

   Everything below is presentation. The real paywall lives on the server,
   which refuses /api/chat without an entitlement — a browser can be edited by
   whoever is holding it, so a gate enforced here would be a suggestion. This
   code exists to explain the state, not to enforce it.

   Selling inside the packaged mobile apps breaks App Store rule 3.1.1 and
   Play's Billing policy (both require their own in-app purchase for digital
   goods), so the whole upgrade surface is hidden in the native shell.
============================================================ */
let billingConfig = null;

// Two separate questions, deliberately not one flag:
//   billingAvailable — can the checkout screen be shown at all?
//   paymentRequired  — is anything actually gated, or asked for?
// When the server runs open to everyone, paying stays possible for anyone who
// wants to, but nothing is locked and nothing is requested.
function freeForAll(){ return !!(billingConfig && billingConfig.freeForAll); }
function billingAvailable(){
  return !!backendUrl() && !!billingConfig && !nativeShell();
}
function paymentRequired(){ return billingAvailable() && !freeForAll(); }
function isPro(){ return !!(state.entitlement && state.entitlement.active); }
function planPending(){ return !!(state.entitlement && state.entitlement.status === "pending"); }
function trialLeft(){ return (state.entitlement && state.entitlement.trialRemaining) || 0; }
// Chat is usable when the subscription is live, or trial messages remain.
function chatUnlocked(){ return !backendUrl() || freeForAll() || isPro() || trialLeft() > 0; }

function money(amount, currency){
  const symbol = currency === "BDT" ? "৳" : (currency === "USD" ? "$" : "");
  return symbol ? `${symbol}${amount}` : `${amount} ${currency}`;
}

async function loadBilling(){
  if(!backendUrl()) return;
  try{
    const [cfg, ent] = await Promise.all([
      fetch(backendUrl()+"/api/billing/config").then(r=>r.ok?r.json():null),
      fetch(backendUrl()+"/api/billing/entitlement", {headers:backendHeaders()})
        .then(r=>{ rememberVisitorToken(r); return r.ok?r.json():null; }),
    ]);
    if(cfg) billingConfig = cfg;
    if(ent) state.entitlement = ent;
  }catch(e){
    // Offline or the server is down. The app stays usable; chat will report
    // the real reason when it's actually attempted.
    console.info("billing unavailable", e && e.message);
  }
  renderSidebar();
  if(state.view === "upgrade" || state.view === "chat") renderView();
}

async function refreshEntitlement(){
  if(!backendUrl()) return;
  try{
    const r = await fetch(backendUrl()+"/api/billing/entitlement", {headers:backendHeaders()});
    rememberVisitorToken(r);
    if(r.ok) state.entitlement = await r.json();
  }catch(e){}
  renderSidebar();
}

async function redeemCode(code){
  const r = await fetch(backendUrl()+"/api/billing/redeem", {
    method:"POST", headers:{...backendHeaders(), "content-type":"application/json"},
    body: JSON.stringify({code}),
  });
  rememberVisitorToken(r);
  const body = await r.json().catch(()=>({}));
  if(r.ok && body.entitlement){
    state.entitlement = {...body.entitlement, trialRemaining: trialLeft()};
    return {ok:true, message: body.message || "Free access unlocked."};
  }
  return {ok:false, message: body.message || "That code isn't valid."};
}

async function submitPayment(payload){
  const r = await fetch(backendUrl()+"/api/billing/claim", {
    method:"POST", headers:{...backendHeaders(), "content-type":"application/json"},
    body: JSON.stringify(payload),
  });
  rememberVisitorToken(r);
  const body = await r.json().catch(()=>({}));
  if(r.ok){
    if(body.entitlement) state.entitlement = {...body.entitlement, trialRemaining: trialLeft()};
    return {ok:true, message: body.message || "Submitted for verification."};
  }
  return {ok:false, message: body.message || "That didn't go through."};
}
function backendHeaders(){
  const h = {};
  const token = store.get("visitorToken", "");
  if(token) h["x-atlas-visitor"] = token;
  const code = (state.settings.accessCode||"").trim();
  if(code) h["x-atlas-code"] = code;
  return h;
}
// The server issues an anonymous, signed id on first contact; holding onto it
// is what makes a returning browser find its own saved plans.
function rememberVisitorToken(resp){
  try{
    const token = resp.headers.get("x-atlas-visitor");
    if(token) store.set("visitorToken", token);
  }catch(e){}
}

let backendSaveTimer = null;
async function pullFromBackend(){
  const via = backendUrl();
  if(!via) return;
  try{
    const resp = await fetch(via + "/api/state", {headers: backendHeaders()});
    if(!resp.ok) return;
    rememberVisitorToken(resp);
    const data = await resp.json();
    const remote = data && data.state;
    if(!remote || !Array.isArray(remote.plans)) return;
    const merged = mergePlansData(state.plans, remote.plans);
    const changed = JSON.stringify(merged) !== JSON.stringify(state.plans);
    state.plans = merged;
    store.set("plans", state.plans);
    if(changed){ renderView(); toast("Synced your plans from the server", "success"); }
  }catch(e){
    console.info("Backend state pull skipped:", e && e.message);
  }
}
function pushToBackend(){
  const via = backendUrl();
  if(!via) return;
  clearTimeout(backendSaveTimer);
  backendSaveTimer = setTimeout(async ()=>{
    try{
      const resp = await fetch(via + "/api/state", {
        method:"PUT",
        headers: Object.assign({"content-type":"application/json"}, backendHeaders()),
        body: JSON.stringify({state:{plans: state.plans}})
      });
      rememberVisitorToken(resp);
    }catch(e){
      console.info("Backend state push failed:", e && e.message);
    }
  }, 3000);
}

/* ============================================================
   Course data — courses.json, generated by tools/build_catalog.py from
   data/paths.json + the resource-directory spreadsheet. Loaded at runtime so
   course content is data, not code. The paths compiled into this file stay as
   an offline fallback for when the fetch can't run (opening the file directly
   from disk, for instance).
============================================================ */
let courseData = null;
let catalogQuery = "";
let catalogSubject = "";
// How many results are on screen. Reset whenever the query or filter changes,
// so a narrowed search never starts halfway down someone else's scroll.
let catalogLimit = 80;

function featuredPaths(){
  return (courseData && Array.isArray(courseData.paths) && courseData.paths.length)
    ? courseData.paths : FEATURED_PATHS;
}
async function loadCourseData(){
  try{
    const resp = await fetch("courses.json", {cache:"no-cache"});
    if(!resp.ok) return;
    const data = await resp.json();
    if(!data || !Array.isArray(data.catalog)) return;
    courseData = data;
    if(state.view === "home" || state.view === "catalog") renderView();
  }catch(e){
    // Offline, or opened as a local file — the built-in paths still work.
    console.info("courses.json not loaded; using built-in course data.", e && e.message);
  }
}

function renderCatalog(container){
  const all = courseData ? courseData.catalog : null;
  setTopbar("Catalog", all ? `${all.length} courses` : "");
  if(!all){
    container.innerHTML = `
      <div class="chat-empty">
        <div class="big-ic">${icon("book","ic-xl")}</div>
        <h2>Catalog unavailable</h2>
        <p>The course catalog lives in <code>courses.json</code>, built from the spreadsheet by
        <code>tools/build_catalog.py</code>. It loads when Mindora is served over http(s) — if you opened this
        file straight from disk, the browser blocks that read. Your plans and featured paths are unaffected.</p>
      </div>`;
    return;
  }

  const subjects = Array.from(new Set(all.map(c=>c.subject))).sort();
  const q = catalogQuery.trim().toLowerCase();
  const rows = all.filter(c=>{
    if(catalogSubject && c.subject !== catalogSubject) return false;
    if(!q) return true;
    return (c.title+" "+c.platform+" "+c.level+" "+c.subject).toLowerCase().includes(q);
  });
  const shown = rows.slice(0, catalogLimit);

  container.innerHTML = `
    <div class="home-section-head" style="margin-bottom:14px;">
      <h3>Every course in the directory</h3>
      <span class="section-rule"></span>
      <span class="badge">${rows.length} match${rows.length===1?'':'es'}</span>
    </div>
    <div class="field" style="max-width:460px;">
      <input type="text" id="catalogSearch" placeholder="Search by title, platform or level…" value="${escapeHtml(catalogQuery)}">
    </div>
    <div class="chip-row" style="margin-bottom:20px;">
      <span class="chip ${catalogSubject===''?'selected':''}" data-action="catalog-subject" data-subject="" tabindex="0" role="button">All</span>
      ${subjects.map(s=>`<span class="chip ${catalogSubject===s?'selected':''}" data-action="catalog-subject" data-subject="${escapeHtml(s)}" tabindex="0" role="button">${escapeHtml(s)}</span>`).join("")}
    </div>
    <div class="course-grid">
      ${shown.length ? shown.map(c=>`
        <a class="course-card" href="${escapeHtml(c.url)}" target="_blank" rel="noopener"
           data-subject="${escapeHtml(c.subject)}">
          <span class="cx-subject">${escapeHtml(c.subject)}</span>
          <span class="cx-title">${escapeHtml(c.title)}</span>
          <span class="cx-platform">${escapeHtml(c.platform)}</span>
          <span class="cx-foot">
            <span class="cx-tags">
              <span class="cx-tag">${escapeHtml(c.level)}</span>
              ${/free/i.test(c.cost||"") ? `<span class="cx-tag free">Free</span>`
                                         : `<span class="cx-tag">${escapeHtml(c.cost)}</span>`}
              ${c.embeddable ? `<span class="cx-tag plays">Plays in app</span>` : ""}
            </span>
            <span class="cx-go">${icon("external","ic-sm")}</span>
          </span>
        </a>`).join("") : ""}
    </div>
    ${!shown.length ? `
      <div class="chat-empty">
        <div class="big-ic">${icon("search","ic-xl")}</div>
        <h2>Nothing matches that</h2>
        <p>Try a shorter word, or clear the subject filter.</p>
      </div>` : ""}
    ${rows.length > shown.length ? `
      <div class="more-row">
        <span>Showing ${shown.length} of ${rows.length}</span>
        <button class="btn small" data-action="catalog-more">Show ${Math.min(80, rows.length - shown.length)} more</button>
      </div>` : ""}
  `;

  const box = document.getElementById("catalogSearch");
  box.oninput = e=>{
    catalogQuery = e.target.value;
    catalogLimit = 80;
    const pos = e.target.selectionStart;
    renderView();
    const again = document.getElementById("catalogSearch");
    if(again){ again.focus(); again.setSelectionRange(pos, pos); }
  };
}

/* ============================================================
   Watch tracking — YouTube IFrame Player API
   Reports how far through each video the learner actually is, and completes
   the lesson on its own once the video finishes. Entirely best-effort: if the
   API script is blocked or fails, the embed is still a normal iframe and
   simply plays without tracking.
============================================================ */
const AUTO_DONE_AT = 0.95;   // treat "basically finished" as finished
const inlinePlayers = new Map();   // classId -> {player, el, timer}
let ytApiPromise = null;
let watchSaveTimer = null;

function watchPct(c){ return Math.min(1, Math.max(0, Number(c && c.watchPct) || 0)); }

function loadYouTubeApi(){
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise(resolve=>{
    if(window.YT && window.YT.Player) return resolve();
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function(){
      if(typeof prev === "function"){ try{ prev(); }catch(e){} }
      resolve();
    };
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.async = true;
    s.onerror = ()=> resolve();   // fail soft — playback still works, tracking doesn't
    document.head.appendChild(s);
    setTimeout(resolve, 8000);    // never hang forever on a blocked network
  });
  return ytApiPromise;
}

function findClassAnywhere(classId){
  for(const plan of state.plans){
    const c = findClass(plan, classId);
    if(c) return {plan, c};
  }
  return null;
}

function bindInlinePlayers(){
  // Drop players whose iframe was replaced or removed by a re-render.
  for(const [cid, rec] of Array.from(inlinePlayers)){
    if(rec.el !== document.getElementById("ytf-"+cid)){
      clearInterval(rec.timer);
      try{ rec.player && rec.player.destroy && rec.player.destroy(); }catch(e){}
      inlinePlayers.delete(cid);
    }
  }
  const frames = Array.from(document.querySelectorAll("iframe[data-yt-class]"))
    .filter(f => !inlinePlayers.has(f.dataset.ytClass));
  if(!frames.length) return;

  loadYouTubeApi().then(()=>{
    if(!(window.YT && window.YT.Player)){ frames.forEach(f=>markUntracked(f.dataset.ytClass)); return; }
    frames.forEach(f=>{
      const cid = f.dataset.ytClass;
      if(inlinePlayers.has(cid) || !document.contains(f)) return;
      attachPlayer(cid, f, false);
    });
  });
}

function attachPlayer(cid, f, isRetry){
  let player;
  try{
    player = new YT.Player(f, {
      events:{
        onReady: ()=>{ const r = inlinePlayers.get(cid); if(r) r.ready = true; },
        onStateChange: e=>{
          const r = inlinePlayers.get(cid);
          if(r) r.ready = true;   // any state callback proves the bridge is live
          if(e.data === YT.PlayerState.ENDED) handleVideoEnded(cid, player);
        }
      }
    });
  }catch(e){ markUntracked(cid); return; }

  const timer = setInterval(()=>{
    try{
      const dur = player.getDuration ? player.getDuration() : 0;
      const cur = player.getCurrentTime ? player.getCurrentTime() : 0;
      if(dur > 0){
        const rec = inlinePlayers.get(cid);
        if(rec) rec.ready = true;
        recordWatchProgress(cid, cur/dur, player);
      }
    }catch(e){}
  }, 1000);
  inlinePlayers.set(cid, {player, el:f, timer, ready:false});

  // The postMessage bridge to the embed sometimes never comes up (blocked
  // script, extension, slow network). Retry once, then say so plainly rather
  // than leaving the learner waiting for a tick that will never arrive.
  setTimeout(()=>{
    const rec = inlinePlayers.get(cid);
    if(!rec || rec.ready || rec.el !== document.getElementById("ytf-"+cid)) return;
    clearInterval(rec.timer);
    try{ rec.player && rec.player.destroy && rec.player.destroy(); }catch(e){}
    inlinePlayers.delete(cid);
    const el = document.getElementById("ytf-"+cid);
    if(!el) return;
    if(isRetry) markUntracked(cid);
    else attachPlayer(cid, el, true);
  }, isRetry ? 9000 : 6000);
}

// No progress bridge: hide the meaningless 0% readout and tell the learner to
// tick the box themselves, so nothing silently pretends to be tracking.
function markUntracked(cid){
  const label = document.querySelector(`[data-watchpct="${cid}"]`);
  if(label){
    label.textContent = "Tick when finished";
    label.classList.add("untracked");
  }
  const bar = document.querySelector(`[data-watchfill="${cid}"]`);
  if(bar && bar.parentElement) bar.parentElement.style.display = "none";
}

// Progress only ever moves forward — scrubbing backwards shouldn't lose credit.
function recordWatchProgress(classId, frac, player){
  const found = findClassAnywhere(classId);
  if(!found) return;
  const {plan, c} = found;
  const next = Math.min(1, Math.max(watchPct(c), frac));
  if(next - watchPct(c) < 0.005 && !(next >= AUTO_DONE_AT && !c.done)) return;
  c.watchPct = next;
  paintWatchProgress(classId, next);
  // localStorage (and the Drive sync it triggers) shouldn't run every second.
  clearTimeout(watchSaveTimer);
  watchSaveTimer = setTimeout(()=>{ plan.updatedAt = Date.now(); persistPlans(); }, 4000);
  if(next >= AUTO_DONE_AT) maybeAutoComplete(classId, player);
}

function paintWatchProgress(classId, frac){
  const pctText = Math.round(frac*100) + "% watched";
  const fill = document.querySelector(`[data-watchfill="${classId}"]`);
  if(fill) fill.style.width = Math.round(frac*100) + "%";
  const label = document.querySelector(`[data-watchpct="${classId}"]`);
  if(label) label.textContent = pctText;
}

function handleVideoEnded(classId, player){
  recordWatchProgress(classId, 1, player);
  maybeAutoComplete(classId, player);
}

// A playlist isn't finished just because its first video ended, so only
// auto-complete on the last entry. Single videos complete straight away.
function maybeAutoComplete(classId, player){
  const found = findClassAnywhere(classId);
  if(!found || found.c.done) return;
  try{
    const list = player && player.getPlaylist && player.getPlaylist();
    if(list && list.length > 1){
      const idx = player.getPlaylistIndex ? player.getPlaylistIndex() : 0;
      if(idx < list.length - 1) return;
    }
  }catch(e){}
  const {plan, c} = found;
  // Reaching the end of the video is not the same as having learned it.
  c.watchPct = 1;
  plan.updatedAt = Date.now();
  persistPlans();
  paintWatchProgress(classId, 1);

  if(gateOnQuiz(plan, c)) return;
  c.done = true;
  c.doneAt = Date.now();
  c.watchPct = 1;
  plan.updatedAt = Date.now();
  persistPlans();
  paintWatchProgress(classId, 1);
  syncDoneUI(classId, plan, true);
  toast(`Finished — "${c.title}" marked complete`, "success");
}

// Updates the checkbox/card/progress bar without a re-render, so the video the
// learner is watching is never torn down mid-playback.
function syncDoneUI(classId, plan, isDone){
  const card = document.querySelector(`[data-card="${classId}"]`);
  if(card) card.classList.toggle("done", !!isDone);
  const box = document.querySelector(`[data-action="toggle-class-done"][data-class="${classId}"]`);
  if(box) box.checked = !!isDone;
  const fill = document.querySelector(".detail-head .progress-fill");
  if(fill) fill.style.width = planProgress(plan) + "%";
}

// Expands a lesson's video into a real inline iframe. When the lesson only has a
// channel/search link, first resolves it to a specific video via the YouTube Data

async function playInline(planId, classId){
  const plan = getPlan(planId);
  const c = plan && findClass(plan, classId);
  if(!c) return;

  if(!getYtEmbed(c)){
    if(!ytApiKey()) return;
    const media = document.querySelector(`[data-media="${classId}"]`);
    if(media) media.classList.add("is-loading");
    try{
      const id = await resolveYouTubeVideoId(plan, c);
      if(!id){ toast("Couldn't find a video for this lesson.", "error"); if(media) media.classList.remove("is-loading"); return; }

document.addEventListener("change", e=>{
  const action = e.target.closest("[data-action]");
  if(!action) return;
  const act = action.dataset.action;
  if(act==="set-completion"){
    const plan = getPlan(action.dataset.plan);
    const cls = findClass(plan, action.dataset.class);
    if(cls){
      cls.completionTime = action.value || null;
      plan.updatedAt = Date.now(); persistPlans();
      const fired = store.get("firedNotifs", {});
      const today = ymd(new Date());
      delete fired[`${plan.id}|${cls.id}|${today}|10`];
      delete fired[`${plan.id}|${cls.id}|${today}|5`];
      store.set("firedNotifs", fired);
      if(state.view==="today") renderView();
    }
  } else if(act==="edit-todo"){
    const d = findDay(action.dataset.plan, action.dataset.week, action.dataset.day);
    const t = d && (d.day.todos||[]).find(x=>x.id===action.dataset.todo);
    if(t){ t.text = action.value; d.plan.updatedAt = Date.now(); persistPlans(); }
  } else if(act==="set-start-date"){
    const plan = getPlan(action.dataset.id);
    if(plan){ plan.startDate = action.value; plan.updatedAt=Date.now(); persistPlans(); renderView(); }
  }
});

function findClass(plan, classId){
  if(!plan) return null;
  for(const w of (plan.weeks||[])) for(const d of (w.days||[])) {
    const c = (d.classes||[]).find(c=>c.id===classId);
    if(c) return c;
  }
  return null;
}
function findDay(planId, weekNumber, dayNumber){
  const plan = getPlan(planId);
  const week = plan && (plan.weeks||[]).find(w=>String(w.weekNumber)===String(weekNumber));
  const day = week && (week.days||[]).find(d=>String(d.dayNumber)===String(dayNumber));
  return day ? {plan, week, day} : null;
}
function findClassContext(plan, classId){
  if(!plan) return null;
  for(const w of (plan.weeks||[])) for(const d of (w.days||[])) {
    const idx = (d.classes||[]).findIndex(c=>c.id===classId);
    if(idx !== -1) return {week:w, day:d, classes:d.classes, idx};
  }
  return null;
}

async function openWatchModal(planId, classId){
  const plan = getPlan(planId);
  const ctx = plan && findClassContext(plan, classId);
  if(!ctx) return;
  const c = ctx.classes[ctx.idx];
  let yt = getYtEmbed(c);

  if(yt || !(c.type === "video" && ytApiKey())){
    renderWatchModal(planId, ctx, yt, false);
    return;
  }

  renderWatchModal(planId, ctx, null, true);
  let resolveErr = null, resolvedId = null;
  try{ resolvedId = await resolveYouTubeVideoId(plan, c); }
  catch(e){ resolveErr = e; }
  yt = resolvedId ? {kind:"video", id:resolvedId} : null;

  const stillOpenOnThisClass = document.querySelector(`.watch-modal[data-class="${classId}"]`);
  if(!stillOpenOnThisClass) return;
  if(resolveErr) toast(resolveErr.message || "Couldn't find a video for this lesson.", "error");
  renderWatchModal(planId, ctx, yt, false);
  if(yt && state.view!=="chat") renderView();
}

// --- phone "More" sheet ---
(function wireSheet(){
  const overlay = document.getElementById("moreSheet");
  const button = document.getElementById("btnMore");
  if(!overlay || !button) return;

  const open = ()=>{
    overlay.hidden = false;
    requestAnimationFrame(()=>overlay.classList.add("open"));
  };
  const close = ()=>{
    overlay.classList.remove("open");
    // Wait for the slide-out before hiding, or it vanishes mid-animation.
    setTimeout(()=>{ if(!overlay.classList.contains("open")) overlay.hidden = true; }, 240);
  };

  button.addEventListener("click", ()=>{
    overlay.classList.contains("open") ? close() : open();
  });
  overlay.addEventListener("click", e=>{ if(e.target === overlay) close(); });
  // Any destination inside closes the sheet; the delegated nav handler does
  // the actual navigating.
  overlay.querySelectorAll(".sheet-item").forEach(item=>item.addEventListener("click", close));
  document.addEventListener("keydown", e=>{
    if(e.key === "Escape" && overlay.classList.contains("open")) close();
  });
})();

// --- palette wiring ---
(function wirePalette(){
  const overlay = document.getElementById("palette");
  const input = document.getElementById("paletteInput");
  const list = document.getElementById("paletteList");

  input.addEventListener("input", ()=>updatePalette(input.value.trim()));
  // Clicking the backdrop dismisses; clicking inside the box must not.
  overlay.addEventListener("click", e=>{ if(e.target === overlay) closePalette(); });
  list.addEventListener("click", e=>{
    const item = e.target.closest(".palette-item");
    if(item) runPalette(Number(item.dataset.i));
  });
  list.addEventListener("mousemove", e=>{
    const item = e.target.closest(".palette-item");
    if(item && Number(item.dataset.i) !== paletteIndex){
      paletteIndex = Number(item.dataset.i);
      paintPalette();
    }
  });
})();

fillIconSlots();
applyTheme();
state.view = viewFromHash() || state.view;
renderView();
loadCourseData();
pullFromBackend();
loadBilling();
checkReminders();
autoSyncFromDrive();

// Only registers when actually served over http(s) (e.g. GitHub Pages) with
// sw.js sitting alongside this file — silently does nothing when this page
// is just double-clicked as a local file, or opened standalone elsewhere.
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    // A cached app that can never update is worse than no cache at all, so
    // surface new versions instead of pinning people to an old build.
    reg.addEventListener("updatefound", ()=>{
      const incoming = reg.installing;
      if(!incoming) return;
      incoming.addEventListener("statechange", ()=>{
        if(incoming.state === "installed" && navigator.serviceWorker.controller){
          showUpdateBar(reg);
        }
      });
    });
  }).catch(()=>{});

  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(reloading) return;
    reloading = true;
    location.reload();
  });
}

function showUpdateBar(reg){
  if(document.getElementById("updateBar")) return;
  const bar = document.createElement("div");
  bar.id = "updateBar";
  bar.className = "update-bar";
  bar.innerHTML = `<span>A new version of Mindora is ready.</span>
    <button class="btn small primary" id="updateNow">Reload</button>
    <button class="btn small" id="updateLater">Later</button>`;
  document.body.appendChild(bar);
  document.getElementById("updateNow").onclick = ()=>{
    if(reg.waiting) reg.waiting.postMessage("skip-waiting");
    else location.reload();
  };
  document.getElementById("updateLater").onclick = ()=> bar.remove();
}

/* Connection state — an installed app gets opened on planes and trains, so
   say plainly when features that need the network won't work. */
function paintOnlineState(){
  const off = !navigator.onLine;
  document.body.classList.toggle("is-offline", off);
  let pill = document.getElementById("offlinePill");
  if(off && !pill){
    pill = document.createElement("div");
    pill.id = "offlinePill";
    pill.className = "offline-pill";
    pill.innerHTML = `${icon("alert","ic-sm")} Offline — saved plans still work`;
    document.body.appendChild(pill);
  } else if(!off && pill){
    pill.remove();
  }
}
window.addEventListener("online", paintOnlineState);
window.addEventListener("offline", paintOnlineState);
paintOnlineState();

})();
</script>
