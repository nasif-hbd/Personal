name: Check course links

# Free learning resources rot: videos get deleted, made private, or have
# embedding switched off. This catches that before a learner hits it.
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays, 05:17 UTC
  push:
    paths:
      - "courses.json"
      - "tools/check_links.py"
      - ".github/workflows/link-check.yml"
  workflow_dispatch:
    inputs:
      paths_only:
        description: "Check only the curated 14-day paths (faster)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Verify links
        id: check
        continue-on-error: true
        run: |
          python tools/check_links.py \
            ${{ inputs.paths_only && '--paths-only' || '' }} \
            | tee check-output.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: |
            link-report.json
            check-output.txt

      # Only definitive failures (deleted videos, embedding turned off) reach
      # here — unreachable hosts are ignored by the checker itself, so this
      # shouldn't fire on transient network trouble.
      - name: Open an issue when links are broken
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('link-report.json', 'utf8'));
            const lines = report.problems.map(
              p => `- **${p.status}** — ${p.where}\n  ${p.url} (${p.detail || ''})`
            ).join('\n');
            const title = `Broken course links: ${report.problems.length} need attention`;
            const body = [
              `The weekly link check found ${report.problems.length} broken link(s).`,
              '',
              lines,
              '',
              `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n');

            // Reuse the existing open issue instead of filing a new one weekly.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'broken-links',
            });
            if (existing.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['broken-links'],
              });
            }

      - name: Fail the run if links are broken
        if: steps.check.outcome == 'failure'
        run: exit 1
