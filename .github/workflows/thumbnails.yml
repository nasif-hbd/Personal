name: Fetch course thumbnails

# Real preview images for every embeddable course. Runs where normal
# internet access exists (this sandbox's own dev environment deliberately
# doesn't reach img.youtube.com) and commits whatever's new, so the app
# ships real thumbnails without anyone downloading 200+ images by hand.
on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays, 06:23 UTC - new courses land through the week
  push:
    branches: [main, claude/learning-app-claude-api-a4lz1w]
    paths:
      - "courses.json"
      - "tools/fetch_thumbnails.py"
      - ".github/workflows/thumbnails.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests

      - name: Fetch missing thumbnails
        run: python tools/fetch_thumbnails.py

      - name: Rebuild courses.json with any new thumbnail fields
        run: |
          pip install -r tools/requirements.txt
          python tools/build_catalog.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- thumbnails courses.json; then
            echo "nothing new"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thumbnails courses.json
          git commit -m "Fetch course thumbnails [skip ci]"
          git push
