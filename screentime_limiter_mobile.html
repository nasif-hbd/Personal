<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Time Limiter</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #e8e9ec;
    --muted: #8b8f9a;
    --accent: #4f8cff;
    --danger: #ff5a5f;
    --ok: #34c759;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 1.4rem; margin: 8px 0 16px; }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
  input {
    flex: 1;
    background: #0f1115;
    border: 1px solid #2a2e37;
    color: var(--text);
    border-radius: 8px;
    padding: 10px;
    font-size: 0.95rem;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button.secondary { background: #2a2e37; }
  button.danger { background: var(--danger); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .app-name { font-weight: 600; font-size: 1.05rem; }
  .app-meta { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
  .bar-bg {
    background: #0f1115;
    border-radius: 6px;
    height: 8px;
    margin: 10px 0;
    overflow: hidden;
  }
  .bar-fill { height: 100%; background: var(--ok); transition: width 0.3s; }
  .bar-fill.over { background: var(--danger); }
  .app-actions { display: flex; gap: 8px; margin-top: 10px; }
  .blocked-msg { color: var(--danger); font-size: 0.8rem; margin-top: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; }
</style>
</head>
<body>

<h1>Screen Time Limiter</h1>

<div class="card">
  <div class="form-row">
    <input id="appNameInput" type="text" placeholder="App name (e.g. Instagram)">
  </div>
  <div class="form-row">
    <input id="appLimitInput" type="number" min="1" placeholder="Daily limit (minutes)">
    <button onclick="handleSetLimit()">Set</button>
  </div>
  <div id="formMsg" class="blocked-msg"></div>
</div>

<div id="appList"></div>

<script>
const STORAGE_KEY = "screentime_data_v1";
const MAX_CHANGES_PER_WEEK = 3;
const CHANGE_WINDOW_MS = 7 * 24 * 60 * 60 * 1000;

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : { apps: {} };
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

function recentChanges(log) {
  const cutoff = Date.now() - CHANGE_WINDOW_MS;
  return log.filter(t => t > cutoff);
}

function setLimit(data, name, minutes) {
  const entry = data.apps[name] || { dailyLimitMinutes: null, usage: {}, limitChangeLog: [], activeSince: null };
  const recent = recentChanges(entry.limitChangeLog);
  if (recent.length >= MAX_CHANGES_PER_WEEK) {
    const nextAllowed = new Date(recent[0] + CHANGE_WINDOW_MS);
    throw new Error(
      `'${name}' limit already changed ${MAX_CHANGES_PER_WEEK} times in the last 7 days. ` +
      `Next change allowed after ${nextAllowed.toLocaleString()}.`
    );
  }
  entry.dailyLimitMinutes = minutes;
  recent.push(Date.now());
  entry.limitChangeLog = recent;
  data.apps[name] = entry;
  saveData(data);
}

function usedSecondsToday(entry) {
  const base = entry.usage[todayKey()] || 0;
  if (entry.activeSince) {
    return base + Math.floor((Date.now() - entry.activeSince) / 1000);
  }
  return base;
}

function startTracking(name) {
  const data = loadData();
  Object.entries(data.apps).forEach(([n, e]) => {
    if (e.activeSince) stopTracking(n, data, false);
  });
  const entry = data.apps[name];
  const limitSeconds = entry.dailyLimitMinutes * 60;
  if (usedSecondsToday(entry) >= limitSeconds) return;
  entry.activeSince = Date.now();
  saveData(data);
  render();
}

function stopTracking(name, dataArg, doSave = true) {
  const data = dataArg || loadData();
  const entry = data.apps[name];
  if (!entry.activeSince) return;
  const elapsed = Math.floor((Date.now() - entry.activeSince) / 1000);
  const key = todayKey();
  entry.usage[key] = (entry.usage[key] || 0) + elapsed;
  entry.activeSince = null;
  if (doSave) {
    saveData(data);
    render();
  }
}

function deleteApp(name) {
  const data = loadData();
  delete data.apps[name];
  saveData(data);
  render();
}

function handleSetLimit() {
  const nameInput = document.getElementById("appNameInput");
  const limitInput = document.getElementById("appLimitInput");
  const msg = document.getElementById("formMsg");
  msg.textContent = "";

  const name = nameInput.value.trim();
  const minutes = parseInt(limitInput.value, 10);

  if (!name || !minutes || minutes <= 0) {
    msg.textContent = "Enter an app name and a positive number of minutes.";
    return;
  }

  const data = loadData();
  try {
    setLimit(data, name, minutes);
    nameInput.value = "";
    limitInput.value = "";
    render();
  } catch (e) {
    msg.textContent = e.message;
  }
}

function render() {
  const data = loadData();
  const list = document.getElementById("appList");
  const names = Object.keys(data.apps);

  if (names.length === 0) {
    list.innerHTML = `<div class="empty">No apps added yet.</div>`;
    return;
  }

  list.innerHTML = names.map(name => {
    const entry = data.apps[name];
    const used = usedSecondsToday(entry);
    const limitSeconds = entry.dailyLimitMinutes * 60;
    const pct = Math.min(100, (used / limitSeconds) * 100);
    const over = used >= limitSeconds;
    const changesLeft = MAX_CHANGES_PER_WEEK - recentChanges(entry.limitChangeLog).length;
    const isActive = !!entry.activeSince;

    return `
      <div class="card">
        <div class="app-name">${name}</div>
        <div class="app-meta">
          ${Math.floor(used / 60)} / ${entry.dailyLimitMinutes} min today &middot;
          ${changesLeft} limit change${changesLeft === 1 ? "" : "s"} left this week
        </div>
        <div class="bar-bg">
          <div class="bar-fill ${over ? "over" : ""}" style="width:${pct}%"></div>
        </div>
        <div class="app-actions">
          ${isActive
            ? `<button class="danger" onclick="stopTracking('${name}')">Stop using</button>`
            : `<button ${over ? "disabled" : ""} onclick="startTracking('${name}')">Start using</button>`}
          <button class="secondary" onclick="deleteApp('${name}')">Remove</button>
        </div>
        ${over ? `<div class="blocked-msg">Daily limit reached. Blocked until tomorrow.</div>` : ""}
      </div>
    `;
  }).join("");
}

setInterval(() => {
  const data = loadData();
  const anyActive = Object.values(data.apps).some(e => e.activeSince);
  if (anyActive) render();
}, 1000);

render();
</script>
</body>
</html>
