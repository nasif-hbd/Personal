# Render blueprint — push this repo, then set the secret env vars in the
# dashboard. Never put real keys in this file; it is committed.
services:
  - type: web
    name: mindora-backend
    runtime: docker
    # Without this Render picks a paid instance and asks for a card at the
    # blueprint step. Change to `starter` when you want the disk below.
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    # Free plan: no persistent disk. The database is rebuilt from a Google
    # Drive snapshot every time the instance wakes, so paid subscriptions
    # survive the reset — see "Running on a free plan" in server/README.md.
    #
    # To move to a paid plan, add `plan: starter` and uncomment the disk. The
    # snapshot keeps working either way; it just stops being load-bearing.
    #
    # disk:
    #   name: mindora-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY     # secret — set in dashboard
        sync: false
      - key: GOOGLE_CLIENT_ID      # secret — set in dashboard
        sync: false
      - key: GOOGLE_CLIENT_SECRET  # secret — set in dashboard
        sync: false
      - key: GOOGLE_REFRESH_TOKEN  # secret — set in dashboard
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://nasif-hbd.github.io
      - key: DAILY_REQUEST_CAP
        value: "300"
      - key: PER_VISITOR_DAILY_CAP
        value: "25"
      - key: DB_PATH
        value: /tmp/mindora.db

      # --- subscriptions -------------------------------------------------
      # Everything open to everyone: chat works with no payment and no code.
      # The payment system stays wired up — set this to false to start
      # charging again, with nothing to rebuild.
      - key: FREE_FOR_ALL
        value: "true"
      # Without ADMIN_TOKEN the payment-review API stays shut (503), so no
      # payment can ever be approved and nobody can subscribe.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: FREE_ACCESS_CODE   # secret — set in dashboard
        sync: false
      # 0 = strict paywall. Raise it to let people try the assistant first.
      - key: FREE_TRIAL_MESSAGES
        value: "0"
      - key: CURRENCY
        value: BDT
      - key: PRICE_MONTHLY
        value: "499"
      - key: PRICE_YEARLY
        value: "4499"

      # --- where buyers send money ---------------------------------------
      # Any left blank is hidden at checkout, so you only advertise the rails
      # you actually accept. Set these in the dashboard, not here.
      - key: PAY_BKASH
        sync: false
      - key: PAY_NAGAD
        sync: false
      - key: PAY_ROCKET
        sync: false
      - key: PAY_BANK
        sync: false
      - key: PAY_GPAY
        sync: false
